name: "CI: Test Packaging"

on:
  push:
    branches: [ master, staging, stable ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.git**'
      - '**.yml'
      # no docs on which one of these is supposed to work, so
      # why not just do both
      - 'RobustToolbox'
      - 'RobustToolbox/**'
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.git**'
      - '**.yml'
      - 'RobustToolbox'
      - 'RobustToolbox/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test Packaging (${{ matrix.target.name }})
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows
            args: server --platform win-x64 --platform win-arm64
          - name: linux
            args: server --platform linux-x64 --platform linux-arm64
          - name: macos
            args: server --platform osx-x64 --platform osx-arm64
          - name: client
            args: client

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4.2.2

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package ${{ matrix.target.name }}
        run: dotnet run --project Content.Packaging ${{ matrix.target.args }}

  success:
    name: Test Packaging
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && github.actor != 'PJBot' && github.event.pull_request.draft == false
    steps:
      - name: Packaging succeeded
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Packaging failed!"
            exit 1
          fi

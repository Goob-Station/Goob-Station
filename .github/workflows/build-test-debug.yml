name: Build & Test Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - &checkout
      name: Checkout Master
      uses: actions/checkout@v4.2.2

    - &submodule
      name: Setup Submodule
      run: git submodule update --init --recursive

    - &submodule_pull
      name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - &submodule_update
      name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - &dotnet
      name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m -clp:ErrorsOnly

    - name: Save build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          bin/Content.*/*.json
          bin/Content.IntegrationTests/*.dll
          bin/Content.IntegrationTests/*.pdb
          bin/Content.IntegrationTests/runtimes/linux-x64/**
          bin/Content.Tests/*.dll
        retention-days: 1

  test-unit:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *dotnet
    - &download_build
      name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: bin/

    - name: Link runtimes
      run: ln -s $(pwd)/bin/Content.IntegrationTests/runtimes bin/Content.Tests/

    - name: Run Content.Tests
      run: dotnet test bin/Content.Tests/Content.Tests.dll -- NUnit.ConsoleOut=0

  test-main:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *dotnet
    - *download_build

    - name: Run main Content.IntegrationTests
      timeout-minutes: 25
      run: |
        DOTNET_gcServer=1 dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll -- \
          NUnit.Where="cat != MapTests && cat != GameRuleTests" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

  test-maps:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *dotnet
    - *download_build

    - name: Run MapTests
      timeout-minutes: 25
      run: |
        DOTNET_gcServer=1 dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll -- \
          NUnit.Where="cat == MapTests" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

  test-gamerules:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *dotnet
    - *download_build

    - name: Run GameRuleTests
      timeout-minutes: 25
      run: |
        DOTNET_gcServer=1 dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll -- \
          NUnit.Where="cat == GameRuleTests" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

  ci-success:
    name: Build & Test Debug
    needs: [build, test-unit, test-main, test-maps, test-gamerules]
    runs-on: ubuntu-latest
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: CI succeeded
        run: |
          if [[ "${{ needs.build.result }}" != "success" ||
                "${{ needs.test-unit.result }}" != "success" ||
                "${{ needs.test-main.result }}" != "success" ||
                "${{ needs.test-maps.result }}" != "success" ||
                "${{ needs.test-gamerules.result }}" != "success" ]]; then
            echo "Not all tests succeeded!"
            exit 1
          fi
          exit 0

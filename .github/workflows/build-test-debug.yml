name: Build & Test Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

jobs:
  tests:
    name: ${{ matrix.name }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            project: Content.Tests/Content.Tests.csproj
            filter: ""
            nunit-args: NUnit.ConsoleOut=0
          # Pirate: isolate the memory-heavy entity fixture while the catch-all shard covers new upstream tests.
          - name: Integration tests
            project: Content.IntegrationTests/Content.IntegrationTests.csproj
            filter: "FullyQualifiedName!~Content.IntegrationTests.Tests.EntityTest"
            nunit-args: NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed
          - name: Entity integration tests
            project: Content.IntegrationTests/Content.IntegrationTests.csproj
            filter: "FullyQualifiedName~Content.IntegrationTests.Tests.EntityTest"
            nunit-args: NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

    runs-on: ubuntu-latest
    # Pirate: the expanded RT 270 integration suite exceeds the default job limit.
    timeout-minutes: 60

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run ${{ matrix.name }}
      timeout-minutes: 60
      env:
        TEST_FILTER: ${{ matrix.filter }}
        TEST_PROJECT: ${{ matrix.project }}
        NUNIT_ARGS: ${{ matrix.nunit-args }}
      run: |
        while sleep 60; do
          echo "::notice::${{ matrix.name }} are still running..."
        done &
        heartbeat_pid=$!
        trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

        export DOTNET_gcServer=1
        test_args=(--no-build --configuration DebugOpt "$TEST_PROJECT")
        if [[ -n "$TEST_FILTER" ]]; then
          test_args+=(--filter "$TEST_FILTER")
        fi

        dotnet test "${test_args[@]}" -- $NUNIT_ARGS
  ci-success:
    name: Build & Test Debug
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0

name: Labels

on:
  issues:
    types: [ opened ]
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review, review_requested ]
  workflow_run:
    workflows: [ "Review Trigger" ]
    types: [ completed ]

jobs:
  labels:
    name: Labels
    if: |
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.name == 'Review Trigger' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.repository.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest

    steps:
    - name: Check for Merge Conflicts
      if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.action != 'review_requested' && github.event.pull_request.draft == false }}
      uses: eps1lon/actions-label-merge-conflict@v3.0.0
      with:
        dirtyLabel: "S: Merge Conflict"
        repoToken: "${{ secrets.BOT_TOKEN }}"
        commentOnDirty: "This pull request has conflicts, please resolve those before we can evaluate the pull request."

    - name: Label by changed files
      if: ${{ !cancelled() && github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) }}
      uses: actions/labeler@v5

    - name: Label size
      if: ${{ !cancelled() && github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) }}
      uses: "pascalgn/size-label-action@v0.5.5"
      env:
        GITHUB_TOKEN: "${{ secrets.BOT_TOKEN }}"
      with:
        sizes: >
          {
            "0": "XS",
            "10": "S",
            "100": "M",
            "1000": "L",
            "5000": "XL"
          }

    - name: Add needs review
      if: ${{ !cancelled() && github.event.action == 'review_requested' }}
      uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "S: Needs Review"

    - name: Remove awaiting changes
      if: ${{ !cancelled() && github.event.action == 'review_requested' }}
      uses: actions-ecosystem/action-remove-labels@v1
      with:
        labels: "S: Awaiting Changes"

    - name: Label branch stable
      if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.action == 'opened' && github.event.pull_request.base.ref == 'stable' }}
      uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Branch: Stable"

    - name: Label branch staging
      if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.action == 'opened' && github.event.pull_request.base.ref == 'staging' }}
      uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Branch: Staging"

    - name: Label untriaged
      if: ${{ !cancelled() && (github.event_name == 'issues' || (github.event_name == 'pull_request_target' && github.event.action == 'opened')) && join(github.event.issue.labels) == '' }}
      uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "S: Untriaged"

    - name: Get PR context
      if: github.event_name == 'workflow_run'
      id: pr-context
      env:
        GH_TOKEN: ${{ github.token }}
        PR_TARGET_REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        PR_NUMBER=$(gh pr list \
        --repo "${PR_TARGET_REPO}" \
        --search "${HEAD_SHA}" \
        --state all \
        --json number \
        --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Could not resolve PR for commit ${HEAD_SHA}"
            exit 1
          fi

          echo "Resolved PR: $PR_NUMBER"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Fetch reviews
      if: github.event_name == 'workflow_run'
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ steps.pr-context.outputs.number }}
      run: |
        curl -s -o reviews.json -L \
          -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUMBER/reviews

        TYPE=$(jq -r 'type' reviews.json)

        if [ "$TYPE" != "array" ]; then
          echo "Unexpected API response:"
          cat reviews.json
          exit 1
        fi

    - name: Count approvals
      if: github.event_name == 'workflow_run'
      id: check-approvals
      run: |
        APPROVALS=$(jq '
          sort_by(.submitted_at)
          | group_by(.user.login)
          | map(last)
          | map(select(.state=="APPROVED" and .user.type=="User"))
          | length
        ' reviews.json)

        echo "Number of approvals: $APPROVALS"
        echo "approvals=$APPROVALS" >> "$GITHUB_OUTPUT"

    - name: Add Approved Label if Enough Approvals
      if: github.event_name == 'workflow_run' && steps.check-approvals.outputs.approvals >= 2
      uses: actions-ecosystem/action-add-labels@v1
      env:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      with:
        number: ${{ steps.pr-context.outputs.number }}
        labels: "S: Approved"

    - name: Remove Other Labels on Approved
      if: github.event_name == 'workflow_run' && steps.check-approvals.outputs.approvals >= 2
      uses: actions-ecosystem/action-remove-labels@v1
      env:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      with:
        number: ${{ steps.pr-context.outputs.number }}
        labels: |
          S: Needs Review
          S: Needs Second Approval

    - name: Add Second Approval Requirement
      if: github.event_name == 'workflow_run' && steps.check-approvals.outputs.approvals == 1
      uses: actions-ecosystem/action-add-labels@v1
      env:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      with:
        number: ${{ steps.pr-context.outputs.number }}
        labels: |
          S: Needs Review
          S: Needs Second Approval

    - name: Remove Other Labels on Second Approval
      if: github.event_name == 'workflow_run' && steps.check-approvals.outputs.approvals == 1
      uses: actions-ecosystem/action-remove-labels@v1
      env:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      with:
        number: ${{ steps.pr-context.outputs.number }}
        labels: "S: Approved"

    - name: Remove All Other Labels if No Approval
      if: github.event_name == 'workflow_run' && steps.check-approvals.outputs.approvals < 1
      uses: actions-ecosystem/action-remove-labels@v1
      env:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      with:
        number: ${{ steps.pr-context.outputs.number }}
        labels: |
          S: Needs Review
          S: Needs Second Approval

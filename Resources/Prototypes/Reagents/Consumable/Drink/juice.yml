- type: reagent
  id: JuiceCarrot
  name: reagent-name-juice-carrot
  parent: BaseJuice
  desc: reagent-desc-juice-carrot
  physicalDesc: reagent-physical-desc-crisp
  flavor: carrot
  color: "#FF8820"
  puddleColor: "#FF882080" # Goob
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Oculine
        amount: 0.5
      - !type:AdjustReagent
        reagent: Nutriment
        amount: 0.5
      - !type:ImmunityModifier # Goobstation start # 1/3 of immurin
        gainRateModifier: 0.000211695098702 # sqrt(1/3) * immurin
        strengthModifier: 0.00256600119637 # sqrt(1/3) * immurin
        statusLifetime: 3 # 3s per 1u #Goobstation end


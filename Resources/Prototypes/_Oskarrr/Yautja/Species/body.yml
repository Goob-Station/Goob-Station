- type: body
  id: GoobYautjaBody
  name: "яутжа"
  root: chest
  slots:
    head:
      part: HeadYautja
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
    chest:
      part: ChestYautja
      connections:
      - groin
      - right arm
      - left arm
      - head
      organs:
        heart: OrganHumanHeart
        lungs: OrganHumanLungs
    groin:
      part: GroinYautja
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganHumanStomach
        liver: OrganHumanLiver
        kidneys: OrganHumanKidneys
    right arm:
      part: RightArmYautja
      connections:
      - right hand
    left arm:
      part: LeftArmYautja
      connections:
      - left hand
    right hand:
      part: RightHandYautja
    left hand:
      part: LeftHandYautja
    right leg:
      part: RightLegYautja
      connections:
      - right foot
    left leg:
      part: LeftLegYautja
      connections:
      - left foot
    right foot:
      part: RightFootYautja
    left foot:
      part: LeftFootYautja

- type: entity
  id: PartYautja
  parent: [BaseItem, BasePart]
  name: "yautja body part"
  abstract: true
  components:
  - type: Icon
    sprite: _Oskarrr/Yautja/body.rsi
    state: full
  - type: BodyPart
    species: Yautja
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: GoobYautjaBlood
        Quantity: 10

- type: entity
  id: ChestYautja
  name: "yautja chest"
  parent: [PartYautja, BaseChest]
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/body.rsi
    state: torso_m
  - type: WoundableVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    occupiedLayer: Chest
    bleedingOverlay: _Shitmed/Mobs/Effects/bleeding_damage.rsi
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#39FF14"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: GoobYautjaBlood
        Quantity: 20


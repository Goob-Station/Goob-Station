- type: entity
  parent: ClothingOuterArmorBase # Стандартна база для бронежилетів та верхнього одягу в Goob
  id: GoobYautjaArmorBase
  abstract: true
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/armor_clan.rsi
    state: icon
  - type: Clothing
    sprite: _Oskarrr/Yautja/armor_clan.rsi
    equipDelay: 1
    unequipDelay: 1
    slots: [ outerClothing ] # Прописуємо слот верхнього одягу
  # Переписуємо захист під стандарти Goob (Еквівалент крутої тактичної броні)
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65       # Поглинає 35% тупої шкоди
        Slash: 0.60       # Поглинає 40% ріжучої шкоди
        Piercing: 0.60    # Поглинає 40% проникаючої шкоди (кулі)
        Heat: 0.55        # Поглинає 45% термічної шкоди
        Structural: 0.60  # Поглинає 40% шкоди від вибухів/руйнувань
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: SpeciesPressureProtection
    species:
    - Yautja

- type: entity
  parent: GoobYautjaArmorBase
  id: GoobYautjaAncientAlienArmor
  name: "стародавня прибулецька броня"
  description: "Стародавня броня з дивного сплаву. Вона холодна на дотик з прибулецькою вагою."

- type: entity
  parent: GoobYautjaArmorBase # Виправлено батька, оскільки HeavyClanArmor відсутній
  id: GoobYautjaStoneArmor
  name: "прибулецька кам'яна броня"
  description: "Костюм броні, повністю зроблений з каменю. Виглядає неймовірно важким."
  suffix: Yautja, Flavor
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/armor_heavy_clan.rsi
    state: icon
  - type: Clothing
    sprite: _Oskarrr/Yautja/armor_heavy_clan.rsi
  # Кам'яна броня трохи міцніша, але сповільнюватиме (баланс Goob)
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.50       # 50% захисту від порізів
        Piercing: 0.60
        Heat: 0.50        # 50% захисту від вогню
        Structural: 0.55  # 45% захисту від вибухів

- type: entity
  parent: GoobYautjaArmorBase
  id: GoobYautjaClanArmor
  name: "клановий обладунок"
  description: "Костюм броні з легким набивкою. Виглядає старим, але функціональним."


    - YautjaSetPiercingSword
    - YautjaSetSeveringSword
    - YautjaSetScimitar
    - YautjaSetChainwhip
    - YautjaSetDualWarScythe
    - YautjaSetDoubleWarScythe
    - YautjaSetCruelStaff
    - YautjaSetCombistick
    - YautjaSetWarAxe
    - YautjaSetCeremonialDagger
    - YautjaSetCombiknife
    - YautjaSetHunterSpear
    - YautjaSetWarGlaive
    - YautjaSetCleavingGlaive
    - YautjaSetAncientWarGlaive
    - YautjaSetLongaxe
    - YautjaSetDuellingBlade
    - YautjaSetDuellingClub

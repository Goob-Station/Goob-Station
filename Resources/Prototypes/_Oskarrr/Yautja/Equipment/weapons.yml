  name: "сплавний шип"
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/weapons.rsi
    layers:
    - state: harpoon
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 24
        Slash: 6
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        # Як у звичайних куль — б'є в скло/решітки (GlassLayer ↔ BulletImpassable)
        mask:
        - Impassable
        - BulletImpassable
- type: entity
  parent: BaseItem
  id: GoobYautjaSpikeLauncher
  name: "пускова установка шипів"
  description: "Компактний пристрій Яутжа у формі півмісяця, що швидко формує і випускає сплавні шипи. Регенерує заряд кожні 3 секунди."
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/guns.rsi
    layers:
    - state: spike_launcher
  - type: Item
    sprite: _Oskarrr/Yautja/gun_inhands.rsi
    heldPrefix: spike_launcher
    size: Normal
  - type: AmmoCounter
  - type: Gun
    projectileSpeed: 28
    fireRate: 1.2
    minAngle: 10
    maxAngle: 18
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/harpoon.ogg
  - type: BasicEntityAmmoProvider
    proto: GoobYautjaSpikeProjectile
    capacity: 12
    count: 12
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 3
    rechargeSound: null
  # Одна рука; дві в руках — стріляють разом (як Dualetta), але не обов'язково.
  - type: Multishot
    missChance: 0
    spreadMultiplier: 1
    spreadAddition: 0
  - type: Tag
    tags:
    - Sidearm
  - type: Appearance


- type: entity
  parent: BaseBullet
  id: GoobYautjaPlasmaBoltBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    noRot: false
    sprite: _Oskarrr/Yautja/plasma_projectiles.rsi
    scale: 1.15, 1.15
    layers:
    - state: ion
      shader: unshaded
  - type: Ammo
    muzzleFlash: GoobYautjaPlasmaMuzzleFlash
  - type: Projectile
    impactEffect: GoobYautjaPlasmaImpactEffect
    soundHit:
      collection: WeakHit
    forceSound: true
    damage:
      types:
        Heat: 0
  - type: PointLight
    enabled: true
    color: "#50d9ff"
    radius: 3.25
    energy: 2.1
  - type: TimedDespawn
    lifetime: 4
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Opaque
        layer:
        - Opaque


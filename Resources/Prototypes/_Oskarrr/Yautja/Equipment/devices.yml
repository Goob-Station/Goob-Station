- type: entity
  parent: ClothingMaskGas
  id: GoobYautjaMaskBase
  abstract: true
  suffix: Yautja, Abstract
  components:
  - type: IngestionBlocker
    blockSmokeIngestion: true
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 20
  - type: NightVision
    isEquipment: true
    color: white
    drawOverlay: false
    strength: 0
    noise: 0
    tint: 3, 3, 3
    activateSound:
      path: /Audio/_Oskarrr/Yautja/Equipment/pred_vision.wav
    deactivateSound: null
  - type: ThermalVision
    isEquipment: true
    toggleAction: ToggleThermalVisionXenomorph
    color: white
    drawOverlay: false
    lightRadius: 10
    strength: 0
    noise: 0
    tint: 3, 3, 3
    activateSound:
      path: /Audio/_Oskarrr/Yautja/Equipment/pred_vision.wav
    deactivateSound: null
  - type: HandheldTranslator
    spoken:
    - TauCetiBasic
    understood:
    - TauCetiBasic
    requires:
    - Yautja
    enabled: true
    toggleOnInteract: false
    setLanguageOnInteract: false
    showInfoOnExamine: false
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: SpeciesPressureProtection
    species:
    - Yautja

- type: entity
  parent: GoobYautjaMaskBase
  id: GoobYautjaMask
  name: "біомаска"
  description: "Прибулецька мисливська маска з вбудованим тактичним візором і перекладачем Tau-Ceti Basic."
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/mask.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _Oskarrr/Yautja/mask.rsi
    slots:
    - Mask
    - SuitStorage
  - type: Item
    size: Small
  - type: Mask
- type: entity
  parent: IDCardStandard
  id: GoobYautjaBracerIdChip
  name: "вбудований ID-чип наручника"
  description: "Компактний ідентифікаційний планшет, розгорнутий з наручника Яутжа."
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    layers:
    - state: default
    - state: silver
  - type: IdCard
    jobTitle: job-name-yautja
    jobIcon: JobIconUnknown
  - type: Access
    groups:
    - AllAccess
- type: entity
  parent: BaseItem
  id: GoobYautjaHealthShardHalf
  name: "половина цілющого уламка"
  description: "Одна половина розділеного цілющого уламка. Використайте на собі, щоб встромити її й отримати негайне лікування та хімічне підсилення."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/health_shard.rsi
    state: shard_icon
  - type: Item
    sprite: _Oskarrr/Yautja/health_shard.rsi
    size: Small
  - type: UseDelay
    delay: 1.0
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: 10
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: HyposprayBlockNonMobInjection
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 10
        reagents:
        - ReagentId: Omnizine
          Quantity: 10

- type: entity
  id: GoobYautjaBracerSelfDestructBurst
  name: yautja bracer self destruct burst
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Explosive
    explosionType: Default
    totalIntensity: 3500
    intensitySlope: 15
    maxIntensity: 70
    canCreateVacuum: true

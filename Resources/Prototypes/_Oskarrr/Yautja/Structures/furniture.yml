# Yautja furniture — real seat/bed/table behaviour (station-quality), Yautja sprites.

# --- Chairs / seats ---
- type: entity
  parent: ChairBase
  id: GoobYautjaStructureYautjaMachinesChair
  name: яутжа стілець
  description: Стародавнє мисливське крісло. Сідай — або тебе посадять.
  suffix: Yautja
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/Structures/yautja_machines.rsi
    state: chair
    noRot: true
  - type: Strap
    position: Stand
    buckleOffset: "0,-0.05"

- type: entity
  parent: ChairBase
  id: GoobYautjaStructureYautjaMachinesComfychair
  name: яутжа зручний стілець
  description: Виглядає підозріло зручно для жорстокої раси мисливців.
  suffix: Yautja

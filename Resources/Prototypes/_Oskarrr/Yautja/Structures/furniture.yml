  name: кістяний трон Яутжа
  description: Трон з кісток здобичі. Важко, але сидіти можна.
  suffix: Yautja
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/Structures/32x32_hunter_props.rsi
    state: bone_throne
    noRot: true
  - type: Strap
    position: Stand
    buckleOffset: "0,-0.1"

# Decorative top piece for the throne (not a seat).
- type: entity

- type: species
  id: WorkingJoe
  name: species-name-workingjoe
  roundStart: false
  prototype: MobWorkingJoe
  sprites: MobWorkingJoeSprites
  markingLimits: MobJoeMarkingLimits
  dollPrototype: MobWorkingJoeDummy
  skinColoration: TintedHues
  defaultSkinTone: "#FFFFFF"
  knowledge: Human
  sexes:
  - Unsexed
  maleFirstNames: NamesFirstMale
  femaleFirstNames: NamesFirstFemale
  lastNames: NamesLast
  # Fixed 2x human scale (old random-size spawn variants removed).
  minHeight: 2.0
  defaultHeight: 2.0
  maxHeight: 2.0
  minWidth: 2.0
  defaultWidth: 2.0
  maxWidth: 2.0
  sizeRatio: 1.2

# Engineer Jockey — human-scale, dedicated jockey mesh.
- type: species

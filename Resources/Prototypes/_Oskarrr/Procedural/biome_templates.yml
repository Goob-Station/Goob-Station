  - !type:BiomeTileLayer
    threshold: -0.6
    tile: FloorLowDesert
    noise:
      seed: 35
      frequency: 0.025
      noiseType: OpenSimplex2
      fractalType: FBm
  - !type:BiomeTileLayer
    threshold: 0.1
    tile: FloorDesert
    noise:
      seed: 36
      frequency: 0.03
      noiseType: OpenSimplex2
      fractalType: FBm
  - !type:BiomeTileLayer
    tile: FloorAsteroidSand
    threshold: -0.22
    noise:
      seed: 34
      noiseType: Cellular
      frequency: 0.04
      fractalType: FBm
      octaves: 5
      lacunarity: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2

# 3) Savanna — open firefight ground for corporate spies
- type: biomeTemplate
  id: WildLandsSavanna
  layers:
  # Tall grass cover (player hide)
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorOskarrrDryGrass
    - FloorPlanetGrass
    - FloorLowDesert
    divisions: 2
    threshold: -0.35
    noise:
      seed: 41
      noiseType: OpenSimplex2
      frequency: 1.1
    decals:
    - Grassa1
    - Grassa2
    - Grassa3
    - Grassa4
    - Grassa5
    - Grassb1
    - Grassb2
    - Grassb3
    - Grassc1
    - Grassc2
    - Grassd1
    - Grassd2
    - Grasse1
    - Grasse2
  # Sparse dry trees
  - !type:BiomeEntityLayer
    threshold: 0.78
    noise:
      seed: 42
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 1.2
    allowedTiles:
    - FloorOskarrrDryGrass
    - FloorPlanetGrass
    - FloorLowDesert
    entities:
    - FloraTree
    - FloraTreeStump
  # Occasional bushes
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorOskarrrDryGrass
    - FloorPlanetGrass
    divisions: 1
    threshold: 0.65
    noise:
      seed: 43
      noiseType: OpenSimplex2
      frequency: 1
    decals:
    - BushDOne
    - BushDTwo
    - BushDThree
  # Sparse rocks
  - !type:BiomeEntityLayer
    threshold: 0.92
    noise:
      seed: 44
      noiseType: OpenSimplex2
      frequency: 2
    allowedTiles:
    - FloorOskarrrDryGrass
    - FloorLowDesert
    - FloorDesert
    entities:
    - FloraRockSolid
  # Sparse savanna herds
  - !type:BiomeEntityLayer
    threshold: 0.92
    noise:
      seed: 73
      noiseType: OpenSimplex2
      frequency: 0.8
    allowedTiles:
    - FloorOskarrrDryGrass
    - FloorPlanetGrass
    - FloorLowDesert
    entities:
    - MobWildLandsSavannaCow
    - MobWildLandsSavannaGoat
    - MobWildLandsBoar
    - MobWildLandsChicken
  # Light rock outcrops (not as dense as desert canyons)
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorOskarrrDryGrass
    - FloorLowDesert
    - FloorPlanetGrass
    threshold: -0.45
    noise:
      seed: 45
      noiseType: Cellular
      frequency: 0.035
      fractalType: FBm
      octaves: 4
      lacunarity: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WallRock
  - !type:BiomeDummyLayer
    id: Loot
  # Open mixed dry grass + sand
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorLowDesert
  - !type:BiomeTileLayer
    threshold: -0.55
    tile: FloorOskarrrDryGrass
    noise:
      seed: 46
      frequency: 0.02
      noiseType: OpenSimplex2
      fractalType: FBm
  - !type:BiomeTileLayer
    threshold: 0.25
    tile: FloorPlanetGrass
    noise:
      seed: 47
      frequency: 0.035
      noiseType: OpenSimplex2
      fractalType: FBm
  - !type:BiomeTileLayer
    threshold: 0.55
    tile: FloorDesert
    noise:
      seed: 48
      frequency: 0.04
      noiseType: OpenSimplex2
      fractalType: None
  - !type:BiomeTileLayer
    tile: FloorLowDesert
    threshold: -0.45
    noise:
      seed: 45
      noiseType: Cellular
      frequency: 0.035
      fractalType: FBm
      octaves: 4
      lacunarity: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2

    - FloorLowDesert
    - FloorAsteroidSand
    entities:
    - FruitCactus
  # Scattered rocks
  - !type:BiomeEntityLayer
    threshold: 0.85
    noise:
      seed: 32
      noiseType: OpenSimplex2
      frequency: 2
    allowedTiles:
    - FloorDesert
    - FloorLowDesert
    - FloorAsteroidSand
    entities:
    - FloraRockSolid
  # Dried logs / stumps
  - !type:BiomeEntityLayer
    threshold: 0.88
    noise:
      seed: 33
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 1.8
    allowedTiles:

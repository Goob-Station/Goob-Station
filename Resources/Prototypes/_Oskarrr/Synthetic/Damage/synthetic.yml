# Not Biological → bandages / ointments that whitelist Biological do nothing.
# No Radiation / Poison / Asphyxiation support → immune to those damage types.
- type: damageContainer
  id: Synthetic
  supportedGroups:
  - Brute
  - Burn
  supportedTypes:
  - Shock
  - Cold
  - Heat
  - Bloodloss
  - Caustic

- type: damageModifierSet
  id: Synthetic
  coefficients:
    Blunt: 0.65
    Slash: 0.65
    Piercing: 0.7
    Heat: 0.85
    Shock: 1.1
    Cold: 0.5
    Caustic: 0.75
    Bloodloss: 0.5
    Radiation: 0
    Poison: 0
    Asphyxiation: 0
    Cellular: 0
  ignoreArmorPierceFlags: All

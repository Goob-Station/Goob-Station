- type: body
  id: Bot
  name: "бот"
  root: hand 1
  slots:
    hand 1:
      part: LeftArmBorg

# It's like a medibot or a cleanbot except it has two arms to hug :)
- type: body
  id: HugBot
  name: "обіймабот"
  root: box
  slots:
    box:
      part: TorsoBorg
      connections:
      - right arm
      - left arm
    right arm:
      part: RightArmBorg
      connections: # Goobstation
      - right hand # Goobstation
    left arm:
      part: LeftArmBorg
      connections: # Goobstation
      - left hand # Goobstation
    # Goobstation start
    right hand:
      part: RightHandHuman
    left hand:
      part: LeftHandHuman

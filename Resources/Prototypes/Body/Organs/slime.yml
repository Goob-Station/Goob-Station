- type: entity
  id: SentientSlimeCore
  parent: [BaseItem, OrganHumanBrain]
  name: sentient slime core
  description: "The source of incredible, unending gooeyness."
  components:
    - type: Sprite
      sprite: Mobs/Species/Slime/organs.rsi
      state: brain-slime
    - type: Stomach
    - type: Organ
      intCap: 120 # to prevent slimes from getting oneshot
      integrity: 120
      integrityThresholds:
        Normal: 120
        Damaged: 60
        Destroyed: 0
      slotId: core
    - type: Metabolizer
      maxPoisonsProcessable: 2 # Shitmed
      metabolizerTypes: [ Slime ]
      removeEmpty: true
      groups:
        - id: Food
        - id: Drink
        - id: Medicine
        - id: Poison
        - id: Narcotic
        - id: Alcohol
          rateModifier: 2.5
    - type: SolutionContainerManager
      solutions:
        stomach:
          maxVol: 50.0
        food:
          maxVol: 10 # goob edit
          reagents:
            - ReagentId: GreyMatter
              Quantity: 5
            - ReagentId: Cognizine # goob edit
              Quantity: 5 # goob edit
        organ:
          reagents:
            - ReagentId: Slime
              Quantity: 10
            - ReagentId: Cognizine # goob edit
              Quantity: 5 # goob edit
    - type: Item
      size: Small
      heldPrefix: brain


- type: entity
  id: OrganSlimeLungs
  parent: BaseHumanOrgan
  name: slime gas sacs
  description: "Collects nitrogen, which slime cells use for maintenance."
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/organs.rsi
    layers:
      - state: lung-l-slime
      - state: lung-r-slime
  - type: Organ # Shitmed
    intCap: 105 #
    integrity: 105
    integrityThresholds:
      Normal: 105
      Damaged: 70
      Destroyed: 0
    slotId: lungs
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Slime ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Slime
          Quantity: 10
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Item
    size: Small
    heldPrefix: lungs
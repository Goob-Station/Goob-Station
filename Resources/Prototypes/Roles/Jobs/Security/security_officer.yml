- type: job
  id: SecurityOfficer
  name: job-name-security
  description: job-description-security
  playTimeTracker: JobSecurityOfficer
  requirements:
    - !type:DepartmentTimeRequirement
      department: Security
      time: 10h # Pirate
    - !type:TraitsRequirement # Pirate
      inverted: true
      traits:
      - Foreigner
      - ForeignerLight
      - DeafTrait
      - MovementImpaired
      - Blindness
      - Narcolepsy
      - Muted
      - WheelchairBound # Pirate end
    # Pirate contractor start
    - !type:CharacterEmployerRequirement
      employers:
      - NanoTrasen
      - ZavodskiyInterstellar
      - PMCG
    # Pirate contractor end
  startingGear: SecurityOfficerGear
  icon: "JobIconSecurityOfficer"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides: # goobstation
  - Security
  - LegalSOP
  - OfficerCadetSOP
  - CorporateJudo
  - AlertLevels
  goobcoins: 30 #Goob content
  access:
  - Security
  - Brig
  - Maintenance
  - External
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
      - type: SecurityStaff

- type: startingGear
  id: SecurityOfficerGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    ears: ClothingHeadsetAltSecurityRegular # Goobstation
#    pocket1: WeaponPistolMk58 # PIRATE, moved to loadouts
  storage:
    back:
    - Flash
#    - MagazinePistol # PIRATE, moved to loadouts

- type: chameleonOutfit
  id: SecurityOfficerChameleonOutfit
  job: SecurityOfficer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretSecurity
    mask: ClothingMaskGasSecurity
    neck: Dinkystar
    gloves: ClothingHandsGlovesColorBlack

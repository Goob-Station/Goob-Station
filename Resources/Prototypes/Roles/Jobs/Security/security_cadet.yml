- type: job
  id: SecurityCadet
  name: job-name-cadet
  description: job-description-cadet
  playTimeTracker: JobSecurityCadet
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 10h # Pirate
    - !type:TraitsRequirement # Pirate
      inverted: true
      traits:
      - Foreigner
      - ForeignerLight
      - DeafTrait
      - MovementImpaired
      - Blindness
      - Narcolepsy
      - Muted
      - WheelchairBound # Pirate end
    # - !type:DepartmentTimeRequirement # Pirate
    #   department: Security # Pirate
    #   time: 18000 #5 hrs # Pirate
    #   inverted: true # stop playing intern if you're good at security! # Pirate
    # Pirate contractor start
    - !type:CharacterEmployerRequirement
      employers:
      - NanoTrasen
      - ZavodskiyInterstellar
      - PMCG
    # Pirate contractor end
  startingGear: SecurityCadetGear
  icon: "JobIconSecurityCadet"
  supervisors: job-supervisors-security
  canBeAntag: false
  guides: # goobstation
  - Security
  - OfficerCadetSOP
  - SearchesSOP
  goobcoins: 30 #Goob content
  access:
  - Security
  - Brig
  - Maintenance
  - External
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
      - type: SecurityStaff


- type: job
  id: Captain
  name: job-name-captain
  description: job-description-captain
  playTimeTracker: JobCaptain
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 4h
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 4h
    - !type:DepartmentTimeRequirement
      department: Science
      time: 4h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 6h # Goobstation
    - !type:DepartmentTimeRequirement
      department: Command
      time: 8h # Goobstation
    - !type:TraitsRequirement # Pirate
      inverted: true
      traits:
      - Foreigner
      - ForeignerLight
      - DeafTrait
      - MovementImpaired
      - Blindness
      - Narcolepsy
      - Muted
      - WheelchairBound # Pirate end
    #- !type:SpeciesRequirement # Pirate remove requireme
    #  inverted: true
    #  species:
    #  - Felinid
      #any MRP using our code might eventually want to use it
    # - !type:SaturationRequirement # MisandryBox - no neon hair on captain
    #   hairColorSaturation: 0.30
    # Pirate contractor start
    - !type:CharacterEmployerRequirement
      employers:
      - NanoTrasen
    # Pirate contractor end
  guides: # goobstation
  - Command
  - Succession
  - StandardProceduresSOP
  - CaptainSOP
  goobcoins: 50 #Goob content
  weight: 20
  startingGear: CaptainGear
  icon: "JobIconCaptain"
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  canBeAntag: false
  whitelisted: true # Pirate
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
      - type: Condemned # Goobstation - Nanotrasen owns your soul pal.
        soulOwnedNotDevil: true

- type: startingGear
  id: CaptainGear
  equipment:
   # shoes: ClothingShoesBootsLaceup - Goobstation
    eyes: ClothingEyesGlassesCommand
    #gloves: ClothingHandsGlovesCaptain - Goobstation, moved to loadouts
    id: CaptainPDA
    ears: ClothingHeadsetAltCommand
  #storage: # Pirate
    #back: # Pirate
    #- Flash # Pirate
    #- TelescopicBaton # Goobstation # PIRATE, moved to loadouts
    # - StationCharter

- type: chameleonOutfit
  id: CaptainChameleonOutfit
  job: Captain
  hasMindShield: true
  equipment:
    head: ClothingHeadHatCapcap
    eyes: ClothingEyesGlassesCommand
    mask: ClothingMaskGasCaptain
    neck: ClothingNeckCloakCap

- type: job
  id: ResearchDirector
  name: job-name-rd
  description: job-description-rd
  playTimeTracker: JobResearchDirector
  requirements:
  - !type:RoleTimeRequirement
    role: JobForensicMantis
    time: 18000 # 5 hours
  - !type:RoleTimeRequirement
    role: JobScientist
    time: 6h # Goobstation
  - !type:DepartmentTimeRequirement
    department: Science
    time: 10h
  - !type:SpeciesRequirement # Pirate no ipc psionics
    inverted: true
    species:
    - IPC
  - !type:TraitsRequirement
    inverted: true
    traits:
    - DeafTrait
    - Blindness
    - Narcolepsy
    - Muted
    - WheelchairBound # Pirate end
  #- !type:SpeciesRequirement # Pirate remove requirement
  #  inverted: true
  #  species:
  #  - Felinid
  # Pirate contractor start
  - !type:CharacterEmployerRequirement
    employers:
    - NanoTrasen
    - Interdyne
  # Pirate contractor end
  weight: 10
  startingGear: ResearchDirectorGear
  icon: "JobIconResearchDirector"
  supervisors: job-supervisors-captain
  #canBeAntag: false
  antagAdvantage: 75 # Goobstation
  guides: # goobstation
  - Science
  - Command
  - ResearchDirectorSOP
  - ScienceSOP
  goobcoins: 40 #Goob content
  access:
  - Research
  - Command
  - Maintenance
  - ResearchDirector
  - Brig
  - Cryogenics
  - External # Goobstation
  - Mantis # Pirate
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: Psionic # Nyano - They start with telepathic chat
        powerSlots: 3
        baselinePowerCost: 75
        nextPowerCost: 75 # No that's fully intended that he has the "Full" power pull. Have fun with being a crew-aligned wizard/cultist.
      - type: CommandStaff
      - type: InnatePsionicPowers
        powersToAdd:
          - DispelPower
          - MetapsionicPower
          - TelepathyPower
      - type: Telepathy

- type: startingGear
  id: ResearchDirectorGear
  equipment:
    id: RnDPDA
    ears: ClothingHeadsetAltScience # Goobstation
  storage:
    back:
    - CosmicCenser # DeltaV - Cosmic Cult
    # Pirate: Flash and TelescopicBaton moved to loadouts.

- type: chameleonOutfit
  id: ResearchDirectorChameleonOutfit
  job: ResearchDirector
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretRND
    eyes: ClothingEyesGlasses
    mask: ClothingMaskGas
    neck: ClothingNeckCloakRd
    outerClothing: ClothingOuterCoatRD
    gloves: ClothingHandsGlovesColorPurple

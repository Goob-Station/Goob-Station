    #  inverted: true
    #  species:
    #  - Felinid
  # Pirate contractor start
    - !type:CharacterEmployerRequirement
      employers:
      - NanoTrasen
      - OrionExpress
  # Pirate contractor end
  weight: 10
  startingGear: QuartermasterGear
  icon: "JobIconQuarterMaster"
  supervisors: job-supervisors-captain
  #canBeAntag: false
  antagAdvantage: 75 # Goobstation
  guides: # goobstation
  - Cargo
  - QuartermasterSOP
  - CargoSOP
  - Command
  goobcoins: 40 #Goob content
  access:
  - Cargo
  - Salvage
  - Quartermaster
  - Maintenance
  - External
  - Command
  - Brig
  - Cryogenics
  - External # goobstation
  special:

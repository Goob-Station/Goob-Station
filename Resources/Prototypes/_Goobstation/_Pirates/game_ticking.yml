- type: entity
  parent: BaseGameRule
  id: SpacePirates
  components:
  - type: StationEvent
    weight: 2
    duration: null
    earliestStart: 20
    reoccurrenceDelay: 60
    minimumPlayers: 30
    chaos:
      Hostile: 60
      Medical: 50
      Death: 25
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 550 # Until Pirate gear gets reworked, they dont threaten the station as hard as dragon or colossus to justify this high of a chaos score (650)
  - type: PendingPirateRule
    ransomPrototype: BikeHornRansom
  - type: Tag
    tags:
    - MidroundAntag

- type: entity
  parent: BaseGameRule
  id: PiratesSpawn
  components:
  - type: ActivePirateRule
  - type: RuleGrids
  - type: LoadMapRule
    mapPath: /Maps/_Goobstation/Shuttles/pirates_irs.yml
  - type: AntagLoadProfileRule
    speciesOverride: Human
    alwaysUseSpeciesOverride: true
  - type: AntagSelection
    definitions:
    - spawnerPrototype: SpawnPointPirateCaptain
      pickPlayer: false
      min: 5
      max: 5
      mindRoles:
      - MindRolePirate
      startingGear: PirateGear
      components:
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
  - type: Tag
    tags:
    - MidroundAntag

- type: entity
  parent: BikeHorn
  id: BikeHornRansom
  categories: [ HideSpawnMenu ]
  components:
  - type: Ransom

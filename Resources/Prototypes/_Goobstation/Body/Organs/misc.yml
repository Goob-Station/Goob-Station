- type: entity
  parent: [ OrganHumanHeart, BaseSyndicateContraband ]
  id: OrganHeartSandevistan
  name: Sandevistan
  description: Illegal cyberware that replaces the user's heart and allows them to greatly increase their speed for the cost of the endurance.
  components:
  - type: Cybernetics
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/sandevistan.rsi
    state: icon
    scale: 0.5, 0.5
  - type: OrganActions
    actions:
    - ActionToggleSandevistan
  - type: Organ
    onAdd:
    - type: SandevistanUser
      visionComponents:
      - type: SandevistanSlowdownVision
      thresholds:
        Warning: 10
        Shaking: 15
        Disable: 35
        Death: 80

- type: entity
  parent: [ OrganHumanHeart, BaseSyndicateContraband ]
  id: OrganHeartStatvekaSandevistan
  name: mi13 statveka sandevistan
  description: A cybernetic heart implant that drastically improves the user's speed and reflexes for a short duration, at the cost of endurance. Once used by a certain mercenary.
  components:
  - type: Cybernetics
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/sandevistan.rsi
    layers:
    - state: icon
    scale: 0.5, 0.5
  - type: OrganActions
    actions:
    - ActionToggleSandevistan
    - ActionSandevistanCounter
  - type: Organ
    onAdd:
    - type: SandevistanUser
      movementSpeedModifier: 1
      attackSpeedModifier: 1
      doAfterModifier: 1
      slowfieldEnabled: true
      trampleEnabled: true
      hitDamageMultiplier: 3
      hitDisables: true
      hitKnockbackStrength: 6
      visionComponents:
      - type: SandevistanSlowdownVision
      - type: AudioPitch
      thresholds:
        Shaking: 1
        Warning: 2
        Disable: 10

- type: entity
  parent: [ OrganHumanHeart, BaseSyndicateContraband ]
  id: OrganHeartTimestopperSandevistan
  name: mi13 timestopper sandevistan
  description: A cybernetic heart implant. This one is an offshoot of the statveka. While having a stronger effect it's not as stable. Once used by a certain vampire..
  components:
  - type: Cybernetics
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/sandevistan.rsi
    layers:
    - state: icon
    scale: 0.5, 0.5
  - type: OrganActions
    actions:
    - ActionToggleSandevistan
    - ActionSandevistanCounter
  - type: Organ
    onAdd:
    - type: SandevistanUser
      movementSpeedModifier: 1
      attackSpeedModifier: 3
      doAfterModifier: 1
      slowfieldEnabled: true
      hitDamageMultiplier: 0.5
      hitKnockbackStrength: 2
      hitKnockbackDelayed: true
      afterimageColor: "#9a9a9a"
      loadPerActivation: 0
      mobSpeedMultiplier: 0.015
      thrownItemSpeedMultiplier: 0.005
      projectileSpeedMultiplier: 0.003
      startSound:
        path: /Audio/_Goobstation/Sandevistan/time_slow.ogg
        params:
          volume: 12
      endSound:
        path: /Audio/_Goobstation/Sandevistan/time_slow_reverse.ogg
        params:
          volume: 12
      loopSound: null
      visionComponents:
      - type: SandevistanTimestopVision
      - type: AudioReverb
      activationComponents:
      - type: SandevistanTimestopBurst
      thresholds:
        Warning: 2
        Shaking: 3
        DisableNoAnim: 8

- type: entity
  parent: [OrganHumanHeart, BaseSyndicateContraband]
  id: SyndicateBerserkerHeart
  name: berserker heart
  description: A next-gen combat circulatory core that allows the user to enter a berserk state, greatly increasing their speed and reflexes for a short time at the cost of endurance and some pain resistance. Highly illegal.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/berserker_heart.rsi
    state: icon
    scale: 0.5, 0.5
  - type: OrganActions
    actions:
    - ActionActivateBerserkerImplant

- type: entity
  parent: [OrganHumanHeart, BaseSyndicateContraband]
  id: SyndicateJumpstarterHeart
  name: jumpstarter heart
  description: A next-gen combat circulatory core that injects a large amount of omnizine into the user's bloodstream when they are critically injured, saving them from death. Highly illegal.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/jumpstarter_heart.rsi
    state: icon
    scale: 0.5, 0.5
  - type: Organ
    onAdd:
    - type: InjectOnMobState
      reagents:
        Omnizine: 75
        TranexamicAcid: 5
        DexalinPlus: 15

# Literally the first base
- type: breed
  parent: BaseMutation
  id: GreyMutation
  breedName: grey slime
  producedExtract: GreySlimeExtract
  components:
  - type: Slime
    breed: GreyMutation
    slimeColor: "#828282"
    maxOffspring: 4
    mutationChance: 0.45
    potentialMutations:
    - OrangeMutation
    - PurpleMutation
    - BlueMutation
    - MetalMutation

- type: breed
  parent: BaseMutation
  id: RainbowMutation
  breedName: rainbow slime
  producedExtract: RainbowSlimeExtract
  components:
  - type: Slime
    slimeColor: "#383936"
    shouldHaveShader: true
    shader: XenoMetallic
    breed: RainbowMutation
    maxOffspring: 1
    mutationChance: 0
    canBeModified: false # No purple slime abuse
    potentialMutations:
    - RainbowMutation

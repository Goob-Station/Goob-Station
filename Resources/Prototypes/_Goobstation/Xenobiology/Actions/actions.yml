- type: entity
  parent: BaseAction
  id: ActionSlimeLatch
  name: Latch
  description: Latch onto a target and begin digesting it! Or get off of an existing one if you're already latched onto something.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Xenobiology/Actions/actions_slime.rsi
      state: slimeeat
    useDelay: 3
  - type: TargetAction
    range: 1
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Body
    blacklist:
      components:
      - Slime
    canTargetSelf: false
    event: !type:SlimeLatchEvent {}

- type: entity
  parent: BaseAction
  id: ActionEatCorpse
  name: Eat corpse
  description: Slowly begin to tear off the target's body part or organ.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Xenobiology/Actions/actions_slime.rsi
      state: slimeeat
    useDelay: 1
  - type: TargetAction
    range: 1
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Body
    canTargetSelf: false
    event: !type:EatCorpseEvent

- type: entity
  parent: BaseEntitySpellAction
  id: ActionMindTransfer
  name: Mind Transference
  description: Transfer your mind to someone's else but with a cost.
  components:
  - type: Action
    useDelay: 60
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/staff_animation.ogg
    raiseOnUser: true
    icon:
      sprite: _Goobstation/Wizard/actions.rsi
      state: mindswap
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
        - MobState
        - Body # this also allows borgs because that supercode uses Body for no reason
        - PAI # intended to mindswap pAIs and AIs
        - StationAiCore
        - MindContainer
    event: !type:MindTransferenceEvent
      sound:
        path: /Audio/_Goobstation/Wizard/mandswap.ogg
  - type: Sprite # Goobstation - for apprentices
    sprite: _Goobstation/Wizard/actions.rsi
    state: mindswap

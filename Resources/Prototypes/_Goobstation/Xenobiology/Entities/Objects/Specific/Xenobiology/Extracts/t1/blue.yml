- type: entity
  id: BlueSlimeExtract
  parent: BaseSlimeExtract
  name: blue slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#79F6FC"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:AreaReactionEffect
        duration: 10
        prototypeId: Foam
        sound:
          path: /Audio/Effects/extinguish.ogg
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReagent
      - !type:AdjustReagent
        reagent: FrostOil
        amount: 30
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReagent
      - !type:AdjustReagent
        reagent: XenobioJellyBlue
        amount: 1
  - type: Tag
    tags:
    - XenobiologyBlueExtract

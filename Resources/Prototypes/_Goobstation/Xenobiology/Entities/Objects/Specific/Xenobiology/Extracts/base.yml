- type: entity
  id: BaseSlimeExtract
  parent: BaseItem
  name: slime extract
  description: Goo extracted from a slime. Legends claim these to have "magical powers".
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#828282"
  - type: Appearance
  - type: SolutionContainerManager # If you are removing this in favor of upstream, delete RelaySolution on every single xenobio extract rection
    solutions:
      extract:
        maxVol: 100
  - type: InjectableSolution
    solution: extract
  - type: DrawableSolution
    solution: extract
  - type: ExaminableSolution
    solution: extract
  - type: SlimeExtract
  - type: Reactive
    scaleOverride: 1
  - type: StatusEffects # used for jittering and stuff
    allowed:
    - Jitter
  - type: GuideHelp
    guides:
    - Xenobiology

- type: entity
  abstract: true
  id: FilledBaseSlimeExtract
  suffix: Filled
  components:
  - type: InjectOnSpawn
    solutionName: extract
    reagents:
    - ReagentId: Water
      Quantity: 5
    - ReagentId: Blood
      Quantity: 5
    - ReagentId: Plasma
      Quantity: 5
  - type: Reactive
    effects:
    - !type:RemoveComponents
      guidebookText: entity-effect-guidebook-remove-reactive
      components:
      - type: Reactive # Remove after the whole reagent reaction done

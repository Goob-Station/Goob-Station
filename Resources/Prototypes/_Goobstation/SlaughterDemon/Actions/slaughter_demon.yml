- type: entity
  id: BloodCrawlAction
  name: Blood Crawl
  description: JAUNT ANYWHERE WHENEVER YOU ARE ON BLOOD
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Goobstation/SlaughterDemon/abilities.rsi
      state: crawl
    useDelay: 4
  - type: InstantAction
    event: !type:BloodCrawlEvent

- type: entity
  id: DemonicWhisperAction
  name: Demonic Whisper
  parent: ActionTelepathy
  description: SEND A MESSAGE TO THEIR SOUL, FROM HELL
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    icon:
      sprite: _Goobstation/SlaughterDemon/abilities.rsi
      state: whisper
    itemIconStyle: NoItem
  - type: TargetAction
    interactOnMiss: false
    range: 15
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:TelepathyWhisperEvent
  - type: TelepathyAction
    popupDialogueTitle: demonic-whisper-title
    popupWhisperSelf: demonic-whisper-self
    popupWhisperFlavor: demonic-whisper-flavor
    popupType: MediumCaution

- type: constructionGraph
  id: FermentingBarrel
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity {}
    edges:
    - to: barrel
      steps:
      - material: WoodPlank
        amount: 8
        doAfter: 5
  - node: barrel
    entity: FermentingBarrel
    edges:
    - to: start
      completed:
      - !type:EmptyAllContainers {}
      - !type:GivePrototype
        prototype: MaterialWoodPlank1
        amount: 8
      steps:
      - tool: Prying
        doAfter: 3

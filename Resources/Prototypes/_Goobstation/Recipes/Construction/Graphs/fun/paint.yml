- type: constructionGraph
  id: PaintEaselGraph
  start: start
  graph:
  - node: start
    edges:
    - to: easel
      steps:
      - material: WoodPlank
        amount: 4
        doAfter: 3
  - node: easel
    entity: PaintEasel
    edges:
    - to: start
      completed:
      - !type:EmptyAllContainers
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 4
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 2

- type: constructionGraph
  id: PaintCanvasGraph
  start: start
  graph:
  - node: start
    edges:
    - to: canvas
      steps:
      - material: WoodPlank
        amount: 1
        doAfter: 1
      - material: Cloth
        amount: 2
        doAfter: 1
    - to: landscape
      steps:
      - material: WoodPlank
        amount: 1
        doAfter: 1
      - material: Cloth
        amount: 3
        doAfter: 1
    - to: small
      steps:
      - material: WoodPlank
        amount: 1
        doAfter: 1
      - material: Cloth
        amount: 1
        doAfter: 1
  - node: canvas
    entity: PaintCanvas
  - node: landscape
    entity: PaintCanvasLandscape
  - node: small
    entity: PaintCanvasSmall


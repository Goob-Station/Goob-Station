# Tier 1

- type: entity
  id: SpiderlingRed
  parent: MobSpiderlingBase
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: flesh_spiderling
  - type: DamageStateVisuals
    states:
      Alive:
        Base: flesh_spiderling
      Dead:
        Base: flesh_spiderling_dead
  - type: TerrorSpiderling
    growsInto: RedTerror


# prince
- type: entity
  id: TerrorSpiderPrince
  parent: BaseMobTerrorSpider
  name: prince of terror
  description: An enormous, terrifying spider. It looks like it is judging everything it sees. Its hide seems armored, and it bears the scars of many battles.
  components:
  - type: Sprite
    sprite: _Goobstation/Terror/Entities/Mobs
    layers:
      - map: ["enum.DamageStateVisualLayers.Base"]
        state: allblack
  - type: DamageStateVisuals
    states:
      Alive:
        Base: allblack
      Dead:
        Base: allblack_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Dead
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 40
      types:
        Structural: 60
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 5
    useSound:
      path: /Audio/Items/crowbar.ogg
  # Terror
  - type: TerrorPounce
    injectReagent: Toxin
    injectAmount: 10
  - type: TerrorTremor
  - type: TerrorCharge
    structureDamage:
      types:
        Structural: 300
    targetDamage:
      groups:
        Brute: 30
  - type: ProximityLeashAnchor
    leashGroup: terrorSpider
  - type: TerrorSpider
    spiderType: TerrorPrince
  - type: ActionGrant
    actions:
    - ActionTerrorThickWeb
    - ActionTerrorPounce
    - ActionTerrorTremor
    - ActionTerrorCharge

# princess
- type: entity
  id: TerrorSpiderPrincess
  parent: BaseMobTerrorSpider
  name: princess of terror
  description: An enormous spider. It looks strangely cute and fluffy.
  components:
  - type: Sprite
    sprite: _Goobstation/Terror/Entities/Mobs
    layers:
      - map: ["enum.DamageStateVisualLayers.Base"]
        state: princess
  - type: DamageStateVisuals
    states:
      Alive:
        Base: princess
      Dead:
        Base: princess_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Web
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: VentCrawler
  # Terror
  - type: TerrorVentSmash
  - type: SpiderEggLayer
    generationInterval: 90
    maxStoredEggs: 8
  - type: TerrorSpider
    spiderType: TerrorPrincess
  - type: ActionGrant
    actions:
    - ActionTerrorAirtightWeb
    - ActionTerrorLayEggs
    - ActionTerrorVentSmash

# mother
- type: entity
  id: TerrorSpiderMother
  parent: BaseMobTerrorSpider
  name: mother of terror
  description: An enormous spider. Tiny spiderlings are crawling all over it. Their beady little eyes all stare at you. The horror!
  components:
  - type: Sprite
    sprite: _Goobstation/Terror/Entities/Mobs
    layers:
      - map: ["enum.DamageStateVisualLayers.Base"]
        state: mother
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mother
      Dead:
        Base: mother_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 10
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2
    useSound:
      path: /Audio/Items/crowbar.ogg
  # Terror
  - type: TerrorVentSmash
  - type: TerrorLifeShare
    selfCost:
      groups:
        Brute: 10
    healAmount:
      groups:
        Brute: -30
  - type: TerrorSpider
    spiderType: TerrorMother
  - type: ActionGrant
    actions:
    - ActionTerrorAirtightWeb
    - ActionTerrorVentSmash
    - ActionTerrorLifeShare

- type: entity
  parent: BaseGameRule
  id: SlasherSpawn
  components:
  - type: StationEvent
    weight: 3
    duration: null
    earliestStart: 30
    minimumPlayers: 30
    chaos:
      Hostile: 40
      Combat: 40
      Death: 40
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 600
  - type: AntagLockerSpawn
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Yowie
    - IPC
    - Diona
    - Harpy
    - Plasmaman
    - Hydrakin
    forceMaxSize: true
  - type: AntagObjectives
    objectives:
    - SlasherSurviveObjective
    - SlasherAbsorbSoulsObjective
  - type: AntagSelection
    selectionTime: PostPlayerSpawn
    agentName: slasher-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostSlasher
      min: 1
      max: 1
      pickPlayer: false
      briefing:
        text: slasher-role-greeting
        color: Red
        sound: /Audio/_Goobstation/Slasher/Effects/SlasherIntro.ogg
      mindRoles:
      - MindRoleSlasher
      components:
      - type: SlasherKitSelect
      - type: UserInterface
        interfaces:
          enum.SlasherKitSelectUiKey.Key:
            type: SlasherKitSelectBoundUserInterface
      - type: GhostRole
        name: ghost-role-information-slasher-name
        description: ghost-role-information-slasher-description
        rules: ghost-role-information-antagonist-rules
        mindRoles:
        - MindRoleGhostRoleSoloAntagonist
      - type: GhostTakeoverAvailable
  - type: Tag
    tags:
    - MidroundAntag

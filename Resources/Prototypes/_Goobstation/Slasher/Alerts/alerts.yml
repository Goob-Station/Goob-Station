- type: alert
  id: SlasherSeen
  icons:
  - sprite: /Textures/_Goobstation/Interface/Alerts/seen.rsi
    state: unseen
  - sprite: /Textures/_Goobstation/Interface/Alerts/seen.rsi
    state: seen
  name: alerts-slasher-seen-name
  description: alerts-slasher-seen-desc
  minSeverity: 0
  maxSeverity: 1

- type: alert
  id: BaseSlasherFear
  abstract: true
  icons:
  - sprite: /Textures/_Goobstation/Slasher/Objects/fear_alert.rsi
    state: icon
  alertViewEntity: AlertSlasherFearSpriteView

- type: alert
  id: SlasherFear
  parent: BaseSlasherFear
  clickEvent: !type:SlasherToggleFearMusicAlertEvent
  name: alerts-slasher-fear-name
  description: alerts-slasher-fear-desc

- type: alert
  id: SlasherFearVictim
  parent: BaseSlasherFear
  name: alerts-slasher-fear-victim-name
  description: alerts-slasher-fear-victim-desc

- type: entity
  id: AlertSlasherFearSpriteView
  categories: [ HideSpawnMenu ]
  components:
  - type: GenericCounterAlert
    hideLeadingZeroes: true
  - type: Sprite
    layers:
    - map: [ "enum.AlertVisualLayers.Base" ]
      sprite: /Textures/_Goobstation/Slasher/Objects/fear_alert.rsi
      state: icon
    - map: [ "1" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      state: "0"
      offset: 0.5, 0
    - map: [ "10" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      state: "0"
      offset: 0.375, 0
    - map: [ "100" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      state: "0"
      offset: 0.25, 0

- type: alert
  id: SlasherSoulBonus
  icons:
  - sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus.rsi
    state: icon
  alertViewEntity: AlertSlasherSoulBonusSpriteView
  name: alerts-slasher-soul-bonus-name
  description: alerts-slasher-soul-bonus-desc

- type: entity
  id: AlertSlasherSoulBonusSpriteView
  categories: [ HideSpawnMenu ]
  components:
  - type: SlasherSoulBonusAlert
  - type: Sprite
    layers:
    - map: [ "enum.AlertVisualLayers.Base" ]
      sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus.rsi
      state: icon
    # Damage row (top)
    - map: [ "damage1" ]
      sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus_counter.rsi
      state: "0"
      offset: 0.3125, 0.34375
    - map: [ "damage10" ]
      sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus_counter.rsi
      state: "0"
      offset: 0.1875, 0.34375
    - map: [ "damage100" ]
      sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus_counter.rsi
      state: "0"
      offset: 0.0625, 0.34375
    # Armor row (bottom)
    - map: [ "armor1" ]
      sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus_counter.rsi
      state: "0"
      offset: 0.3125, 0.03125
    - map: [ "armor10" ]
      sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus_counter.rsi
      state: "0"
      offset: 0.1875, 0.03125
    - map: [ "armor100" ]
      sprite: /Textures/_Goobstation/Slasher/Alerts/soul_bonus_counter.rsi
      state: "0"
      offset: 0.0625, 0.03125

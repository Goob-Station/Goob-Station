- type: slasherKitList
  id: SlasherKits
  kits:
    slasher-kit-butcher:
      ascensionId: Butcher
      gear: SlasherGear
      description: slasher-kit-butcher-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/butcher.rsi
        state: icon
    slasher-kit-chickenmask:
      gear: SlasherGearChickenMask
      description: slasher-kit-chickenmask-desc
      guide: SlasherHotline
      requiredAscension: Butcher
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/chickenmask.rsi
        state: icon
      machetePrototype: SlasherBat
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/fake_atomika.ogg
        params:
          volume: -4
          loop: true
      fearStyle:
      - type: HotlineVision
      components:
      - type: HotlineVision
    slasher-kit-spring:
      gear: SlasherGearSpring
      description: slasher-kit-spring-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/spring.rsi
        state: icon
      machetePrototype: SlasherMacheteSpring
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/fnaf_bonnies_lullaby.ogg
        params:
          volume: -4
          loop: true
    slasher-kit-billy:
      ascensionId: Billy
      gear: SlasherGearBilly
      description: slasher-kit-billy-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/billy.rsi
        state: icon
      machetePrototype: SlasherCrowbar
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/that_handsome_devil_midi.ogg
        params:
          volume: -7
          loop: true
    slasher-kit-monsieur:
      gear: SlasherGearBilly
      description: slasher-kit-monsieur-desc
      guide: SlasherMonsieur
      ascensionId: Monsieur
      requiredAscension: Billy
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/monsieur.rsi
        state: icon
      machetePrototype: SlasherCrowbar
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/excuse_me_tider.ogg
        params:
          volume: -7
          loop: true
      components:
      - type: TentacleHook
      - type: ActionGrant
        actions:
        - ActionTentacleHook
    slasher-kit-cult:
      gear: SlasherGearCult
      description: slasher-kit-cult-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/cult.rsi
        state: icon
      machetePrototype: SlasherEldritchBlade
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/cultist_chant.ogg
        params:
          loop: true
    slasher-kit-maintenance:
      gear: SlasherGearMaintenance
      description: slasher-kit-maintenance-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/maintenance.rsi
        state: icon
      machetePrototype: SlasherButchCleaver
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/scared_to_bits.ogg
        params:
          loop: true
    slasher-kit-cannibal:
      gear: SlasherGearCannibal
      description: slasher-kit-cannibal-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/cannibal.rsi
        state: icon
      machetePrototype: SlasherButchCleaver
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/horror_violin_string.ogg
        params:
          volume: -7
          loop: true
    slasher-kit-clown:
      gear: SlasherGearClown
      description: slasher-kit-clown-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/clown.rsi
        state: icon
      machetePrototype: SlasherOffsetCaneClown
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/naktigonis_catwhisker.ogg
        params:
          volume: -7
          loop: true
      jumpscareSound:
        path: /Audio/Items/Toys/pushHornHonk.ogg
      meatSpikePrototype: SlasherMeatSpikeClown
      bloodTrailReagent: Honk
      soulStealSound:
        path: /Audio/Items/Toys/pushHornHonk.ogg
      ascensionGear: SlasherGearClownAscended
      ascendanceAnnouncementKey: slasher-soulsteal-ascendance-clown
      ascendanceSound:
        path: /Audio/Items/Toys/pushHornHonk.ogg
        params:
          volume: -2
    slasher-kit-glutton:
      gear: SlasherGearGlutton
      description: slasher-kit-glutton-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/glutton.rsi
        state: icon
      machetePrototype: SlasherButchCleaver
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/padtext_horror.ogg
        params:
          volume: -7
          loop: true
    slasher-kit-hockey:
      gear: SlasherGearHockey
      description: slasher-kit-hockey-desc
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/hockey.rsi
        state: icon
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/horror_synthwave.ogg
        params:
          volume: -7
          loop: true
      jumpscareSound:
        path: /Audio/_Goobstation/Slasher/Effects/JasonJumpscare.ogg
    slasher-kit-boogeyman:
      gear: SlasherGearBoogeyman
      description: slasher-kit-boogeyman-desc
      guide: SlasherBoogeyman
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/boogeyman.rsi
        state: icon
      machetePrototype: SlasherKitchenKnife
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/halloween.ogg
        params:
          loop: true
      removeComponents:
      - SlasherIncorporeal
      fearStyle:
      - type: SprintDisabled
      components:
      - type: BoogeymanShadow
      - type: SprintDisabled
      - type: Muted
      - type: MovementSpeedModifier
        baseSprintSpeed: 5.0
    slasher-kit-falseidol:
      gear: SlasherGearFalseIdol
      description: slasher-kit-falseidol-desc
      ascensionId: FalseIdol
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/falseidol.rsi
        state: icon
      machetePrototype: SlasherMacheteFalseIdol
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/retry_now_instrumental.ogg
        params:
          volume: -11
          loop: true
    slasher-kit-idol:
      gear: SlasherGearIdol
      description: slasher-kit-idol-desc
      guide: SlasherIdol
      requiredAscension: FalseIdol
      sprite:
        sprite: _Goobstation/Slasher/Interface/KitIcons/idol.rsi
        state: icon
      machetePrototype: SlasherMacheteIdol
      bloodTrailMusic:
        path: /Audio/_Goobstation/Slasher/Music/retry_now.ogg
        params:
          volume: -7
          loop: true
      ascendanceAnnouncementKey: slasher-soulsteal-ascendance-idol
      fearStyle:
      - type: SlasherValentineOverlay
      components:
      - type: SlasherIdol
      - type: MagicalStarEyes
      - type: SlasherSoulSteal
        requireLimbLoss: false
      - type: SlasherStaggerArea
        shockwaveShader: SlasherStaggerValentine
        ringColor: "#FF6B99"
      - type: RandomMetadata
        nameSegments:
        - NamesSlasherIdolTitle
        - NamesSlasherIdol
        nameFormat: name-format-slasher
  postSelectionComponents:
    - type: Slasher
    - type: SlasherSummonMachete
    - type: SlasherStaggerArea
    - type: SlasherRelentlessGrab
    - type: SlasherRegenerate
    - type: SlasherFear
    - type: SlasherIncorporeal
    - type: SlasherSoulSteal
    - type: SlasherSummonMeatSpike
    - type: NightVision
      color: "#FF0000"
      toggleAction: ActionSlasherNightVision
      activateSound: !type:SoundCollectionSpecifier
        collection: EyeOpen
      deactivateSound: !type:SoundCollectionSpecifier
        collection: EyeClose
    - type: GrabIntent
      grabThrownSpeed: 10
      throwingDistance: 8
      softGrabSpeedModifier: 1
      hardGrabSpeedModifier: 1
      chokeGrabSpeedModifier: 1
    - type: BreathingImmunity
    - type: GunBlocked
      popupText: slasher-cannot-use-guns # Seems to be broken inside AntagSelection
    - type: WeakToHoly
    - type: Hunger
      baseDecayRate: 0
    - type: Thirst
      baseDecayRate: 0
    - type: MobThresholds
      thresholds:
        0: Alive
        150: Dead
    - type: RandomMetadata
      nameSegments:
      - NamesSlasherTitle
      - NamesSlasher
      nameFormat: name-format-slasher

- type: entityTable
  id: DiseaseEventTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector # Ez
      weight: 55
      children:
        - id: DiseaseFluEvent
        - id: DiseasePneumoniaEvent
        - id: DiseaseColdEvent
        - id: DiseaseSleepEvent
        - id: DiseaseGutWormsEvent
    - !type:GroupSelector # Hard
      weight: 35
      children:
        - id: DiseasePlagueEvent
        - id: DiseaseCorgiPuppyEvent
        - id: DiseaseMagnitisEvent
    - !type:GroupSelector # Hell - pizdec
      weight: 10
      children:
        - id: DiseaseBeeseaseEvent
        - id: DiseaseMechanitesEvent
        - id: DiseaseInquisitionFluEvent


- type: entity
  parent: BaseGameRule
  id: DiseaseFluEvent
  components:
  - type: GameRule
    chaosScore: 60
  - type: StationEvent
    weight: 3
    earliestStart: 15
    reoccurrenceDelay: 20
    minimumPlayers: 12
    duration: null
    chaos: # Goobstation
      Medical: 20
    eventType: Chaotic
  - type: DiseaseSelection
    disease: DiseaseFlu
    min: 1
    max: 5
    spreadParams:
      spreadType: RandomEventDisease


# used for disease spread
- type: entity
  id: DiseaseBase
  components:
  - type: Disease
  - type: ContainerContainer # It has to be specified here to prevent container desyncs on client-side
    containers:
      diseaseEffectContainer: !type:Container

- type: entity
  id: DiseaseBaseMouse
  parent: DiseaseBase
  components:
  - type: Disease
    diseaseType: Bacterial # TODO: make it roll the disease type
    effects:
      DiseaseBehaviorCough: 1 # guaranteed cough

- type: entity
  id: DiseaseFlu
  parent: DiseaseBase
  name: flu
  description: Highly annoying and mildly dangerous.
  components:
  - type: Disease
    diseaseType: Viral
    infectionRate: 0.01 # 100 seconds
    genotype: 1234
    effects:
      DiseaseBehaviorPoison: 0.4
      DiseaseBehaviorVomit: 0.6
      DiseaseBehaviorFeelUnwell: 1
      DiseaseBehaviorHeadache: 0.8
      DiseaseBehaviorCough: 0.6
      DiseaseBehaviorSneeze: 0.2

- type: entity
  id: DiseaseCold
  parent: DiseaseBase
  name: cold
  description: Classic.
  components:
  - type: Disease
    diseaseType: Bacterial
    infectionRate: 0.01 # 100 seconds
    immunityGainRate: 1.5 # immunity speed
    genotype: 1122
    effects:
      DiseaseBehaviorFeelUnwell: 1
      DiseaseBehaviorHeadache: 0.5
      DiseaseBehaviorCough: 1
      DiseaseBehaviorWeakness: 1
      DiseaseBehaviorDrowsiness: 0.8

- type: entity
  id: DiseasePlague
  parent: DiseaseBase
  name: Plague
  description: Highly dangerous.
  components:
  - type: Disease
    diseaseType: Viral
    infectionRate: 0.005 # 200 seconds
    genotype: 63251
    effects:
      DiseaseBehaviorPoison: 0.6
      DiseaseBehaviorVomit: 1
      DiseaseBehaviorHeadache: 0.6
      DiseaseBehaviorTemperature: 1
      DiseaseBehaviorApathy: 0.6
      DiseaseBehaviorAbscesses: 1
      DiseaseBehaviorAsthenia: 0.5
      DiseaseBehaviorSluggish: 0.6

- type: entity
  id: DiseasePneumonia
  parent: DiseaseBase
  name: Pneumonia
  description: A severe disease with moderate infection and dangerous.
  components:
  - type: Disease
    diseaseType: Bacterial
    genotype: 1255
    effects:
      DiseaseBehaviorPneumonia: 1
      DiseaseBehaviorHeadache: 0.6
      DiseaseBehaviorTemperature: 1
      DiseaseBehaviorFeelUnwell: 0.8
      DiseaseBehaviorBlunt: 0.5
      DiseaseBehaviorCough: 1
      DiseaseBehaviorWeakness: 1

- type: entity
  id: DiseaseCorgiPuppy
  parent: DiseaseBase
  name: Lycancoughy
  description: Aww... we’re all going to die from corgis <3.
  components:
  - type: Disease
    diseaseType: Parasite
    infectionRate: 0.003
    immunityGainRate: 0.5
    genotype: 19845
    effects:
      DiseaseBehaviorFightImmunity: 0.6
      DiseaseBehaviorEuphoria: 1
      DiseaseBehaviorHyperactive: 1
      DiseaseBehaviorLycancoughy: 1

- type: entity
  id: DiseaseMagnitis
  parent: DiseaseBase
  name: Magnitis
  description: Nanobot disease that causes objects to go towards you.
  components:
  - type: Disease
    diseaseType: Nanobot
    immunityGainRate: 0.2 #Nanobots kill immunity
    genotype: 9867
    effects:
      DiseaseBehaviorGravitosisB: 1
      DiseaseBehaviorPainNumbness: 1
      DiseaseBehaviorNecrosis: 1
      DiseaseBehaviorSkinLesion: 1

- type: entity
  id: DiseaseBeesease
  parent: DiseaseBase
  name: Beesease
  description: Bees for you.
  components:
  - type: Disease
    diseaseType: Parasite
    infectionRate: 0.003
    immunityGainRate: 0.5
    genotype: 656565
    effects:
      DiseaseBehaviorFeelUnwell: 1
      DiseaseBehaviorInternalBleeding: 0.5
      DiseaseBehaviorBeeKillMe: 1
      DiseaseBehaviorBeeVomit: 1
      DiseaseBehaviorCough: 1

- type: entity
  id: DiseaseCancer
  parent: DiseaseBase
  name: cancer
  description: Deals genetic damage to the infected. Doesn't go away by itself.
  components:
  - type: Disease
    diseaseType: OwnCells
    infectionRate: 0.005 # slow
    immunityGainRate: 0.5 # immunity against it also slow
    canGainImmunity: false
    genotype: 1111
    effects:
      DiseaseBehaviorCancer: 0.5
      DiseaseBehaviorFightImmunity: 1 # won't let you cure it

- type: entity
  id: DiseaseGravitosisA
  parent: DiseaseBase
  name: gravitosis A
  description: A strange disease.
  components:
  - type: Disease
    diseaseType: Bacterial
    genotype: 56441
    effects:
      DiseaseBehaviorGravitosisA: 1

- type: entity
  id: DiseaseGunemia
  parent: DiseaseBase
  name: gunemia
  description: A strange disease.
  components:
  - type: Disease
    diseaseType: Bacterial
    genotype: 666323
    effects:
      DiseaseBehaviorGunemia: 1

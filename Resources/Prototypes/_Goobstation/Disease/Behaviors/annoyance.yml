    complexity: 5
  - type: DiseaseReagentEffect
    severityScale: false  
    timeScale: false  
    progressScale: false 
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectSeeingRainbow
      time: 20
  - type: DiseasePeriodicCondition
    delayMin: 10
    delayMax: 50
  - type: DiseaseEmoteEffect
    emote: Laugh

- type: entity
  id: DiseaseBehaviorApathy
  parent: DiseaseBehaviorBase
  name: Apathy
  description: Symptom that makes the world progressively lose its range of colors.
  components:
  - type: DiseaseEffect
    complexity: 5
  - type: DiseaseGrantComponentEffect
    components:
    - type: BlackAndWhiteOverlay
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorWeakness
  parent: DiseaseBehaviorBase
  name: Weakness
  description: Symptom that gradually lowers stamina.

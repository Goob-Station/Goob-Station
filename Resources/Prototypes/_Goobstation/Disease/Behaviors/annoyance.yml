- type: entity
  id: DiseaseBehaviorVomit
  parent: DiseaseBehaviorBase
  name: Vomiting
  description: Makes you periodically vomit.
  components:
  - type: DiseaseEffect
    complexity: 8 # can make you constantly hungry
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:Vomit
  # also a low-power infect
  - type: DiseaseSpreadEffect
    arc: 360
    range: 2
    timeScale: false
    spreadParams:
      power: 0.5
      chance: 0.5
      spreadType: Aerial
  - type: DiseasePeriodicCondition
    delayMin: 20
    delayMax: 60

- type: entity
  id: DiseaseBehaviorFeelUnwell
  parent: DiseaseBehaviorBase
  name: Feeling unwell
  description: Makes you feel unwell.
  components:
  - type: DiseaseEffect
    complexity: 4 # just an annoyance
  - type: DiseasePopupEffect
    string: disease-effect-popup-default
  - type: DiseasePeriodicCondition
    delayMin: 30
    delayMax: 60
  - type: DiseaseProgressCondition
    minProgress: 0.4

- type: entity
  id: DiseaseBehaviorHeadache
  parent: DiseaseBehaviorBase
  name: Headache
  description: Gives you headaches, which may make working more difficult.
  components:
  - type: DiseaseEffect
    complexity: 8 # very annoying
  - type: DiseasePopupEffect
    string: disease-effect-popup-headache
  - type: DiseasePeriodicCondition
    delayMin: 3
    delayMax: 12
  - type: DiseaseFlashEffect
    timeScale: false
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorGravitosisA
  parent: DiseaseBehaviorBase
  name: Gravitosis A
  description: Rare and exotic disease symptom that causes objects to swirl around you.
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    severityScale: false  
    timeScale: false  
    progressScale: false 
    component: GravityWell
    defaults:
      BaseTangentialAcceleration: 2
      maxRange: 2
  - type: GravityWell
    maxRange: 2

- type: entity
  id: DiseaseBehaviorGravitosisB
  parent: DiseaseBehaviorBase
  name: Gravitosis B
  description: Rare and exotic disease symptom that causes objects to go towards you.
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    severityScale: false  
    timeScale: false  
    progressScale: false 
    component: GravityWell
    defaults:
      BaseRadialAcceleration: 2
      maxRange: 2
  - type: GravityWell
    maxRange: 2

- type: entity
  id: DiseaseBehaviorGravitosisC
  parent: DiseaseBehaviorBase
  name: Gravitosis C
  description: Rare and exotic disease symptom that causes objects to go away from you.
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    severityScale: false  
    timeScale: false  
    progressScale: false 
    component: GravityWell
    defaults:
      BaseRadialAcceleration: -2
      maxRange: 2
  - type: GravityWell
    maxRange: 2

- type: entity
  id: DiseaseBehaviorDelusion
  parent: DiseaseBehaviorBase
  name: Delusion
  description: Symptom that makes you talk nonsense.
  components:
  - type: DiseaseEffect
    complexity: 14
  - type: DiseaseGrantComponentEffect
    components:
    - type: BackwardsAccent

- type: entity
  id: DiseaseBehaviorClumsy
  parent: DiseaseBehaviorBase
  name: Clumsy
  description: Symptom that makes you clumsy.
  components:
  - type: DiseaseEffect
    complexity: 10
  - type: DiseaseGrantComponentEffect
    components:
    - type: Clumsy

- type: entity
  id: DiseaseBehaviorCursed
  parent: DiseaseBehaviorBase
  name: Curse
  description: Symptom that... oh fuck...
  components:
  - type: DiseaseEffect
    complexity: 15
  - type: DiseaseGrantComponentEffect
    components:
    - type: TileMovement

- type: entity
  id: DiseaseBehaviorMute
  parent: DiseaseBehaviorBase
  name: Mute
  description: ...
  components:
  - type: DiseaseEffect

    effects:
    - !type:TakeStaminaDamage
        amount: 50
        probability: 0.05
  - type: DiseaseProgressCondition
    minProgress: 0.8
  - type: DiseasePeriodicCondition
    delayMin: 10
    delayMax: 35

- type: entity
  id: DiseaseBehaviorParasitism
  parent: DiseaseBehaviorBase
  name: Parasitism
  description: Symptom that accelerates hunger.
  components:
  - type: DiseaseEffect
    complexity: 20
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:SatiateHunger
      factor: -0.5

- type: entity
  id: DiseaseBehaviorDisorientation
  parent: DiseaseBehaviorBase
  name: Disorientation
  description: Symptom that... what?
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    timeScale: false  
    progressScale: false 
    timeScale: false
    effects:
    - !type:MovementSpeedModifier
      walkSpeedModifier: -1
      sprintSpeedModifier: -1
      time: 5
  - type: DiseaseProgressCondition
    minProgress: 0.8
  - type: DiseasePeriodicCondition
    delayMin: 2
    delayMax: 25

- type: entity
  id: DiseaseBehaviorHyperactive
  parent: DiseaseBehaviorBase
  name: Feeling hyper
  description: Makes you feel hyper.
  components:
  - type: DiseaseEffect
    complexity: -30
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:MovementSpeedModifier
      walkSpeedModifier: 1.35
      sprintSpeedModifier: 1.35
    - !type:GenericStatusEffect
      key: Stutter
      component: StutteringAccent
    - !type:Jitter
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorEnhancedDetoxification
  parent: DiseaseBehaviorBase
  name: Enhanced detoxification
  description: Accelerates natural detoxification.
  components:
  - type: DiseaseEffect
    complexity: -20
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      conditions:
        types:
          Poison: -1

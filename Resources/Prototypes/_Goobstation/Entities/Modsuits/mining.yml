- type: entity
  parent: [ ClothingModsuitStandard, BaseCargoContraband ]
  id: ClothingModsuitMining
  name: mining modsuit control unit
  description: "A Nanotrasen mining suit for on-site operations, fit with accreting ash armor and a sphere form."
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/mining.rsi
  - type: ModSuit
    theme: ModThemeMining
    parts:
      head: ClothingModsuitHelmetMining
      gloves: ClothingModsuitGauntletsMining
      outerClothing: ClothingModsuitChestplateMining
      shoes: ClothingModsuitBootsMining
  - type: Construction
    graph: Modsuit
    node: mining

- type: entity
  parent: ClothingModsuitHelmetStandard
  id: ClothingModsuitHelmetMining
  name: mining modsuit helmet
  description: The helmet of a mining modsuit. The visor has been expanded into a system of seven arachnid-like cameras.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/mining.rsi
  - type: PointLight
    color: "#a4fef4"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HEAD
      head-vox:
      - state: equipped-HEAD
      head-vulpkanin:
      - state: equipped-HEAD
      head-feroxi:
      - state: equipped-HEAD
      head-hydrakin:
      - state: equipped-HEAD
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.95
        Heat: 0.6
        Radiation: 0.2
        Caustic: 0.4
  - type: FireProtection
    reduction: 0.3
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-resomi:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-vulpkanin:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-feroxi:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-hydrakin:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded

- type: entity
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestplateMining
  name: mining modsuit chestplate
  description: The chestplate of a mining modsuit. Ceramic plating gives it incredible protection against blasts, corrosives and heat.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/mining.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.95
        Heat: 0.5
        Radiation: 0.2
        Caustic: 0.3
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: FireProtection
    reduction: 0.9
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed
  - type: ModSealedComponents
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.005
      coolingCoefficient: 0.01

- type: entity
  parent: ClothingModsuitGauntletsStandard
  id: ClothingModsuitGauntletsMining
  name: mining modsuit gauntlets
  description: The gauntlets of a mining modsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/mining.rsi

- type: entity
  parent: ClothingModsuitBootsStandard
  id: ClothingModsuitBootsMining
  name: mining modsuit boots
  description: The boots of a mining modsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/mining.rsi

- type: entity
  parent: [ ClothingModsuitStandard, BaseSyndicateContraband ]
  id: ClothingModsuitSyndicate
  name: blood-red modsuit control unit
  description: An advanced combat suit adorned in a sinister crimson red color scheme, produced by the Gorlex Marauders. It offers armor ruled illegal in most of the sector.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/syndicate.rsi
  - type: ModSuit
    theme: ModThemeSyndicate
    parts:
      head: ClothingModsuitHelmetSyndicate
      gloves: ClothingModsuitGauntletsSyndicate
      outerClothing: ClothingModsuitChestplateSyndicate
      shoes: ClothingModsuitBootsSyndicate
  - type: ItemSlots
    slots:
      mod-core:
        name: modsuit-core-slot-name
        startingItem: ModsuitCoreStandardMicroreactor
        whitelist:
          components:
          - ModCore

- type: entity
  parent: ClothingModsuitSyndicate
  id: ClothingModsuitSyndicateFilled
  suffix: Filled
  components:
  - type: ModSuit
    startingModules:
    - ModsuitModuleStorageSyndicate
    - ModsuitModuleFlashlight

- type: entity
  parent: [ ClothingModsuitHelmetStandard, BaseSyndicateContraband ]
  id: ClothingModsuitHelmetSyndicate
  name: blood-red modsuit helmet
  description: The helmet of a blood-red modsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/syndicate.rsi
  - type: PointLight
    color: "#ff3c3c"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HEAD
      head-vox:
      - state: equipped-HEAD
      head-vulpkanin:
      - state: equipped-HEAD
      head-feroxi:
      - state: equipped-HEAD
      head-hydrakin:
      - state: equipped-HEAD
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.55
      OrganDamage: 0.55
      BoneDamage: 0.55
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.47
        Slash: 0.47
        Piercing: 0.47
        Heat: 0.47
        Radiation: 0.47
        Caustic: 0.47
  - type: FireProtection
    reduction: 0.25
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-resomi:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-vulpkanin:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-feroxi:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-hydrakin:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
  - type: ModSealedComponents
    components:
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.07
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.01
      coolingCoefficient: 0.01
    - type: IdentityBlocker
    - type: IngestionBlocker
      blockSmokeIngestion: True
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide


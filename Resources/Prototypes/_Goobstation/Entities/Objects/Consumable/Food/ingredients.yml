- type: entity
  parent: BaseFoodCondimentPacket
  id: FoodCondimentPacketProtein
  name: "упаковка протеїнового порошку"
  description: "Містить 10 унцій порошкового протеїну. Змішати з 20 унціями води"
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Protein
          Quantity: 10
  - type: Icon
    state: packet-greygoo
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: packet-solid-

- type: entity
  name: "блок сиру свободи"
  parent: FoodBakingBase
  id: FoodFreedomCheeseBlock
  description: "Цільний шматок сиру, що забиває артерії, зроблений за сумнівним рецептом старого світу. Наріжте його для своїх друзів... або просто з'їжте весь шматок самі, дивак."
  components:
  - type: FlavorProfile
    flavors:
      - creamy
      - cheesy
    ignoreReagents:
      - Nutriment
      - GastroToxin
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/freedom_cheese.rsi
    state: cheese_block
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 28
        reagents:
        - ReagentId: Nutriment
          Quantity: 16
        - ReagentId: GastroToxin
          Quantity: 4
  - type: SliceableFood
    count: 4
    slice: FoodFreedomCheeseSlice


- type: entity
  name: "скибочка сиру свободи"
  parent: FoodBakingBase
  id: FoodFreedomCheeseSlice
  description: "Дуже сумнівна суміш чеддера, наповнювачів та духу свободи. Медична страховка NanoTrasen не покриває інциденти, пов'язані зі споживанням цього продукту."
  components:
  - type: FlavorProfile
    flavors:
      - creamy
      - cheesy
    ignoreReagents:
      - Nutriment
      - GastroToxin
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/freedom_cheese.rsi
    state: cheese_slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: GastroToxin
          Quantity: 1
  - type: Tag
    tags:
    - Slice
  - type: FoodSequenceElement
    entries:
      Burger: FSE_FoodFreedomCheeseSlice

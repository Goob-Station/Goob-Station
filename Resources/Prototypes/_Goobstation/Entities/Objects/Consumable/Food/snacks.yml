# Snacks
- type: entity
  parent: FoodSnackBase
  id: FoodSnackProteinbar
  name: "протеїновий батончик"
  description: "Протеїнові батончики бренду SwoleMAX гарантовано додадуть вам впевненості у власних силах."
  components:
  - type: FlavorProfile
    flavors:
      - chalky
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/bay_food.rsi
    state: proteinbar
  - type: Item
  - type: Edible
    trash:
    - FoodPacketProteinbarTrash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: CocoaPowder
          Quantity: 1
        - ReagentId: Theobromine
          Quantity: 1

- type: entity
  name: "мотдог"
  parent: FoodMeatBase
  id: FoodSnackMothdog
  description: "Він у розквіті сил."
  components:
  - type: Tag
    tags:
    - Cooked
  - type: FlavorProfile
    flavors:
    - chuddy
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/mothdog.rsi
    layers:
    - state: mothdog-4
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: mothdog-
    changeColor: false
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Protein
          Quantity: 10
  - type: Appearance
  - type: Edible
    trash:
    - FoodSnackMothdogTrash


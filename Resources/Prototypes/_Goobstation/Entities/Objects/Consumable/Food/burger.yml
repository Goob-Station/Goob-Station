
- type: entity
  name: nothing burger
  parent: FoodBurgerBase
  id: FoodBurgerChud
  description: A burger for when nothing happens.
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - nothing
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/chud_burger.rsi
    state: icon
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 6
        - ReagentId: Nothing
          Quantity: 5
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: FoodBurgerBase
  name: mothroachburger
  description: The last lamp it saw was the one inside the microwave.
  id: FoodBurgerMustard
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
      - light
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/mothroach_burger.rsi
    state: mustard_mothroach
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 5 # Goobstation - cooked food more useful
        - ReagentId: Protein
          Quantity: 5 # Goobstation - cooked food more useful
        - ReagentId: Vitamin
          Quantity: 7
  - type: Tag
    tags:
    - Meat


- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerCold
  name: five below burger
  description: COLD! COLD! COLD!
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
    storedOffset: 0,1
    inhandVisuals:
      left:
      - state: plain-inhand-left
      right:
      - state: plain-inhand-right
  - type: FlavorProfile
    flavors:
      - meaty
      - cold
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/chilly_pepper_food.rsi
    state: burger-cold
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: FrostOil
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 1
  - type: Tag
    tags:
    - Meat


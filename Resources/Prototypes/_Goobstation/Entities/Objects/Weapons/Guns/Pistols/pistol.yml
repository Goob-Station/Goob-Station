- type: entity
  name: "Дуалетта"
  parent: [BaseWeaponPistol, BaseSyndicateContraband]
  id: WeaponPistolDualetta
  description: "Найкрутіший пістолет у секторі. Кажуть, ніхто не має достатньої сили волі, щоб заплямувати репутацію цієї зброї, наважившись стріляти з неї без парного пістолета. Живиться з пістолетних магазинів .35 Auto."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/Dualetta.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunFlashlightAttachment # DOWNSTREAM-TPirates: gun flashlights
    offset: "-0.03125, 0.1875"
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/Dualetta.rsi
  - type: Gun
    minAngle: 1
    maxAngle: 5
    angleIncrease: 1
    angleDecay: 4
    fireRate: 6
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: ItemSlots # DOWNSTREAM-TPirates: gun flashlights
    slots:
      flashlight:
        name: weapon-upgrade-slot-name-flashlight
        priority: 5
        ejectOnBreak: true
        occludesLight: false
        whitelist:
          components:
          - GunUpgradeFlashlight
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolHighCapacity
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: ItemUpgradeable # DOWNSTREAM-TPirates: gun flashlights
  - type: ContainerContainer # DOWNSTREAM-TPirates: gun flashlights
    containers:
      flashlight: !type:ContainerSlot
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Tag
    tags:
    - WeaponPistolDualetta
  - type: Multishot
    missChance: 0
    spreadMultiplier: 1
    spreadAddition: 0
  - type: RequiresDualWield
    whitelist:
      tags:
      - WeaponPistolDualetta

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: WeaponPistolAnaconda
  name: "Анаконда"
  description: "Громіздка ручна гармата з вбудованим у руків’я фабрикатором. Повільно друкує набої для себе, але не розраховуйте, що цього вистачить для тривалих перестрілок."
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/anaconda.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: GunFlashlightAttachment # DOWNSTREAM-TPirates: gun flashlights
    offset: "0.09375, 0.125"
  - type: Appearance
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/anaconda.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 3
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/hpistol.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletCaselessRifle
    capacity: 7
    count: 7
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 4
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: RestrictGunshotsByUserTag # Goobstation
    doesntContain:
    - Oni
    messages:
    - oni-cannot-shoot-guns-1
    - oni-cannot-shoot-guns-2
    - oni-cannot-shoot-guns-3
  - type: AmmoCounter
  - type: ItemUpgradeable # DOWNSTREAM-TPirates: gun flashlights
  - type: ItemSlots # DOWNSTREAM-TPirates: gun flashlights
    slots:
      flashlight:
        name: weapon-upgrade-slot-name-flashlight
        priority: 5
        ejectOnBreak: true
        occludesLight: false
        whitelist:
          components:
          - GunUpgradeFlashlight
  - type: ContainerContainer # DOWNSTREAM-TPirates: gun flashlights
    containers:
      flashlight: !type:ContainerSlot
      ballistic-ammo: !type:Container

- type: entity
  name: "Контрактний термінатор"
  parent: [BaseWeaponPistol, BaseCentcommContraband]
  id: WeaponPistolCentcommAgent
  description: "Необхідність — мати обману."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/agentpistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/agentpistol.rsi
  - type: Gun
    minAngle: 1
    maxAngle: 5
    angleIncrease: 1
    angleDecay: 4
    fireRate: 4
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/silenced.ogg
      params:
        volume: -14
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolNeurotoxin
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMagnum
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnumNeurotoxin
        priority: 1
        whitelist:
          tags:
          - CartridgeMagnum

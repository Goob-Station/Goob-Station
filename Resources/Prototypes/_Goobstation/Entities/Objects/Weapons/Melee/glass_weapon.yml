- type: entity
  name: glass sabre
  parent: [ BaseSword, BaseMajorContraband ]
  id: WeaponGlassSabre
  description: A ceremonial sabre made of glass. Breaks upon taking any damage whilst holding it.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/glass_sabre.rsi
  - type: MeleeWeapon
    animationRotation: -95
    wideAnimationRotation: -135
    heavyStaminaCost: 2.5
    attackRate: 1.5
    damage:
      types:
        Slash: 19
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: 0.3
    spread: 90
  - type: DisarmMalus
  - type: BreakOnHolderDamage
    breakSound:
      collection: GlassBreak
      params:
        volume: -4
    spawnOnBreak: ShardGlass
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

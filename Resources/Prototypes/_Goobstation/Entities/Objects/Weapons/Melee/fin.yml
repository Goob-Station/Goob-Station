- type: entity
  name: sharkminnow fin
  parent: [ BaseItem, BaseMajorContraband ]
  id: WeaponSharkMinnowFin
  description: A razor-sharp fin torn from a sharkminnow. Makes you friendly to carps, or at least...earns their respect.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/minnow_fin.rsi
    state: icon
  - type: Item
    size: Large
    sprite: _Goobstation/Objects/Weapons/Melee/minnow_fin.rsi
  - type: Sharp
  - type: MeleeWeapon
    attackRate: 4
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 7
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DisarmMalus
  - type: FactionWhileHeld
    faction: Dragon
    iconToAdd: SleepingCarpFaction
  - type: Construction
    graph: SharkminnowFin
    node: fin

- type: constructionGraph
  id: SharkminnowFin
  start: start
  graph:
  - node: start
    edges:
    - to: fin
      steps:
      - material: SharkMinnowTooth
        amount: 3
        doAfter: 2
      - material: CarpScales
        amount: 5
        doAfter: 2
  - node: fin
    entity: WeaponSharkMinnowFin

- type: construction
  id: SharkminnowFin
  graph: SharkminnowFin
  startNode: start
  targetNode: fin
  category: construction-category-weapons
  objectType: Item
  description: construction-recipe-sharkminnow-fin

- type: entity
  name: hammer
  parent: BaseItem
  id: MeleeHammer
  description: 3 steel 2 wood
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/hammer.rsi
    state: icon
  - type: MeleeWeapon
    animationRotation: -90 # WWDP
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Blunt: 12
    heavyStaminaCost: 6
    soundHit:
      collection: MetalThud
  - type: Item
    size: Small
    sprite: _Goobstation/Objects/Weapons/Melee/hammer.rsi
  - type: Tag
    tags:
    - Hammer
  - type: Tool
    qualities:
    - Hammering
    useSound:
      path: /Audio/Items/trayhit2.ogg
  - type: Construction
    graph: Hammer
    node: hammer

- type: entity
  name: large hammer
  parent: [ BaseItem, BaseMajorContraband ]
  id: WeaponLargeHammer
  description: Large enough to put a sledgehammer to shame, this hammer deals tremendous damage to shields and structures.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/large_hammer.rsi
    state: icon
  - type: Item
    size: Huge
    sprite: _Goobstation/Objects/Weapons/Melee/large_hammer.rsi
  - type: MeleeWeapon
    attackRate: 0.7
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 14
        Structural: 50
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 6
  - type: ExtraDamageVsHeld
    whitelist:
      components:
      - Blocking
    damage:
      types:
        Blunt: 28
  - type: Construction
    graph: LargeHammer
    node: largeHammer
  - type: DisarmMalus

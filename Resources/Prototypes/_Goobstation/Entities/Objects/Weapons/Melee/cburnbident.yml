- type: entity
  name: dispatch spear
  parent: [BaseItem, BaseCentcommContraband] # Before you ask why I didn't parent the spear, it's because I don't want this to be able to have reagants applied.
  id: CburnSpear
  description: A spear used by Nanotrasen's CBURN agents. Effective at incinerating organic targets.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/cburn_spear.rsi
    state: icon
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.08,-0.06
          - -0.06,-0.08
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: MeleeWeapon
    angle: 0
    attackRate: 0.9
    wideAnimationRotation: -135
    damage:
      types:
        Heat: 15
        Piercing: 5
    animation: WeaponArcThrust
  - type: IgniteOnMeleeHit
    fireStacks: 2
  - type: LandAtCursor
  - type: DamageOtherOnHit # Let the spears SOAR!!
    damage:
      types:
        Piercing: 30
        Heat: 15
  - type: UseDelay
  - type: Item
    size: Large
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Heat: 5
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/cburn_spear.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: DisarmMalus
    malus: 0.45
  - type: Appearance
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: StaticPrice
    price: 800
  - type: Tool
    qualities:
    - Prying

- type: entity
  parent: [ CburnSpear, BaseSecurityContraband ]
  id: CburnSpearCrew
  name: deterrence spear
  description: A spear used by Nanotrasen's security officers. Effective at incinerating organic targets.
  components:
  - type: IgniteOnMeleeHitToggled
    fireStacks: 2
  - type: IgniteOnMeleeHit # parent
    fireStacks: 0
  - type: Stunbaton
    energyPerUse: 50
    lightAttackEnergyMultiplier: 2
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 5
        Piercing: 5
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 5
  - type: StaminaDamageOnHit # Only here so Stunbaton's charge drain fires
    damage: 1
    overtime: 1
    lightAttackDamageMultiplier: 0
    lightAttackOvertimeDamageMultiplier: 0
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 20
        Heat: 8

# Blueshield

- type: entity
  id: BlueshieldUndeterminedWeapon
  name: "набір синього щита"
  description: "Невелика коробка, що використовує технологію блюспейс для доставки спорядження безпосередньо до вас. Обирайте з розумом."
  parent: [ BaseItem, BaseSetSelector, BaseCentcommContraband ]
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/blueshieldundetermined.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BSOBlueshieldSet
    - BSORevolverSet
    - BSOCQCSet
    - BSOChesterSet
    - BSOSyringeSet
    - BSOKendoSet # Pirate: katana
    maxSelectedSets: 2


- type: entity
  id: BlueshieldUndeterminedHardsuit
  name: "набір скафандра синього щита"
  description: "Невелика коробка, що використовує технологію блюспейс для доставки спорядження безпосередньо до вас. Обирайте з розумом."
  parent: [ BaseItem, BaseSetSelector, BaseCentcommContraband ]
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/blueshieldundetermined.rsi
    state: icon-alt
  - type: SetSelector
    possibleSets:
    - BSOHardsuitLightSet
    - BSOModsuitSet
    maxSelectedSets: 1


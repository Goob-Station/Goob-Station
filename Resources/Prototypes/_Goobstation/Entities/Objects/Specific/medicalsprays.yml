- type: entity # Not very specific anymore but whatever
  name: "розпилювач з кровоспинним порошком"
  id: SprayBottleStypticPowder
  suffix: Filled, Styptic powder
  parent: SprayBottleBase # Can't parent actual spray bottles because solution fill visuals. todo goob.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/Stypticspray.rsi
    layers:
    - state: icon
  - type: Tag
    tags:
    - Spray
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: StypticPowder
          Quantity: 100


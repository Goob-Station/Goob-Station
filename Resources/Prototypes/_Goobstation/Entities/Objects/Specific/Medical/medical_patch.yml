- type: entity
  parent: BaseHealingItem
  id: BaseMedicalPatch
  name: "базовий пластир"
  description: "Пластир для поступового введення ліків пацієнтам."
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/medical_patch.rsi
    state: GenericPatch
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 20
  - type: ExaminableSolution
    solution: drink
  - type: Sticky
    stickDelay: 3
    unstickDelay: 2
    stickPopupStart: goobstation-medicalpatch-sticy-trystick
    stickPopupSuccess: goobstation-medicalpatch-sticy-trystick-success
    unstickPopupStart: goobstation-medicalpatch-sticy-tryremove
    unstickPopupSuccess: goobstation-medicalpatch-sticy-tryremove-success
    selfStickBreakOnMove: false
    selfUnstickBreakOnMove: false
    selfStickTimeMultiplier: 0.5
    whitelist:
      components:
      - Bloodstream
  - type: StickyVisualizer
  - type: Appearance
  - type: MixableSolution
    solution: drink
  - type: MedicalPatch
  - type: Tag
    tags:
    - MedicalPatch

- type: entity
  parent: BaseMedicalPatch
  id: MedicalPatchBasic
  name: "пластир"
  description: "Базовий пластир для поступового введення ліків пацієнтам."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/medical_patch.rsi
    scale: 0.9 , 0.9
    layers:
      - state: GenericPatch
      - state: GenericPatch-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 9
    fillBaseName: GenericPatch-
  - type: SolutionContainerManager
    solutions:
      drink:  #drink is the same as Bottle solution, this is to prevent recoding chem master. TODO: recode chem master
        maxVol: 20
  - type: Tag
    tags:
    - MedicalPatch
  - type: Spillable # only way empty the patch is wring it out and spill it on the floor
    solution: drink
  - type: RefillableSolution  # I don't know why this wasn't like this to begin with.
    solution: drink

- type: entity
  parent: BaseHealingItem
  id: UsedMedicalPatch
  name: "використаний пластир"
  description: "...фу."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/medical_patch.rsi
    state: GenericPatchSmallUsed
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition #get 1 cloth form recycling a used patch
    materialComposition:
      Cloth: 100
      Plastic: 100

- type: entity
  parent: UsedMedicalPatch
  id: UsedMedicalPatchMakeshift
  name: "використаний пластир"
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/medical_patch.rsi
    state: MakeshiftPatchUsed

- type: entity
  parent: MedicalPatchBasic
  id: MedicalPatchRapid
  name: "швидкий пластир"
  description: "Пластир для швидшого введення ліків. На ньому намальовані гоночні машини."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/medical_patch.rsi
    layers:
      - state: GenericPatch
      - state: GenericPatchBorder
        color: Red
      - state: GenericPatch-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: MedicalPatch
    transferAmount: 2 # Twice the ammound of basic

- type: entity
  parent: MedicalPatchBasic
  id: MedicalPatchTherapeutic
  name: "терапевтичний пластир"
  description: "Пластир, що вводить дозу протягом довшого періоду часу, ніж інші пластирі."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/medical_patch.rsi
    layers:
      - state: GenericPatch
      - state: GenericPatchBorder
        color: LightBlue
      - state: GenericPatch-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: MedicalPatch
    transferAmount: 0.5 # literally the rapid patch but in reverse

- type: entity
  parent: MedicalPatchBasic
  id: MedicalPatchLarge
  name: "великий пластир"
  description: "Більший пластир підвищеної місткості, що використовується для дійсно великих \"бу-бу\". Не рекомендується з хімікатами, які легко передозувати."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Medical/medical_patch.rsi
    scale: 1 , 1
    layers:
      - state: GenericPatch
      - state: GenericPatchBorder
        color: Violet
      - state: GenericPatch-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 40 # +50% from basic
  - type: MedicalPatch
    injectPercentageOnAttatch: 10 # 4u when full
  - type: Item
    shape:
    - 0,0,0,1

- type: entity
  parent: BaseMedicalPatch
  id: MedicalPatchMakeshift
  name: "саморобний пластир"
  description: "Це не виглядає гігієнічно. Сподіваюся, він впорається."
  components:
  - type: Sprite
    state: MakeshiftPatch
  - type: MedicalPatch
    updateTime: 2 # slow
    singleUse: true
    trashObject: UsedMedicalPatchMakeshift
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 20  # lasts for 40 seconds, effectively half as good as a normal patch
  - type: Construction
    graph: MedicalPatchMakeshift
    node: medicalPatchMakeshift

- type: constructionGraph
  id: MedicalPatchMakeshift
  start: start
  graph:
  - node: start
    edges:
    - to: medicalPatchMakeshift
      steps:
      - material: Cloth
        amount: 1
        doAfter: 5
  - node: medicalPatchMakeshift
    entity: MedicalPatchMakeshift

- type: construction
  id: MedicalPatchMakeshift
  graph: MedicalPatchMakeshift
  startNode: start
  targetNode: medicalPatchMakeshift
  category: construction-category-tools
  objectType: Item

- type: constructionGraph
  id: SilkPatchMakeshift
  start: start
  graph:
  - node: start
    edges:
    - to: silkPatchMakeshift
      steps:
      - material: WebSilk
        amount: 4
        doAfter: 5
  - node: silkPatchMakeshift
    entity: MedicalPatchMakeshift

- type: construction
  id: SilkPatchMakeshift
  graph: SilkPatchMakeshift
  startNode: start
  targetNode: silkPatchMakeshift
  category: construction-category-tools
  objectType: Item
  entityWhitelist:
    tags:
    - SpiderCraft

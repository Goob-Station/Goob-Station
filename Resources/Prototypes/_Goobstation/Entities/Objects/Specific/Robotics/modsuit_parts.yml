- type: entity
  parent: PartModsuit
  id: ModsuitCorePlasma
  name: MOD plasma core
  description: Nanotrasen's attempt at capitalizing on their plasma research. These plasma cores are refueled by feeding plasma sheets straight into the suit, though they hold less charge than a standard core.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#d07bff"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: ModCore
  - type: Battery
    maxCharge: 720
    startingCharge: 720
  - type: ModCoreRefuelable
    fuel:
      tags:
      - SheetPlasma
    chargePerFuel: 180
  - type: PhysicalComposition
    materialComposition:
      Plasma: 100
      Glass: 25

- type: entity
  parent: PartModsuit
  id: ModsuitCoreInfinite
  name: MOD infinite core
  suffix: Admeme
  description: A fusion core using the rare Fixium to sustain enough energy for the lifetime of the MOD's user.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#7bffe1"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: ModCore
  - type: Battery
    maxCharge: 1000000
    startingCharge: 1000000
  - type: BatterySelfRecharger
    autoRechargeRate: 1000

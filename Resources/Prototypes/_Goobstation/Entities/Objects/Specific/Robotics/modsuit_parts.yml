- type: entity
  id: PartModsuit
  parent: BaseItem
  name: MOD part
  description: A part used in MOD construction.
  abstract: true
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Robotics/modsuit_parts.rsi
  - type: Icon
    sprite: _Goobstation/Objects/Specific/Robotics/modsuit_parts.rsi
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  #- type: GuideHelp TODO: Guide

- type: entity
  id: ModsuitChestplate
  parent: PartModsuit
  name: MOD chestplate
  components:

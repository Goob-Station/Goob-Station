- type: entity
  abstract: true
  parent: BaseItem
  id: BaseModsuitModule
  name: MOD module
  description: A module for a modular suit.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Robotics/mod_modules.rsi
    state: module
  - type: Item
    size: Normal
  - type: ModModule
  - type: Tag
    tags:
    - ModsuitModule
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleStorage
  components:
  - type: Sprite
    state: storage
  - type: ModModule
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleStorage

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageCompact
  name: MOD compact storage module
  description: What amounts to a series of integrated storage compartments and specialized pockets installed across the surface of the suit, useful for storing various bits, and or bobs.
  components:
  - type: ModModule
    complexity: 1
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,5,3
      maxItemSize: Normal

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageLarge
  name: MOD storage module
  description: Reverse engineered by Nakamura Engineering from Donk Company designs, this system of hidden compartments is entirely within the suit, distributing items and weight evenly to ensure a comfortable experience for the user; whether smuggling, or simply hauling.
  components:
  - type: Sprite
    state: storage_large
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,1,3
      - 3,0,6,3
      - 8,0,9,3
      maxItemSize: Huge

- type: entity
  parent: [BaseModsuitModuleStorage, BaseSyndicateContraband]
  id: ModsuitModuleStorageSyndicate
  name: MOD syndicate storage module
  description: A storage system using nanotechnology developed by Cybersun Industries, these compartments use esoteric technology to compress the physical matter of items put inside of them, essentially shrinking items for much easier and more portable storage.
  components:
  - type: Sprite
    state: storage_syndi
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,9,3
      maxItemSize: Huge

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageBluespace
  name: MOD bluespace storage module
  description: A storage system developed by Nanotrasen, these compartments employ miniaturized bluespace pockets for the ultimate in storage technology; regardless of the weight of objects put inside.
  components:
  - type: Sprite
    state: storage_bluespace
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,11,5
      maxItemSize: Huge

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleFlashlight
  name: MOD flashlight module
  description: A simple pair of configurable flashlights installed on the left and right sides of the helmet, useful for providing light in a variety of ranges and colors.
  components:
  - type: Sprite
    state: flashlight
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.4
    requiredParts:
    - head
  - type: ModLightModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleMagboots
  name: MOD magnetic stability module
  description: These are powerful electromagnets fitted into the suit's boots, allowing users both excellent traction no matter the condition indoors, and to essentially hitch a ride on the exterior of a hull.
  components:
  - type: Sprite
    state: magnet
  - type: ModModule
    moduleType: Toggle
    complexity: 2
    activePower: 0.4
    requiredParts:
    - shoes
    incompatible:
      tags:
      - ModsuitModuleGravity
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleGravity
  - type: ModGrantComponentsModule
    slot: shoes
    toggleItem: true
    components:
    - type: ItemToggle
      onUse: false
      onActivate: false
    - type: Magboots
      enabledPrefix: null
    - type: NoSlip
  - type: ModSpeedModule
    walkModifier: 0.85
    sprintModifier: 0.85

- type: entity
  parent: ModsuitModuleMagboots
  id: ModsuitModuleMagbootsAdvanced
  name: "MOD advanced magnetic stability module"
  description: "These are powerful electromagnets fitted into the suit's boots, allowing users both excellent traction no matter the condition indoors, and to essentially hitch a ride on the exterior of a hull."
  components:
  - type: ModModule
    moduleType: Toggle
    complexity: 3
    activePower: 0.6
    requiredParts:
    - shoes
    incompatible:
      tags:
      - ModsuitModuleGravity
  - type: ModSpeedModule
    walkModifier: 1
    sprintModifier: 1

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleVisor
  components:
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.2
    requiredParts:
    - head
    incompatible:
      tags:
      - ModsuitModuleVisor
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleVisor

- type: entity
  parent: BaseModsuitModuleVisor
  id: ModsuitModuleVisorMedical
  name: MOD medical visor module
  description: A heads-up display installed into the visor of the suit. This cross-references suit sensor data with a modern biological scanning suite, allowing the user to visualize the current health of organic lifeforms.
  components:
  - type: Sprite
    state: medhud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
    - type: ShowHealthIcons
    - type: ShowDiseaseIcons

- type: entity
  parent: [BaseModsuitModuleVisor, BaseSecurityContraband]
  id: ModsuitModuleVisorSecurity
  name: MOD security visor module
  description: A heads-up display installed into the visor of the suit. This module is a heavily-retrofitted targeting system, plugged into various criminal databases to be able to view arrest records, command simple security-oriented robots, and generally know who to shoot.
  components:
  - type: Sprite
    state: sechud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails

- type: entity
  parent: BaseModsuitModuleVisor
  id: ModsuitModuleVisorDiagnostic
  name: MOD diagnostic visor module
  description: A heads-up display installed into the visor of the suit. This uses a series of advanced sensors to access data from advanced machinery, exosuits, and other devices, allowing the user to visualize current power levels and integrity of such.
  components:
  - type: Sprite
    state: diaghud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleWelding
  name: MOD welding protection module
  description: A module installed into the visor of the suit, this projects a polarized, holographic overlay in front of the user's eyes. It's rated high enough for immunity against extremities such as spot and arc welding, solar eclipses, and handheld flashlights.
  components:
  - type: Sprite
    state: welding
  - type: ModModule
    complexity: 1
    idlePower: 0.1
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: EyeProtection

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleDevice
  components:
  - type: ContainerContainer
    containers:
      mod-device: !type:ContainerSlot

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleHealthAnalyzer
  name: MOD health analyzer module
  description: A module installed into the glove of the suit. This is a high-tech biological scanning suite, allowing the user indepth information on the vitals and injuries of others even at a distance.
  components:
  - type: Sprite
    state: health
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceHealthAnalyzer

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleGps
  name: MOD internal GPS module
  description: This module uses common Nanotrasen technology to calculate the user's position anywhere in space, down to the exact coordinates.
  components:
  - type: Sprite
    state: gps
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
  - type: ModDeviceModule
    device: ModsuitDeviceGps

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleJetpack
  name: MOD ion jetpack module
  description: A series of electric thrusters installed across the suit, this is a module highly anticipated by trainee Engineers. Rather than using gasses for combustion thrust, these jets are capable of accelerating ions using charge from the suit's charge.
  components:
  - type: Sprite
    state: jetpack
  - type: Appearance
  - type: ModModule
    moduleType: Toggle
    complexity: 3
    activePower: 20
    requiredParts:
    - outerClothing
    incompatible:
      tags:
      - ModsuitModuleJetpack
  - type: Jetpack
  - type: ModJetpackModule
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleJetpack

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleThermalRegulator
  name: MOD thermal regulator module
  description: Advanced climate control, using an inner body glove interwoven with thousands of tiny, flexible cooling lines. This circulates coolant at various user-controlled temperatures, ensuring they're comfortable.
  components:
  - type: Sprite
    state: regulator
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 1.2
  - type: ModThermalRegulatorModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleEmpShield
  name: MOD EMP shield module
  description: A field inhibitor installed into the suit, protecting it against feedback such as electromagnetic pulses that would otherwise damage the electronic systems of the suit.
  components:
  - type: Sprite
    state: empshield
  - type: ModModule
    complexity: 1
    idlePower: 0.2
  - type: ModEmpShieldModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleMouthhole
  name: MOD eating apparatus module
  description: A favorite by Miners, this modification to the helmet utilizes a nanotechnology barrier infront of the mouth to allow eating and drinking while retaining protection and atmosphere.
  components:
  - type: Sprite
    state: apparatus
  - type: ModModule
    complexity: 1
    requiredParts:
    - head
  - type: ModMouthholeModule

- type: entity
  parent: HandheldHealthAnalyzer
  id: ModsuitDeviceHealthAnalyzer
  name: MOD health analyzer
  categories: [ HideSpawnMenu ]

- type: entity
  parent: HandheldGPSBasic
  id: ModsuitDeviceGps
  name: MOD GPS
  categories: [ HideSpawnMenu ]
  components:
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleBuiltin
  components:
  - type: ModModule
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinThermal
  name: integrated thermal visor
  description: Thermal imaging built into the helmet's visor, letting the wearer see the heat signatures of living things through walls.
  components:
  - type: Sprite
    state: thermal_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.8
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ThermalVision
      isEquipment: true
      isActive: true
      lightRadius: 15

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinNightVision
  name: integrated night vision
  description: Light amplification built into the helmet's visor, letting the wearer see in the dark.
  components:
  - type: Sprite
    state: night_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.4
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: NightVision
      isEquipment: true
      isActive: true

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinSecHud
  name: integrated security visor
  description: A security heads-up display built into the helmet, showing job, mindshield and criminal record status.
  components:
  - type: Sprite
    state: sechud_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.2
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinMedHud
  name: integrated medical visor
  description: A medical heads-up display built into the helmet, showing the health of those around you.
  components:
  - type: Sprite
    state: medhud_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.2
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
    - type: ShowHealthIcons

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinFlashProtection
  name: integrated flash protection
  description: The helmet's visor is polarized against flashes and welding arcs while the suit is active.
  components:
  - type: Sprite
    state: welding
  - type: ModModule
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: FlashImmunity
    - type: EyeProtection

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinInsulation
  name: insulated gauntlets
  description: The gauntlets are lined with insulation, protecting the wearer from electric shocks even while the suit is off.
  components:
  - type: Sprite
    state: module
  - type: ModModule
    allowFlags: Inactive
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    slot: gloves
    components:
    - type: Insulated

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinAutoInjector
  name: integrated auto-injector
  description: An emergency auto-injector built into the chestplate. It doses the wearer with combat medicine when they fall into critical condition.
  components:
  - type: Sprite
    state: injector
  - type: ModModule
    requiredParts:
    - outerClothing
  - type: ModGrantComponentsModule
    slot: outerClothing
    components:
    - type: ClothingAutoInject
      reagents:
        Epinephrine: 10
        Bicaridine: 10
        TranexamicAcid: 5
        Tramadol: 5

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinChameleon
  name: chameleon projector
  description: A holographic projector that lets the control unit disguise itself as another backpack.
  components:
  - type: Sprite
    state: chameleon
  - type: ModModule
    moduleType: Usable
    allowFlags: Inactive
  - type: ModOpenUiModule
    key: enum.ChameleonUiKey.Key

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinInstrument
  name: integrated synthesizer
  description: A tiny synthesizer built into the helmet, for when the job gets boring.
  components:
  - type: Sprite
    state: bikehorn
  - type: ModModule
    moduleType: Usable
    requiredParts:
    - head
  - type: ModOpenUiModule
    key: enum.InstrumentUiKey.Key
    slot: head

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinGrip
  name: reinforced grip
  description: Servos in the gauntlets give the wearer an iron grip when grabbing others.
  components:
  - type: Sprite
    state: clamp
  - type: ModModule
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    slot: gloves
    components:
    - type: GrabModifier
      grabEscapeModifier: -0.1
      grabEscapeMultiplier: 0.8
      grabMoveSpeedMultiplier: 2
      startingGrabStage: Hard

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleQuickCarry
  name: MOD quick carry module
  description: A suite of advanced servos, redirecting power from the suit's arms to help carry the wounded; or simply for fun. However, Nanotrasen has locked the module's ability to assist in hand-to-hand combat.
  components:
  - type: Sprite
    state: carry
  - type: ModModule
    complexity: 1
    idlePower: 0.1
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    target: Wearer
    components:
    - type: ModQuickCarry
      multiplier: 0.4

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleInjector
  name: MOD injector module
  description: A module installed into the wrist of the suit, this functions as a high-capacity syringe, with a tip fine enough to locate the emergency injection ports on any suit of armor.
  components:
  - type: Sprite
    state: injector
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceInjector

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleDefibrillator
  name: MOD defibrillator module
  description: A module built into the gauntlets of the suit; commonly known as the 'Healing Hands' by medical professionals. Onboard computers in the suit calculate the necessary voltage, and the wearer returns to Medical a hero.
  components:
  - type: Sprite
    state: defibrillator
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 1.2
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceDefibrillator

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModulePatientTransport
  name: MOD patient transport module
  description: A module built into the forearm of the suit. Summonable with merely a gesture, the hardlight transport bag keeps a patient in stasis, but only holds together while the wearer drags it.
  components:
  - type: Sprite
    state: patient_transport
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.8
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDevicePatientTransport

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleThreadRipper
  name: MOD thread ripper module
  description: A module that rips open and rethreads the fabric of a patient's clothing as needed, letting the wearer operate without undressing them first.
  components:
  - type: Sprite
    state: thread_ripper
  - type: ModModule
    moduleType: Toggle
    complexity: 2
    activePower: 0.4
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    target: Wearer
    components:
    - type: SurgeryIgnoreClothing

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleTRay
  name: MOD t-ray scan module
  description: A module installed into the visor of the suit, allowing the user to use a pulse of terahertz radiation to essentially echolocate things beneath the floor, mostly cables and pipes.
  components:
  - type: Sprite
    state: tray
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.4
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: TrayScanner
      enabled: true
  - type: ModTrayScannerModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleRadProtection
  name: MOD radiation protection module
  description: A module utilizing polymers and reflective shielding to protect the user against ionizing radiation.
  components:
  - type: Sprite
    state: radshield
  - type: ModModule
    complexity: 2
    idlePower: 0.2
  - type: ModArmorModule
    modifiers:
      coefficients:
        Radiation: 0.2

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleHeadProtector
  name: MOD safety-first head protection module
  description: A series of dampening plates installed along the back and inside of the helmet, protecting the wearer from falling debris and the occasional blunt instrument.
  components:
  - type: Sprite
    state: module
  - type: ModModule
    complexity: 1
    requiredParts:
    - head
  - type: ModArmorModule
    slots:
    - head
    modifiers:
      coefficients:
        Blunt: 0.9

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleTether
  name: MOD emergency tether module
  description: A custom-built grappling-hook powered by a winch capable of hauling the user. While some older models of cargo-oriented grapples have capacities of a few tons, these are only capable of working in zero-gravity environments, a blessing to some Engineers.
  components:
  - type: Sprite
    state: tether
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.4
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceTether

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleMister
  name: MOD water mister module
  description: A module containing a mister, able to spray water to extinguish fires. Refills itself slowly from the suit's internal reservoir.
  components:
  - type: Sprite
    state: mister
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.4
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceMister

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleResinMister
  name: MOD resin mister module
  description: An atmospheric resin launcher that fires globs of quick-setting metal foam, patching breaches from a safe distance.
  components:
  - type: Sprite
    state: mister
    color: "#c0d6e8"
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.8
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceResinMister

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleHolster
  name: MOD holster module
  description: Based off typical storage compartments, this system allows the suit to holster a standard firearm across its surface and allow for extremely quick retrieval.
  components:
  - type: Sprite
    state: holster
  - type: ModModule
    moduleType: Usable
    complexity: 2
    allowFlags: Inactive
    cooldown: 0.5
  - type: ModHolsterModule
    whitelist:
      components:
      - Gun
  - type: ContainerContainer
    containers:
      mod-holster: !type:ContainerSlot

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleMegaphone
  name: MOD megaphone module
  description: A microchip megaphone linked to a MODsuit, for very important purposes, like loudness.
  components:
  - type: Sprite
    state: megaphone
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.2
    requiredParts:
    - head
  - type: Loudspeaker
    isActive: true
    affectChat: true
    speechSounds: Loudspeaker
  - type: ModLoudspeakerModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModulePepperShoulders
  name: MOD pepper shoulders module
  description: A module that attaches two pepper sprayers on shoulders of a MODsuit, releasing a cloud of capsaicin around the wearer on command.
  components:
  - type: Sprite
    state: pepper_shoulder
  - type: ModModule
    moduleType: Usable
    complexity: 1
    usePower: 15
    cooldown: 15
  - type: ModSpawnModule
    prototype: ModsuitPepperSmokeEffect

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleRestraintAssist
  name: MOD restraint assist module
  description: Enhanced gauntlet grip pads that help with placing individuals in restraints more quickly.
  components:
  - type: Sprite
    state: module
  - type: ModModule
    complexity: 1
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    target: Wearer
    components:
    - type: ModQuickCuff
      multiplier: 0.5

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleBulwark
  name: MOD bulwark module
  description: Layers of hydraulic stabilizers in the suit's legs keep the wearer firmly planted, making them impossible to shove around.
  components:
  - type: Sprite
    state: bulwark
  - type: ModModule
    complexity: 3
    idlePower: 0.2
    requiredParts:
    - shoes
  - type: ModGrantComponentsModule
    target: Wearer
    components:
    - type: ModShoveBlocker

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleDrill
  name: MOD drill module
  description: An integrated drill, typically extending over the user's hand. While useful for drilling through rock, your drill is surely the one that both pierces and creates the heavens.
  components:
  - type: Sprite
    state: drill
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.4
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceDrill
  - type: ModSphereDrill
    damage:
      types:
        Structural: 50
    whitelist:
      components:
      - MiningScannerViewable

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleOreBag
  name: MOD ore bag module
  description: An integrated ore storage system installed into the gauntlets, magnetically pulling in nearby ore while active.
  components:
  - type: Sprite
    state: ore
  - type: ModModule
    moduleType: Toggle
    complexity: 1

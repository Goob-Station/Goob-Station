- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleGloveTranslator
  name: "MOD glove translator module"
  description: "A module that adds motion sensors into the suit's gloves, which works in tandem with a short-range subspace transmitter, letting the audibly impaired use sign language over comms."

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseModsuitModule
  name: MOD module
  description: A module for a modular suit.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Robotics/mod_modules.rsi
    state: module
  - type: Item
    size: Normal
  - type: ModModule
  - type: Tag
    tags:
    - ModsuitModule
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleStorage
  components:
  - type: Sprite
    state: storage
  - type: ModModule
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleStorage

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageCompact
  name: MOD compact storage module
  description: What amounts to a series of integrated storage compartments and specialized pockets installed across the surface of the suit, useful for storing various bits, and or bobs.
  components:
  - type: ModModule
    complexity: 1
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,5,3
      maxItemSize: Normal

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageLarge
  name: MOD storage module
  description: Reverse engineered by Nakamura Engineering from Donk Company designs, this system of hidden compartments is entirely within the suit, distributing items and weight evenly to ensure a comfortable experience for the user; whether smuggling, or simply hauling.
  components:
  - type: Sprite
    state: storage_large
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,1,3
      - 3,0,6,3
      - 8,0,9,3
      maxItemSize: Huge

- type: entity
  parent: [BaseModsuitModuleStorage, BaseSyndicateContraband]
  id: ModsuitModuleStorageSyndicate
  name: MOD syndicate storage module
  description: A storage system using nanotechnology developed by Cybersun Industries, these compartments use esoteric technology to compress the physical matter of items put inside of them, essentially shrinking items for much easier and more portable storage.
  components:
  - type: Sprite
    state: storage_syndi
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,9,3
      maxItemSize: Huge

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageBluespace
  name: MOD bluespace storage module
  description: A storage system developed by Nanotrasen, these compartments employ miniaturized bluespace pockets for the ultimate in storage technology; regardless of the weight of objects put inside.
  components:
  - type: Sprite
    state: storage_bluespace
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,11,5
      maxItemSize: Huge

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleFlashlight
  name: MOD flashlight module
  description: A simple pair of configurable flashlights installed on the left and right sides of the helmet, useful for providing light in a variety of ranges and colors.
  components:
  - type: Sprite
    state: flashlight
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.1
    requiredParts:
    - head
  - type: ModLightModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleMagboots
  name: MOD magnetic stability module
  description: These are powerful electromagnets fitted into the suit's boots, allowing users both excellent traction no matter the condition indoors, and to essentially hitch a ride on the exterior of a hull.
  components:
  - type: Sprite
    state: magnet
  - type: ModModule
    moduleType: Toggle
    complexity: 2
    activePower: 0.1
    requiredParts:
    - shoes
  - type: ModGrantComponentsModule
    slot: shoes
    toggleItem: true
    components:
    - type: ItemToggle
      onUse: false
      onActivate: false
    - type: Magboots
      enabledPrefix: null
    - type: NoSlip

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleVisor
  components:
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.05
    requiredParts:
    - head
    incompatible:
      tags:
      - ModsuitModuleVisor
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleVisor

- type: entity
  parent: BaseModsuitModuleVisor
  id: ModsuitModuleVisorMedical
  name: MOD medical visor module
  description: A heads-up display installed into the visor of the suit. This cross-references suit sensor data with a modern biological scanning suite, allowing the user to visualize the current health of organic lifeforms.
  components:
  - type: Sprite
    state: medhud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
    - type: ShowHealthIcons
    - type: ShowDiseaseIcons

- type: entity
  parent: [BaseModsuitModuleVisor, BaseSecurityContraband]
  id: ModsuitModuleVisorSecurity
  name: MOD security visor module
  description: A heads-up display installed into the visor of the suit. This module is a heavily-retrofitted targeting system, plugged into various criminal databases to be able to view arrest records, command simple security-oriented robots, and generally know who to shoot.
  components:
  - type: Sprite
    state: sechud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails

- type: entity
  parent: BaseModsuitModuleVisor
  id: ModsuitModuleVisorDiagnostic
  name: MOD diagnostic visor module
  description: A heads-up display installed into the visor of the suit. This uses a series of advanced sensors to access data from advanced machinery, exosuits, and other devices, allowing the user to visualize current power levels and integrity of such.
  components:
  - type: Sprite
    state: diaghud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleWelding
  name: MOD welding protection module
  description: A module installed into the visor of the suit, this projects a polarized, holographic overlay in front of the user's eyes. It's rated high enough for immunity against extremities such as spot and arc welding, solar eclipses, and handheld flashlights.
  components:
  - type: Sprite
    state: welding
  - type: ModModule
    complexity: 1
    idlePower: 0.05
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: FlashImmunity
    - type: EyeProtection

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleHealthAnalyzer
  name: MOD health analyzer module
  description: A module installed into the glove of the suit. This is a high-tech biological scanning suite, allowing the user indepth information on the vitals and injuries of others even at a distance.
  components:
  - type: Sprite
    state: health
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.05
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceHealthAnalyzer

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleGps
  name: MOD internal GPS module
  description: This module uses common Nanotrasen technology to calculate the user's position anywhere in space, down to the exact coordinates.
  components:
  - type: Sprite
    state: gps
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.05
  - type: ModDeviceModule
    device: ModsuitDeviceGps

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleJetpack
  name: MOD ion jetpack module
  description: A series of electric thrusters installed across the suit, this is a module highly anticipated by trainee Engineers. Rather than using gasses for combustion thrust, these jets are capable of accelerating ions using charge from the suit's charge.
  components:
  - type: Sprite
    state: jetpack
  - type: Appearance
  - type: ModModule
    moduleType: Toggle
    complexity: 3
    activePower: 0.5
    requiredParts:
    - outerClothing
    incompatible:
      tags:
      - ModsuitModuleJetpack
  - type: Jetpack
  - type: ModJetpackModule
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleJetpack

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleThermalRegulator
  name: MOD thermal regulator module
  description: Advanced climate control, using an inner body glove interwoven with thousands of tiny, flexible cooling lines. This circulates coolant at various user-controlled temperatures, ensuring they're comfortable.
  components:
  - type: Sprite
    state: regulator
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.3
  - type: ModThermalRegulatorModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleEmpShield
  name: MOD EMP shield module
  description: A field inhibitor installed into the suit, protecting it against feedback such as electromagnetic pulses that would otherwise damage the electronic systems of the suit.
  components:
  - type: Sprite
    state: empshield
  - type: ModModule
    complexity: 1
    idlePower: 0.1
  - type: ModEmpShieldModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleMouthhole
  name: MOD eating apparatus module
  description: A favorite by Miners, this modification to the helmet utilizes a nanotechnology barrier infront of the mouth to allow eating and drinking while retaining protection and atmosphere.
  components:
  - type: Sprite
    state: apparatus
  - type: ModModule
    complexity: 1
    requiredParts:
    - head
  - type: ModMouthholeModule

- type: entity
  parent: HandheldHealthAnalyzer
  id: ModsuitDeviceHealthAnalyzer
  name: MOD health analyzer
  categories: [ HideSpawnMenu ]

- type: entity
  parent: HandheldGPSBasic
  id: ModsuitDeviceGps
  name: MOD GPS
  categories: [ HideSpawnMenu ]
  components:
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleBuiltin
  categories: [ HideSpawnMenu ]
  components:
  - type: ModModule
    removable: false
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinThermal
  name: integrated thermal visor
  description: Thermal imaging is built into the helmet's visor. It can be toggled from the helmet itself.
  components:
  - type: Sprite
    state: thermal_visor

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinSecHud
  name: integrated security HUD
  description: A security heads-up display built into the helmet, showing job, mindshield and criminal record status.
  components:
  - type: Sprite
    state: sechud_visor

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinMedHud
  name: integrated medical HUD
  description: A medical heads-up display built into the helmet, showing the health of those around you.
  components:
  - type: Sprite
    state: medhud_visor

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinFlashProtection
  name: integrated flash protection
  description: The helmet's visor is polarized against flashes and welding arcs.
  components:
  - type: Sprite
    state: welding

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinInsulation
  name: insulated gauntlets
  description: The gauntlets are lined with insulation, protecting the wearer from electric shocks.
  components:
  - type: Sprite
    state: module

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinAutoInjector
  name: integrated auto-injector
  description: An emergency auto-injector built into the chestplate, loaded with combat medicine.
  components:
  - type: Sprite
    state: injector

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinChameleon
  name: chameleon projector
  description: The control unit can disguise itself as another backpack.
  components:
  - type: Sprite
    state: chameleon

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinInstrument
  name: integrated synthesizer
  description: A tiny synthesizer built into the helmet, for when the job gets boring.
  components:
  - type: Sprite
    state: bikehorn

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinGrip
  name: reinforced grip
  description: Servos in the gauntlets give the wearer an iron grip when grabbing others.
  components:
  - type: Sprite
    state: clamp

- type: entity
  parent: ModsuitModuleJetpack
  id: ModsuitModuleJetpackAdvanced
  name: "MOD advanced ion jetpack module"
  description: "An improvement on the previous model of electric thrusters. This one achieves higher precision and spatial stability through mounting of more jets and application of red paint."

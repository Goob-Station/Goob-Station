- type: entity
  parent: ModsuitModuleBuiltinThermal
  id: ModsuitModuleThermalVisor
  name: "MOD thermal visor module"
  description: "A heads-up display installed into the visor of the suit. This uses a small IR scanner to detect and identify the thermal radiation output of objects near the user. While it can detect the heat output of even something as small as a rodent, it still produces irritating red overlay. They say these also let you see behind you."
  components:
  - type: ModModule
    moduleType: Toggle
    complexity: 2
    activePower: 0.8
    requiredParts:
    - head
    incompatible:

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModulePlasmaStabilizer
  name: "MOD plasma stabilizer module"
  description: "This system essentially forms an atmosphere of its own, within the suit, efficiently and quickly preventing oxygen from causing the user's head to burst into flame. This allows plasmamen to safely remove their helmet, allowing for easier equipping of any MODsuit-related equipment, or otherwise. The purple glass of the visor seems to be constructed for nostalgic purposes."
  components:
  - type: Sprite
    state: plasma_stabilizer
  - type: ModModule
    complexity: 1
    idlePower: 0.2
    allowFlags: Inactive
    requiredParts:
    - head
  - type: ModPlasmaStabilizerModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleHatStabilizer
  name: "MOD hat stabilizer module"
  description: "A simple set of deployable stands, directly atop one's head; these will deploy under a hat to keep it from falling off, allowing them to be worn atop the sealed helmet. You still need to take the hat off your head while the helmet deploys, though. This is a must-have for Nanotrasen Captains, enabling them to show off their authoritative hat even while in their MODsuit."
  components:
  - type: Sprite
    state: hat_holder
  - type: ModModule
    complexity: 0
    allowFlags: Inactive
    requiredParts:
    - head
  - type: ModHatStabilizerModule


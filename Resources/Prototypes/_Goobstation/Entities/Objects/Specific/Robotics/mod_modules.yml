  id: ModsuitModuleNightVisor
  name: "MOD night visor module"
  description: "A heads-up display installed into the visor of the suit. Typical for both civilian and military applications, this allows the user to perceive their surroundings while in complete darkness, enhancing the view by tenfold; yet brightening everything into a spooky green glow. They say these also let you see behind you."

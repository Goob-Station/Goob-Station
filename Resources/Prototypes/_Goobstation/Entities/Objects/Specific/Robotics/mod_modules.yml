- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleBurgerDispenser
  name: "MOD burger dispenser module"
  description: "A rare piece of technology reverse-engineered from a prototype found in a Donk Company vessel. This can draw incredible amounts of power from the suit's charge to create edible organic matter in the palm of the wearer's glove; however, research seemed to have entirely stopped at burgers. Notably, all attempts to get it to dispense Earl Grey tea have failed."
  components:

  name: nanotrasen representative lizard plushie
  description: An adorable stuffed toy that resembles a lizardperson as a nanotrasen representative. It seems to always be judgmental of you.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: ntr

- type: entity

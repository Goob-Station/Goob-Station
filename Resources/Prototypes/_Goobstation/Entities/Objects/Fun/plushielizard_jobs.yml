# This base is created so we don't have to define the different sprite path for each plushie job.
- type: entity
  parent: BasePlushieLizardJob
  id: PlushieLizardJobBlueshieldOfficer
  name: blueshield officer lizard plushie
  description: An adorable stuffed toy that resembles a lizardperson as a blueshield officer. One smack from this plushie is sure to ward off any evildoers.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/plushielizard_jobs.rsi
    state: bso

- type: entity

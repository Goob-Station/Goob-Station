- type: entity
  abstract: true
  parent: BaseItem
  id: BasePaintingFrame
  description: Put it on a finished painting to frame it.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/painting_frames.rsi
  - type: Item
    size: Small

- type: entity
  parent: BasePaintingFrame
  id: PaintingFrameWood
  name: wooden painting frame
  components:

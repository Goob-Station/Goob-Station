   #Goobstation
- type: entity
  parent: [BaseHandheldInstrument, Clothing]
  id: BaseCassette
  abstract: true
  components:
  - type: Instrument
    program: 62
  - type: SwappableInstrument
    instrumentList:
      "Synth": { 62: 0 }
      "Friend": { 2: 0 }
      "Overdriven": { 29: 0 }
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - neck
  - type: ActivatableUI
    inHandsOnly: false

- type: entity
  parent: [BaseCassette, BaseSyndicateContraband]
  id: BloodredCassette
  name: "криваво-червоний касетний плеєр"
  description: "Найменш витончений спосіб насолодитися улюбленими мелодіями."
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/bloodred_cassette_player.rsi
    state: icon
  - type: Item
    sprite: _Goobstation/Objects/Fun/bloodred_cassette_player.rsi
  - type: Clothing
    quickEquip: false
    sprite: _Goobstation/Objects/Fun/bloodred_cassette_player.rsi

- type: entity
  parent: BaseCassette
  id: CrewCassette
  name: "касетний плеєр"
  description: "Звичайний старий касетний плеєр, щоб насолоджуватися мелодіями на ходу."
  components:
    - type: Sprite
      sprite: _Goobstation/Objects/Fun/crew_cassette_player.rsi
      state: icon
    - type: Item
      sprite: _Goobstation/Objects/Fun/crew_cassette_player.rsi
    - type: Clothing
      quickEquip: false
      sprite: _Goobstation/Objects/Fun/crew_cassette_player.rsi

- type: entity
  parent: BaseCassette
  id: ExecutiveCassette
  name: "представницький касетний плеєр"
  description: "Ідеально підходить для того, щоб ви виглядали так, ніби займаєтеся злиттям та поглинанням."
  components:
    - type: Sprite
      sprite: _Goobstation/Objects/Fun/executive_cassette_player.rsi
      state: icon
    - type: Item
      sprite: _Goobstation/Objects/Fun/executive_cassette_player.rsi
    - type: Clothing
      quickEquip: false
      sprite: _Goobstation/Objects/Fun/executive_cassette_player.rsi

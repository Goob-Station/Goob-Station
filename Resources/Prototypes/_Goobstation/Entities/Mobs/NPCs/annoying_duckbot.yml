- type: entity
  parent: MobSiliconBase
  id: MobAnnoyingDuckBot
  name: annoying duck bot
  description: The happiest duck on the station! It thinks it's a real duck.
  components:
  - type: Sprite
    sprite: _Goobstation/Mobs/Silicon/Bots/annoying_duckbot.rsi
    state: annoying_duckbot
  - type: SpamEmitSound
    minInterval: 3
    maxInterval: 15
    sound:
      collection: AnnoyingDuckBotSounds
      params:
        variation: 0.125
  - type: HTN
    rootTask:
      task: AnnoyingDuckBotCompound
  - type: Construction
    graph: AnnoyingDuckBot
    node: bot
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-mechanical
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-annoying-duckbot-name
    description: ghost-role-information-annoying-duckbot-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: InteractionPopup
    successChance: 0.9
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/duck_quack_happy.ogg
  - type: Vocalizer
    minVocalizeInterval: 1m
    maxVocalizeInterval: 2m
  - type: DatasetVocalizer
    dataset: AnnoyingDuckBotAd
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - RobotTalk
    - Duck
    understands:
    - TauCetiBasic
    - RobotTalk
    - Duck
  - type: EggLayer
    eggSpawn:
    - id: FoodEggAnnoyingDuck
    eggLayCooldownMin: 300
    eggLayCooldownMax: 600
  - type: EmaggableAnnoyingDuckBot
    sound:
      collection: AnnoyingDuckBotSounds
      params:
        pitch: 0.7
        variation: 0.3
    minSoundInterval: 1
    maxSoundInterval: 6
    eggLayCooldownMin: 60
    eggLayCooldownMax: 120
    dataset: AnnoyingDuckBotEmaggedAd
    minVocalizeInterval: 2s
    maxVocalizeInterval: 5s
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:GiveGoobcoinsToKillerBehaviour
        amount: 1
      - !type:SpawnEntitiesBehavior
        spawn:
          EffectConfettiBurst:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/Animals/children_yay_sound.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

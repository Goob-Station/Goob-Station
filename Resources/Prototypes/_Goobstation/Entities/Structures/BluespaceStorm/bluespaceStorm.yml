- type: entity
  id: LavalandBluespacePortal
  name: lavaland bluespace portal
  description: A portal leading to lavaland, too unstable for you to cross unscathed but not the same can be said for whatever's at the other side.
  components:
  - type: Sprite
    noRot: true
    sprite: _Goobstation/BluespaceStorm/bluespace_portal.rsi
    layers:
    - state: lavaland_portal
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: BlueSpaceStormPortal
    portalType: LavalandBluespacePortal
  - type: RequireProjectileTarget
  - type: AmbientSound
    volume: 2
    range: 20
    sound:
      path: /Audio/_Goobstation/Ambience/ominous_pulse.ogg
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Magic/ethereal_enter.ogg


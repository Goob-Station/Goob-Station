- type: entity
  abstract: true
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetAltLoudspeaker
  components:
  - type: Loudspeaker
    canToggle: true
    affectRadio: true

- type: entity
  parent: [ClothingHeadsetAltSyndicate, ClothingHeadsetAltLoudspeaker]
  id: ClothingHeadsetAltSyndicateCommander
  name: "криваво-червона командирська гарнітура"

- type: entity
  parent: ClothingHeadset
  id: ClothingHeadsetChronolegioneer
  name: "футуристична накладна гарнітура"
  description: "Гарнітура з майбутнього, яка може приймати більшість частот радіостанцій."
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyFuture
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/chronolegioneer.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/chronolegioneer.rsi

- type: entity
  parent: ClothingHeadsetChronolegioneer
  id: ClothingHeadsetChronolegioneerUnremoveable
  suffix: Unremoveable
  components:
  - type: Unremoveable

- type: entity
  parent: [ClothingHeadsetAlt, BaseSecurityContraband]
  id: ClothingHeadsetAltWarden
  name: "навушники наглядача"
  description: "Оновлений, модульний інтерком, що дозволяє швидко спілкуватися з командним персоналом."
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySecurity
      - EncryptionKeyCommand
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/warden.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/warden.rsi

- type: entity
  parent: [ClothingHeadsetAlt, BaseCentcommContraband]
  id: ClothingHeadsetDeathsquad
  name: "навушники загону смерті"
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCentCom
      - EncryptionKeyStationMaster
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/deathsquad.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/deathsquad.rsi
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: [ClothingHeadsetAlt, BaseSecurityContraband]
  id: ClothingHeadsetAltSecurityRegular
  name: "гарнітура служби безпеки"
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySecurity
      - EncryptionKeyCommon
  - type: Sprite
    sprite: Clothing/Ears/Headsets/security.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/security.rsi

- type: entity
  parent: [ClothingHeadsetAlt, BaseCentcommContraband]
  id: ClothingHeadsetAltBlueshield
  name: "навушники офіцера синього щита"
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommand
      - EncryptionKeyCentCom
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/blueshield.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/blueshield.rsi

- type: entity
  parent: ClothingHeadsetCommand
  id: ClothingHeadsetCommandService
  name: "командно-сервісна гарнітура"
  description: "Гарнітура з каналами командування та сервісу."
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommand
      - EncryptionKeyService
      - EncryptionKeyCommon

- type: entity
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetAltRadioHost
  name: "накладна гарнітура радіоведучого"
  description: "Накладна гарнітура з додатковою м’якою пінною підкладкою навколо вух."
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Goobstation/Clothing/Ears/Headsets/radiohost.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Ears/Headsets/radiohost.rsi

- type: cinematicCaptionStyle
  id: CinematicCaptionDefault

- type: cinematicCaptionStyle
  id: HereticCaptionBase
  abstract: true
  fontPath: /Fonts/_Goobstation/PirataOne/PirataOne-Regular.ttf
  fontSize: 46
  maxWidthFraction: 0.72
  verticalPosition: 0.62
  shake: 1.5
  textSound:
    collection: HereticScriptWhispers
    params:
      volume: -5
  textSoundFadeTime: 1.5

- type: cinematicCaptionStyle
  id: HereticCaptionPunchBase
  abstract: true
  parent: HereticCaptionBase
  fontSize: 125
  tracking: 0.05
  maxWidthFraction: 0.92
  verticalPosition: 0.5
  shake: 2
  letterWave: 1
  waveSpeed: 1.3
  slamScale: 0.25
  slamDecay: 6
  kick: 0.12
  kickTime: 0.94
  stepRate: 12
  igniteTime: 0
  throb: 0.02
  auraScale: 1.15

# Ash

# fun GPS UI
- type: entity
  id: HandheldGPSBasic
  components:
  - !Remove type: HandheldGPS
  - type: GPS # what if gps didnt suck doo doo balls
  - type: ActivatableUI
    key: enum.GpsUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.GpsUiKey.Key:
        type: GpsBoundUserInterface
  - type: PhysicalComposition # Recycle update
    materialComposition:
      Steel: 200
      Glass: 75
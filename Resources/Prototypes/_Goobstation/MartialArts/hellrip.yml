- type: martialArt
  id: HellRip
  roundstartCombos: HellRipMoves
  randomDamageModifier: True
  damageModifierType: Slash
  combos:
  - DropKick
  - HeadRip
  - Slam
  - TearDown

- type: martialArtsCombo
  id: DropKick
  name: Flying DropKick
  attacks:
  - Disarm
  - Disarm
  userConditions:
  - !type:ProneCondition
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Effects/demon_attack1.ogg
  targetEffects:
  - !type:MartialArtsThrow
    thrownSpeed: 25
  - !type:TakeStaminaDamage
    amount: 80
    immediate: true
  - !type:ModifyKnockdown
    type: Set
    time: 6

- type: martialArtsCombo
  id: HeadRip
  name: Head Rip
  attacks:
  - Harm
  - Harm
  - Harm
  - Grab
  userConditions:
  - !type:ProneCondition
  targetConditions:
  - !type:MobStateCondition
    state: Dead
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Effects/gib1.ogg
  - !type:PlaySoundEffect
    sound: /Audio/Effects/demon_attack1.ogg
  - !type:StopPulling
  targetEffects:
  - !type:MartialArtsDamage
    damage:
      types:
        Slash: 100
  - !type:MartialArtsDamage
    damage:
      types:
        Blunt: 300
    targetPart: Head
  - !type:AmputatePart # we make sure
    partType: Head

- type: martialArtsCombo
  id: TearDown
  name: Tear Down
  attacks:
  - Harm
  - Disarm
  - Grab
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Effects/Fluids/blood1.ogg
  - !type:PlaySoundEffect
    sound: /Audio/Effects/demon_attack1.ogg
  - !type:StopPulling
  targetEffects:
  - !type:TakeStaminaDamage
    amount: 40
    immediate: true
  - !type:MartialArtsDamage
    damage:
      types:
        Slash: 50
  - !type:ModifyKnockdown
    type: Set
    time: 6

- type: martialArtsCombo
  id: Slam
  name: Hellish Slam
  attacks:
  - Disarm
  - Harm
  - !type:PlaySoundEffect
    sound: /Audio/Effects/Fluids/blood1.ogg
  - !type:PlaySoundEffect
    sound: /Audio/Effects/metal_slam5.ogg
  - !type:ModifyKnockdown
    type: Remove
    time: 5
  - !type:SetStandingState
    standing: true
  targetEffects:
  - !type:TakeStaminaDamage
    amount: 100
    immediate: true
  - !type:ModifyKnockdown
    type: Set
    time: 8

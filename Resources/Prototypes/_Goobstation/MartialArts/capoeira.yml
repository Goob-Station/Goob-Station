- type: martialArt
  id: Capoeira
  componentGrant:
  - type: CapoeiraUser
  combos:
  - PushKick
  - SweepKick
  - CircleKick
  - SpinKick
  - KickUp
  weight: 6

- type: martialArtsCombo
  id: PushKick
  name: Push Kick
  attacks:
  - Grab
  - Harm
  - Harm
  targetConditions:
  - !type:ProneCondition
    inverted: true
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit3.ogg
  - !type:TakeStaminaDamage
    amount: -30
    immediate: true
  - !type:StopPulling
  targetEffects:
  - !type:MartialArtsDamage
    damage:
      types:
        Blunt: 10
    usesVelocityPower: true
  - !type:MartialArtsThrow # TODO: doesnt take power into account
    thrownSpeed: 7
  - !type:CapoeiraKnockdown
    time: 2 # this is further multiplied by your movespeed, about 6 seconds if you're running

- type: martialArtsCombo
  id: CircleKick
  name: Circle Kick
  attacks:
  - Disarm
  - Disarm
  - Harm
  userConditions:
  - !type:ProneCondition
    inverted: true
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit2.ogg
  - !type:TakeStaminaDamage
    amount: -40
    immediate: true
  targetEffects:
  - !type:MartialArtsDamage
    damage:
      types:
        Blunt: 15
  # TODO: account for power again
  # - speedMultiplier = 1f / MathF.Max(1f, power);
  # - args.SlowDownTime * power
  - !type:MovementSpeedModifier
    type: Set
    time: 2
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
    effectProto: MartialArtsGenericSlowdownEffect  

- type: martialArtsCombo
  id: SweepKick
  name: Sweep Kick
  attacks:
  - Harm
  - Harm
  - Disarm
  userConditions:
  - !type:ProneCondition
    inverted: true
  - !type:CapoeiraVelocityCondition
    minVelocity: 2
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit1.ogg
  - !type:TakeStaminaDamage
    amount: -60
    immediate: true
  - !type:ApplyMartialArtsMultiplier
    multiplier: 1.5
    modifier: 0
    time: 5
    type: AttackRate
  targetEffects:
  - !type:MartialArtsDamage
    damage:
      Blunt: 10
    usesVelocityPower: true
  - !type:TakeStaminaDamage
    amount: 10
    immediate: true
  - !type:CapoeiraKnockdown
    time: 1

- type: martialArtsCombo
  id: SpinKick
  name: Spin Kick
  attacks:
  - Grab
  - Harm
  - Disarm
  - Harm
  userConditions:
  - !type:ProneCondition
    inverted: true
  - !type:CapoeiraVelocityCondition
    minVelocity: 2
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit1.ogg
  - !type:TakeStaminaDamage
    amount: -100
    immediate: true
  - !type:StopPulling
  - !type:ApplyMartialArtsMultiplier
    multiplier: 1.5
    modifier: 0
    time: 5
    type: AttackRate
  - !type:DoAnimatedEmote
    emote: Flip
  targetEffects:
  - !type:CapoeiraKnockdown
    time: 2
  - !type:MartialArtsDamage
    damage:
      Blunt: 25
    usesVelocityPower: true
  - !type:TakeStaminaDamage
    amount: 15
    immediate: true

- type: martialArtsCombo
  id: KickUp
  name: Kick Up
  attacks:
  - Disarm
  - Disarm
  userEffects:
  - !type:ModifyKnockdown
    type: Remove
    time: 5

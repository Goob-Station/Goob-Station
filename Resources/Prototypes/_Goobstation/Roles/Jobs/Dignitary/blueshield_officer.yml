- type: job
  id: BlueshieldOfficer
  name: job-name-bso
  description: "Виконуйте роль охоронця та радника для Командування й VIP із Центкому."
  playTimeTracker: JobBlueshieldOfficer
  requirements:
    - !type:DepartmentTimeRequirement
      department: Command
      time: 90000 # 25 hours
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 54000 # 15 hours
    - !type:DepartmentTimeRequirement
      department: Security
      time: 90000 # 25 hours
    - !type:AgeRequirement
      requiredAge: 21
    - !type:TraitsRequirement # Pirate
      inverted: true
      traits:
      - Foreigner
      - ForeignerLight
      - DeafTrait
      - MovementImpaired
      - Blindness
      - Narcolepsy
      - Muted
      - WheelchairBound # Pirate end
    #- !type:SpeciesRequirement # Pirate remove requirement
    #  inverted: true
    #  species:
    #  - Felinid
  # Pirate contractor start
    - !type:CharacterEmployerRequirement
      employers:
      - NanoTrasen
      - PMCG
  # Pirate contractor end
  guides:
  - BlueshieldOfficerSOP
  - Command
  - Succession
  goobcoins: 45
  weight: 20
  startingGear: BlueshieldOfficerGear
  icon: "JobIconBlueshield"
  joinNotifyCrew: true
  supervisors: job-supervisors-ntr-centcom
  canBeAntag: false
  whitelisted: true # Pirate
  access:
  - Security
  - Brig
  - External
  - Cryogenics
  - Maintenance
  - Engineering
  - Medical
  - Research
  - Command
  - CentralCommand
  - BlueshieldOfficer
  - Service
  - Hydroponics
  - Cargo
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, BluespaceLifelineImplant ] # Go big, or go home.
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
      - type: Condemned
        soulOwnedNotDevil: true

- type: startingGear
  id: BlueshieldOfficerGear
  equipment:
    eyes: ClothingEyesGlassesBSO
    #gloves: ClothingHandsGlovesCombat - Goobstation, moved to loadouts

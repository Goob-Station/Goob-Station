- type: entity
  parent: BaseGameRule
  id: EmergencyGridRestore
  components:
  - type: StationEvent
    startAnnouncement: station-event-emergency-grid-restore-announcement
    startAnnouncementColor: "#18abf5"
    startAudio:
      path: /Audio/Announcements/announce.ogg
    weight: 4
    reoccurrenceDelay: 25
    earliestStart: 10
    duration: 1
    chaos:
      Power: -200
    eventType: FreeStuffUseful
  - type: EmergencyGridRestoreRule

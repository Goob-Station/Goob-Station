- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseDepartmentDropPod
  components:
  - type: StationEvent
    weight: 5
    reoccurrenceDelay: 20
    earliestStart: 10
    duration: 1
    eventType: FreeStuffUseful

- type: entity
  parent: BaseDepartmentDropPod
  id: DropPodMedical
  components:
  - type: StationEvent
    chaos:
      Medical: -150
  - type: GameDirectorRequiresStaff
    departments:
    - Medical
  - type: DepartmentDropPodRule
    department: Medical
    channel: Medical
    problem: department-drop-pod-problem-injuries
    supplies: department-drop-pod-supplies-medical
    contents: !type:AllSelector
      children:
      - id: CrateMedicalSupplies
      - id: CrateEmergencyBruteKit
      - id: CrateEmergencyBurnKit
      - id: CrateEmergencyAdvancedKit

- type: entity
  parent: BaseDepartmentDropPod
  id: DropPodSecurityArmory

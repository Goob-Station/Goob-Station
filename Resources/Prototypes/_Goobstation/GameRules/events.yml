- type: entity
  id: TidemindDevelop
  parent: BaseGameRule
  components:
  - type: GameRule
    chaosScore: 150
  - type: StationEvent
    weight: 3 # rare
    duration: 1
    # no occurences limit so newly arriving tiders can also get it
  - type: JobAddCollectiveMindRule
    message: station-event-tidemind-message
    affected:
      - Passenger
    channel: Tidemind

- type: entity
  parent: BaseGameRule
  id: DerelictCyborgSyndicateSpawn
  components:
  - type: GameRule
    chaosScore: 150
  - type: StationEvent
    weight: 4.5 # Uncommon
    earliestStart: 30
    reoccurrenceDelay: 30
    minimumPlayers: 4
    duration: null
  - type: SpaceSpawnRule
    spawnDistance: 0
  - type: AntagSpawner
    prototype: PlayerBorgDerelictSyndicateAssaultBattery
  - type: AntagSelection
    definitions:
    - spawnerPrototype: SpawnPointGhostDerelictCyborgSyndicate
      min: 1
      max: 1
      pickPlayer: false

- type: entity # Goobstation
  id: JobDistributionError
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-job-distribution-error-announcement
    minimumPlayers: 25
    weight: 3
    duration: 1
  - type: GameRule
    chaosScore: 50
  - type: JobDistributionErrorRule # Goobstation
    jobs:
    - SecurityClown
    - PartyMaker
    - CommandMaid

- type: entity
  parent: BaseGameRule
  id: VoidwalkerSpawn
  components:
  - type: StationEvent
    weight: 2
    earliestStart: 30
    maxOccurrences: 1
    minimumPlayers: 35
    duration: null
    chaos:
      Hostile: 20
      Friend: 20
      Combat: 40
      Death: 60
      Medical: 40
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 600
  - type: SpaceSpawnRule
    spawnDistance: 0
  - type: AntagSpawner
    prototype: BaseMobVoidWalker
  - type: VoidwalkerRule
  - type: AntagObjectives
    objectives:
    - VoidwalkerKidnapObjective
    - VoidwalkerSurviveObjective
  - type: AntagSelection
    agentName: voidwalker-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostVoidwalker
      min: 1
      max: 1
      pickPlayer: false
      mindRoles:
      - MindRoleVoidwalker

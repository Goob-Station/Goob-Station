- type: emote
  id: Flip
  name: chat-emote-name-flip
  icon: _Goobstation/Interface/Emotes/flip.png
  blacklist: # Pirate: pAIs cannot perform physical emotes
    components:
    - PAI
  chatMessages: ["chat-emote-msg-flip"]
  chatTriggers:
  - flip
  - flips
  - flips.
  - flips!
  - does a flip
  - does a flip.
  - does a flip!
  event: !type:AnimationFlipEmoteEvent


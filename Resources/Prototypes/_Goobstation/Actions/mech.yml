- type: entity
  parent: BaseAction
  id: ActionMechSelectEquipment
  name: Select equipment
  description: Switch straight to this piece of equipment.
  components:
  - type: Action
    useDelay: 0.25
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:MechSelectEquipmentEvent

- type: entity
  parent: BaseMechAction
  id: ActionMechOverclock
  name: Overclock
  description: Force your exosuit to move faster than is safely possible. Shreds through integrity and power.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_overload_off
    iconOn:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_overload_on
  - type: InstantAction
    event: !type:MechOverclockActionEvent


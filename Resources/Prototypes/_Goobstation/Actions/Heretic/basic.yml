# actions
- type: entity
  parent: BaseAction
  id: ActionHereticOpenStore
  name: "Відкрите сховище знань"
  description: "Відкрийте Сховище знань."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: open_store
  - type: InstantAction
    event: !type:EventHereticOpenStore {}
  - type: HereticAction
    requireMagicItem: false

- type: entity
  parent: BaseAction
  id: ActionHereticMansusGrasp
  name: "Мансусова хватка"
  description: "Спрямуйте силу Старих Богів через свою руку."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: mansus_grasp
  - type: InstantAction
    event: !type:EventHereticMansusGrasp {}
  - type: HereticAction
    requireMagicItem: false

- type: entity
  parent: BaseAction
  id: ActionHereticLivingHeart
  name: "Живе серце"
  description: "Використовуйте своє серце, щоб визначити місцезнаходження жертви."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 2
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: living_heart
  - type: InstantAction
    event: !type:EventHereticLivingHeart {}
  - type: HereticAction
    requireMagicItem: false

- type: entity
  parent: BaseAction
  id: ActionHereticMansusLink
  name: "Зв'язок з Мансусом"
  description: "Пробийтеся крізь реальність і з'єднайте розуми один з одним. Клавіша за замовчуванням - +m"
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: mansus_link
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:EventHereticMansusLink {}
  - type: HereticAction
    requireMagicItem: false
  - type: SpeakOnAction
    sentence: heretic-speech-mansuslink

- type: entity
  parent: BaseAction
  id: ActionHereticShadowCloak
  name: "Плащ Тіні"
  description: "Повністю приховує вашу особистість, але не робить вас невидимим. Можна активувати завчасно, щоб вимкнути. Під час дії плаща ви рухаєтеся швидше, але виконуєте дії набагато повільніше. Отримання шкоди під час дії плаща може призвести до його раптового зникнення."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 6
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: shadowcloak
  - type: InstantAction
    event: !type:EventHereticCloak
      status: ShadowCloakStatusEffect
      lifetime: 180
  - type: HereticAction
    requireMagicItem: true
  - type: Tag
    tags:
    - ShadowCloakAction

- type: entity
  parent: BaseAction
  id: ActionHereticShapeshift
  name: "Зміна форми"
  description: "Закляття, що дозволяє прийняти обличчя іншої істоти, отримавши її здібності."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: shapeshift
  - type: InstantAction
    event: !type:EventHereticShapeshift
  - type: ShapeshiftAction
    polymorphs:
    - ShapeshiftMouse
    - ShapeshiftHonkBot
    - ShapeshiftAdultSlimesBlue
    - ShapeshiftBat
    - ShapeshiftMothroach
    - ShapeshiftCrab
    - ShapeshiftGoose
    - ShapeshiftLizard
    - ShapeshiftParrot
    - ShapeshiftGiantSpider
    - ShapeshiftFox
    - ShapeshiftCorgi
    - ShapeshiftCat
    - ShapeshiftHamster
    - ShapeshiftCarp
    - ShapeshiftBingle
    - ShapeshiftLaserRaptor
  - type: UserInterface
    interfaces:
      enum.HereticShapeshiftUiKey.Key:
        type: HereticShapeshiftBoundUserInterface

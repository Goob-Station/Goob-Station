- type: entity
  parent: BaseAction
  id: ActionModSuitActivate
  name: Toggle MOD activation
  description: Seal or unseal your MODsuit. All parts must be deployed first.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Actions/modsuit.rsi
      state: activate
  - type: InstantAction
    event: !type:ModSuitActivateActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSuitDeploy
  name: Deploy MOD parts
  description: Deploy or retract every part of your MODsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModSuitDeployActionEvent

- type: entity
  parent: BaseAction
  id: ActionModModule
  name: Use MOD module
  description: Use or toggle this MODsuit module.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModModuleActionEvent

- type: entity
  parent: BaseAction
  id: ActionModPowerKick
  name: Power kick
  description: Launch yourself at a target with a devastating kick.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 7
  - type: EntityTargetAction
    canTargetSelf: false
  - type: WorldTargetAction
    event: !type:ModPowerKickActionEvent

- type: entity
  parent: BaseAction
  id: ActionModHydraulicLaunch
  name: Hydraulic launch
  description: Charge the hydraulic arms and launch yourself at a target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 10
  - type: EntityTargetAction
    canTargetSelf: false
  - type: WorldTargetAction
    event: !type:ModPowerKickActionEvent

- type: entity
  parent: BaseAction
  id: ActionModMagnet
  name: Hydraulic magnet
  description: Pull a crate or locker to you, or fling the one you're dragging at a target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 7
  - type: WorldTargetAction
    event: !type:ModMagnetActionEvent

- type: entity
  parent: BaseAction
  id: ActionModRecyclerUnload
  name: Unload recycler
  description: Dump everything the recycler has collected at your feet.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:ModRecyclerUnloadActionEvent

- type: entity
  parent: BaseAction
  id: ActionModShootingMode
  name: Cycle shooting mode
  description: Switch the shooting assistant between off, stormtrooper and sharpshooter modes.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:ModShootingModeActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSelectDevice
  name: Select module tool
  description: Choose which tool this MOD module deploys.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:ModSelectDeviceActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSphereMissiles
  name: Launch micromissiles
  description: Fire a volley of mining micromissiles at the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Goobstation/Objects/Specific/Robotics/mod_modules.rsi
      state: mine_missile
    useDelay: 3
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 8
  - type: WorldTargetAction
    event: !type:ModSphereMissileActionEvent


- type: entity
  parent: BaseAction
  id: ActionActivateProjector
  name: Toggle Clone
  description: Generates or dissipates your connected gemini.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: default
  - type: InstantAction
    event: !type:CloneProjectorActivatedEvent {}

- type: entity
  parent: BaseAction
  id: ActionHailer
  name: Hail
  description: Audibly hail nearby crew, useful for giving quick orders.
  components:
  - type: Action
    icon: { sprite: Clothing/Mask/gassecurity.rsi, state: icon }
  - type: InstantAction
    event: !type:HailerActionEvent

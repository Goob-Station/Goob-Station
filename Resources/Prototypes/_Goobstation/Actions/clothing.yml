- type: entity
  parent: BaseAction
  id: ActionModSuitActivate
  name: Toggle MOD activation
  description: Seal or unseal your MODsuit. All parts must be deployed first.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Actions/modsuit.rsi
      state: activate
  - type: InstantAction
    event: !type:ModSuitActivateActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSuitDeploy
  name: Deploy MOD parts
  description: Deploy or retract every part of your MODsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModSuitDeployActionEvent

- type: entity
  parent: BaseAction
  id: ActionModModule
  name: Use MOD module
  description: Use or toggle this MODsuit module.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModModuleActionEvent


- type: entity
  parent: BaseAction
  id: ActionActivateProjector
  name: Toggle Clone
  description: Generates or dissipates your connected gemini.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: default
  - type: InstantAction
    event: !type:CloneProjectorActivatedEvent {}

- type: entity
  parent: BaseAction
  id: ActionHailer
  name: Hail
  description: Audibly hail nearby crew, useful for giving quick orders.
  components:
  - type: Action
    icon: { sprite: Clothing/Mask/gassecurity.rsi, state: icon }
  - type: InstantAction
    event: !type:HailerActionEvent

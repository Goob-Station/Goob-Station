- type: entity
  id: CrateArmoryCombatHardsuit
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: Combat hardsuit crate
  description: Contains an advanced security hardsuit. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: ClothingOuterHardsuitCombatOfficer
        amount: 1

- type: entity
  id: CrateArmoryCombatMedicalHardsuit
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: Combat medical hardsuit crate
  description:  Contains an advanced medical security hardsuit, less defence but much less cumbersome. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: ClothingOuterHardsuitCombatMedical
        amount: 1

- type: entity
  id: CrateArmoryCombatRiotHardsuit
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: Riot hardsuit crate
  description: Contains an advanced riot security hardsuit, very high defence but much also very cumbersome. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: ClothingOuterHardsuitCombatRiot
        amount: 1

- type: entity
  id: CrateSpearBundle
  parent: CrateGenericSteel
  name: bundle of spears crate
  description: Contains 4 spear and a reinforced spear, for all your tribesmen needs.
  components:
  - type: StorageFill
    contents:
      - id: SpearReinforced
      - id: Spear
        amount: 4

- type: entity
  id: CrateHunterArcher
  parent: CrateGenericSteel
  name: archer kit crate
  description: Contains a shortbow, some arrows and a quiver.
  components:
  - type: StorageFill
    contents:
      - id: BowImprovised
      - id: ArrowRegular
        amount: 10
      - id: ClothingBeltQuiver

- type: entity
  id: CrateCombatKnives
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: combat knife crate
  description: Contains a combat knife.
  components:
  - type: StorageFill
    contents:
      - id: CombatKnife
        amount: 6

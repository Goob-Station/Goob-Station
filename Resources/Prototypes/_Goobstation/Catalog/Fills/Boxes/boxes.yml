- type: entity
  name: "пакунок зворотної ведмежої пастки"
  parent: BoxCardboard
  id: BoxReverseBearTrap
  description: "Коробка, повна абсолютно легальних речей."
  components:
  - type: StorageFill
    contents:
      - id: ReverseBearTrap
        amount: 1
      - id: ReverseBearTrapKey
        amount: 1
  - type: Sprite
    sprite: _Goobstation/Objects/Storage/boxes.rsi

- type: entity
  name: "коробка бойових ін'єкторів"
  parent: BoxCardboard
  id: BoxCombatInjector
  suffix: DO NOT MAP
  description: "Коробка з бойовим ін'єктором та кількома лікувальними хімікатами."
  components:
  - type: StorageFill
    contents:
      - id: CombatInjector
        amount: 1
      - id: TirimolChemistryVial
        amount: 1
      - id: OmnizineChemistryVial
        amount: 1
      - id: SyriniverChemistryVial
        amount: 1
      - id: ProcenylLazideChemistryVial
        amount: 1
      - id: EbifinlLazideChemistryVial
        amount: 1
  - type: Sprite
    sprite: _Goobstation/Objects/Storage/boxes.rsi

- type: entity
  name: "коробка картриджів для автоін'єктора"
  parent: BoxCardboard
  id: BoxAutoinjectorCartidges
  description: "Коробка з картриджами для автоін'єктора."
  components:
  - type: StorageFill
    contents:
    - id: CartridgeSaline
      amount: 3
    - id: CartridgeBicaridine
      amount: 3
    - id: CartridgeDermaline
      amount: 3
  - type: Sprite
    sprite: _Goobstation/Objects/Storage/boxes.rsi

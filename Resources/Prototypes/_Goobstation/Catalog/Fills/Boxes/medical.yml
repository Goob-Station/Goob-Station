- type: entity
  name: "шприц-бокс pax"
  parent: BoxCardboard
  id: BoxSyringePax
  description: "Коробка, повна шприців із транквілізаторами."
  components:
  - type: StorageFill
    contents:
      - id: SyringePax
        amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: syringe

- type: entity
  name: "коробка шприців з отрутою"
  parent: BoxCardboard
  id: BoxSyringePoison
  description: "Коробка, повна шприців з отрутою швидкої дії."
  components:
  - type: StorageFill
    contents:
    - id: SyringePoisonCentcomm
      amount: 6
  - type: Sprite
    layers:
    - state: box
    - state: syringe

# If changing heretic ascensions cinematics make sure they still line up with the actual ascension audio.

- type: cinematic
  id: HereticAscensionAsh # 15.5s
  addComp:
  - type: CinematicLetterbox
    fraction: 0.16
    color: "#0a0302"
  - type: CinematicZoom
    zoomFactor: 0.6
  - type: CinematicPressure
    shockTime: 12
    shockDuration: 1.2
    color: "#ff7b24"
  - type: CinematicShake
    amplitude: 0.035
  segments:
  - duration: 4
    sound:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_ash.ogg
    addComp:
    - type: CinematicCaption
      fontPath: /Fonts/_Goobstation/PirataOne/PirataOne-Regular.ttf
      textSound:
        collection: HereticScriptWhispers
        params:
          volume: -4
      shake: 1.5
      text: heretic-cinematic-ash-1
      showSubject: true
      writeTime: 1.8
      verticalPosition: 0.62
      fontSize: 46
      maxWidthFraction: 0.72
      textColor: "#100401"
      hotColor: "#fff1cf"
      midColor: "#ff9126"
      deepColor: "#7a1d05"

# Defines the pool from which each new combat-music playback randomly selects one track.
- type: soundCollection
  # Gives client code a stable name for this configurable collection.
  id: CombatMusic
  # Add or remove attributed music paths here to change the available combat tracks.
  files:
    - /Audio/_Goobstation/Music/running_in.ogg
    - /Audio/_Goobstation/Music/Black_Swarm.ogg
    - /Audio/_Goobstation/Music/Colonial_Marines_The_Final_Battle.ogg

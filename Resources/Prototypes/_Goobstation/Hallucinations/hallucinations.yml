# Status effect

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectHallucinating
  name: hallucinating
  categories: [ HideSpawnMenu ]
  components:
  - type: Hallucinating

# Base

- type: entity
  id: BaseMobHallucination
  abstract: true
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Clickable
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: StandingState
  - type: Appearance
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: TimedDespawn
    lifetime: 10

- type: entity
  parent: BaseMobHallucination
  id: MobHallucinationSpider
  name: tarantula
  suffix: Hallucination
  description: Widely recognized to be the literal worst thing in existence.
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: tarantula
      sprite: Mobs/Animals/spider.rsi
  - type: SpriteMovement
    movementLayers:
      movement:
        state: tarantula-moving
    noMovementLayers:
      movement:
        state: tarantula

- type: entity
  parent: BaseMobHallucination
  id: MobHallucinationClownSpider
  name: clown spider
  suffix: Hallucination
  description: Combines the two most terrifying things in existence, spiders and clowns.
  components:

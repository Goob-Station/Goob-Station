- type: entity
  id: EmpPulse
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Effects/emp.rsi
      state: emp_pulse
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer
  - type: EmpOnTrigger
    range: 5
    energyConsumption: 50
    disableDuration: 5
  - type: TriggerOnSpawn

- type: entity
  parent: FoodApple
  id: FoodDeliciousApple
  name: delicious looking apple
  description: It's a delicious piece of Eden.
  components:
  - type: Produce
    seedId: deliciousApple
  - type: Tag
    tags:
    - Fruit
    - DeliciousLookingApple

- type: entity
  parent: FoodApple
  id: FoodMethApple
  name: meth apple
  description: It's a meth up'ed piece of Eden.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/meth_apple.rsi
  - type: Produce
    seedId: MethApple
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 14
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 4
        - ReagentId: Desoxyephedrine
          Quantity: 5
  - type: Tag
    tags:
    - Fruit
    - MethApple

- type: entity

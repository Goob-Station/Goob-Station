- type: entity
  parent: FoodProduceBase
  id: FoodSynthMeat
  name: synthmeat
  description: Synthetic meat grown in hydroponics.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/synthmeat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Synthflesh
          Quantity: 10
  - type: Produce
    seedId: SynthMeat
  - type: Tag
    tags:

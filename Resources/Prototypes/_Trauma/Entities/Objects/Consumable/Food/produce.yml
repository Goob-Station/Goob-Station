- type: entity
  parent: FoodProduceBase
  id: MelonBalloon
  name: melon balloon
  description: Who knew that melons could fly!
  components:
  - type: Sprite
    state: icon
    sprite: _Trauma/Objects/Fun/balloons/red_balloon.rsi
  - type: Produce
    seedId: BalloonWatermelon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/BalloonEffect/balloon_pop.ogg
          params:
            variation: 0.125
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpillBehavior
        solution: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 75
  - type: Tag
    tags:
    - BalloonMelon

- type: entity
  parent: ProduceBase
  id: SteelWheatBushel
  name: steel wheat bushel
  description: Sigh... steel wheat... a-grain?
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/steel_wheat.rsi
  - type: Produce
    seedId: SteelWheat
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Lead
          Quantity: 0.1
        - ReagentId: Iron
          Quantity: 2
  - type: Tag
    tags:
    - Wheat
    - SteelWheat

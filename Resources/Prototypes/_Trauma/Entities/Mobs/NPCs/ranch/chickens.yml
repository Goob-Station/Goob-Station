- type: entity
  abstract: true
  parent: SimpleMobBase
  id: BaseMobChickRanch
  name: chicken
  description: Comes before an egg, and IS a dinosaur!
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Ranch/chicken-white.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: chick-white
  - type: AnimalAgeing
  - type: DamageStateVisuals
    states:
      Alive:
        Base: chick-white
      Critical:
        Base: chick-white-dead
      Dead:
        Base: chick-white-dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 8
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Speech
    speechVerb: SmallMob
    speechSounds: Cluck
  - type: Tag
    tags:
    - DoorBumpOpener
    - Chicken
    - VimPilot
  - type: Appearance
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 1
  - type: InteractionPopup
    successChance: 0.8
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/chicken_cluck_happy.ogg
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 100
  - type: ExaminableHunger

- type: entity
  abstract: true
  parent: BaseMobChickRanch
  id: BaseMobRoosterRanch
  components:
  - type: MostRecentlyEatenFoodTags
  - type: Happiness
  - type: Sprite
    sprite: _Trauma/Mobs/Ranch/chicken-white.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: rooster-white
  - type: DamageStateVisuals
    states:
      Alive:
        Base: rooster-white
      Critical:
        Base: rooster-white-dead
      Dead:
        Base: rooster-white-dead

- type: entity
  abstract: true
  parent: BaseMobRoosterRanch
  id: BaseMobHenRanch
  components:
  - type: RanchingEggLayer
  - type: MostRecentlyEatenFoodTags
  - type: Happiness
  - type: Sprite
    sprite: _Trauma/Mobs/Ranch/chicken-white.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: hen-white
  - type: DamageStateVisuals
    states:
      Alive:
        Base: hen-white
      Critical:
        Base: hen-white-dead
      Dead:
        Base: hen-white-dead

# The Chicks

- type: entity
  parent: BaseMobChickRanch
  id: MobChickWhite
  components:
  - type: SpawnEntityOnAgeUp
    entToSpawn: MobWhiteChicken

- type: entity
  parent: BaseMobChickRanch
  id: MobChickSilkie
  components:
  - type: SpawnEntityOnAgeUp
    entToSpawn: MobSilkieChicken
  - type: Sprite
    sprite: _Trauma/Mobs/Ranch/chicken-silkie.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: chick-silkie
  - type: DamageStateVisuals
    states:
      Alive:
        Base: chick-silkie
      Critical:
        Base: chick-silkie-dead
      Dead:
        Base: chick-silkie-dead


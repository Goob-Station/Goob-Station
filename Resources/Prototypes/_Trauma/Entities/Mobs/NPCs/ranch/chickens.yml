# Glass chicken

- type: entity
  abstract: true
  id: GlassChickenBase
  description: Looks very fragile...
  components:
  - type: DealDamageOnPulled
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: grabbed-shatter-popup
        popupType: LargeCaution
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior
        solution: bloodstream
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: [GlassChickenBase, BaseMobChickRanch]
  id: MobChickGlass
  name: glass chick
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Ranch/chicken-glass.rsi

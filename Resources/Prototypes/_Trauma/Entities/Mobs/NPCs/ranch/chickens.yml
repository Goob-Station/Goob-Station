# Clown

- type: entity
  abstract: true
  id: BaseChickenClown
  components:
  - type: InteractionPopup
    successChance: 0.8
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Items/Toys/pushHornHonk.ogg
  - type: MeleeWeapon
    soundHit:
      collection: BikeHorn
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
  - type: SpamEmitSound
    minInterval: 2
    maxInterval: 12
    sound:
      collection: BikeHorn
      params:
        variation: 0.125

- type: entity
  parent: [BaseChickenClown, BaseMobChickRanch]

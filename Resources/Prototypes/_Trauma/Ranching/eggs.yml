    sprite: _Trauma/Objects/Misc/eggs.rsi
    state: egg-pigeon
  - type: TimedReplace
    entity: MobChickPigeon
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Handheld
  - type: ListenBlacklist
    blacklist:
      components:
      - Advertise
  - type: Speech
    speechVerb: Robotic
  - type: EntityEffectOnEaten
    effects:
    - !type:AddComponents
      components:
      - type: TelecomExempt
      - type: IntrinsicRadioReceiver
      - type: ActiveRadio
        channels:
        - EggRadio
  - type: Tag
    tags:
    - Radio


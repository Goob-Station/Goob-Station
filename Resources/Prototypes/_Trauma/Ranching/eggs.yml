- type: entity
  id: BalloonEggSpawner
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: SpawnEntityTableOnTrigger
    table: !type:GroupSelector
      children:
      - id: BalloonEggBlue
      - id: BalloonEggRed

- type: entity
  parent: BaseRanchingEgg
  id: BalloonEggBlue
  suffix: Blue, Oxygen
  components:
  - type: Sprite
    state: egg-balloon-blue
  - type: TimedReplace
    entity: MobChickBalloon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpawnGasBehavior
        gasMixture:
          moles:
            Oxygen: 100
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BalloonEggBlue
  id: BalloonEggRed
  suffix: Red, Plasma
  components:
  - type: Sprite
    state: egg-balloon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpawnGasBehavior
        gasMixture:
          moles:
            Plasma: 100
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


- type: entity
  abstract: true
  parent: FoodEggBase
  id: BaseRanchingEgg
  name: egg
  components:
  - type: Perishable
    rotAfter: 99999999 # For my birthday wish I wish to remove rotting
    molsPerSecondPerUnitMass: 0
  - type: RotInto
    entity: Eggshells
    stage: 1
  - type: Sprite
    sprite: _Trauma/Objects/Misc/eggs.rsi
    state: egg-white
  - type: EggFertilizationTarget
  - type: TimedReplace
    entity: MobChickWhite
  - type: BadFood

- type: entity
  parent: BaseRanchingEgg
  id: WhiteEgg
  suffix: White

- type: entity
  parent: BaseRanchingEgg

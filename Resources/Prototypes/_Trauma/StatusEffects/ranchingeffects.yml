- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectShink
  name: shrunk
  components:
  - type: ShrunkStatusEffect

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectDamageMod
  name: damage mod changed
  components:
  - type: ChangeDamageModiferSetStatusEffect

- type: entity
  parent: StatusEffectDamageMod
  id: StatusEffectDamageModKnightEgg
  components:
  - type: ChangeDamageModiferSetStatusEffect
    damageModifierSet: KnightChickenEffect

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectDreamEgg
  name: dream egg effect
  components:
  - type: StunnedStatusEffect
  - type: StatusEffectAlert
    alert: Stun
  - type: KnockdownStatusEffect
  - type: StatusEffectEffects
    effects:
    - !type:HealthChange
      damage:
        types:
          Asphyxiation: -5
          Blunt: -5
          Heat: -5
          Piercing: -5
          Slash: -5
          Cold: -5
          Radiation: -2
          Poison: -2
      useTargeting: false

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectCockatricePower
  name: cockatrice egg effect
  components:
  - type: TemporaryActionGrantEffect
    actionPrototypes:
    - CockatricePowerAction

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectMedusa
  name: Turned into stone
  components:
  - type: StunnedStatusEffect
  - type: AddShaderStatusEffect
    shader: Greyscale
  - type: StatusEffectEffectsApply
    effectsOnApply:
    - !type:PopupMessage
      visualType: LargeCaution
      type: Local
      messages:
      - medusa-popup
    - !type:PlaySoundEffect
      sound: /Audio/Effects/break_stone.ogg

- type: entity
  parent: MobStatusEffectDebuff
  id: SnowEggEffect
  name: Snow trail!
  components:
  - type: Trail
    color: "#ffffff"
    lifetime: 1
    sprite:
      sprite: /Textures/_Trauma/Objects/Specific/egg-snow-effect
      state: icon
  - type: StatusEffectEffects
    effects:
    - !type:SpawnEntity
      entity: WallRockSnow
    - !type:HealthChange
      damage:
        types:
          Cold: -5
      useTargeting: false

- type: entity
  parent: MobStatusEffectBase
  id: DreamsicleEggEffect
  name: Orange Dreamsicle High
  components:
  - type: TemporaryActionGrantEffect
    actionPrototypes:
    - ActionDashMoth
  - type: StatusEffectEffects
    effects:
    - !type:Jitter
    - !type:MovementSpeedModifier
      walkSpeedModifier: 4
      sprintSpeedModifier: 4


- type: entity
  parent: MobStatusEffectBase
  id: SnowEggEffectNoDamage
  name: Snow trail!
  components:
  - type: Trail
    color: "#ffffff"
    lifetime: 5
    frequency: 0.05
    sprite:
      sprite: /Textures/_Trauma/Objects/Specific/egg-snow-effect
      state: icon

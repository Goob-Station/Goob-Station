- type: entity
  parent: BaseAction
  id: CockatricePowerAction
  name: Cockatrice's power
  description: The Cockatrice's egg has given you the power to turn people into stone statues!
  components:
  - type: Action
    raiseOnAction: true
    useDelay: 10
    icon:
      sprite: _Trauma/Actions/ranching.rsi
      state: cockatrice
  - type: TargetAction
    interactOnMiss: false
    range: 4
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidProfile
    canTargetSelf: false
    event: !type:EffectTargetActionEvent
  - type: EffectAction
    onPerformed: false
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectMedusa
      time: 15
      type: Add

- type: entity
  parent: BaseAction
  id: ZappyPowerAction
  name: Zappy's power
  description: The Zappy's egg has given you the power to summon clouds of thunder!
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: _Trauma/Mobs/Ranch/chicken-zappy.rsi
      state: rooster
    itemIconStyle: BigAction
    raiseOnAction: true
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:SpawnRandomEntities
      entity: ThunderCloud
      number: 3

- type: entity
  parent: BaseAction
  id: ActionFireballPhoenix
  name: Phoenix Fireball
  description: Fires an explosive fireball towards the clicked location.
  components:
  - type: Sprite
    sprite: _Goobstation/Wizard/actions.rsi
    state: fireball
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: _Goobstation/Wizard/actions.rsi
      state: fireball
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFireball
      projectileSpeed: 20
  - type: SpeakOnAction
    sentence: action-speech-spell-fireball-phoenix

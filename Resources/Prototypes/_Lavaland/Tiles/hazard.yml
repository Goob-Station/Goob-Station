# Because the OG sprite has iconsmoothing and planet tiles on the sprites.
- type: entity
  id: FloorLiquidPlasmaEntityFull
  name: liquid plasma
  description: Sweet, expensive nectar. Don't consume.
  suffix: Full
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#974988"
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
    triggerGroups:
      types:
      - Lava
  - type: TileEntityEffect
    effects:
    - !type:FlammableReaction
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
  - type: FishingSpot
    fishList: !type:NestedSelector
      tableId: PlasmaFishingLootTable
    fishDefaultTimer: 25.0
    fishTimerVariety: 15.0
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: _Lavaland/Tiles/Planet/Hazard.rsi
    drawdepth: BelowFloor
    layers:
    - state: plasma
      shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
  - type: Tag
    tags:
    - HideContextMenu
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: FloorCosmicDecay

- type: entity
  id: FloorLavaEntityFull
  name: lava
  description: Don't jump in. It's not worth it, no matter how funny it is.
  suffix: Full
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#FF4500"
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
    triggerGroups:
      types:
        - Lava
  - type: TileEntityEffect
    effects:
    - !type:FlammableReaction
      multiplier: 2.5 # Lavaland Change
      multiplierOnExisting: 0.75
    - !type:Ignite
    - !type:AdjustTemperature
      amount: 10000 # thermal energy, not temperature!
    - !type:MovespeedModifier
      walkSpeedModifier: 0.6
      sprintSpeedModifier: 0.6
  - type: FishingSpot
    fishList: !type:NestedSelector
      tableId: LavaFishingLootTable
    fishDefaultTimer: 25.0
    fishTimerVariety: 15.0
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/Planet/lava.rsi
    drawdepth: BelowFloor
    layers:
      - state: lava
        shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
  - type: Tag
    tags:
      - HideContextMenu
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: FloorCosmicDecay

# Hierophant club
- type: entity
  id: ActionHierophantClubTileMovement
  name: "Прокляття руху по клітинках"
  description: "Змушує ціль пересуватися лише по клітинках."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -23
    useDelay: 30
    icon:
      sprite: /Textures/_Lavaland/Interface/Alerts/hierophantbeat.rsi
      state: hierophant
    itemIconStyle: NoItem
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    event: !type:ToggleTileMovementActionEvent

- type: entity
  id: ActionHierophantClubBlink
  parent: ActionBaseHierophant
  name: "Блінк"
  description: "Телепортує вас у будь-яку точку, куди ви можете фізично дістатися."
  components:
  - type: Action
    raiseOnUser: true
    priority: -24
    useDelay: 10
    icon:
      sprite: _Lavaland/Objects/Weapons/hierophant_club.rsi
      state: icon
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

- type: reagent
  id: MinersSalve
  name: reagent-name-minerssalve
  group: Medicine
  desc: reagent-desc-minerssalve
  physicalDesc: reagent-physical-desc-shiny
  flavor: metallic
  color: "#f2c777"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: -1.5
            Slash: -1.5
            Piercing: -1.5
            Heat: -2
            Shock: -0.5
            Asphyxiation: -1
            Bloodloss: -1
        conditions:
        - !type:ReagentThresholdCondition
          max: 21
        - !type:PressureThresholdCondition
          min: 20
          max: 50
          worksOnLavaland: true


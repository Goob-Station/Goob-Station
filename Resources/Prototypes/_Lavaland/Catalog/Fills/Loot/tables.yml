- type: entityTable
  id: LootCommon
  table: !type:AllSelector
    children:
    # Food
    - !type:NestedSelector
      tableId: LootFoodCommonMRE
      prob: 1.0
    - !type:NestedSelector
      tableId: LootFoodCommonDrink
      prob: 1.0
    - !type:NestedSelector
      tableId: LootFoodCommonMisc
      prob: 0.8
    # Utility
    - !type:NestedSelector
      tableId: LootUtilityCommonTools
      prob: 0.8
    - !type:NestedSelector
      tableId: LootUtilityCommonMisc
      prob: 0.8
    # Medicine
    - !type:NestedSelector
      tableId: LootMedicineCommonTopicals
      prob: 0.5
    - !type:NestedSelector
      tableId: LootMedicineCommonChemicals
      prob: 0.2
    # Junk
    - !type:NestedSelector
      tableId: LootJunkCommonMisc
      prob: 0.4
    # Misc
    - !type:NestedSelector
      tableId: LootMiscCommonValuables
      prob: 0.6
    # Weapons
    - !type:NestedSelector
      tableId: MetalShelfCommonGunWeapons
      prob: 0.1
    # Ammo
    - !type:NestedSelector
      tableId: MetalShelfCommonAmmo
      prob: 0.25
    # Materials
    - !type:NestedSelector
      tableId: MetalShelfCommonMaterial
      prob: 1


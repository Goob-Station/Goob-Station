# 300
- type: entity
  parent: CrateMaterialGlass
  id: CrateMaterialGlass300
  name: large glass sheet crate
  description: 300 sheets of glass, packed with care.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: SheetGlass
        amount: 10

- type: entity

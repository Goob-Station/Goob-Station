        amount: 10

- type: entity
  parent: CrateMaterialTextiles
  id: CrateMaterialTextiles300
  name: large textiles crate
  description: 200 pieces of cloth and 100 pieces of durathread.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MaterialCloth
          amount: 20
        - id: MaterialDurathread
          amount: 10


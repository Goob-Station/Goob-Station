- type: entity
  id: ShuttleGunKineticAuto
  parent: [ ShuttleGunBase, ConstructibleMachine ]
  name: PTK-800 "Matter Dematerializer"
  description: Salvage stationary mining turret. Gradually accumulates charges on its own, extremely effective for asteroid excavation.
  suffix: Auto
  categories: [ Spawner ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shuttles/kinetic.rsi
    layers:
    - state: ptk-800
    - state: mag-7
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      upgrade_slot_1: !type:ContainerSlot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 25
    fireRate: 1
    selectedMode: SemiAuto
    angleDecay: 45
    minAngle: 5
    maxAngle: 15
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
      params:
        variation: 0.12
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        pitch: 1.2
        variation: 0.08
  - type: BasicEntityAmmoProvider
    proto: BulletKineticShuttle
    capacity: 5
    count: 5
  - type: Machine
    board: ShuttleGunKineticCircuitboard
  - type: PressureDamageChange
    lowerBound: 0
  - type: ItemUpgradeable
  - type: ItemSlots
    slots:
      upgrade_slot_1:
        name: weapon-upgrade-slot-name-first
        swap: false
        priority: 1
        insertDelay: 1.2
        ejectDelay: 0.9
        whitelist:
          tags:
          - PKAUpgrade
  - type: AutoShootGun
    enabled: true

- type: entity
  name: infinite power cell
  description: A small cell that self recharges.
  id: DebugPowerCellAntiqueProtoInfinite
  suffix: DO NOT MAP
  parent: BasePowerCell
  components:
    - type: Sprite
      layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: antique
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
    - type: Battery
      maxCharge: 9999
      startingCharge: 9999
    - type: BatterySelfRecharger
      autoRechargeRate: 9999
    - type: BatteryAmmoProvider
      proto: RedLaser
      fireCost: 75 # 16 shots

- type: entity
  id: GrenadeFragSelfDespawn # To avoid entity clutter on self recharge turrets
  parent: GrenadeFrag
  components:
  - type: TimedDespawn
    lifetime: 10

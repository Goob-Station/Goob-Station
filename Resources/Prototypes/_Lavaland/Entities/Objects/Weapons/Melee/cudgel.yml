- type: entity
  abstract: true
  name: base cudgel
  parent: [ BaseItem, BaseMinorContraband ]
  id: WeaponCudgelBase
  description: A piece of wood sharpened for easier grip. A primitive hunters favorite, perfect for barbaric destruction!
  components:
  - type: MeleeWeapon
    animationRotation: -135
    heavyStaminaCost: 15
    wideAnimationRotation: -135
    attackRate: 0.8
  - type: StaminaDamageOnHit
    damage: 10
  - type: Wieldable
  - type: Item
    size: Large
    shape:
    - 0,0,0,3
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.6 # a bit unwieldly but does the job
  - type: Clothing
    sprite: _Lavaland/Objects/Weapons/Melee/cudgel.rsi
    quickEquip: false
    slots:
    - belt
  - type: UndetectableContraband
  - type: Tag
    tags:
    - WoodCudgel

- type: entity
  name: wood cudgel
  parent: WeaponCudgelBase
  id: WeaponCudgelWood
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Melee/cudgel.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 9
        Structural: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 4
        Structural: 15
  - type: Item
    storedSprite:
      state: world_icon
      sprite: _Lavaland/Objects/Weapons/Melee/cudgel.rsi
  - type: Clothing
    sprite: _Lavaland/Objects/Weapons/Melee/cudgel.rsi
  - type: PhysicalComposition
    materialComposition:
      Wood: 300
  - type: Construction
    graph: WoodenCudgel
    node: cudgel

- type: entity
  name: ashwood cudgel
  parent: WeaponCudgelBase
  id: WeaponCudgelAshwood
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Melee/ashwood_cudgel.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
        Structural: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 6
        Structural: 15
  - type: Item
    storedRotation: 90
    storedSprite:
      state: world_icon
      sprite: _Lavaland/Objects/Weapons/Melee/ashwood_cudgel.rsi
  - type: Clothing
    sprite: _Lavaland/Objects/Weapons/Melee/ashwood_cudgel.rsi
  - type: PhysicalComposition
    materialComposition:
      Ashwood: 300
  - type: Construction
    graph: WoodenCudgel
    node: cudgel

- type: entity
  name: incomplete wooden cudgel
  parent: [ BaseItem, BaseMinorContraband ]
  id: IncompleteWoodCudgel
  description: A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: WoodenCudgel
    node: incompleteCudgel

- type: entity
  name: incomplete ashwood cudgel
  parent: [ BaseItem, BaseMinorContraband ]
  id: IncompleteAshwoodCudgel
  description: A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: AshwoodCudgel
    node: incompleteCudgel

- type: Tag
  id: WoodCudgel
 
- type: entity
  name: ice cudgel
  parent: WeaponCudgelBase
  id: WeaponCudgelIce
  description: A wood cudgel wrapped in brullbar fur. It's freezing to the touch.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/ice_club.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 9
        Structural: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 4
        Structural: 15
  - type: ChangeTemperatureOnHit
    heat: -100000 # Genuinely no clue why this number needs to be so high, it just doesn't work otherwise.
  - type: Item
    storedSprite:
      state: world-icon
      sprite: _Goobstation/Objects/Weapons/Melee/ice_club.rsi
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/ice_club.rsi
  - type: Construction
    graph: IceCudgel
    node: icecudgel
 
- type: entity
  name: flesh cudgel
  parent: WeaponCudgelBase
  id: WeaponCudgelFlesh
  description: A wood cudgel caked in rotten meat. The smell alone is a weapon.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/flesh_club.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 9
        Structural: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 4
        Structural: 15
  - type: VomitOnHit
    chance: 0.15
  - type: Item
    storedSprite:
      state: world-icon
      sprite: _Goobstation/Objects/Weapons/Melee/flesh_club.rsi
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/flesh_club.rsi
  - type: Construction
    graph: FleshCudgel
    node: fleshcudgel
 
- type: constructionGraph
  id: IceCudgel
  start: start
  graph:
  - node: start
    edges:
    - to: icecudgel
      steps:
      - tag: WoodCudgel
        name: construction-step-wood-cudgel
        icon:
          sprite: _Lavaland/Objects/Weapons/Melee/cudgel.rsi
          state: icon
        doAfter: 1
      - material: BrullbarFur
        amount: 3
        doAfter: 3
  - node: icecudgel
    entity: WeaponCudgelIce
 
- type: constructionGraph
  id: FleshCudgel
  start: start
  graph:
  - node: start
    edges:
    - to: fleshcudgel
      steps:
      - tag: WoodCudgel
        name: construction-step-wood-cudgel
        icon:
          sprite: _Lavaland/Objects/Weapons/Melee/cudgel.rsi
          state: icon
        doAfter: 1
      - tag: Meat
        name: construction-step-flesh-cudgel-meat
        doAfter: 3
  - node: fleshcudgel
    entity: WeaponCudgelFlesh
 
- type: construction
  id: IceCudgel
  graph: IceCudgel
  startNode: start
  targetNode: icecudgel
  category: construction-category-weapons
  objectType: Item
  description: construction-recipe-ice-cudgel
 
- type: construction
  id: FleshCudgel
  graph: FleshCudgel
  startNode: start
  targetNode: fleshcudgel
  category: construction-category-weapons
  objectType: Item
  description: construction-recipe-flesh-cudgel

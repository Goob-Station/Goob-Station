######################### Construction graphs #########################################

- type: construction
  id: MercuryRailgun
  graph: MercuryRailgun
  startNode: start
  targetNode: WeaponMercuryRailgun
  category: construction-category-weapons
  objectType: Item

- type: constructionGraph
  id: MercuryRailgun
  start: start
  graph:
    - node: start
      edges:
        - to: WeaponMercuryRailgun
          steps:
            - tag: MegafaunaMercuryCore
              name: Core of Mercury
              icon:
                sprite: _Lavaland/Objects/Devices/mercury.rsi
                state: mercury_core
              doAfter: 5
            - material: ORTAlloy
              amount: 2
              doAfter: 5
    - node: WeaponMercuryRailgun
      entity: WeaponMercuryRailgun

- type: construction
  id: RadiantMODsuit
  graph: RadiantMODsuit
  startNode: start
  targetNode: ClothingModsuitORTRadiant
  category: construction-category-clothing

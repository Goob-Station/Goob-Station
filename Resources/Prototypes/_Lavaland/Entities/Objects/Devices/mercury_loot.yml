# Shield (1 alloy, 2 keratin)

- type: construction
  id: RadiantShield
  graph: RadiantShield
  startNode: start
  targetNode: RadiantEnergyShield
  category: construction-category-weapons
  objectType: Item

- type: constructionGraph

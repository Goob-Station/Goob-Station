######################### Construction graphs #########################################

# Canceller (4 keratin)

- type: construction
  id: ParadoxCanceller
  graph: ParadoxCanceller
  startNode: start
  targetNode: MegafaunaParadoxCanceller
  category: construction-category-utilities
  objectType: Item

- type: constructionGraph
  id: ParadoxCanceller
  start: start
  graph:
    - node: start
      edges:
        - to: MegafaunaParadoxCanceller
          steps:
            - material: ORTKeratin
              amount: 4
              doAfter: 6
    - node: MegafaunaParadoxCanceller
      entity: MegafaunaParadoxCanceller

# Ether drinker (4 keratin)

- type: construction
  id: EtherDrinker
  graph: EtherDrinker
  startNode: start
  targetNode: MegafaunaEtherDrinker
  category: construction-category-utilities

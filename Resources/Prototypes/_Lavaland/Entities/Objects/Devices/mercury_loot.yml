################################################################################################

- type: entity
  parent: BaseItem
  id: MegafaunaMercuryCore
  name: Core of Mercury
  description: Can be used to make highly advanced tools and weaponry. Alternatively, can be sold for a handsome sum.
  components:
  - type: PointLight
    radius: 2
    color: cyan
    energy: 1
  - type: Sprite
    sprite: _Lavaland/Objects/Devices/mercury.rsi
    state: mercury_core
  - type: Tag # I hate construction graphs
    tags:
    - MegafaunaMercuryCore

- type: entity
  parent: BaseItem
  id: MegafaunaEtherDrinker
  name: Ether Drinker
  description: 
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Devices/mercury.rsi
    state: ether_drinker

- type: entity
  parent: BaseItem
  id: MegafaunaParadoxCanceller
  name: Paradox Canceller
  description: A device that saves your point in time, then reverts you back to that point after a short delay, reverting any damage taken in that period.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Devices/mercury.rsi
    state: paradox_canceller
  - type: UseDelay
    delay: 60
  - type: ParadoxCanceller
    trail:
      - type: Trail
        color: "#ae00ffdd"
        scale: 0.9
        frequency: 0.1
        lifetime: 1
        lerpTime: 0.05
        alphaLerpAmount: 0.2
        scaleLerpAmount: 0.1
        shader: unshaded
        sprite:
          sprite: /Textures/Mobs/Aliens/paradox_clone.rsi
          state: paradox

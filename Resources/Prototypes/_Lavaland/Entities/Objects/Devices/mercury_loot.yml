# Railgun (1 alloy + core)

- type: construction
  id: MercuryRailgun
  graph: MercuryRailgun
  startNode: start
  targetNode: WeaponMercuryRailgun
  category: construction-category-weapons
  objectType: Item

- type: constructionGraph
  id: MercuryRailgun
  start: start
  graph:
    - node: start
      edges:
        - to: WeaponMercuryRailgun
          steps:
            - tag: MegafaunaMercuryCore
              name: mercury-core
              icon:
                sprite: _Lavaland/Objects/Devices/mercury.rsi
                state: mercury_core
              doAfter: 5
            - material: ORTAlloy
              amount: 1
              doAfter: 5
    - node: WeaponMercuryRailgun

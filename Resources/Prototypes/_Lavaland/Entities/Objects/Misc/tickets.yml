# Base

- type: entity
  parent: BaseItem
  id: BaseBunkerTicket
  name: kit coupon
  description: This ticket could be exchanged for special goods on the second floor of Bunker Alfa. Though, for now, it is worthless.
  abstract: true
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Lavaland/Objects/Misc/tickets.rsi
    state: ticket_green3
    layers:
    - state: ticket_green3
      map: ["base"]
  - type: Item
    sprite: _Lavaland/Objects/Misc/tickets.rsi
    size: Tiny

# Green

- type: entity
  parent: BaseBunkerTicket
  id: BunkerTicketGreen
  name: common kit coupon
  suffix: Full
  components:
  - type: StackPrice
    price: 100
  - type: Sprite
    sprite: _Lavaland/Objects/Misc/tickets.rsi
    state: ticket_green3
    layers:
    - state: ticket_green3
      map: ["base"]
  - type: Stack
    stackType: GreenCoupon
    count: 30
    baseLayer: base
    layerStates:
    - ticket_green
    - ticket_green2
    - ticket_green3

- type: entity
  parent: BunkerTicketGreen
  id: BunkerTicketGreen1
  suffix: One
  components:
  - type: Sprite
    state: ticket_green
  - type: Stack
    count: 1

- type: entity
  parent: BunkerTicketGreen

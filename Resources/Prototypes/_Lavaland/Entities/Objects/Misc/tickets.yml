- type: stack
  id: GreenCoupon
  name: stack-ticket-green
  icon: { sprite: /Textures/_Lavaland/Objects/Misc/tickets.rsi, state: ticket_green }
  spawn: BunkerTicketGreen

- type: stack
  id: OrangeCoupon
  name: stack-ticket-orange
  icon: { sprite: /Textures/_Lavaland/Objects/Misc/tickets.rsi, state: ticket_orange }

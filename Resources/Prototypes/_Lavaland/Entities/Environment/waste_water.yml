- type: entity
  id: EnvironmentalHazardFloorWasteWaterBase
  abstract: true
  name: waste water
  description: Looks like water but is as bad as they come. WILL KILL YOU! Don't step on it.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _Goobstation/Tiles/waste.rsi
    drawdepth: BelowFloor
    layers:
      - state: waste_water
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: TileEntityEffect
    effects:
    - !type:DamageTileEffect
      damage:
        types:
          Caustic: 40 # Basically they should die but they should be able to get the fuck out as a final chance.
          Genetic: 10

- type: entity
  id: EnvironmentalHazardFloorWasteWaterEntity
  parent: EnvironmentalHazardFloorWasteWaterBase
  suffix: Default
  components:
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    triggerGroups:
      types:
        - WasteWater
    blacklist:
      components:
        - Fauna

- type: entity
  id: EnvironmentalHazardFloorWasteWaterEntitySafe
  parent: EnvironmentalHazardFloorWasteWaterBase
  suffix: Catwalk-safe
  components:
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
      components:
        - Fauna
    triggerGroups:
      types:
        - WasteWater

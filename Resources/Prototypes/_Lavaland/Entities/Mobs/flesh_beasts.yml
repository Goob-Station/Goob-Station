- type: entity
  parent: [ LavalandMobBase, MobCombat ]
  id: BaseMobFleshBeast
  name: roaming flesh
  description: A creature created by military experiments gone awry. Not very fast.
  abstract: true
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: Tag
    tags:
    - Flesh
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Flesh/32x32.rsi
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.2
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: Stamina
    baseCritThreshold: 100
    animationThreshold: 25
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss:
          0.001
    bloodlossHealDamage:
      types:
        Bloodloss:
          -0.25
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 10 # To avoid blood floods.
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: FleshBeast
  - type: AutoEmote
    emotes:
    - FleshGrowling
  - type: Vocal
    sounds:
      Male: FleshSmall
      Female: FleshSmall
      Unsexed: FleshSmall
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 5
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Fauna # Lavaland Change

- type: entity
  parent: BaseMobFleshBeast
  id: MobFleshBiter
  categories: [ HideSpawnMenu ]
  components: 
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: biter # If someone ever sees this and is an artist, please draw a sprite that isn't just a spitter without its green pixels.
  - type: DamageStateVisuals
    states:
      Alive:
        Base: biter
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead

- type: entity
  parent: BaseMobFleshBeast
  id: MobFleshBiterSnow
  name: numb flesh
  description: Somehow, even slower than the regular biter, but takes less damage from conventional weapons.
  categories: [ HideSpawnMenu ]
  components: 
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: biter_snow # Same here
  - type: DamageStateVisuals
    states:
      Alive:
        Base: biter_snow
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcSmash
    damage:
      types:
        Piercing: 5
        Cold: 5
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ColdFauna


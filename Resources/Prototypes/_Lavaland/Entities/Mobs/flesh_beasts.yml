- type: entity
  parent: BaseMobFleshBeast
  id: MobFleshBloater
  name: bloated flesh
  description: Explodes into caustic gas if it gets near you.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bloated
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bloated
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      35: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.8
    baseSprintSpeed: 4.8
  - type: TriggerOnProximity
    mobState:
      - Alive
    whitelist:
      components:
      - Actor
    cooldown: 1
    requiresAnchored: false
    repeating: false
    triggerSpeed: 0.3
    shape:
      !type:PhysShapeCircle
      radius: 2
    layer:
    - MobMask
  - type: Body
    bodyType: Complex
    prototype: Monkey # What could it mean??
  - type: GibOnTrigger
  - type: SmokeOnTrigger
    duration: 2
    spreadAmount: 50
    solution:
      reagents:
        - ReagentId: Razorium
          Quantity: 15
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcSmash
    damage:
      types:
        Blunt: 10


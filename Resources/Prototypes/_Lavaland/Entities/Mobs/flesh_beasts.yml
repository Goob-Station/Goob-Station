    baseWalkSpeed: 1
    baseSprintSpeed: 1
    maxSpeedOverride: 10
  - type: BerserkerStats
    scaleDamage: true
    scaleSpeed: true
    damageMinMultiplier: 1.0
    damageMaxMultiplier: 1.5
    speedMinMultiplier: 1.0
    speedMaxMultiplier: 7.5
    exponentialScaling: true
    scalingExponent: 2
    componentThresholds:
    - healthThreshold: 0.5
      components:
      - type: SpamEmitSound
        minInterval: 1.5
        maxInterval: 5
        sound:
          collection: FleshGrowl
          params:
            variation: 0.125

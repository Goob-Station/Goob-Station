- type: entity
  parent: BaseMobFleshBeast
  id: MobFleshTankElite
  name: frenzied giant
  description: This hulking beast gets faster and stronger the more damage it takes. Don't get caught in its claw!
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: OverMobs
    sprite: _Lavaland/Mobs/Flesh/48x48.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: tank2
  - type: DamageStateVisuals
    states:
      Alive:
        Base: tank2
      Critical:
        Base: dead2
      Dead:
        Base: dead2
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: SoundWhileAlive

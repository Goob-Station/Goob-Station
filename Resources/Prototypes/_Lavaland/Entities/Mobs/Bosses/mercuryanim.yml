- type: entity
  name: ???
  id: BaseORTAnimation
  categories: [HideSpawnMenu]
  description: The air trembles around it.
  abstract: true
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Timer
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-2,1,1"
        hard: false
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer

- type: entity
  id: MegafaunaORTDormant
  parent: BaseORTAnimation
  name: Unknown entity
  description: Appears to be dormant. Maybe give it a whack?
  suffix: DO NOT MAP # except for where the Megafauna is supposed to spawn, of course.
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: MercurySpider
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/128x128.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: dormant
  - type: VicinitySpawner
    numberToSpawn: 1
    spawnInterval: 4
    offsetForSpawn: 12
    prototype:
    - ORTLightParticle
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ORTFormingAnimation:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: ORTFormingAnimation
  parent: BaseORTAnimation
  categories: [HideSpawnMenu]
  components:
  - type: VicinitySpawner
    numberToSpawn: 1
    spawnInterval: 1
    offsetForSpawn: 12
    prototype:
    - ORTLightParticleLong
  - type: TriggerOnSpawn
  - type: EmitSoundOnTrigger
    sound: /Audio/_Lavaland/Mobs/Bosses/Mercury/ufo_active.ogg
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/128x128.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mercury-forming
  - type: TimedSpawner
    prototypes:
      - ORTForming
    chance: 1.0
    intervalSeconds: 6.5
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 6.5

- type: entity
  id: ORTCombatAnimation
  parent: BaseORTAnimation
  categories: [HideSpawnMenu]
  description: Oh no...
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/128x128.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mercury-combat-forming
  - type: TimedSpawner
    prototypes:
      - ORTCombatForm
    chance: 1.0
    intervalSeconds: 0.9
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 1

- type: entity
  id: ORTUFODeathAnimation
  parent: BaseORTAnimation
  categories: [HideSpawnMenu]
  description: Is it finally over?
  components:
  - type: TriggerOnSpawn
  - type: EmitSoundOnTrigger
    sound: /Audio/_Lavaland/Mobs/Bosses/Mercury/ufo_death.ogg
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/128x128.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: UFO-death
  - type: TimedSpawner
    prototypes:
      - ORTStarCell
    chance: 1.0
    intervalSeconds: 12.9
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 13

- type: entity
  id: ORTStarCell
  parent: BaseORTAnimation
  #categories: [HideSpawnMenu]
  name: Star cell
  description: Space-time continuum analyzed. Manifesting Star Cell colony invasive entity.
  components:
  - type: Transform
    noRot: false
  - type: PointLight
    radius: 5
    energy: 3
    color: gold
  - type: PulsingLight
    lightColor: gold
  - type: Rotating
    rotationSpeed: 30
    increaseOvertime: true
  - type: FadingIn
    fadeInTime: 4
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _Lavaland/Mobs/Bosses/128x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: star_cell
  - type: TimedSpawner
    prototypes:
      - ORTXibalbaWarpIn
    chance: 1.0
    intervalSeconds: 8
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: FadingTimedDespawn
    lifetime: 8
    fadeOutTime: 4
  - type: TriggerOnSpawn
  - type: EmitSoundOnTrigger
    sound: /Audio/_EinsteinEngines/Effects/Shadowkin/futuristic-teleport.ogg

- type: entity
  id: ORTXibalbaWarpIn
  parent: BaseORTAnimation
  categories: [HideSpawnMenu]
  name: ???
  description: It's still not over?
  components:
  - type: PointLight
    radius: 5
    energy: 3
    color: cyan
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: warp_in
  - type: TimedSpawner
    prototypes:
      - ORTXibalba
    chance: 1.0
    intervalSeconds: 1.3
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 1.4
  - type: TriggerOnSpawn
  - type: EmitSoundOnTrigger
    sound: /Audio/_EinsteinEngines/Effects/Shadowkin/futuristic-teleport.ogg

- type: entity
  id: ORTXibalbaGhost
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    state: adapted_melee
    drawdepth: BelowMobs
    noRot: true
  - type: Transform
    noRot: true
  - type: FadingIn
    fadeIn: 5

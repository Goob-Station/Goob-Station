# Tail lash action
- type: entity
  id: ActionTailLash
  parent: BaseAction
  name: Tail lash
  description: Hit your opponent with your tail.
  components:
  - type: Action
    useDelay: 11
    itemIconStyle: BigAction
    icon: { sprite : _White/Interface/Actions/xenomorph.rsi, state: tail_attack }
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:TailLashActionEvent

# Spit (neurotoxin / chemical) — aim with action icon (not RMB)
- type: entity
  id: ActionNeurotoxinSpit
  parent: BaseAction
  name: Spit (55)
  description: Spit toward a point. Click the icon, then click where to fire. Mode switches with spit mode.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true # PlasmaAmmoProvider / Gun are on the body
    useDelay: 0.75
    itemIconStyle: BigAction
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: acid }
  - type: TargetAction
    range: 20
    checkCanAccess: false
  - type: WorldTargetAction
    rotateOnUse: true
    event: !type:NeurotoxinSpitActionEvent

- type: entity
  id: ActionAcid
  parent: BaseAction
  name: Corrosive acid (200)
  description: Drench a structure or object in acid. Walls and machines melt over time; items dissolve into ash.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true # organ-granted; XenomorphAcid is on the body
    useDelay: 5
    itemIconStyle: BigAction
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: acid }
  - type: TargetAction
    interactOnMiss: false
    range: 2
    targetingIndicator: true
    checkCanAccess: true
  - type: EntityTargetAction
    event: !type:AcidActionEvent
  - type: PlasmaCostAction
    plasmaCost: 200

# Toggle spit: neurotoxin (default) <-> chemical heat 21 (armor applies). Needs acid gland + spit gun.
- type: entity
  id: ActionXenomorphSpitMode
  parent: BaseAction
  name: Toggle spit mode
  description: Switch between neurotoxin spit and chemical heat spit (21 Heat, armor applies).
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true # organ-granted; XenomorphSpitMode is on the body
    useDelay: 0.5
    itemIconStyle: BigAction
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: harm }
    iconOn: { sprite: _White/Interface/Actions/xenomorph.rsi, state: acid }
  - type: InstantAction
    event: !type:XenomorphSpitModeToggleEvent

- type: entity
  id: ActionXenomorphScreech
  parent: BaseAction
  name: Empress screech
  description: Deafening xenomorph roar. Paralyzes all nearby creatures except xenomorphs.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 120
    icon: { sprite: _Oskarrr/RMC14/Effects/xeno_screech.rsi, state: screech }
  - type: InstantAction
    event: !type:XenomorphScreechActionEvent

- type: entity
  id: ActionXenomorphHiveAnnounce
  parent: BaseAction
  name: Hive announce
  description: Project a psychic message to everyone who has a hive node.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 30
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: plasma_transfer_on }
  - type: InstantAction
    event: !type:XenomorphHiveAnnounceActionEvent

# Jump action
- type: entity
  id: ActionJumpXenomorph
  parent: BaseAction
  name: Jump
  description: Stun your enemies with a quick jump.
  components:
  - type: Action
    priority: 0
    useDelay: 3
    icon: { sprite : _White/Interface/Actions/xenomorph.rsi, state: leap_off }
    iconOn: { sprite : _White/Interface/Actions/xenomorph.rsi, state: leap_on }
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:JumpActionEvent

# Transfer plasma action
- type: entity
  id: ActionTransferPlasma
  parent: BaseAction
  name: Transfer plasma (50)
  description: Passes plasma to your friend.
  components:
  - type: Action
    priority: 0
    icon: { sprite : _White/Interface/Actions/xenomorph.rsi, state: plasma_transfer_off }
    iconOn: { sprite : _White/Interface/Actions/xenomorph.rsi, state: plasma_transfer_on }
  - type: TargetAction
    interactOnMiss: false
    range: 2
  - type: EntityTargetAction
    event: !type:TransferPlasmaActionEvent

- type: entity
  id: ActionXenomorphOvipositorAttach
  parent: BaseAction
  name: Attach ovipositor (5s)
  description: Root yourself in place to begin laying eggs.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 1
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: egg }
  - type: InstantAction
    event: !type:XenomorphOvipositorAttachEvent

- type: entity
  id: ActionXenomorphOvipositorDetach
  parent: BaseAction
  name: Detach ovipositor (5s)
  description: Withdraw the ovipositor and move freely again.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 1
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: evolve }
  - type: InstantAction
    event: !type:XenomorphOvipositorDetachEvent

- type: entity
  id: ActionXenomorphOvipositorLayEgg
  parent: BaseAction
  name: Lay egg (3s)
  description: Produce a plantable xenomorph egg. One egg every 3 seconds.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 3
    icon: { sprite: _White/Objects/Specific/Xenomorphs/empress_egg.rsi, state: icon }
  - type: InstantAction
    event: !type:XenomorphOvipositorLayEggEvent

# Promotion action
- type: entity
  id: ActionXenomorphPromotion
  parent: BaseAction
  name: Promote to Praetorian (500) # Goobstation
  description: Directly promote a xenomorph to Praetorian status. # Goobstation
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 5 # Goobstation
    icon: { sprite : _White/Interface/Actions/xenomorph.rsi, state: promote }
  - type: TargetAction # Goobstation start
    checkCanAccess: true
    range: 2
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      requireAll: true
      components:
        - Xenomorph # Goobstation end
    event: !type:PromotionActionEvent
  - type: PlasmaCostAction
    plasmaCost: 500

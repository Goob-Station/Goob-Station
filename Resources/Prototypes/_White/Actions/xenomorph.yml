# Combat action
- type: entity
  id: ActionCombatModeToggleXenomorph
  parent: ActionCombatModeToggle
  components:
  - type: Action
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: help }
    iconOn: { sprite: _White/Interface/Actions/xenomorph.rsi, state: harm }

# Thermal action
- type: entity
  id: ToggleThermalVisionXenomorph
  parent: ToggleThermalVision
  components:
  - type: Action
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: vision_off }
    iconOn: { sprite: _White/Interface/Actions/xenomorph.rsi, state: vision_on }

# Evolution actions
- type: entity
  id: ActionEvolution
  parent: BaseAction
  name: Evolve
  description: Evolve into a higher xenomorph caste.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigAction
    useDelay: 0
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: evolve }
  - type: InstantAction
    event: !type:EvolutionsActionEvent

- type: entity
  id: ActionEvolutionPraetorian
  parent: ActionEvolution
  name: Evolve to praetorian (500)
  description: Evolve into the main defender of the hive.
  components:
  - type: Action
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: evolve_praetorian }
  - type: PlasmaCostAction
    plasmaCost: 500

- type: entity
  id: ActionEvolutionQueen
  parent: ActionEvolutionPraetorian
  name: Evolve to queen (500)
  description: Produce an internal egg sac capable of spawning children. Only one queen can exist at a time.
  components:
  - type: Action
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: evolve_queen }
  - type: PlasmaCostAction
    plasmaCost: 500

- type: entity
  id: ActionEvolutionEmpress
  parent: ActionEvolution
  name: Evolve to empress (500)
  description: Evolve into an empress. Costs 500 plasma. Requires 720 seconds of evolution points.
  components:
  - type: Action
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: evolve_queen }
  - type: PlasmaCostAction
    plasmaCost: 500

# Structures actions
- type: entity
  id: ActionXenomorphChooseStructure
  parent: BaseAction
  name: Choose resin structure
  description: Select which resin structure to secrete.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 0.5
    icon: { sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi, state: resin }
  - type: InstantAction
    event: !type:XenomorphChooseStructureEvent

- type: entity
  id: ActionXenomorphSecrete
  parent: BaseAction
  name: Secrete resin
  description: Build the selected resin structure.
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction
    useDelay: 1
    icon: { sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi, state: resin }
  - type: TargetAction
    range: 2
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:XenomorphSecreteEvent
  - type: PlasmaCostAction
    plasmaCost: 50

- type: entity
  id: ActionSpawnResinWeedNode
  parent: BaseAction
  name: Plant weeds (50)
  description: Plants some xenomorph weeds.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 2
    icon: { sprite: _RMC14/Structures/Xenos/xeno_weeds.rsi, state: constructionnode } # Goobstation new sprites
  - type: InstantAction
    event: !type:SpawnTileEntityActionEvent
      entity: ResinWeedNode
      blockedCollisionMask:
      - SlipLayer
      blockedCollisionLayer:
      - Impassable
      - MidImpassable
      - LowImpassable
  - type: PlasmaCostAction
    plasmaCost: 50 # Goobstation

- type: entity
  id: ActionSpawnXenomorphEgg
  name: Lay egg (75)
  description: Lay an egg to produce facehuggers to impregnate prey with.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigAction
    useDelay: 2
    icon: { sprite: _White/Interface/Actions/xenomorph.rsi, state: egg }
  - type: InstantAction
    event: !type:SpawnTileEntityActionEvent
      entity: XenomorphEgg
      blockedCollisionMask:
      - TableMask
      blockedCollisionLayer:
      - TableLayer
      - BulletImpassable
  - type: PlasmaCostAction
    plasmaCost: 75

# TODO: delete it
- type: entity
  id: ActionSpawnWallResin
  parent: BaseAction
  name: Build a resin wall (50)
  description: Secrete tough malleable resin.
  components:
  - type: Action
    useDelay: 2 # Goobstation
    itemIconStyle: BigAction
    icon: { sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi, state: resin } # Goobstation new sprites
  - type: TargetAction
    range: 2
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: WallResin
      length: 2 # Goobstation
      blockedCollisionMask:
      - FullTileMask
      blockedCollisionLayer:
      - WallLayer
  - type: PlasmaCostAction
    plasmaCost: 50 # Goobstation

- type: entity
  id: ActionSpawnHiveFloor
  parent: BaseAction
  name: Build hive floor (50)
  description: Secrete durable hive plating that blocks planetary storms.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon: { sprite: _White/Structures/Furniture/resin_weed.rsi, state: full }
  - type: TargetAction
    range: 2
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      tileId: FloorXenoHive
      length: 1
  - type: PlasmaCostAction
    plasmaCost: 50


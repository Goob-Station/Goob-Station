- type: species
  id: Avali
  name: species-name-avali
  roundStart: true
  prototype: MobAvali
  sprites: MobAvaliSprites
  defaultSkinTone: "#D2B48C"
  markingLimits: MobAvaliMarkingLimits
  dollPrototype: AppearanceAvali
  skinColoration: Hues
  maleFirstNames: names_avali_first
  femaleFirstNames: names_avali_first
  lastNames: names_avali_packs
  naming: FirstLast
  minAge: 20
  youngAge: 100
  oldAge: 250
  maxAge: 350
  minHeight: 0.8
  defaultHeight: 0.91
  maxHeight: 1
  # Pirate: source size maps to the current player-facing height field.
  averageHeight: 150

- type: speciesBaseSprites
  id: MobAvaliSprites
  sprites:
    Head: MobAvaliHead
    Face: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobAvaliTorso
    Groin: MobAvaliGroin
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobAvaliEyes
    LArm: MobAvaliLArm
    RArm: MobAvaliRArm
    LHand: MobAvaliLHand
    RHand: MobAvaliRHand
    LLeg: MobAvaliLLeg
    RLeg: MobAvaliRLeg
    LFoot: MobAvaliLFoot
    RFoot: MobAvaliRFoot

- type: markingPoints
  id: MobAvaliMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [AvaliTailBase]
    Snout:
      points: 1
      required: false
    HeadTop:
      points: 1
      required: false
    HeadSide:
      points: 1
      required: true
      defaultMarkings: [AvaliEarsBase]
    Chest:
      points: 1
      required: false
    Legs:
      points: 2
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Arms:
      points: 4
      required: false


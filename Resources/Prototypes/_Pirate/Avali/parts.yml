# Pirate: Shitmed splits Starlight's single Avali torso into chest and groin.
# Pirate: current MovementBodyPart has no density limit; Avali legs inherit default movement.

- type: entity
  id: PartAvali
  parent: PartHuman
  abstract: true
  name: avali body part
  components:
  - type: Sprite
    sprite: _Pirate/Mobs/Species/Avali/parts.rsi
  - type: Icon
    sprite: _Pirate/Mobs/Species/Avali/parts.rsi
  - type: BodyPart
    species: Avali
  - type: Damageable
    damageModifierSet: Avali
  - type: Woundable
    boneEntity: BoneWeak
  # Pirate: Shitmed renders species damage through body-part wound visuals.
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#6C3BAA"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1.5
      - ReagentId: AvaliBlood
        Quantity: 5

- type: entity
  id: ChestAvali
  name: avali chest
  parent: [PartAvali, BaseChest]
  components:
  - type: Sprite
    state: torso_m
  - type: Icon
    state: torso_m
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: AvaliBlood
        Quantity: 10

- type: entity
  id: GroinAvali
  name: avali groin
  parent: [PartAvali, BaseGroin]
  components:
  # Pirate: source art has no groin state, so detached groins use torso art.
  - type: Sprite
    state: torso_m
  - type: Icon
    state: torso_m

- type: entity
  id: HeadAvali
  name: avali head
  parent: [PartAvali, BaseHead]
  components:
  - type: Sprite
    state: head_m
  - type: Icon
    state: head_m
  - type: Woundable
    boneEntity: BoneNeckWeak
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: AvaliBlood
        Quantity: 10

- type: entity
  id: LeftArmAvali
  name: left avali arm
  parent: [PartAvali, BaseLeftArm]
  components:
  - type: Sprite

# Pirate: Avali survival boxes replace plant-based rations with tinned meat.

- type: entity
  parent: BoxSurvivalSlots
  id: BoxSurvivalSlotsAvali
  suffix: Standard, Avali
  components:
  - type: ContainerFill
    containers:
      water:
      - DrinkWaterBottleFull
      nutriblock:
      - FoodTinMRE
      flare:
      - Flare
      tank:
      - EmergencyOxygenTankFilled
      mask:
      - ClothingMaskBreath
      emergencypen:
      - EmergencyMedipen
      spacepen:
      - SpaceMedipen


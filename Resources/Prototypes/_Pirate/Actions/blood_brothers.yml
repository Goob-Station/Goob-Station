- type: entity
  parent: BaseAction
  id: ActionBloodBrotherConvert
  name: "Навернути"
  description: "Наверніть члена екіпажу до вашої кровної клятви."
  components:
  - type: Action
    icon:
      sprite: /Textures/Interface/Alerts/bleed.rsi
      state: bleed10
    itemIconStyle: BigAction
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:BloodBrotherConvertActionEvent
    whitelist:
      components:
      - HumanoidAppearance
    canTargetSelf: false

- type: entity
  parent: BaseAction
  id: ActionBloodBrotherCheckConvert
  name: "Перевірити, чи можна навернути"
  description: "Перевірте, чи піддається член екіпажу наверненню."
  components:
  - type: Action
    icon: Interface/VerbIcons/vv.svg.192dpi.png
    itemIconStyle: BigAction
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:BloodBrotherCheckConvertActionEvent
    whitelist:
      components:
      - HumanoidAppearance
    canTargetSelf: false

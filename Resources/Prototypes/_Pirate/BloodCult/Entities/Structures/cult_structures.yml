- type: entity
  id: CultBaseStructure
  parent: BaseBloodCultContraband
  suffix: Base
  placement:
    mode: SnapgridCenter
  components:
  - type: CultAnchorable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 110
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Appearance
  - type: Anchorable
  - type: Rotatable
  - type: Pullable
  - type: Clickable
  - type: InteractionOutline
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:SpawnEntitiesBehavior
            spawn:
              SheetSteel1:
                min: 2
                max: 4

- type: entity
  id: CultPylon
  parent: CultBaseStructure
  name: pylon
  suffix: Cult
  description: A floating crystal that slowly heals those faithful to Nar'Sie.
  components:
  - type: CultHealingSource
  - type: Construction
    graph: CultPylon
    node: pylon
  - type: Sprite
    sprite: _Pirate/Structures/BloodCult/pylon.rsi
    noRot: true
    snapCardinals: true
    layers:
      - state: pylon-on
        map: ["anchored"]
  - type: GenericVisualizer
    visuals:
      enum.CultStructureVisuals.Anchored:
        anchored:
          True: { state: pylon-on }
          False: { state: pylon-off }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.125,-0.125,0.125,0.125"
        density: 110
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: GlassBreak
          - !type:SpawnEntitiesBehavior
            spawn:
              SheetGlass1:
                min: 2
                max: 4

- type: entity
  id: CultBaseFactory
  parent: CultBaseStructure
  suffix: Cult
  abstract: true
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Structures/Factories/altar.rsi
    noRot: true
    snapCardinals: true
    layers:
    - state: icon
      map: [ "enum.BloodCultVisuals.Layer" ]
  - type: TimedCultFactory
    entries: []
  - type: UserInterface
    interfaces:
      enum.RadialSelectorUiKey.Key:
        type: TrackedRadialSelectorMenuBUI
  - type: ActivatableUI
    key: enum.RadialSelectorUiKey.Key
  - type: ActivatableUiUserWhitelist
    whitelist:
      components:
      - BloodCultist
      - BloodCultConstruct
  - type: GenericVisualizer
    visuals:
      enum.BloodCultVisuals.Active:
        enum.BloodCultVisuals.Layer:
          True: { state: icon }
          False: { state: icon_off }

- type: entity
  id: CultForge
  parent: CultBaseFactory
  name: daemon forge
  description: A forge used in crafting the unholy weapons wielded by the armies of Nar'Sie.
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Structures/Factories/forge.rsi
  - type: TimedCultFactory
    entries:
    - prototype: MirrorShieldBloodCult
    - prototype: EldritchLongsword
    - prototype: ClothingOuterBloodCultArmor
    - prototype: ClothingOuterRobesBloodCultFlagellant
    - prototype: UnholyHalberd
  - type: Construction
    graph: CultForge
    node: forge

- type: entity
  id: CultArchives
  parent: CultBaseFactory
  name: archives
  description: A desk covered in arcane manuscripts and tomes in unknown languages. Looking at the text makes your skin crawl.
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Structures/Factories/archives.rsi
  - type: TimedCultFactory
    entries:
    - prototype: ShuttleCurse
    - prototype: ClothingEyeBloodCultBlindfold
    - prototype: VeilShifter
    - prototype: VoidTorch
  - type: Construction
    graph: CultArchives
    node: archives

- type: entity
  id: CultAltar
  parent: CultBaseFactory
  name: altar
  description: A bloodstained altar dedicated to Nar'Sie.
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Structures/Factories/altar.rsi
  - type: TimedCultFactory
    entries:
    # Pirate: this lesser shell cannot bypass the existing 30 runed-steel juggernaut recipe.
    - prototype: CultLesserConstructShell
    - prototype: BloodCultWhetstone
  - type: Construction
    graph: CultAltar
    node: altar

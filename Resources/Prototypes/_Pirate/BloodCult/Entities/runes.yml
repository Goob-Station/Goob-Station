# Blood Cult Runes
- type: entity
  id: BaseBloodCultRune
  name: "руна"
  description: "Схоже, її розмазали кров'ю..."
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: BloodCultRune
  - type: Clickable
  - type: TriggerOnActivate
  - type: CleanableRune
  - type: Reactive
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:DeleteEntityEffect
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      vapor:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        hard: false
        mask:
        - MobMask
        - ItemMask
        layer:
        - ItemMask
  - type: Sprite
    sprite: _Pirate/Structures/BloodCult/bloodrune.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: barrier
      color: "#FF00FF"

- type: entity
  parent: BaseBloodCultRune
  id: BarrierRune
  name: "бар'єрна руна"
  components:
  - type: BarrierOnTrigger
  - type: Sprite
    drawdepth: HighFloorObjects
    layers:
    - state: barrier
      color: "#FF3300CC"

- type: entity
  parent: BaseBloodCultRune
  id: BarrierRune_drawing
  name: "бар'єрна руна"
  components:
  - type: Sprite
    sprite: _Pirate/Structures/BloodCult/bloodrune.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: barrier_drawing
      color: "#FF3300CC"
  - type: TimedDespawn
    lifetime: 15

- type: entity

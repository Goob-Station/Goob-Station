- type: entity
  id: BloodCultTeleportInEffect
  name: blood cult teleport in effect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    layers:
    - sprite: _Pirate/BloodCult/Effects/teleport.rsi
      state: blood_cult_in
      shader: unshaded
    netsync: false
    drawdepth: Effects
  - type: PointLight
    color: "#FF0000"


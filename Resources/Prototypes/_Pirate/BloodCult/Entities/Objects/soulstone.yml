- type: entity
  id: CultSoulStone
  parent: [ BaseItem, BaseBloodCultContraband ]
  name: "камінь душі"
  description: "Кристалізована кров Нар'Сі, що містить мозок і душу проклятого."
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Objects/soulstone.rsi
    state: soulstone
  - type: Input
    context: "ghost"
  - type: SoulStone
  - type: Clickable
  - type: MindContainer
  - type: Speech
  - type: Emoting
  - type: Item
    size: Small
    heldPrefix: soulstone
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: CultSoulStoneShard
  parent: CultSoulStone
  name: "уламок каменя душі"
  description: "Фрагмент кристалізованої крові Нар'Сі, що досі гуде ув'язненими душами."
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Objects/soulstone.rsi
    state: soulstone

- type: entity
  id: CultSoulStoneGhost
  parent: CultSoulStone
  suffix: Ghost Role
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    allowMovement: false
    allowSpeech: true
    name: cult-soulstone-role-name
    description: cult-soulstone-role-description
    rules: cult-soulstone-role-rules
    mindRoles:
    - MindRoleCultist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable

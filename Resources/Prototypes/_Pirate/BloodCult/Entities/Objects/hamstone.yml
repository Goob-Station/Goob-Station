- type: entity
  id: CultHamstone
  parent: [ BaseItem, BaseBloodCultContraband ]
  name: "хом'якамінь"
  description: "Кристалізована кров Нар'Сі, що містить мозок і душу проклятого хом'яка."
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Objects/hamstone.rsi
    state: hamstone
  - type: Input
    context: "ghost"
  - type: SoulStone
  - type: Clickable
  - type: MindContainer
  - type: Speech
  - type: Emoting
  - type: Item
    size: Small
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: [ SheetGlassBase, BaseBloodCultContraband ]
  id: SheetRunedGlass
  name: "руноване скло"
  suffix: Full
  description: "Лист потойбічного скла, який аколіти космічних сутностей використовують для складання викривлених конструкцій."
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      RunedGlass: 100
  - type: Stack
    stackType: RunedGlass
    baseLayer: base
    layerStates:
    - runedglass
    - runedglass_2
    - runedglass_3
  - type: Sprite
    sprite: _Pirate/BloodCult/Sheets/glass.rsi
    state: runedglass_3
    layers:
    - state: runedglass_3
      map: ["base"]
  - type: Item
    sprite: _Pirate/BloodCult/Sheets/glass.rsi
    heldPrefix: runedglass
  - type: Appearance


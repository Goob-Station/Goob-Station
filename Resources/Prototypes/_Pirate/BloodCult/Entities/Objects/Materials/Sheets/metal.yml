- type: entity
  parent: [ SheetMetalBase, BaseBloodCultContraband ]
  id: SheetRunedSteel
  name: "рунована сталь"
  suffix: Full
  description: "Лист потойбічної сталі, який аколіти космічних сутностей використовують для складання викривлених конструкцій."
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      RunedSteel: 100
  - type: Stack
    stackType: RunedSteel
    baseLayer: base
    layerStates:
    - runedmetal
    - runedmetal_2
    - runedmetal_3
  - type: Sprite
    sprite: _Pirate/BloodCult/Sheets/metal.rsi
    state: runedmetal_3
    layers:
    - state: runedmetal_3
      map: ["base"]
  - type: Item
    sprite: _Pirate/BloodCult/Sheets/metal.rsi
    heldPrefix: runedmetal
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.RadialSelectorUiKey.Key:
        type: AttachedRadialSelectorMenuBUI
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.RadialSelectorUiKey.Key
  - type: ActivatableUiUserWhitelist
    whitelist:
      components:
      - BloodCultist
  - type: CultConstructionMenu
    entries:
    - prototype: CultAltarConstruction
    - prototype: CultForgeConstruction
    - prototype: CultArchivesConstruction

- type: entity
  parent: SheetRunedSteel
  id: SheetRunedSteel30
  name: "рунована сталь"
  suffix: 30
  components:
  - type: Sprite
    state: runedmetal_3
  - type: Stack
    stackType: RunedSteel
    count: 30

- type: entity
  parent: SheetRunedSteel
  id: SheetRunedSteel10
  name: "рунована сталь"
  suffix: 10
  components:
  - type: Sprite
    state: runedmetal_2
  - type: Stack
    stackType: RunedSteel
    count: 10

- type: entity
  parent: SheetRunedSteel
  id: SheetRunedSteel1
  name: "рунована сталь"
  suffix: Single
  components:
  - type: Sprite
    state: runedmetal
  - type: Stack
    stackType: RunedSteel
    count: 1

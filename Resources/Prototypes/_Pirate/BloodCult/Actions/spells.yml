# actions
- type: entity
  id: ActionCultistStudyVeil
  name: "Вивчити Завісу"
  description: "Дослідити стан завіси та силу вашого культу."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: study_veil
  - type: InstantAction
    event: !type:EventCultistStudyVeil {}
  - type: Sprite
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: study_veil
  - type: CultistSpell
    abilityId: StudyVeil
    charges: 1
    infinite: True
    healthCost: 0
    rechargeTime: 0

- type: entity
  id: ActionCultistCommune
  name: "Спілкування"
  description: "Надіслати повідомлення іншим культистам. Стережіться - непосвячені можуть бачити, як ви шепочете закляття."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: NoItem
    icon:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: commune
  - type: InstantAction
    event: !type:BloodCultCommuneEvent {}
  - type: Sprite
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: commune
  - type: CultistSpell
    abilityId: Commune
    charges: 1
    infinite: True
    healthCost: 0
    rechargeTime: 0

- type: entity
  id: ActionCultistSpellsSelect
  name: "Підготувати Закляття"
  description: "Підготуйте криваве закляття, вирізьбивши його на своєму тілі. До 1 закляття можна підготувати без стояння на руні підсилення."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: spell_select
  - type: InstantAction
    event: !type:BloodCultSpellsEvent {}
  - type: Sprite
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: spell_select
  - type: CultistSpell
    abilityId: SpellsSelect
    charges: 1
    infinite: True
    healthCost: 0
    rechargeTime: 0

- type: entity
  id: ActionCultistSummonDagger
  name: "Призвати Кинджал"
  description: "Скористайтеся благословенням Нар'Сі, щоб сформувати ритуальний кинджал зі свого тіла. Доки ваше серце продовжує битися, Вона дозволить вам створювати нові."
  categories: [ HideSpawnMenu ]
  components:
  - type: Icon
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: summon_dagger
  - type: Sprite
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: summon_dagger
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: summon_dagger
  - type: InstantAction
    event: !type:EventCultistSummonDagger {}
  - type: CultistSpell
    abilityId: SummonDagger
    charges: 1
    infinite: False
    healthCost: 0
    rechargeTime: 0

- type: entity
  id: ActionCultistSanguineDream
  name: "Кривавий Сон"
  description: "Зловісне закляття, що занурює ціль у сон, наповнений кошмарами. ЕМІть кіборгів. Ті, хто має майндшилд, будуть ненадовго оглушені замість занурення в сон."
  categories: [ HideSpawnMenu ]
  components:
  - type: Icon
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: stun
  - type: Sprite
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: stun
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: stun
    iconOn:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: stun_selected
  - type: TargetAction
    interactOnMiss: False
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: False
    event: !type:EventCultistSanguineDream {}
    #useDelay: 60  TIME DELAY BETWEEN ACTION USES
    #deselectOnMiss: False
    #targetingIndicator: True  # apparently defaults to using what is held in hand?
    #entityIcon: <an "EntityUid?">  # overrides the icon
    #sound: a SoundSpecifier. Should probably be used instead of castSound down below.
    #iconOn:  # The sprite when selected. USE THIS.
  - type: CultistSpell
    abilityId: SanguineDream
    charges: 1
    infinite: False
    healthCost: 0
    rechargeTime: 0
    invocation: Fuu ma'jin!
    castSound: !type:SoundPathSpecifier
        path: /Audio/Magic/blink.ogg

- type: entity
  id: ActionCultistTwistedConstruction
  name: "Викривлена Конструкція"
  description: "Зловісне закляття, що використовується для перетворення сталі або скла на руновану сталь чи руноване скло."
  categories: [ HideSpawnMenu ]
  components:
  - type: Icon
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: twisted_construction
  - type: Sprite
    sprite: _Pirate/BloodCult/spells_cultist.rsi
    state: twisted_construction
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: twisted_construction
    iconOn:
      sprite: _Pirate/BloodCult/spells_cultist.rsi
      state: twisted_construction
  - type: TargetAction
    interactOnMiss: False
  - type: EntityTargetAction
    whitelist:
      components:
      - Stack
      - Construction
    canTargetSelf: False
    event: !type:EventCultistTwistedConstruction {}
    #useDelay: 60  TIME DELAY BETWEEN ACTION USES
    #deselectOnMiss: False
    #targetingIndicator: True  # apparently defaults to using what is held in hand?
    #entityIcon: <an "EntityUid?">  # overrides the icon
    #sound: a SoundSpecifier. Should probably be used instead of castSound down below.
    #iconOn:  # The sprite when selected. USE THIS.
  - type: CultistSpell
    abilityId: CultTwistedConstruction
    charges: 1
    infinite: False
    healthCost: 0
    rechargeTime: 0
    invocation: Ethra p'ni dedol!
    castSound: !type:SoundPathSpecifier
        path: /Audio/Magic/blink.ogg

    - type: ZombieImmune
    - type: Damageable
      damageContainer: BloodCultConstruct
      damageModifierSet: CultShade
    - type: BloodCultConstruct
    - type: Bloodstream
      bloodReferenceSolution:
        reagents: []
      maxBleedAmount: 0
    - type: MindContainer
    - type: Shade
    - type: Physics
    - type: InputMover
    - type: MobMover
    - type: ReplacementAccent
      accent: genericAggressive
    - type: CombatMode
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: NpcFactionMember

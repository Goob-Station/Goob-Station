- type: entity
  name: juggernaut shell
  id: CultJuggernautShell
  parent: BaseBloodCultContraband
  description: A large, inert monstrosity made from runed steel. Can be completed by dragging a dead body onto it or using a filled soulstone on it.
  components:
  - type: BloodCultConstructShell
  - type: Construction
    graph: CultJuggernautShell
    node: juggernautShell
  - type: Sprite
    sprite: _Pirate/BloodCult/Mobs/constructs.rsi
    state: juggernaut
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 110
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:SpawnEntitiesBehavior
            spawn:
              SheetRunedSteel1:
                min: 2
                max: 4

- type: entity
  id: CultLesserConstructShell
  parent: [ BaseItem, BaseBloodCultContraband ]
  name: lesser construct shell
  description: An empty shell that can bind a dead soul or a soul stone into a lesser construct.
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Objects/construct_shell.rsi
    state: icon
  - type: Item
    size: Large
  - type: BloodCultItem
  - type: BloodCultConstructShell
    constructs:
    - prototype: MobBloodCultArtificer
    - prototype: MobBloodCultWraith
  - type: UserInterface
    interfaces:
      enum.RadialSelectorUiKey.Key:
        type: TrackedRadialSelectorMenuBUI
        interactionRange: 2

- type: entity
  id: MobBloodCultJuggernaut
  name: Juggernaut
  description: Strong, slow, and has lots of health. Solves most problems by punching them. Immune to weak attacks.
  parent: [ SimpleSpaceMobBase, BaseBloodCultContraband ]
  categories: [ HideSpawnMenu ]
  components:
    - type: Hands
      showInHands: false
    - type: ComplexInteraction
    - type: ZombieImmune
    - type: Damageable
      damageContainer: BloodCultConstruct
      damageModifierSet: CultJuggernaut
    - type: IgnoreSlowOnDamage
    - type: BloodCultConstruct
      ejectSourceOnCritical: true
    - type: Reactive
      groups:
        Flammable: [ Touch ]
        Extinguish: [ Touch ]
    - type: MindContainer
    - type: Juggernaut
    - type: ContainerContainer
      containers:
        juggernaut_body_container: !type:ContainerSlot
        juggernaut_soulstone_container: !type:ContainerSlot
    - type: Physics
    - type: InputMover
    - type: MobMover
    - type: Speech
    - type: Emoting
    - type: ReplacementAccent
      accent: juggernaut
    - type: CombatMode
    - type: Puller
      needsHands: false
    - type: Pullable
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: NpcFactionMember
      factions:
        - BloodCultist
    - type: MobState
      allowedStates:
        - Alive
        - Critical
        - Dead
    - type: StatusEffects
      allowed:
        - KnockedDown
        - SlowedDown
        # Stun is intentionally excluded - juggernauts have nothing to stun
        # Electrocution is intentionally excluded - juggernauts are immune to electrical shocks
    - type: MobStateActions
      actions:
        Critical: []  # Juggernauts should not have critical state actions (suicide, last words)
    - type: MeleeWeapon
      hidden: true
      canWideSwing: true
      altDisarm: false
      soundHit:
        path: /Audio/Effects/wood_destroy2.ogg
      angle: 60
      animation: WeaponArcSmash
      wideAnimation: WeaponArcSmash
      damage:
        types:
          Blunt: 15
          Structural: 50
    - type: DamageStateVisuals
      states:
        Alive:
          Base: juggernaut
          BaseUnshaded: nautdamage
        Critical:
          Base: juggernaut
        Dead:
          Base: juggernaut_dead
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.35
          density: 200
          mask:
            - BlobMobMask
          layer:
            - BlobMobLayer
    - type: MobThresholds
      thresholds:
        0: Alive
        180: Critical
        280: Dead
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.0
      baseSprintSpeed: 2.5
    - type: Sprite
      sprite: _Pirate/BloodCult/Mobs/constructs.rsi
      drawdepth: Mobs
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: juggernaut
        - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
          state: nautdamage
          shader: unshaded
    - type: NightVision # EE nightvision port
      isActive: true
      toggleAction: null
      color: "#50595C"
      activateSound: null
      deactivateSound: null
    - type: IntrinsicUI
      uis:
        enum.BloodCultistCommuneUIKey.Key:
          toggleAction: null
    - type: UserInterface
      interfaces:
        enum.BloodCultistCommuneUIKey.Key:
          type: BloodCultCommuneBoundUserInterface
          requireInputValidation: false
    - type: GuideHelp
      guides:
      - BloodCult
    - type: Body
      prototype: null
      # No prototype - juggernauts have no organs or limbs, like borgs


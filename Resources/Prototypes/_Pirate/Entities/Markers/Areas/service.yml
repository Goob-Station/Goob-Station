- type: entity
  abstract: true
  parent: BaseAreaStation
  id: BaseAreaService
  name: "сервісний відділ"
  components:
  - type: DepartmentArea
    # Pirate: service jobs are part of Civilian in this fork.
    department: Civilian

# For the kitchen itself
- type: entity
  parent: BaseAreaService
  id: AreaKitchen
  name: "кухня"
  components:
  - type: Sprite
    state: kitchen

# For the seating area between kitchen and bar
- type: entity
  parent: AreaKitchen
  id: AreaCafeteria
  name: "кафетерій"
  components:
  - type: Sprite
    state: cafeteria

# For the kitchen freezer room
- type: entity
  parent: AreaKitchen
  id: AreaColdRoom
  name: "холодильна кімната"
  components:
  - type: Sprite
    state: kitchen_cold

- type: entity
  parent: AreaKitchen
  id: AreaKitchenBackRoom
  name: "задня кімната кухні"
  components:
  - type: Sprite
    state: kitchen_back

- type: entity
  parent: BaseAreaService
  id: AreaBarber
  name: "перукарня"
  components:
  - type: Sprite
    state: barber

- type: entity
  parent: BaseAreaService
  id: AreaBar
  name: "бар"
  components:
  - type: Sprite
    state: bar
  - type: LuckyWinnerTarget

- type: entity
  parent: BaseAreaService
  id: AreaBarBackRoom
  name: "задня кімната бару"
  components:
  - type: Sprite
    state: bar_back_room

- type: entity
  parent: BaseAreaService
  id: AreaDiner
  name: "закусочна"
  components:
  - type: Sprite
    state: diner

- type: entity
  parent: BaseAreaService
  id: AreaBotany
  name: "гідропоніка"
  components:
  - type: Sprite
    state: hydro

- type: entity
  parent: BaseAreaService
  id: AreaServiceHall
  name: "сервісний хол"
  components:
  - type: Sprite
    state: service_hall

# For areas to be mapped on shuttles
- type: entity
  abstract: true
  parent: BaseArea
  id: BaseAreaShuttle
  components:
  - type: Sprite
    sprite: _Pirate/Markers/Areas/shuttle.rsi
    state: shuttle

- type: entity
  parent: BaseAreaShuttle
  id: AreaShuttleAbductor
  name: "шатл абдукторів"
  components:
  - type: Sprite
    state: abductor

- type: entity
  parent: BaseAreaShuttle
  id: AreaShuttleNukie
  name: "шатл ядерників"
  components:
  - type: Sprite
    state: nukie

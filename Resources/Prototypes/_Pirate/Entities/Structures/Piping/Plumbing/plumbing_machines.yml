# =============================================================================
# Plumbing Reactor - accumulates reagents and triggers reactions
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingReactor
  name: "реактор трубопроводу"
  description: "Втягує цільові реагенти з входу в налаштованих кількостях і запускає реакції. Потребує живлення."
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: reaction_chamber
      map: [ "enum.PlumbingVisualLayers.Base" ]
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Longitudinal
    previewInletDirections: North
    previewOutletDirections: South
  - type: GenericVisualizer
    visuals:
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Base:
          True: { state: reaction_chamber_on }
          False: { state: reaction_chamber }
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingReactor
    bufferSolutionName: buffer
    outputSolutionName: output
    inletName: inlet
  - type: PlumbingInlet
    solutionName: buffer
    inletNames:
    - inlet
    transferAmount: 0
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: output
    connectedOutlets: true
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 100
        canReact: false  # Reactions triggered manually when targets met
      output:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: UserInterface
    interfaces:
      enum.PlumbingReactorUiKey.Key:
        type: PlumbingReactorBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingReactorUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 750
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:SpillBehavior
        solution: output
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150

# =============================================================================
# Plumbing Smart Dispenser - stores reagents from the network, fills labeled jugs
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingSmartDispenser
  name: "розумний дозатор трубопроводу"
  description: "Втягує всі реагенти зі своїх входів і зберігає до 200u кожного типу. Використайте підписаний контейнер для автоматичного дозування відповідного реагенту або перезаправний контейнер для ручного дозування. Потребує живлення."
  components:
  - type: Sprite
    sprite: Structures/Machines/smartfridge.rsi
    layers:
    - state: smartfridge
      map: ["enum.StorageVisualLayers.Base"]
    - state: smartfridge_door
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Fourway
    previewInletDirections: Fourway
  - type: PointLight
    radius: 1.2
    energy: 3.0
    color: "#9dc5c9"
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: fridge
    inletNames:
    - inletNorth
    - inletEast
    - inletSouth
    - inletWest
    transferAmount: 40
  - type: PlumbingSmartDispenser
    solutionName: fridge
    maxPerReagent: 200
  - type: SolutionContainerManager
    solutions:
      fridge:
        maxVol: 50000
        canReact: false
  - type: ExaminableSolution
    solution: fridge
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: UserInterface
    interfaces:
      enum.PlumbingSmartDispenserUiKey.Key:
        type: PlumbingSmartDispenserBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingSmartDispenserUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpillBehavior
        solution: fridge
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 200

# =============================================================================
# Plumbing Pill Press - automatically creates pills or patches from reagents
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingPillPress
  name: "таблетковий прес трубопроводу"
  description: "Втягує реагенти й пресує їх у пігулки або пластирі з налаштовуваною дозою. Має додаткові входи змішування для змішування з контрольованим співвідношенням. Потребує живлення."
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: pill_press_off
      map: [ "enum.PlumbingVisualLayers.Base" ]
  - type: GenericVisualizer
    visuals:
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Base:
          True: { state: pill_press }
          False: { state: pill_press_off }
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingPillPress
    bufferSolutionName: buffer
    dosage: 10
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: TNorth
    previewInletDirections: North
    previewMixingInletDirections: Lateral
  - type: PlumbingInlet
    solutionName: buffer
    inletNames:
    - inlet
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 20
        canReact: false
      stagingEast:
        maxVol: 20
        canReact: false
      stagingWest:
        maxVol: 20
        canReact: false
  - type: ExaminableSolution
    solution: buffer
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      mixingInletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      mixingInletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: UserInterface
    interfaces:
      enum.PlumbingPillPressUiKey.Key:
        type: PlumbingPillPressBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingPillPressUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150
# =============================================================================
# Plumbing Filter - separates specific reagents into two outputs
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingFilter
  name: "фільтр трубопроводу"
  description: "Фільтрує до 4 конкретних реагентів з мережі каналів. Відфільтровані реагенти надсилаються в бічний вихід, а інші реагенти проходять наскрізь."
  components:
  - type: CollideOnAnchor
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: filter
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: TWest
    previewInletDirections: North
    previewOutletDirections: SWBend
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: buffer
  - type: PiratePlumbingFilter
    filterNodeName: outletFilter
    passthroughNodeName: outletPassthrough
    filteredSolutionName: bufferFiltered
    passthroughSolutionName: buffer
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: buffer
    outletNames:
    - outletFilter
    - outletPassthrough
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 40
        canReact: false
      bufferFiltered:
        maxVol: 40
        canReact: false
  - type: ExaminableSolution
    solution: buffer
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outletFilter:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outletPassthrough:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: AtmosPipeColor
    color: "#8B4513"
  - type: UserInterface
    interfaces:
      enum.PiratePlumbingFilterUiKey.Key:
        type: PiratePlumbingFilterBoundUserInterface
  - type: ActivatableUI
    key: enum.PiratePlumbingFilterUiKey.Key
  - type: Flippable
    mirrorEntity: PlumbingFilterFlipped
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:SpillBehavior
        solution: bufferFiltered
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 125

- type: entity
  parent: PlumbingFilter
  id: PlumbingFilterFlipped
  suffix: Flipped
  description: "Фільтрує до 4 конкретних реагентів з мережі каналів. Відфільтровані реагенти надсилаються в бічний вихід, а інші реагенти проходять наскрізь."
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: filterF
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: TWest
    previewInletDirections: South
    previewOutletDirections: NWBend
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletFilter:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outletPassthrough:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
  - type: Flippable
    mirrorEntity: PlumbingFilter

# =============================================================================
# Plumbing Synthesizer - generates reagents from power
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingSynthesizer
  name: "синтезатор трубопроводу"
  description: "Генерує базові реагенти, використовуючи живлення з внутрішньої батареї."
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    noRot: false
    layers:
    - state: synthesizer
    - state: synthesizer_overlay
      map: [ "enum.PlumbingVisualLayers.Overlay" ]
      visible: false
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: TSouth
    previewOutletDirections: TSouth
  - type: GenericVisualizer
    visuals:
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Overlay:
          True: { visible: true }
          False: { visible: false }
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingSynthesizer
    bufferSolutionName: buffer
    generatableReagents:
      Aluminium: 5
      Carbon: 2
      Chlorine: 8
      Copper: 2
      Ethanol: 5
      Fluorine: 8
      Hydrogen: 2
      Iodine: 5
      Iron: 2
      Lithium: 8
      Mercury: 8
      Nitrogen: 2
      Oxygen: 0
      Phosphorus: 5
      Potassium: 5
      Radium: 10
      Silicon: 5
      Sodium: 3
      Sugar: 2
      Sulfur: 3
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: buffer
    connectedOutlets: true
    outletNames:
    - outletSouth
    - outletEast
    - outletWest
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 10
        canReact: false
  - type: ExaminableSolution
    solution: buffer
  - type: NodeContainer
    nodes:
      outletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      outletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: UserInterface
    interfaces:
      enum.PlumbingSynthesizerUiKey.Key:
        type: PlumbingSynthesizerBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingSynthesizerUiKey.Key
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        blacklist:
          tags:
          - MechReactor
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  # Cell is recharged in-place by PlumbingSynthesizerSystem (see CellRechargeRate);
  # the stock Charger doesn't resume for a cell drained inside the machine.
  - type: ApcPowerReceiver
    powerLoad: 1
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 200
# =============================================================================
# Plumbing Disposal - destroys reagents pulled from plumbing network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingDisposal
  name: "утилізатор трубопроводу"
  description: "Втягує реагенти з південного входу у внутрішній буфер на 200u й знищує їх."
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: disposal
      map: [ "enum.PlumbingVisualLayers.Base" ]
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: South
    previewInletDirections: South
  - type: GenericVisualizer
    visuals:
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Base:
          True: { state: disposal_working }
          False: { state: disposal }
  - type: CollideOnAnchor
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: PlumbingDevice
    updateInterval: 1
  - type: PlumbingInlet
    solutionName: drainBuffer
    inletNames:
    - inlet
  - type: Drain
    autoDrain: false
    unitsDestroyedPerSecond: 15
  - type: DumpableSolution
    solution: drainBuffer
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 200
        canReact: false
  - type: ExaminableSolution
    solution: drainBuffer
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: drainBuffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150

# =============================================================================
# Plumbing Drain - floor drain that outputs to plumbing network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingDrain
  name: "стік трубопроводу"
  description: "Підлоговий стік, що поглинає калюжі й спрямовує їх до мережі трубопроводу замість утилізації."
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Objects/Specific/Janitorial/drain.rsi
    layers:
    - state: icon
    - map: [ "enum.SolutionContainerLayers.Fill" ]
      state: fill-1
      visible: false
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Fourway
    previewOutletDirections: Fourway
  - type: CollideOnAnchor
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg
  - type: Drain
    unitsDestroyedPerSecond: 0
  - type: DumpableSolution
    solution: drainBuffer
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: fill-
    solutionName: drainBuffer
  - type: PlumbingOutlet
    solutionName: drainBuffer
    connectedOutlets: true
    outletNames:
    - outletNorth
    - outletEast
    - outletSouth
    - outletWest
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 400
  - type: NodeContainer
    nodes:
      outletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      outletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: ExaminableSolution
    solution: drainBuffer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: drainBuffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150

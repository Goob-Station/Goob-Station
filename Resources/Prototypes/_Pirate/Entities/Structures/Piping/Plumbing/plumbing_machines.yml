# Base plumbing machine entity - all plumbing machines inherit from this
- type: entity
  abstract: true
  id: PlumbingMachineBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    noRot: false  # Allow rotation so connectors face correct direction
  - type: Clickable
  - type: Appearance
  - type: PlumbingConnectorAppearance
    offset: 0.09375
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: -0.25,-0.25,0.25,0.25
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: AtmosPipeColor
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2
    rpld: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic

# =============================================================================
# Plumbing Tank - stores reagents in the network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingTank
  name: "резервуар трубопроводу"
  description: "Зберігає до 2000u реагентів. Використовуйте резервуари, щоб буферизувати реагенти між етапами виробництва або просто зберігати великі кількості реагентів."
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: tank
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Fourway
    previewInletDirections: North
    previewOutletDirections: TSouth
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: tank
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: tank
    connectedOutlets: true
    outletNames:
    - outletSouth
    - outletEast
    - outletWest
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 2000
        canReact: false
  - type: ExaminableSolution
    solution: tank
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      outletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 100

# =============================================================================
# Plumbing Buffer - small low-profile tank for reagent buffering
# =============================================================================
- type: entity
  parent: PlumbingTank
  id: PlumbingBuffer
  name: "буфер трубопроводу"
  description: "Зберігає до 200u реагентів. Корисний для постачання окремих мереж каналів через свої непід'єднані виходи."
  components:
  - type: CollideOnAnchor
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: buffer_tank
  - type: PlumbingOutlet
    solutionName: tank
    connectedOutlets: false
    outletNames:
    - outletSouth
    - outletEast
    - outletWest
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Fourway
    previewInletDirections: North
    previewOutletDirections: TSouth
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 200
        canReact: false

# =============================================================================
# Plumbing Input - pour reagents into the network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingInput
  name: "вхід трубопроводу"
  description: "Малий резервуар, у який ви заливаєте реагенти. Інші машини беруть з нього. З'єднується в усіх напрямках."
  components:
  - type: CollideOnAnchor
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: pipe_input
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Fourway
    previewOutletDirections: Fourway
  - type: PlumbingInput
    solutionName: input
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: input
    connectedOutlets: true
    outletNames:
    - outletNorth
    - outletEast
    - outletSouth
    - outletWest
  - type: SolutionContainerManager
    solutions:
      input:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: input
  - type: NodeContainer
    nodes:
      outletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      outletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: input
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 75

# =============================================================================
# Plumbing Sink - draws reagents from the network, has an outlet for solutions dumped into it
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingSink
  name: "раковина трубопроводу"
  description: "Раковина, під'єднана до мережі трубопроводу. Набирайте з неї реагенти контейнером або зливайте реагенти в неї, щоб відправити їх у стік. З'єднується в усіх напрямках."
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    drawdepth: FloorObjects
    layers:
    - state: sink_wide
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Fourway
    previewInletDirections: TNorth
    previewOutletDirections: South
  - type: Rotatable
    rotateWhileAnchored: false
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: output
    inletNames:
    - inletNorth
    - inletEast
    - inletWest
  - type: PlumbingOutput
    solutionName: output
  - type: PlumbingOutlet
    solutionName: drain
    connectedOutlets: true
  - type: DumpableSolution
    solution: drain
  - type: Plungeable
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 100
        canReact: false
      drain:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: output
      - !type:SpillBehavior
        solution: drain
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 100


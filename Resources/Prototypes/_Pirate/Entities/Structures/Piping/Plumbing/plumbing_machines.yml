    canCollide: false
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: pipe_output
  - type: PlumbingConnectorAppearance
    offset: 0.09375
    previewNodeDirections: Fourway
    previewInletDirections: Fourway
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: output
    inletNames:
    - inletNorth
    - inletEast
    - inletSouth
    - inletWest
  - type: PlumbingOutput
    solutionName: output
  - type: Plungeable
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      inletWest:
        !type:PlumbingNode

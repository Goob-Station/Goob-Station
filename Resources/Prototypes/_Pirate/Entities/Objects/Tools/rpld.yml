- type: entity
  id: RPLD
  parent: RCD
  name: "RPLD"
  description: "Пристрій для швидкого розгортання рідинних каналів і машин трубопроводу."
  components:
  - type: Contraband
    allowedDepartments: [ Engineering, Medical ]
  - type: RCD
    isRPLD: true
    availablePrototypes:
    - PlumbingRpldDuctStraight
    - PlumbingRpldDuctBend
    - PlumbingRpldDuctTJunction
    - PlumbingRpldDuctFourway
    - PlumbingRpldDuctManifold
    - PlumbingRpldTank
    - PlumbingRpldBuffer
    - PlumbingRpldInput
    - PlumbingRpldOutput
    - PlumbingRpldSink
    - PlumbingRpldReactor
    - PlumbingRpldPillPress
    - PlumbingRpldFilter
    - PlumbingRpldSynthesizer
    - PlumbingRpldSmartDispenser
    - PlumbingRpldDrain
    - PlumbingRpldDisposal
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 45
  - type: Sprite
    sprite: _Pirate/Objects/Tools/rpld.rsi
    state: icon
  - type: Item
    sprite: _Pirate/Objects/Tools/rpld.rsi
  - type: Clothing
    sprite: _Pirate/Objects/Tools/rpld.rsi
  - type: PhysicalComposition # Pirate: keep recycling below the upgraded engifab recipe cost.
    materialComposition:
      Steel: 500
      Plastic: 100

- type: entity
  id: RPLDEmpty
  parent: RPLD
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  id: RPLDRecharging
  parent: RPLD
  name: "експериментальний RPLD"
  description: "Змонтований на кіборгу швидкий трубопровідний пристрій, що на льоту створює стиснену матерію за допомогою внутрішнього фабрикатора."
  suffix: AutoRecharge
  components:
  - type: LimitedCharges
    maxCharges: 20
  - type: AutoRecharge
    rechargeDuration: 10

- type: entity
  id: RPLDExperimental
  parent: RPLD
  suffix: Admeme
  name: "експериментальний RPLD"
  description: "Швидкий трубопровідний пристрій, посилений блюспейсом, що пасивно генерує власну стиснену матерію."
  components:
  - type: AutoRecharge
    rechargeDuration: 1

# Частини мод-с'юту
- type: entity
  parent: ClothingModsuitStandard
  id: ClothingModsuitTCAFLegionnaire
  name: мод-костюм легіонера TCAF
  suffix: TCAF
  description: Головний контролер модульного костюма легіонера. Його зразок носять офіцери Легіону іноземців Тау-Кита.
  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Modsuits/legionnaire.rsi
    - type: ToggleableClothing
      clothingPrototypes:
        head: ClothingModsuitHelmetTCAFLegionnaire
        gloves: ClothingModsuitGauntletsTCAFLegionnaire
        outerClothing: ClothingModsuitChestplateTCAFLegionnaire
        shoes: ClothingModsuitBootsTCAFLegionnaire
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellHyper
          whitelist:
            components:
              - PowerCell
    - type: Storage
      maxItemSize: Huge
      grid:
        - 0,0,7,4
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        back:
        - state: equipped-BACKPACK-sealed
          shader: unshaded

- type: entity
  parent: ClothingModsuitGauntletsStandard
  id: ClothingModsuitGauntletsTCAFLegionnaire
  name: рукавички мод-костюма легіонера TCAF
  description: Пара рукавичок, створених для модульного костюма легіонера.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Modsuits/legionnaire.rsi
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        gloves:
        - state: equipped-HAND-sealed
    - type: Insulated

- type: entity
  parent: [ClothingModsuitHelmetStandard, ShowSecurityIcons, BaseClothingRadio]
  id: ClothingModsuitHelmetTCAFLegionnaire
  name: шолом мод-костюма легіонера TCAF
  description: Передовий шолом, розроблений NanoTrasen для модульного костюма легіонера. Має вбудований проєкційний HUD.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Modsuits/legionnaire.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.08
      lowPressureMultiplier: 1000
    - type: ShowHealthBars
      damageContainers:
        - Biological
    - type: FlashImmunity
    - type: FlashSoundSuppression
      protectionRange: 0
    - type: EyeProtection
    - type: PointLight
      color: "#FFDF00"
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        head:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
    - type: Reflect
      reflectProb: 0.15
      spread: 270
      reflects:
        - Energy
        - NonEnergy

- type: entity
  parent: [ClothingModsuitChestplateStandard, BaseClothingRadio]
  id: ClothingModsuitChestplateTCAFLegionnaire
  name: нагрудник мод-костюма легіонера TCAF
  description: Передовий нагрудник, розроблений NanoTrasen для модульного костюма легіонера. Вбудовані силові сервоприводи допомагають знизити вагу спорядження для користувача.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Modsuits/legionnaire.rsi
    - type: ClothingSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95
    - type: Armor
      traumaDeductions:
        Dismemberment: 0.5
        OrganDamage: 0.5
        BoneDamage: 0.5
        VeinsDamage: 0
        NerveDamage: 0
      modifiers:
        coefficients:
          Blunt: 0.55
          Slash: 0.55
          Piercing: 0.55
          Heat: 0.55
          Radiation: 0.40
          Caustic: 0.40
    - type: ExplosionResistance
      damageCoefficient: 0.45
    - type: EmitsSoundOnMove
      soundCollection:
        collection: FootstepHardsuitMedium
        params:
          volume: -10
    - type: StaminaResistance
      damageCoefficient: 0.45
    - type: FireProtection
      reduction: 0.90
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        outerClothing:
        - state: equipped-OUTERCLOTHING-sealed
        - state: equipped-OUTERCLOTHING-sealed-unshaded
          shader: unshaded
    - type: Reflect
      reflectProb: 0.15
      spread: 270
      reflects:
        - Energy
        - NonEnergy

- type: entity
  parent: ClothingModsuitBootsStandard
  id: ClothingModsuitBootsTCAFLegionnaire
  name: чоботи мод-костюма легіонера TCAF
  description: Сучасна пара магнітних чобіт для модульного костюма легіонера. Поки костюм увімкнений, вони не знижують швидкість пересування власника.
  categories: [HideSpawnMenu]
  components:
    - type: Appearance
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Modsuits/legionnaire.rsi
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        shoes:
        - state: equipped-FEET-sealed
    - type: ItemToggle
    - type: ToggleClothing
      action: ActionToggleMagboots
    - type: ComponentToggler
      components:
      - type: NoSlip
    - type: Magboots
      enabledPrefix: null
    - type: ClothingSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95

# Кіти
- type: entity
  id: SuitStorageTCAFLegionnaire
  parent: SuitStorageBase
  suffix: TCAF Modsuit
  components:
    - type: StorageFill
      contents:
          - id: OxygenTankFilled
          - id: ClothingModsuitTCAFLegionnaire
          - id: ClothingMaskBreath

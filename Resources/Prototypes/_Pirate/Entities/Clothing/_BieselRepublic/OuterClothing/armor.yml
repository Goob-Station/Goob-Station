  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/OuterClothing/Armor/TCAF_plate_carrier_light.rsi
    - type: Clothing
      sprite: _Pirate/Clothing/_BieselRepublic/OuterClothing/Armor/TCAF_plate_carrier_light.rsi
      clothingVisuals:
        outerClothing:
        - state: equipped-OUTERCLOTHING
        - state: equipped-OUTERCLOTHING-unshaded

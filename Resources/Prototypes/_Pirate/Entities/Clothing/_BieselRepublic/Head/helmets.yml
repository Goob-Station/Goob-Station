- type: entity
  parent: [ClothingHeadHelmetBasic, BaseClothingRadio]
  id: ClothingHeadHelmetTCAFNoVisor
  name: тактичний шолом TCAF
  suffix: TCAF
  description: Базовий тактичний шолом, який носять військовослужбовці збройних сил Тау-Кита.
  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Head/Helmet/TCAF_tactical_helmet_novisor.rsi
    - type: Clothing
      sprite: _Pirate/Clothing/_BieselRepublic/Head/Helmet/TCAF_tactical_helmet_novisor.rsi
      clothingVisuals:
        head:
        - state: equipped-HELMET
        - state: equipped-HELMET-unshaded
          shader: unshaded

- type: entity
  parent: [ClothingHeadHelmetBasic, ShowSecurityIcons, BaseClothingRadio]
  id: ClothingHeadHelmetTCAFVisor
  name: тактичний шолом TCAF з візором
  suffix: TCAF
  description: Базовий тактичний шолом з встроєним тактичним візором, який носять військовослужбовці збройних сил Тау-Кита.
  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Head/Helmet/TCAF_tactical_helmet_visor.rsi
    - type: Clothing
      sprite: _Pirate/Clothing/_BieselRepublic/Head/Helmet/TCAF_tactical_helmet_visor.rsi
      clothingVisuals:
        head:
        - state: equipped-HELMET
        - state: equipped-HELMET-unshaded
          shader: unshaded
    - type: FlashImmunity
    - type: EyeProtection
      protectionTime: 5

- type: entity
  parent: [ClothingHeadHelmetBasic, ShowSecurityIcons, BaseClothingRadio]
  id: ClothingHeadHelmetTCAFHeavy
  name: важкий тактичний шолом TCAF
  suffix: TCAF
  description: Значна частина спорядження, яке використовує TCAF, була перероблена зі старішого соляріанського військового спорядження. Цей передовий шолом оснащений балістичним полімерним лицевим щитком з встроєним візором.
  components:
    - type: Sprite
      sprite: _Pirate/Clothing/_BieselRepublic/Head/Helmet/TCAF_tactical_helmet_full.rsi
    - type: Clothing
      sprite: _Pirate/Clothing/_BieselRepublic/Head/Helmet/TCAF_tactical_helmet_full.rsi
      clothingVisuals:
        head:
        - state: equipped-HELMET
        - state: equipped-HELMET-unshaded
          shader: unshaded
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.45
          Slash: 0.45
          Piercing: 0.45
          Heat: 0.45
          Caustic: 0.65
    - type: Reflect
      reflectProb: 0.025
      spread: 270
      reflects:
        - Energy
        - NonEnergy
    - type: ClothingSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95
    - type: FlashImmunity
    - type: EyeProtection
      protectionTime: 5

- type: entity
  id: FxBloodCultRuneBarrier
  name: "бар'єрна руна"
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: HighFloorObjects
    sprite: _Pirate/Structures/BloodCult/bloodrune.rsi

- type: entity
  id: BloodCult
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 20
  - type: BloodCultRule
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ BloodCultist ]
      min: 3
      max: 5
      playerRatio: 10
      startingGear: BloodCultistGear
      briefing:
        text: cult-start-briefing
        color: CornflowerBlue
        sound: "/Audio/_Pirate/Ambience/Antag/cultist_start.ogg"
      blacklist:
        components:
        - BibleUser
      components:
      - type: BloodCultist
      mindRoles:
      - MindRoleCultist
  - type: Tag
    tags:
      - RoundstartAntag

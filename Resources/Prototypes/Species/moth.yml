- type: species
  id: Moth
  name: species-name-moth
  roundStart: true
  prototype: MobMoth
  sprites: MobMothSprites
  defaultSkinTone: "#ffda93"
  markingLimits: MobMothMarkingLimits
  dollPrototype: MobMothDummy
  skinColoration: Hues
  maleFirstNames: NamesMothFirstMale
  femaleFirstNames: NamesMothFirstFemale
  lastNames: NamesMothLast
  # begin Goobstation: port EE height/width sliders
  minHeight: 0.8
  defaultHeight: 1
  maxHeight: 1.20
  minWidth: 0.80
  defaultWidth: 1
  maxWidth: 1.25
  # end Goobstation: port EE height/width sliders

- type: speciesBaseSprites
  id: MobMothSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking # floof
    TailOversuit: MobHumanoidAnyMarking # floof
    TailBehindBackpack: MobHumanoidAnyMarking #imp
    Head: MobMothHead
    Face: MobHumanoidAnyMarking
    Hair: MobHumanoidMarkingMatchSkin
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobMothChest
    Groin: MobMothGroin # Goob
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobMothEyes
    LArm: MobMothLArm
    RArm: MobMothRArm
    LHand: MobMothLHand
    RHand: MobMothRHand
    LLeg: MobMothLLeg
    RLeg: MobMothRLeg
    LFoot: MobMothLFoot
    RFoot: MobMothRFoot

- type: humanoidBaseSprite
  id: MobMothEyes
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: eyes

- type: markingPoints
  id: MobMothMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
      onlyWhitelisted: true
    Tail:
      points: 1
      required: true
      defaultMarkings: [ MothWingsDefault ]
      onlyWhitelisted: true
    Snout:
      points: 1
      required: false
      onlyWhitelisted: true
    HeadTop:
      points: 6
      required: true
      defaultMarkings: [ MothAntennasDefault ]
      onlyWhitelisted: true
    HeadSide:
      points: 8
      required: false
      onlyWhitelisted: true
    Head:
      points: 1
      required: false
      onlyWhitelisted: true
    UndergarmentTop:
      points: 1
      required: false
      onlyWhitelisted: true
    UndergarmentBottom:
      points: 8
      required: false
      onlyWhitelisted: true
    Chest:
      points: 8
      required: false
      onlyWhitelisted: true
    RightLeg:
      points: 2
      required: false
      onlyWhitelisted: true
    RightFoot:
      points: 2
      required: false
      onlyWhitelisted: true
    LeftLeg:

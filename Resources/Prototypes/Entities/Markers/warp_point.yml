- type: entity
  id: WarpPoint
  parent: MarkerBase
  name: "точка телепортації"
  components:
  - type: WarpPoint
  - type: WizardTeleportWarpPoint # Goobstation
  - type: Sprite
    state: pink

- type: entity
  id: WarpPointBeacon
  parent: WarpPoint
  name: "точка телепортації (маяк)"
  components:

- type: entity
  id: RoofMarker
  name: "Дах"
  suffix: Enabled
  parent: MarkerBase
  components:
  - type: SetRoof
    value: true
    blockWeather: true
  - type: Sprite
    layers:
    - state: green
      shader: unshaded

- type: entity
  id: NoRoofMarker
  name: "Дах"
  suffix: Disabled
  parent: MarkerBase
  components:
  - type: SetRoof
    value: false
    blockWeather: false
  - type: Sprite
    layers:
    - state: red
      shader: unshaded
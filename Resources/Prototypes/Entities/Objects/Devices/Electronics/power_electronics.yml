# APC
- type: entity
  id: APCElectronics
  parent: BaseElectronics
  name: "плата АПЦ"
  description: "Схема, що використовується в будівництві АПЦ."
  components:
    - type: ApcElectronics
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: charger_APC
    - type: PhysicalComposition #Goobstation - Recycle update
      materialComposition:
        Glass: 62
      chemicalComposition:
        Silicon: 5
    - type: StaticPrice
      price: 34


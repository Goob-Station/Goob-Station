- type: entity
  name: "пінпоінтер"
  description: "Портативний пристрій стеження. Хоча зазвичай цей пристрій має набагато більше можливостей, він налаштований на фіксацію певних сигналів. Тримайте вертикально, щоб зберегти точність."
  parent: BaseItem
  id: PinpointerBase
  abstract: true
  components:
  - type: Transform
    noRot: True
  - type: Sprite
    noRot: True
    sprite: Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: Objects/Devices/pinpointer.rsi
    state: pinpointer
  - type: Item
    sprite: Objects/Devices/pinpointer.rsi
  - type: Pinpointer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PinpointerVisuals.IsActive:
        enum.PinpointerLayers.Screen:
          True: { visible: True }
          False: { visible: False }
      enum.PinpointerVisuals.TargetDistance:
        enum.PinpointerLayers.Screen:
          Unknown: { state: pinonnull }
          Reached: { state: pinondirect }
          Close: { state: pinonclose }
          Medium: { state: pinonmedium }
          Far: { state: pinonfar }
  - type: AnimationPlayer

- type: entity
  name: "пінпоінтер"
  id: PinpointerNuclear
  parent: [ PinpointerBase, BaseCommandContraband ]
  components:
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - NukeDisk
    targetName: nuclear authentication disk

- type: entity
  name: "синдикатський пінпоінтер"
  description: "Створений спеціально для ядерних оперативних місій, придбайте цей диск!"
  id: PinpointerSyndicateNuclear
  parent: [ PinpointerBase, BaseSyndicateContraband ]
  components:
  - type: Sprite
    layers:
    - state: pinpointer-syndicate
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-syndicate
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - NukeDisk
    targetName: nuclear authentication disk

- type: entity
  name: "універсальна пінпоінтер"
  description: "Портативний пристрій для відстеження, який фіксує будь-яку фізичну особу у вимкненому стані. Тримайте вертикально, щоб зберегти точність."
  id: PinpointerUniversal
  parent: PinpointerBase
  components:
  - type: Sprite
    layers:
    - state: pinpointer-universal
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-universal
  - type: Pinpointer
    updateTargetName: true
    canRetarget: true

- type: entity
  parent: PinpointerBase
  name: "пеленгатор дослідницького сервера"  # Goob edit
  description: "Портативний пристрій відстеження, що вказує напрямок до будь-якого найближчого дослідницького сервера."
  id: PinpointerStation
  #suffix: Station # Goob edit
  components:
  - type: Sprite
    layers:
    - state: pinpointer-station
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-station
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - ResearchServer
    targetName: research servers # Goob edit

- type: entity
  parent: [ PinpointerBase, BaseXenoborgContraband ]
  id: PinpointerMothership
  name: "пінпоінтер ядра"
  description: "Ручний пристрій відстеження, що вказує напрямок до ядра Мотершипа."
  components:
  - type: Sprite
    layers:
    - state: pinpointer-xenoborg
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-xenoborg
  - type: Pinpointer
    whitelist: # Goob edit: pinpointer whitelist
      components:
      - MothershipCore
    targetName: the Mothership # Goob edit

- type: entity
  parent: BaseItem
  id: PinpointerMothershipPiece
  name: "частина пінпойнтера ядра"
  description: "Частина пінпойнтера ядра. Вам потрібно чотири частини, щоб його полагодити."
  components:
  - type: Sprite
    sprite: Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer-xenoborg-piece-1
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        pinpointer-xenoborg-piece-1: ""
        pinpointer-xenoborg-piece-2: ""
        pinpointer-xenoborg-piece-3: ""
        pinpointer-xenoborg-piece-4: ""
  - type: Item
  - type: Tag
    tags:
    - MothershipPinpointerPiece
  - type: Construction
    graph: RepairMothershipPinpointer
    node: start

- type: entity
  parent: PinpointerMothership
  id: PinpointerMothershipRepaired
  name: "відремонтований пінпойнтер ядра"
  description: "Ручний пристрій стеження, що веде в напрямку ядра Материнського корабля. Цей бачив кращі дні."
  components:
  - type: Sprite
    layers:
    - state: pinpointer-xenoborg-repaired
      map: ["enum.PinpointerLayers.Base"]
  - type: Icon
    state: pinpointer-xenoborg-repaired
  - type: Construction
    graph: RepairMothershipPinpointer
    node: repairedPinpointer

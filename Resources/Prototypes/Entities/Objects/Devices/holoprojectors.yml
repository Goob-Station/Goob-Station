- type: entity
  parent: BaseItem
  id: Holoprojector
  name: "голографічний проектор"
  description: "Зручний голографічний проектор, який відображає знак прибиральника."
  components:
  - type: Item
    storedRotation: -90
  - type: HolosignProjector
  - type: UseDelay
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/custodial.rsi
    state: icon
  - type: Tag
    tags:
      - HolosignProjector
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Plastic: 62
      Glass: 37

- type: entity
  parent: Holoprojector
  id: HoloprojectorEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  parent: Holoprojector
  id: HoloprojectorBorg
  suffix: borg
  name: "проектор голознаків"
  description: "Модифікований проектор голографічних знаків для використання в кіборгах-прибиральниках. Автоматично самозаряджається."
  components:
  - type: HolosignProjector
    chargeUse: 240
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  parent: Holoprojector
  id: HoloprojectorClownBorg
  name: "голопіл-проектор"
  description: "Голопіл-проектор, що створює слизьку бананову шкірку з твердого світла. Перезаряджається, тож веселощі ніколи не закінчуються!"
  suffix: borg
  components:
  - type: HolosignProjector
    signProto: HoloPeel
    chargeUse: 240
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/peel.rsi
    state: icon
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  parent: BaseItem # DeltaV - remove powercell requirement
  id: HolofanProjector
  name: "голофазний проектор"
  description: "Не дайте пасажирам-самогубцям вбити всіх під час надзвичайних ситуацій в атмосфері."
  components:
  - type: ChargeHolosignProjector # DeltaV - different implementation using charges
    signProto: HoloFan
    signComponentName: Holofan # DeltaV
    #chargeUse: 120 # DeltaV
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/atmos.rsi
    state: icon
  # Begin DeltaV Additions
  - type: Item
    storedRotation: -90
  - type: LimitedCharges
    maxCharges: 6 # same as it was on a medium cell
  - type: ContainerContainer
    containers:
      signs: !type:Container
  # End DeltaV Additions
  - type: Tag
    tags:
    - HolofanProjector
  - type: StaticPrice
    price: 80
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 75
      Plastic: 12
      Glass: 12
  - type: GuideHelp
    guides:
    - AtmosTools
    - Fires
    - Spacing


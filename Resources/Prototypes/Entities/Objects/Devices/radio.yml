- type: entity
  name: "кишенькова рація"
  description: "Зручна портативна рація."
  parent: BaseItem
  id: RadioHandheld
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
    toggleOnInteract: false # Pirate - Handheld Radios port
  - type: HandheldRadioFrequency
    frequency: 1330 # Pirate - Handheld Radios port
  - type: RadioSpeaker
    toggleOnInteract: false # Pirate - Handheld Radios port
    channels:
    - Handheld
  - type: ListenBlacklist # Goobstation - annoying as shit
    blacklist:
      components:
      - Advertise
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
    state: walkietalkie
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio
  # Pirate start - Handheld Radios port
  - type: ActivatableUI
    key: enum.HandheldRadioUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HandheldRadioUiKey.Key:
        type: HandheldRadioBoundUserInterface
  # Pirate end - Handheld Radios port

- type: entity
  name: "радіостанція охорони"
  description: "Зручна охоронна рація."
  parent: [ RadioHandheld, BaseSecurityContraband ]
  id: RadioHandheldSecurity
  components:
  - type: RadioMicrophone
    broadcastChannel: Security
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Security
  - type: Sprite
    sprite: Objects/Devices/securityhandy.rsi
  - type: Item
    sprite: Objects/Devices/securityhandy.rsi
    heldPrefix: walkietalkie

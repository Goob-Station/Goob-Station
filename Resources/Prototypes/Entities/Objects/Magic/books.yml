- type: entity
  abstract: true
  parent: [ BaseItem, BaseMagicalContraband ]
  id: BaseSpellbook
  name: "книга заклинань"
  components:
    - type: Sprite
      sprite: Objects/Misc/books.rsi
      layers:
      - state: paper_blood
      - state: cover_strong
        color: "#645a5a"
      - state: decor_wingette_flat
        color: "#4d0303"
      - state: icon_pentagramm
        color: "#f7e19f"
    - type: Spellbook
    - type: Tag
      tags:
      - Spellbook

# For the Wizard antagonist
# Do not add discounts or price inflation
- type: entity
  parent: [ BaseItem, BaseMagicalContraband, StorePresetSpellbook ] # Goob edit
  id: WizardsGrimoire
  name: "гримуар чарівника"
  suffix: Wizard
  description: "Важкий том зі складними арканними формулами для підготовки магічних заклять і виклику надприродного спорядження. Десятиліття досліджень пішли на цю збірку містичних таємниць; тепер ідіть і зіпсуйте комусь день."
  components:
    - type: Sprite
      sprite: Objects/Misc/books.rsi
      layers:
      - state: paper_blood
      - state: cover_strong
        color: "#645a5a"
      - state: decor_wingette_flat
        color: "#4d0303"
      - state: icon_pentagramm
        color: "#f7e19f"
    - type: UserInterface
      interfaces:
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
        enum.RefundUiKey.Key:
          type: StoreRefundBoundUserInterface
    - type: ActivatableUI
      key: enum.StoreUiKey.Key
    - type: EnchantingTool # Goobstation
    - type: Store
      refundAllowed: true
      ownerOnly: true # Lesser minds cannot comprehend the arcane secrets within
      balance:
        WizCoin: 10 # prices are balanced around this 10 point maximum and how strong the spells are
    - type: GuideHelp # Goobstation
      guides:
      - Wizard

# Used for the Antag Planet
- type: entity
  id: WizardsGrimoireGhost
  name: "примарний гримуар"
  description: "Модифікований гримуар чарівника, який може використовуватися більш ніж однією людиною і має більше візкойнів, але не може купувати певні заклинання."
  suffix: Wizard
  parent: [ BaseItem, BaseMagicalContraband, GhostAntagSpellPreset ] # Goob edit
  components:
    - type: Sprite
      sprite: Objects/Misc/books.rsi
      layers:
      - state: paper_blood
      - state: cover_strong
        color: "#645a5a"
      - state: decor_wingette_flat
        color: "#4d0303"
      - state: icon_pentagramm
        color: "#f7e19f"
    - type: UserInterface
      interfaces:
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
        enum.RefundUiKey.Key:
          type: StoreRefundBoundUserInterface
    - type: ActivatableUI
      key: enum.StoreUiKey.Key
    - type: Store
      refundAllowed: true
      ownerOnly: false
      balance:
        WizCoin: 50 #Increased currency for more use per book
    - type: EnchantingTool # Goobstation
    - type: GuideHelp # Goobstation
      guides:
      - Wizard
    - type: Tag
      tags:
      - GrimoireGhost

# No-refund version meant for manual spawning, so people can't abuse refund if they were given a tome. Not meant for wizard antag proper!
- type: entity
  parent: WizardsGrimoire
  id: WizardsGrimoireNoRefund
  suffix: Wizard, no refunding
  components:
    - type: Store
      refundAllowed: false

# For debugging purposes only! Or spawn this for an admeme so a wizard can have every spell at once, I can't stop you.
- type: entity
  parent: WizardsGrimoire
  id: WizardsGrimoireDebug
  suffix: Wizard, DEBUG
  description: "Важкий том зі складними арканними формулами для підготовки магічних заклять і виклику надприродного спорядження. Хтось написав \"ЛИШЕ ДЛЯ ЕКСПЕРИМЕНТАЛЬНОГО ВИКОРИСТАННЯ\" на внутрішній обкладинці."
  components:
    - type: Store
      ownerOnly: false # For ease of debugging.
      balance:
        WizCoin: 99999


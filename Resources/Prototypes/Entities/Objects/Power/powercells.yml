- type: entity
  parent: BasePowerCell
  id: PowerCellMicroreactor
  name: "мікрореакторна батарейка"
  description: "Перезаряджається стандартизованим мікрореакторним осередком. Має меншу ємність, але повільно перезаряджається самостійно."
  suffix: Full
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: microreactor
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 720
    startingCharge: 720
  - type: BatterySelfRecharger
    autoRechargeRate: 12 # takes 1 minute to charge itself back to full
    # Goobstation
    canEmp: true
  - type: BatteryAmmoProvider # goob edit - battery hitscan buff
    proto: MediumRedLaser
    fireCost: 90 # 8 shots
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 100
      Glass: 75
      Uranium: 25
      Gold: 12
    chemicalComposition:
      Zinc: 20


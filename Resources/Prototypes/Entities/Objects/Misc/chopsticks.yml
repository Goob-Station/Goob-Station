- type: entity
  parent: BaseItem
  id: ChopSticks
  name: "палички для їжі"
  description: "Дуже традиційний посуд."
  components:
  - type: Sprite
    sprite: Objects/Misc/chopstick.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/chopstick.rsi
    size: Small
  - type: Utensil
    types:
    - Fork
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: BaseItem
  name: "спарені палички для їжі"
  id: PairedChopsticks
  description: "Вам, мабуть, варто їх розділити."
  components:
  - type: SpawnItemsOnUse
    items:
      - id: ChopSticks
    sound:
      path: /Audio/Effects/chopstickbreak.ogg
  - type: Sprite
    sprite: Objects/Misc/chopstick.rsi
    state: paired
  - type: Tag
    tags:
    - Trash
## Filled

- type: entity
  parent: DrinkBaseMug
  id: DrinkHotCoco
  name: "гарячий шоколад"
  suffix: Full
  description: "Підігрітий напій, що складається з розтопленого шоколаду та підігрітого молока."
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: HotCocoa
          Quantity: 20
  - type: Icon
    sprite: Objects/Consumable/Drinks/mug.rsi
    state: icon-vend-brown
  - type: Sprite

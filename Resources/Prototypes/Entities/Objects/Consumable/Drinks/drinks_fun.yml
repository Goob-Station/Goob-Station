- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, DrinkBase, DrinkBaseOpenable, DrinkVisualsAllFilled ]
  id: BaseSqueezeBottle
  components:
  - type: Openable
    sound:
      collection: packetOpenSounds
  - type: Sprite
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-6
      map: [ "enum.SolutionContainerLayers.Fill" ] # already has liquid, so no visible: false
    - state: icon-front
      map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: SolutionContainerVisuals
    maxFillLevels: 6
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceGlue
  name: "тюбик космічного клею"
  description: "Високоефективний клей, призначений для обслуговування надзвичайно складного механічного обладнання. НЕ ПИТИ!"
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glue-tube.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SpaceGlue
          Quantity: 30
  - type: Glue

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceLube
  name: "тюбик космічного мастила"
  description: "Високоефективне мастило, призначене для обслуговування надзвичайно складного механічного обладнання."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/lube-tube.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SpaceLube
          Quantity: 30
  - type: Lube

# Find your nearest clown and give them a gift :o)
- type: entity
  parent: BluespaceBeaker
  id: BottomlessLube
  name: "бездонний бекер лубриканту"
  suffix: DEBUG
  description: "Цей аномальний бекер нескінченно виробляє космолюбрикант і тому має суворо охоронятися, щоб не потрапити в чужі руки."
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 1000
        reagents:
        - ReagentId: SpaceLube
          Quantity: 1000
  - type: SolutionRegeneration
    solution: beaker
    generated:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 200

- type: entity
  parent: [DrinkBaseMaterialGlass, DrinkBase]
  id: DrinkJarWhat
  name: "банку з чимось"
  description: "Насправді не можна сказати, що це таке."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/jar_what.rsi
  - type: FitsInDispenser
    solution: drink


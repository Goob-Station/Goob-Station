  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi
  - type: Label
    currentLabel: reagent-name-water
  - type: Sealable # Goobstation
  - type: Tag # Goobstation
    tags:
    - DrinkBottle


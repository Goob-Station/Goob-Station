- type: entity
  abstract: true
  parent: [DrinkBaseMaterialStrongMetal, DrinkBase, DrinkBaseOpenable, DrinkVisualsOpenable]
  id: FlaskBase
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi
  - type: FitsInDispenser
    solution: drink
  - type: ExaminableSolution
    examinableWhileClosed: false
  # Pirate banking start
  - type: StaticPrice
    price: 45
  # Pirate banking end
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds

# Flasks

- type: entity
  parent: [DrinkBaseMaterialStrongMetal, DrinkBase]
  id: DrinkFlaskOld
  name: "стара фляга"
  description: "Стара занепала фляга, здається, її кришка відсутня."
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask_old.rsi
  - type: FitsInDispenser
    solution: drink

- type: entity
  parent: FlaskBase
  id: DrinkShinyFlask
  name: "блискуча колба"
  description: "Блискуча металева колба. На ній, схоже, викарбуваний грецький символ."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shinyflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkMREFlask
  suffix: Full
  name: "фляга MRE"
  description: "Стара військова фляга, наповнена найкращим вмістом для солдатів."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mreflask.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 50
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: FlaskBase
  id: DrinkDetFlask
  name: "фляга інспектора"
  description: "Металева фляга зі шкіряним ремінцем та золотим значком, що належить інспектору."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/detflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkHosFlask
  name: "фляга ГСБ"
  description: "Металева колба, придатна для працьовитих хот-догів."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/hosflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkFlask
  name: "фляга капітана"
  description: "Металева фляга, що належить капітану."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkFlaskBar
  name: "фляга"
  description: "Багаторазова металева фляга. Вишуканіше, ніж пити прямо з пляшки."
  components:
    - type: Sprite
      sprite: Objects/Consumable/Drinks/barflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkLithiumFlask
  name: "літієва колба"
  description: "Колба з символом атома літію на ній."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/lithiumflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkVacuumFlask
  name: "вакуумна колба"
  description: "Зберігаємо ваші напої ідеальної температури з 1892 року."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/vacuumflask.rsi
  - type: Tool
    qualities:
    - Rolling # Perfectly cylindrical flask
    speedModifier: 0.75

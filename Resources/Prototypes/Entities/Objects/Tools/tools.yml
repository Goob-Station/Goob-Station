- type: entity
  name: "мультитул"
  parent: BaseItem
  id: Multitool
  description: "Вдосконалений інструмент для копіювання, зберігання та надсилання електричних імпульсів та сигналів через дроти та машини."
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/multitool_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/multitool_drop.ogg
  # Goobstation edit end
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Sprite
    sprite: Objects/Tools/multitool.rsi
    layers:
    - state: icon
    - state: green-unlit
      shader: unshaded
  - type: Item
    size: Small
  - type: Clothing
    sprite: Objects/Tools/multitool.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Tool
    qualities:
    - Pulsing
  - type: NetworkConfigurator
  - type: ActivatableUI
    key: enum.NetworkConfiguratorUiKey.List
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.NetworkConfiguratorUiKey.List:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Configure:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Link:
        type: NetworkConfiguratorBoundUserInterface
  - type: Tag
    tags:
    - Multitool
    - DoorElectronicsConfigurator
    - DroneUsable # Goobstation
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: StaticPrice
    price: 56
  - type: GuideHelp
    guides:
    - Networking
    - WirePanels
    - Airlocks
    - InspectingPower

- type: entity
  name: "конфігуратор мережі"
  parent: BaseItem
  id: NetworkConfigurator
  description: "Інструмент для зв'язування пристроїв між собою. Має два режими: режим списку для масового зв'язування пристроїв і режим зв'язування для розширеного зв'язування пристроїв."
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Sprite
    sprite: Objects/Tools/network_configurator.rsi
    layers:
    - state: icon
    - state: mode-link
      map: ["enum.NetworkConfiguratorLayers.ModeLight"]
      shader: unshaded
  - type: Item
    size: Small
  - type: Clothing
    sprite: Objects/Tools/network_configurator.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NetworkConfiguratorVisuals.Mode:
        enum.NetworkConfiguratorLayers.ModeLight:
          True: { state: mode-link }
          False: { state: mode-list }
  - type: NetworkConfigurator
  - type: ActivatableUI
    key: enum.NetworkConfiguratorUiKey.List
    inHandsOnly: true
  - type: Tag
    tags:
    - DoorElectronicsConfigurator
  - type: UserInterface
    interfaces:
      enum.NetworkConfiguratorUiKey.List:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Configure:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Link:
        type: NetworkConfiguratorBoundUserInterface
  - type: StaticPrice
    price: 56
  - type: GuideHelp
    guides:
    - Networking
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 25
      Plastic: 25

#Power tools
#Later on these should switch probably switch damage when changing the tool behavior.
- type: entity
  name: "електродриль"
  parent: BaseItem
  id: PowerDrill
  description: "Проста ручна дриль з електроприводом."
  components:
  - type: Tag
    tags:
    - Powerdrill
  - type: Sprite
    sprite: Objects/Tools/drill.rsi
    state: drill_screw
  - type: Item
    sprite: Objects/Tools/drill.rsi
    size: Small
  - type: Tool
    qualities:
    - Screwing
    speedModifier: 1.5
    useSound: /Audio/Items/drill_use.ogg
  - type: MultipleTool
    statusShowBehavior: true
    entries:
    - behavior: Screwing
      sprite:
        sprite: Objects/Tools/drill.rsi
        state: drill_screw
      useSound:
        path: /Audio/Items/drill_use.ogg
      changeSound:
        path: /Audio/Items/change_drill.ogg
    - behavior: Anchoring
      sprite:
        sprite: Objects/Tools/drill.rsi
        state: drill_bolt
      useSound:
        path: /Audio/Items/drill_use.ogg
      changeSound:
        path: /Audio/Items/change_drill.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Plastic: 100
  - type: StaticPrice
    price: 100
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1.5
    animationRotation: 90 # WWDP
    range: 1.4
    damage:
      types:
        Piercing: 10
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
  - type: Tending # Shitmed
    speed: 0.75
  - type: Drill # Shitmed
    speed: 1
  - type: SurgeryTool # Shitmed
    startSound: /Audio/Items/drill_use.ogg

- type: entity
  id: RCD
  parent: [ BaseItem, BaseEngineeringContraband ]
  name: "УЗК"
  description: "Універсальний засіб конструювання можна використовувати для швидкого встановлення та демонтажу різних станційних конструкцій і пристосувань. Для роботи потрібна стиснута речовина."
  components:
  - type: RCD
    availablePrototypes:
    - WallSolid
    - FloorSteel
    - Plating
    - Catwalk
    - Grille
    - Window
    - WindowDirectional
    - WindowReinforcedDirectional
    - ReinforcedWindow
    - Airlock
    - AirlockGlass
    - Firelock
    - TubeLight
    - BulbLight
    - LVCable
    - MVCable
    - HVCable
    - CableTerminal
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 45
  - type: Sprite
    sprite: Objects/Tools/rcd.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/rcd.rsi
    quickEquip: false
    slots:
    - Belt
  - type: PhysicalComposition
    materialComposition:
      Steel: 600
      Plastic: 100
  - type: StaticPrice
    price: 110
  - type: UserInterface
    interfaces:
      enum.RcdUiKey.Key:
        type: RCDMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.RcdUiKey.Key
  - type: Tag
    tags:
    - DroneUsable # Goobstation

- type: entity
  id: RPD
  parent: RCD
  name: "ШТП"
  description: "Швидкий трубопровідний пристрій дозволяє швидко розміщувати та видаляти будівлі, пов'язані з атмосферою, для використання потребує стисливу матерію."
  components:
  - type: RCD
    isRpd: true
    availablePrototypes:
    - PipeFourway
    - PipeStraight
    - PipeBend
    - PipeTJunction
    - OutletInjector
    - ManualValve
    - VolumetricPump
    - PressurePump
    - VentScrubber
    - PressureValve
    - DualPortVent
    - VentGas
    - VentPassive
    - MixerGas
    - Radiator
    - RadiatorBend
    - SignalValve
    - CanisterPort
    - FilterGas
    # <Goobstation>
    - FilterInline
    - RadiatorInline
    - RadiatorInlineBend
    # </Goobstation>
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 90
  - type: Sprite
    sprite: Objects/Tools/rpd.rsi


- type: entity
  id: RCDEmpty
  parent: RCD
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  id: RCDRecharging
  parent: RCD
  name: "експериментальний УЗК"
  description: "Встановлений на кіборга Універсальний засіб конструювання (УЗК), який створює стиснуту матерію на льоту за допомогою внутрішнього фабрикатора."
  suffix: AutoRecharge
  components:
  - type: LimitedCharges
    maxCharges: 20
  - type: AutoRecharge
    rechargeDuration: 10

- type: entity
  id: RCDExperimental
  parent: RCD
  suffix: Admeme
  name: "експериментальний УЗК"
  description: "Універсальний засіб конструювання, що пасивно генерує власну стиснуту матерію, на основі блюспейсу."
  components:
  - type: AutoRecharge
    rechargeDuration: 1

- type: entity
  name: "стиснута речовина"

- type: entity
  id: MysteryFigureBoxTrash
  parent: BaseItem
  name: "розгорнута картонна коробка"
  description: "Невеличка розгорнута картонна коробка для іграшок."
  components:
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    state: fig_box_unfolded
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage

- type: entity
  parent: BaseItem
  id: MysteryFigureBox
  name: "коробка з мініфігурками таємничих космонавтів"
  description: "Коробка, що містить загадкову мініфігурку. На боковій стороні коробки зображено кілька затемнених \"рідкісних\" фігур, серед яких одна з великим негуманоїдним силуетом."
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
      - state: fig_box
  - type: TriggerOnActivate
  - type: DeleteOnTrigger
  - type: EmitSoundOnTrigger
    positional: true
    predicted: true
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: SpawnEntityTableOnTrigger
    useMapCoords: true
    table: !type:AllSelector
      children:
      - id: MysteryFigureBoxTrash
      - !type:NestedSelector
        tableId: AllFigurinesTable

- type: entity
  parent: BaseItem
  id: MysteryLighterBox
  name: "Таємнича коробка з новинками-запальничками"
  suffix: Filled
  description: "Коробка знятих з виробництва рекламних запальничок, багато з яких згодом були оголошені \"контрабандою\"."
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
    - state: fig_box
  - type: SpawnItemsOnUse
    items:
      - id: MysteryFigureBoxTrash
      - id: CybersunFlippo
        orGroup: Lighterbox
        weight: 0.15
      - id: InterdyneFlippo
        orGroup: Lighterbox
        weight: 0.15
      - id: NanotrasenFlippo
        orGroup: Lighterbox
        weight: 0.25
      - id: WaffleCoFlippo
        orGroup: Lighterbox
        weight: 0.35
      - id: HonkCoFlippo
        orGroup: Lighterbox
      - id: GorlexMatchbox
        orGroup: Lighterbox
        weight: 0.15
      - id: DonkcoLighter
        orGroup: Lighterbox
        weight: 0.25
      - id: SyndicateFlippo
        orGroup: Lighterbox
        weight: 0.15

- type: entity
  parent: MysteryLighterBox
  id: UplinkLighterBox
  suffix: Uplink
  components:
  - type: SpawnItemsOnUse
    items:
      - id: MysteryFigureBoxTrash
      - id: CybersunFlippo
        orGroup: Lighterbox
      - id: InterdyneFlippo
        orGroup: Lighterbox
      - id: WaffleCoFlippo
        orGroup: Lighterbox
      - id: GorlexMatchbox
        orGroup: Lighterbox
      - id: DonkcoLighter
        orGroup: Lighterbox
      - id: SyndicateFlippo
        orGroup: Lighterbox

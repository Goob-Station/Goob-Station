# When adding new balloons, also add it to id: AllMiscToysTable

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBalloon
  components:
  - type: Sprite
    noRot: true
  - type: Item
    size: Small
  - type: EmitSoundOnCollide
    sound: &SoundBalloonHit
      path: /Audio/Effects/balloon_hits.ogg
  - type: EmitSoundOnLand
    sound: *SoundBalloonHit
  - type: Damageable
    damageContainer: Inorganic
  - type: TileFrictionModifier
    modifier: 0.3
  - type: Tag
    tags:
    - Balloon

- type: entity
  parent: BaseBalloon
  id: BalloonSyn
  name: "повітряна куля Синдикату "
  description: "Вручається найсміливішим душам, які пережили атракціон \"атомний твістер\" у \"Сінділенді\"."
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/syndicate.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/syndicate.rsi
  - type: StaticPrice
    price: 100 # Entertainment.

- type: entity
  parent: BaseBalloon
  id: BalloonNT
  name: "повітряна куля НаноТрейзену"
  description: "Спеціально розроблений, щоб завдати максимальної психологічної шкоди оперативникам Синдикату."
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/nanotrasen.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/nanotrasen.rsi

- type: entity
  parent: BaseBalloon
  id: BalloonCorgi
  name: "повітряна куля коргі"
  description: "Це як володіти справжнім собакою - але набагато легше."
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/corgi.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/corgi.rsi

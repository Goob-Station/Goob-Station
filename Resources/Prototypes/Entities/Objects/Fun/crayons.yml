- type: entity
  parent: BoxCardboard
  id: CrayonBox
  name: "коробка для олівців"
  description: "Це коробка з олівцями."
  components:
  - type: Sprite
    sprite: Objects/Fun/crayons.rsi
    state: box
  - type: Storage
    grid:
    - 0,0,7,0
    maxItemSize: Tiny
  - type: Item
    sprite: Objects/Fun/crayons.rsi
    size: Small
    shape:
    - 0,0,1,1
    heldPrefix: box
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CrayonRed
        - id: CrayonOrange
        - id: CrayonYellow
        - id: CrayonGreen
        - id: CrayonBlue
        - id: CrayonPurple
        - id: CrayonBlack
        - id: CrayonWhite
  - type: ItemMapper
    mapLayers:
      black_box:
        whitelist:
          tags:
          - CrayonBlack
      blue_box:
        whitelist:
          tags:
          - CrayonBlue
      green_box:
        whitelist:
          tags:
          - CrayonGreen
      orange_box:
        whitelist:
          tags:
          - CrayonOrange
      purple_box:
        whitelist:
          tags:
          - CrayonPurple
      red_box:
        whitelist:
          tags:
          - CrayonRed
      yellow_box:
        whitelist:
          tags:
          - CrayonYellow
      white_box:
        whitelist:
          tags:
          - CrayonWhite
  - type: Appearance

# When adding new crayons, also add it to id: AllCrayonsTable

- type: entity
  abstract: true
  parent: BaseItem
  id: CrayonInedible
  name: "крейда"
  description: "Кольорова крейда. Заборонений смак."
  components:
  - type: Sprite
    sprite: Objects/Fun/crayons.rsi
  - type: Item
    sprite: Objects/Fun/crayons.rsi
    size: Tiny
  - type: Tag
    tags:
    - Write
    - Crayon
    - Trash
    - Recyclable
  - type: SpaceGarbage
  - type: UserInterface
    interfaces:
      enum.CrayonUiKey.Key:
        type: CrayonBoundUserInterface
  - type: Crayon
    selectedState: like
  - type: LimitedCharges
    maxCharges: 25
  - type: StaticPrice
    price: 5

- type: entity
  abstract: true
  parent: CrayonInedible
  id: Crayon
  description: "Кольорова крейда. Виглядає смачно. Ммм..."
  components:
  - type: Edible
  - type: FlavorProfile
    flavors:
    - chewy
    - bitter
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: MindbreakerToxin
          Quantity: 2

# special crayons

- type: entity
  parent: Crayon
  id: CrayonMime
  name: "мімічна крейда"
  components:
  - type: Sprite
    state: mime
  - type: Item
    heldPrefix: mime
  - type: Crayon
    color: white
  - type: Tag
    tags:
    - Write
    - Crayon
    - CrayonWhite
    - Recyclable
    - Trash

- type: entity
  parent: Crayon
  id: CrayonRainbow
  name: "райдужна крейда"
  components:
  - type: Sprite
    state: rainbow
  - type: Item
    heldPrefix: rainbow
  - type: Crayon
    color: Red
    selectableColor: true
  - type: LimitedCharges
    maxCharges: 30

- type: entity
  parent: CrayonRainbow
  id: CrayonInfinite # should not be player available to prevent decal spam
  categories: [ DoNotMap ]
  name: "нескінченна крейда"
  components:
  - type: Crayon
    deleteEmpty: false
  - type: AutoRecharge
    rechargeDuration: 5

- type: entity
  parent: CrayonInedible
  id: CrayonBorg
  name: "електрична крейда"
  description: "Нібито найсмачніший тип крейди в усіх всесвітах; на жаль, ви не можете її з'їсти."
  components:
  - type: Sprite
    state: electric
  - type: Item
    heldPrefix: electric
  - type: Crayon
    deleteEmpty: false
    color: Red
    selectableColor: true
  - type: AutoRecharge
    rechargeDuration: 5


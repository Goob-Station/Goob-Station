#START SET SELECTION
- type: entity
  id: ChaplainUndeterminedBible
  name: "маяк блюспейс-писання"
  description: "Хоч я і йду долиною тіні смертної, не злякаюся зла, бо Ти зі мною."
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/scripturebeacon.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BibleSet
    - QuaranSet
    - TanakhSet
    - NTEmployeeHandbookSet #Pirate changes atheist
    - ClockworkSet
    - BibleVedaSet
    - VelesBookSet
    maxSelectedSets: 1

- type: selectableSet
  id: BibleSet
  name: "Свята Біблія"
  description: "Розірви будь-який зв'язок, крім тих, що прив'язують мене до твоєї служби і до твого серця."
  sprite:
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  content:
  - Bible

- type: selectableSet
  id: QuaranSet
  name: "Коран"
  description: "Тож які з милостей Господа вашого ви ˹люди і джини˺ обидва заперечите?"
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
    state: icon
  content:
  - BibleQuaran

- type: selectableSet
  id: TanakhSet
  name: "Свитки Танаху"
  description: "Навчаючи, ти вчишся."
  sprite:
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    state: scroll2
  content:
  - BibleTanakh

- type: selectableSet
  id: ClockworkSet
  name: "Годинникова плита"
  description: "Зв'язок між вами та Небесним Покинутим. Містить інформацію, декламує писання і є вашим найважливішим інструментом як Служителя."
  sprite:
    sprite: _ShitChap/Objects/clockwork_slab.rsi
    state: icon
  content:
  - BibleSlabClockwork

- type: selectableSet
  id: BibleVedaSet
  name: "Слов'яно-арійські Веди"
  description: "Слов'янські неоязичництва."
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/veda.rsi
    state: icon
  content:
  - BibleVeda

- type: selectableSet
  id: VelesBookSet
  name: "Книга Велеса"
  description: "Основа й доказ неоязичницької релігійності."
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/veles_book.rsi
    state: icon
  content:
  - BibleVelesBook
##END SET SELECTION

- type: entity
  name: "біблія"
  description: "Нова міжзоряна версія 2340."
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      groups:
        Brute: -15
        Burn: -15
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 15
    damageOnUnholyUse: ## Pirate - What an unholy creature takes when picking up the bible
      groups:
        Burn: 20
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 5 # Goobstation - bro wtf
        Blunt: 1
  #- type: Prayable - no, use the altar
  #  bibleUserOnly: true
  - type: AlternatePrayable # Goobstation
    requireBibleUser: false
  - type: Summonable
    specialItem: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Material
  #  - type: Tag
  #    tags:
  #    - Bible
  #  - type: StealTarget
  #    stealGroup: Bible
  - type: EnchantingTool # Goobstation
  - type: StatusEffectOnCollideGhost # Goobstation
    whitelist:
      tags:
      - WeakToSalt
    statusEffect: Corporeal
    duration: 5

- type: entity
  parent: [Bible]
  name: "некрономікон"
  description: "Там є примітка: Klatuu, Verata, Nikto - не забудьте її знову!"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    locPrefix: "necro"
    healSound: "/Audio/Effects/lightburn.ogg"
  - type: Summonable
    specialItem: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  parent: BaseAction

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseHandheldGrinder
  components:
  - type: SolutionContainerManager
    solutions:
      grinderOutput:
        maxVol: 20
  - type: SolutionTransfer
  - type: DrawableSolution
    solution: grinderOutput
  - type: RefillableSolution
    solution: grinderOutput
  - type: DrainableSolution
    solution: grinderOutput
  - type: Edible
    edible: Drink
    solution: grinderOutput
    destroyOnEmpty: false
    utensil: Spoon
  - type: MixableSolution
    solution: grinderOutput
  - type: ExaminableSolution
    solution: grinderOutput
    exactVolume: true
  - type: SolutionItemStatus
    solution: grinderOutput
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: fill-
  - type: DnaSubstanceTrace
  - type: Damageable
    damageContainer: Inorganic
  - type: Spillable
    solution: grinderOutput
  - type: Appearance
  - type: HandheldGrinder

# Mortars
- type: entity
  parent: BaseHandheldGrinder
  id: MortarAndPestle
  name: "ступка й товкач"
  description: "Використовується для подрібнення невеликих кількостей предметів."
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/mortar_and_pestle.rsi
    layers:
    - state: icon
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
  - type: HandheldGrinder
    finishedPopup: handheld-grinder-grinded

- type: entity
  parent: MortarAndPestle
  id: MortarAndPestleMakeshift
  name: "саморобна ступка й товкач"
  description: "Використовується для подрібнення невеликих кількостей предметів. Гірша версія, зроблена з дерева."
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/mortar_and_pestle.rsi
    layers:
    - state: makeshift_icon
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
  - type: Item
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: HandheldGrinder
    doAfterDuration: 6
  - type: Construction
    graph: MakeshiftMortarAndPestle
    node: mortarAndPestle

# Juicers
- type: entity
  parent: BaseHandheldGrinder
  id: HandheldJuicer
  name: "ручна соковижималка"
  description: "Використовується для вичавлювання соку з невеликих кількостей предметів."
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/handheld_juicer.rsi
    layers:
    - state: juicer_base
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
    - state: cap
  - type: HandheldGrinder
    finishedPopup: handheld-grinder-juiced
    sound: !type:SoundPathSpecifier
      path: /Audio/Items/Culinary/juicer_juicing.ogg # Pasta mixing sound. Close enough.
      params:
        loop: true
    program: Juice

- type: entity
  parent: HandheldJuicer
  id: HandheldJuicerMakeshift
  name: "саморобна соковижималка"
  description: "Використовується для вичавлювання соку з невеликих кількостей предметів. Гірша версія, зроблена з дерева."
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/handheld_juicer.rsi
    layers:
    - state: makeshift_base
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
    - state: cap
  - type: Item
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: HandheldGrinder
    doAfterDuration: 6
  - type: Construction
    graph: MakeshiftJuicer
    node: juicer

# Construction
- type: entity
  name: "незавершена ступка й товкач"
  parent: BaseItem
  id: IncompleteMortarAndPestle
  description: "Кілька дерев'яних дощок, скріплених разом."
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/mortar_and_pestle.rsi
    state: makeshift_base
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: Construction
    graph: MakeshiftMortarAndPestle
    node: incompleteMortarAndPestle

- type: entity
  name: "незавершена ручна соковижималка"
  parent: BaseItem
  id: IncompleteHandheldJuicer
  description: "Трохи дерева й пластику, скріплених разом."
  components:
  - type: Sprite
    sprite: Objects/Specific/Kitchen/handheld_juicer.rsi
    state: makeshift_base
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: makeshift-inhand-left
      right:
      - state: makeshift-inhand-right
  - type: Construction
    graph: MakeshiftJuicer
    node: incompleteJuicer

- type: entity
  name: "міні мотика"
  parent: BaseItem
  id: HydroponicsToolMiniHoe
  description: "Використовується для видалення бур'янів або чухання спини."
  components:
  - type: Tag
    tags:
    - Hoe
    - BotanyHoe
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hoe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 6
  - type: Item
    sprite: Objects/Tools/Hydroponics/hoe.rsi
    storedRotation: -135
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: "садові ножниці"
  parent: BaseItem
  id: HydroponicsToolClippers
  description: "Інструмент, що використовується для відбору зразків з рослин."
  components:
  - type: Tag
    tags:
    - PlantSampleTaker
    - HydroponicsToolClippers # Einstein Engines
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 90
    damage:
      types:
        Slash: 7
  - type: Item
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    storedRotation: -90
  - type: Retractor # Shitmed: Same as wirecutters
    speed: 0.35
  - type: Hemostat
    speed: 0.6
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor2.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  # Goobstation changes
  - type: Tool
    qualities:
    - Cutting
    useSound:
      path: /Audio/Items/wirecutter.ogg
    speedModifier: 0.25

- type: entity
  name: "коса"
  parent: BaseItem
  id: HydroponicsToolScythe
  description: "Гостре та вигнуте лезо на довгій фіброволоконній ручці - цей інструмент дозволяє легко пожинати те, що ви посіяли."
  components:
  - type: Sharp
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    damage:
      types:
        Slash: 10
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    slots:
    - back
  - type: StaticPrice
    price: 40
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100

- type: entity
  name: "сокирка"
  parent: BaseItem
  id: HydroponicsToolHatchet
  description: "Дуже гостре лезо сокири на короткому руків'ї з фібрового металу. Має давню історію рубання речей, але зараз використовується для рубання деревини."
  components:
  - type: Tag
    tags:
    - BotanyHatchet
  - type: Sharp
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 8
        Piercing: 2
  - type: Item
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    storedRotation: -135
  - type: BoneSaw # Shitmed
    speed: 0.35
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/saw.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: "лопатка"
  parent: BaseItem
  id: HydroponicsToolSpade
  description: "Невеликий інструмент для копання та переміщення ґрунту."
  components:
  - type: Tag
    tags:
    - BotanyShovel
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/spade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 8
        Piercing: 2 # I guess you can stab it into them?
    soundHit:
      collection: MetalThud
  - type: Item
    sprite: Objects/Tools/Hydroponics/spade.rsi
    storedRotation: -45
  - type: Shovel
    speedModifier: 0.75 # slower at digging than a full-sized shovel
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: "мішок для рослин"
  id: PlantBag
  parent: BaseStorageItem
  description: "Сумка для ботаніків, щоб легко переносити свої величезні врожаї."
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/Equipment/plant_bag.rsi
    state: icon
  - type: Item
    storedRotation: -90
  - type: Clothing
    quickEquip: false
    slots:
    - belt
  - type: Storage
    grid:
    - 0,0,7,4
    maxItemSize: Small
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
        - Produce
        - Seed
  - type: Dumpable
  - type: RelayInteractionStorage # Goobstation
    whitelist:
      components:
      - ProduceMaterialExtractor

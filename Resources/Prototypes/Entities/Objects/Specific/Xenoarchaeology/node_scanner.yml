- type: entity
  parent: BaseItem
  id: NodeScanner
  name: "сканер вузлів"
  description: "Друг археолога, здатний ідентифікувати вузол артефакту лише за допомогою одного сканування."
  components:
    - type: Sprite
      sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
      state: icon
    - type: Item
      sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    - type: NodeScanner
    - type: UseDelay
      delay: 1
    - type: GuideHelp
      guides:
      - Xenoarchaeology
    - type: PhysicalComposition #Goobstation - Recycle update
      materialComposition:
        Steel: 25
        Plastic: 12
    - type: ActivatableUI
      key: enum.NodeScannerUiKey.Key
      singleUser: true
    - type: UserInterface #needs to be here for certain effects
      interfaces:
        enum.NodeScannerUiKey.Key:
          type: NodeScannerBoundUserInterface

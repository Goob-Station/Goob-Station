- type: entity
  abstract: true
  parent: BaseItem
  id: BaseHypospray
  components:
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: Spillable
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: Appearance

- type: entity
  parent: [BaseHypospray, BaseGrandTheftContraband]
  id: Hypospray
  name: "гіпоспрей"
  description: "Стерильний ін'єктор для швидкого введення ліків пацієнтам."
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
  - type: RefillableSolution
    solution: hypospray
  - type: UseDelay
    delay: 0.5
  - type: StaticPrice
    price: 750
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: Hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
  parent: [BaseHypospray, BaseSyndicateContraband]
  id: SyndiHypo
  name: "гіпоспрей Gorlex"
  description: "Стерильний інжектор для швидкого введення ліків. Розроблений зворотною інженерією за дизайнами Nanotrasen, Cybersun виробляє їх обмеженими партіями для корпсменів Gorlex Marauders."
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/syndihypo.rsi
    layers:
      - state: hypo
        map: ["enum.SolutionContainerLayers.Base"]
      - state: hypo_fill1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: Objects/Specific/Medical/syndihypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
  parent: BaseHypospray
  id: BorgHypo
  name: "боргогіпо"
  description: "Стерильний інжектор для швидкого введення ліків пацієнтам. Ця вбудована модель спеціалізована для використання медичними боргами."
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: borghypo
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: borghypo_fill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 10
  - type: RefillableSolution
    solution: hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: borghypo_fill
    solutionName: hypospray
  - type: UseDelay
    delay: 0.5

- type: entity
  parent: BaseHypospray
  id: JetInjector
  name: "струменевий інжектор"
  description: "Стерильний інжектор для зручного введення ліків пацієнтам."
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/jetinjector.rsi
    layers:
    - state: jetinjector_base
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: jetinjector_filled1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/jetinjector.rsi
  - type: UseDelay
    delay: 1.5
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: jetinjector_filled
    solutionName: hypospray
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: null # Inject everything on injection.
    activeModeProtoId: JetInjectorDynamicMode
    allowedModes:
    - JetInjectorDynamicMode
    - JetInjectorInjectMode

- type: entity
  parent: JetInjector
  id: AdvancedJetInjector
  name: "просунутий струменевий інжектор"
  description: "Бездоганний, модний, високоякісний інжектор. Дозволяє швидше вводити речовини й має трохи більшу місткість."
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/advanced_jetinjector.rsi
    layers:
    - state: jetinjector_base
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: jetinjector_filled1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/advanced_jetinjector.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: SolutionContainerVisuals
    maxFillLevels: 4
  - type: Injector
    activeModeProtoId: AdvancedJetInjectorDynamicMode
    allowedModes:
    - AdvancedJetInjectorDynamicMode
    - AdvancedJetInjectorInjectMode

- type: entity
  parent: SyndiHypo
  id: AdminHypo
  name: "експериментальний гіпоспрей"
  suffix: Admeme
  description: "Максимальне застосування технології bluespace та швидкого введення хімікатів."
  components:
    - type: SolutionContainerManager
      solutions:
        hypospray:
          maxVol: 3000
    - type: UseDelay
      delay: 0.0

- type: entity
  parent: BaseHypospray
  id: ChemicalMedipen
  name: "хімічний медіпен"
  description: "Однодозовий медіпен, який не можна перезаправити."
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: firstaid
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    sprite: Objects/Specific/Medical/medipen.rsi
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#439822"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#439822"
      - state: base-colorB-inhand-right
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20 # Goobstation
  - type: ExaminableSolution
    solution: pen
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: firstaid_empty
  - type: PhysicalComposition
    materialComposition:
      Plastic: 25
  - type: SpaceGarbage
  - type: StaticPrice
    price: 75 # These are limited supply items.
  - type: Tag
    tags:
    - Medipen
  - type: TrashOnSolutionEmpty
    solution: pen
  - type: CosmicTransmutable # DeltaV - cosmic cult
    transmutesTo: CosmicMedipen
    requiredGlyphType: CosmicGlyphBlades # Well I mean it DOES have a needle in it

- type: entity
  parent: ChemicalMedipen
  id: EmergencyMedipen
  name: "екстрена медична ручка"
  description: "Швидкий та безпечний спосіб лікування незначних пошкоджень, зупинки кровотечі та стабілізації пацієнтів для персоналу без глибоких медичних знань." # goobstation
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15 # Goobstation
        reagents:
        - ReagentId: Epinephrine # Goobstation
          Quantity: 5
        - ReagentId: Atropine # Goobstation
          Quantity: 5
        - ReagentId: TranexamicAcid # Goobstation
          Quantity: 5
  - type: Tag
    tags:
    - Medipen
    - EmergencyMedipen
    - Trash


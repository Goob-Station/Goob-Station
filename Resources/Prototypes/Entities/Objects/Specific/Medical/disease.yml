- type: entity
  parent: BaseItem
  id: DiseaseSwab
  name: "стерильний тампон"
  description: "Використовується для взяття та перенесення зразків. Стерильний до відкриття. Одноразового використання."
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Tag
    tags:
    - Recyclable
    - Trash
  - type: BotanySwab
  - type: GuideHelp
    guides:
  # - Virology (when it's back)
    - Botany
    - Chemicals
  - type: DiseaseSwab # Goobstation

- type: entity
  parent: BaseAmmoProvider # this is for cycling swabs out and not spawning 30 entities, trust
  id: BoxMouthSwab
  name: "дозатор стерильних мазків"
  description: "Видає 30 стерильних мазків, надзвичайно корисних для ботаніки."
  components:
  - type: Sprite
    layers:
    - state: boxwide
    - state: swab
  - type: BallisticAmmoProvider
    whitelist:
      components:
      - BotanySwab
    proto: DiseaseSwab
    capacity: 30
  - type: GuideHelp
    guides:
  # - Virology (when it's back)
    - Botany
    - Chemicals

- type: entity
  parent: BaseItem
  id: Vaccine
  name: "вакцина"
  description: "Запобігає зараженню людей, які ще не мають хвороби."
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    # <Goobstation>
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: salpen
  - type: Appearance
  - type: DiseasePen
  - type: GenericVisualizer
    visuals:
      enum.DiseasePenVisuals.Used:
        salpen:
          True: { state: salpen_empty }
          False: { state: salpen }
  # </Goobstation>

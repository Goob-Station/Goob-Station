- type: entity
  name: "бейсбольна біта"
  parent: [BaseItem, BaseMinorContraband]
  id: BaseBallBat
  description: "Міцна бейсбольна бита."
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
  - type: MeleeWeapon
    animationRotation: -135 # WWDP
    heavyStaminaCost: 15 # goob edit
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Structural: 5
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Structural: 10
  - type: StaminaDamageOnHit # goob - bat makes you hurt and tired (but not as much as the real stun stick)
    damage: 12 # goob - 8 hits to stamcrit someone with armor vest + helmet
  - type: MeleeThrowOnHit # Goobstation
    distance: 1
    speed: 5
  - type: Item
    size: Large # Goob edit
    storedRotation: 90 # Goob
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.75 # a bit unwieldly but does the job
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Construction
    graph: WoodenBat
    node: bat
  - type: UseDelay
    delay: 1
  - type: PhysicalComposition
    materialComposition:
      Wood: 250
  - type: Tag
    tags:
    - BaseballBat
  - type: UndetectableContraband #Goobstation-Contraband detector

- type: entity
  name: "незавершена бейсбольна біта"
  parent: BaseItem
  id: IncompleteBaseBallBat
  description: "Кілька дерев'яних дощок, скріплених разом."
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: WoodenBat
    node: incompleteBat

- type: entity
  name: "ударна палиця"
  parent: BaseBallBat
  id: WeaponMeleeKnockbackStick
  description: "А потім у нього почалася кровотеча."
  categories: [ DoNotMap ]
  components:
  - type: MeleeThrowOnHit
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 1

- type: entity
  id: ProjectileFireball
  name: "вогняна куля"
  description: "Тобі краще зважитися."
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Heat: 10
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: TriggerOnCollide
    fixtureID: projectile
    maxTriggers: 1
  - type: Explosive
    explosionType: Default
    maxIntensity: 3.5 # Goob edit
    intensitySlope: 3 # Goob edit
    totalIntensity: 28 # Gobo edit
    maxTileBreak: 0
  - type: IgnitionSource
    temperature: 400
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 0.35
  - type: Ammo # Goobstation
    muzzleFlash: null
  - type: FlashOnTrigger # Goobstation
    duration: 4
    range: 1.8
  - type: Flashbang # Goobstation
    stunTime: 1
    knockdownTime: 6
  - type: Reflective
    reflective: Magic
  - type: Tag # Goobstation
    tags:
      - FlashIgnoreResistances

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletTrigger
  id: ProjectileDragonsBreath
  name: "дихання дракона"
  description: "Намагайтеся не підсмажитися."
  components:
  - type: PointLight
    color: "#E25822"
    radius: 3.0
    energy: 5.0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Reflective
    reflective: Magic
  - type: IgnitionSource
    temperature: 1000
    ignited: true
  - type: RepeatingTrigger
    delay: 0.5 # line of fire as well as if it hits something
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: FireBomb
    totalIntensity: 5 # low intensity, the point is to burn attackers not to break open walls, dragons can just eat them
    intensitySlope: 1
    maxIntensity: 3
    canCreateVacuum: false
    deleteAfterExplosion: false
    repeatable: true
  - type: TimedDespawn
    lifetime: 5

- type: entity
  id: ProjectileAnomalyFireball
  name: "вогняна куля"
  description: "Згусток полум'я, що висить у повітрі."
  parent: ProjectileFireball
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective: Magic
  - type: TimedDespawn
    lifetime: 30
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 0.1
    totalIntensity: 0.3
    maxTileBreak: 0

- type: entity
  id: ProjectileLocker
  name: "проклята шафка"
  description: "Проклята магічна шафка! Зможеш встояти?"
  parent: ClosetSteelBase
  categories: [ HideSpawnMenu ]
  components:
  - type: MagicDamageSource # Pirate changes
  - type: ResistLocker
    resistTime: 60 # Goob edit
  - type: Ammo # Goobstation
    muzzleFlash: null
  - type: FadingTimedDespawn # Goobstation
    lifetime: 120
    fadeOutTime: 5
  - type: StoreOnCollide
    lockOnCollide: true
    disableWhenFirstOpened: true
    disableOnSleep: true # Goobstation
    whitelist:
      components:
        - MobState
  - type: LockVisuals
    stateLocked: cursed_door
    stateUnlocked: decursed_door
  - type: Lock
    breakOnAccessBreaker: false
  - type: AccessReader
    access: [["Wizard"]]
    breakOnAccessBreaker: false
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Brute: 0
  - type: Sprite
    noRot: true
    sprite: Structures/Storage/closet.rsi
    layers:
    - state: cursed
      map: [ "enum.StorageVisualLayers.Base" ]
    - state: decursed_door
      map: [ "enum.StorageVisualLayers.Door" ]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: [ "enum.PaperLabelVisuals.Layer" ]
    - state: cursed_door
      map: [ "enum.LockVisualLayers.Lock" ]
    - state: welded
      visible: false
      map: [ "enum.WeldableLayers.BaseWelded" ]
  #TODO: Will have to eventually make a custom visualizer for cursed lockers
  - type: EntityStorageVisuals
    stateBaseClosed: decursed
    stateDoorOpen: decursed_open
    stateDoorClosed: decursed_door
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by: &flybyfixture
        shape: !type:PhysShapeCircle
          radius: 0.6
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false

- type: entity
  id: ProjectilePolyboltBase
  abstract: true
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_green # Goob edit
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Poison: 0 # Goob edit
  - type: TriggerOnCollide
    fixtureID: projectile
    # Projectile.DeleteOnCollide is true, but allow this to hit multiple entities if they're
    # stacked up (they will all trigger a collide), so this isn't frustrating to use
    maxTriggers: null
  - type: PolymorphOnTrigger
    targetUser: true
  - type: Reflective # Goobstation
    reflective: Magic
  - type: Ammo # Goobstation
    muzzleFlash: null
  - type: Trail # Goobstation
    lerpTime: 0.05
    frequency: 0.02
    lifetime: 1
    alphaLerpAmount: 0.4
    shader: unshaded
    sprite:
      sprite: /Textures/Objects/Weapons/Guns/Projectiles/magic.rsi
      state: magicm_green


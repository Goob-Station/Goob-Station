# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  name: G3
  parent: [BaseWeaponRifle, BaseGunWieldable]
  id: WeaponRifleG3
  description: G3 is a heavy battle rifle made for the german army uses 7.62x51
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/G3.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -10
  - type: Gun
    minAngle: 4
    maxAngle: 19
    angleIncrease: 6
    angleDecay: 80
    fireRate: 6
    shotsPerBurst: 3
    availableModes:
    - Burst
    - FullAuto
    - SemiAuto
    soundGunshot:
      collection: G3Fire
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/G3/rack.ogg
    soundBoltClosed:
      path: /Audio/Weapons/Guns/G3/chamber.ogg
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/G3.rsi
  - type: Item
    sprite: Objects/Weapons/Guns/Rifles/G3.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: G3MagazineRifle
        insertSound: /Audio/Weapons/Guns/G3/magin.ogg
        ejectSound: /Audio/Weapons/Guns/G3/magout.ogg
        priority: 2
        whitelist:
          tags:
          - G3MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x51FMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge762x51FMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance


# Rockets

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: CartridgeRocket
  name: "Граната ПГ-7ВЛ"
  description: "Боєголовка калібру 1,5, призначена для пускової установки РПГ-7. Має трубчасту форму."
  components:
  - type: Tag
    tags:
      - CartridgeRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: BulletRocket
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: rpg
  - type: StaticPrice
    price: 20

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: CartridgeRocketSlow
  name: "Граната ПГ-7ВЛ \"Ракета-равлик\""
  description: "Боєголовка калібру 1,5, розроблена для пускової установки РПГ-7. Надзвичайно повільна."
  components:
    - type: Tag
      tags:
        - CartridgeRocket
    - type: Item
      size: Small
    - type: CartridgeAmmo
      proto: BulletWeakRocket
      deleteOnSpawn: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: frag
    - type: StaticPrice
      price: 20

- type: entity
  id: CartridgeRocketSingularityBuster
  name: "ракета з анти-сингулярною гранатою"
  parent: [BaseItem, BaseCommandContraband]
  description: "Боєголовка, що містить велику кількість античастинок. При попаданні в сингулярність античастинки вивільняються, розкладаючи сингулярність. Гарантія анулюється, якщо ракета влучить у щось, крім сингулярності або тесли."
  components:
    - type: Item
      size: Small
    - type: CartridgeAmmo
      proto: BulletSingularityBusterRocket
      deleteOnSpawn: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: buster
    - type: Tag
      tags:
      - CartridgeRocket

# Grenades

- type: entity

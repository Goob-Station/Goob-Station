  - type: Tag
    tags:
      - Pistolmagazine5.7x28
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge57x28FMJ
    capacity: 14
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/FiveSeven.rsi
    layers:

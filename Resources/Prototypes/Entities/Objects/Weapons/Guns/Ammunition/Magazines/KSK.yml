# Empty mags
- type: entity
  parent: BaseMagazineRifle
  id: MagazineShotgunKSK
  name: "KS-K magazine (12 Gauge buckshot)"
  description: 8 round 12 gauge magazine for the KS-K automatic shotgun.
  components:
  - type: Tag
    tags:
    - MagazineShotgunKSK
  - type: BallisticAmmoProvider
    proto: 12GaugeBuckshot
    mayTransfer: true
    whitelist:
      tags:
      - 12GaugeShell
      - 12GaugeBuckshot
    capacity: 8
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Shotgun/KSK.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

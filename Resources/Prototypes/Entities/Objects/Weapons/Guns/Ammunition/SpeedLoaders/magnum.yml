- type: entity
  abstract: true
  parent: [ BaseItem, BaseSecurityContraband ]
  id: BaseSpeedLoaderMagnum
  name: "швидкозарядник (.45 magnum)"
  components:
  - type: Tag
    tags:
      - SpeedLoaderMagnum
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 6
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnum
  name: "швидкозарядник (.45 magnum)"
  description: "Створений для швидкого заряджання до шести набоїв .45 magnum у порожній револьвер. Призначений для універсальних кінетичних боєприпасів."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnum
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-ammo
      right:
      - state: inhand-right-mag
      - state: inhand-right-ammo

- type: entity
  parent: SpeedLoaderMagnum
  id: SpeedLoaderMagnumEmpty
  name: "спідлоадер (.45 магнум будь-які)"
  suffix: empty
  description: "Створений для швидкого заряджання до шести набоїв .45 магнум у порожній револьвер."
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      # TODO: This is actually a issue with all the speed loaders:
      #       You can mix different ammo types, but it will always
      #       use the one it was printed for.
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: SpeedLoaderMagnum
  id: SpeedLoaderMagnumIncendiary
  name: "спідлоадер (.45 магнум запалювальні)"
  description: "Створений для швидкого заряджання до шести набоїв .45 магнум у порожній револьвер. Призначений для самозаймистих запалювальних набоїв."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumIncendiary

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnumPractice
  name: "швидкозарядник (.45 magnum тренувальний)"
  description: "Створений для швидкого заряджання до шести набоїв .45 magnum у порожній револьвер. Призначений для нешкідливих тренувальних боєприпасів."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumPractice
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: practice-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: practice
    steps: 7
    zeroVisible: false
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-ammo
      - state: inhand-left-stripe
        color: "#ea5800"
      right:
      - state: inhand-right-mag
      - state: inhand-right-ammo
      - state: inhand-right-stripe
        color: "#ea5800"

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnumAP
  name: "швидкозарядник (.45 magnum бронебійний)"
  description: "Створений для швидкого заряджання до шести набоїв .45 magnum у порожній револьвер. Призначений для спеціалізованих бронебійних боєприпасів."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumAP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: piercing-6
        sprite: _Carpmosia/Objects/Weapons/Guns/Ammunition/SpeedLoaders/pistol_speed_loader.rsi
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: piercing
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnumUranium
  name: "швидкозарядник (.45 magnum урановий)"
  description: "Створений для швидкого заряджання до шести набоїв .45 magnum у порожній револьвер. Призначений для екзотичних боєприпасів з урановим осердям."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumUranium
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: uranium-6
        sprite: _Carpmosia/Objects/Weapons/Guns/Ammunition/SpeedLoaders/pistol_speed_loader.rsi
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: uranium
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox46x30
  name: ammunition box (4.6x30mm)
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  # Goobstation edit end
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      type: Tag
      tags:
        - ammuniton4.6x30mmbox
    proto: Cartridge46x30FMJ
    capacity: 70
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
    state: base
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBox46x30
  id: ammuniton4.6x30mmbox
  name: ammunition box (4.6x30mm FMJ)
  components:
  - type: BallisticAmmoProvider
    capacity: 60
    proto: Cartridge46x30FMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - type: MagazineVisuals
      magState: mag-2
      steps: 2
      zeroVisible: false
    - type: Appearance

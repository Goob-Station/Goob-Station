- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox9x19parabellum
  name: ammunition box (9x19 parabellum)
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  # Goobstation edit end
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      type: Tag
      tags:
        - ammuniton9x19parabellumbox
    proto: Cartridge9x19parabellum
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/9x19mm.rsi
    state: base
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBox9x19parabellum
  id: ammuniton9x19parabellumbox
  name: ammunition box (9x19 parabellum)
  components:
  - type: BallisticAmmoProvider
    capacity: 80
    proto: Cartridge9x19parabellum
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

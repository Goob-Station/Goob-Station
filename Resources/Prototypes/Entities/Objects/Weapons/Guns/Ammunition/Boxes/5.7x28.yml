- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox57x28
  name: ammunition box (5.7x28)
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  # Goobstation edit end
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      type: Tag
      tags:
        - Cartridge57x28FMJ
        - ammuniton5.7x28box
    proto: Cartridge57x28FMJ
    capacity: 70
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
    state: base
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBox57x28
  id: ammuniton5.7x28box
  name: ammunition box (5.7x28 FMJ)
  components:
  - type: BallisticAmmoProvider
    capacity: 60
    proto: Cartridge57x28FMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - type: MagazineVisuals
      magState: mag
      steps: 3
      zeroVisible: false
    - type: Appearance

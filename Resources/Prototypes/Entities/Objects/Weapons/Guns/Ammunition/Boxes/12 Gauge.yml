- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox12Gauge
  name: ammunition box (12 Gauge)
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  # Goobstation edit end
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      type: Tag
      tags:
        - 12GaugeShell
        - ammuniton12gaugebox
    proto: 12GaugeBuckshot
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/12_gauge.rsi
    state: base
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBox12Gauge
  id: ammuniton12gaugebox
  name: ammunition box (12 Gauge buckshot)
  components:
  - type: BallisticAmmoProvider
    capacity: 30
    proto: 12GaugeBuckshot
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox14.5x114
  name: ammunition box (14.5x114 FMJ)
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  # Goobstation edit end
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      type: Tag
      tags:
        - Cartridge145x114
        - ammunitonBox145x114
    proto: Cartridge145x114
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/anti_materiel.rsi
    state: base-b
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBox14.5x114
  id: ammunitonBox145x114
  name: ammunition box (14.5x114 FMJ)
  components:
  - type: BallisticAmmoProvider
    capacity: 15
    proto: Cartridge145x114
  - type: Sprite
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
    - state: magb-1
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: magb
    steps: 4
    zeroVisible: false
  - type: Appearance

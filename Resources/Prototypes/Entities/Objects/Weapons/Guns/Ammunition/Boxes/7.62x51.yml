- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox762x51
  name: ammunition box (7.62x51)
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  # Goobstation edit end
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      type: Tag
      tags:
        - Cartridge762x51FMJ
        - ammuniton762x51Box
    proto: Cartridge762x51FMJ
    capacity: 70
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/7.62x51mm.rsi
    state: base
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBox762x51

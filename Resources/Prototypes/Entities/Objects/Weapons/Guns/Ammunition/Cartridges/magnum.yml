  parent: [ BaseCartridge, BaseSecurityCommandContraband ] # Goob edit - captain's N1984
  id: BaseCartridgeMagnum
  name: "патрон (.45 magnum)"
  components:
  - type: Tag
    tags:
      - CartridgeMagnum
  - type: CartridgeAmmo
    proto: BulletMagnum
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnum
  name: "патрон (.45 magnum)"
  description: "Важкий патрон магнум, що переважно використовується револьверами. Стандартні кінетичні боєприпаси поширені та корисні в більшості ситуацій."
  components:
  - type: CartridgeAmmo
    proto: BulletMagnum

- type: entity
  parent: BaseCartridgeMagnum
  id: CartridgeMagnumPractice
  name: "патрон (.45 magnum тренувальний)"
  description: "Важкий патрон magnum, що переважно використовується револьверами. Тренувальні боєприпаси стріляють крейдяним снарядом, який трохи щипає, але не завдає тривалої шкоди."
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumPractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"


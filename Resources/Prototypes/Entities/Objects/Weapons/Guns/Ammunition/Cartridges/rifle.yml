- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeRifle
  name: "патрон (.20 rifle)"
  components:
  - type: Tag
    tags:
      - CartridgeRifle
  - type: CartridgeAmmo
    proto: BulletRifle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifle
  name: "патрон (.20 rifle)"
  description: "Сучасний проміжний патрон для бойових гвинтівок. Стандартні кінетичні боєприпаси поширені й корисні в більшості ситуацій."
  components:
  - type: CartridgeAmmo
    proto: BulletRifle

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRiflePractice
  name: "патрон (.20 rifle тренувальний)"
  description: "Сучасний проміжний патрон для бойових гвинтівок. Тренувальні боєприпаси стріляють крейдяним снарядом, який трохи щипає, але не завдає тривалої шкоди."
  components:
  - type: CartridgeAmmo
    proto: BulletRiflePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleIncendiary
  name: "патрон (.20 rifle запалювальний)"
  description: "Сучасний проміжний патрон для бойових гвинтівок. Запалювальні боєприпаси містять самозаймисту суміш, яка підпалює цілі."
  components:
  - type: CartridgeAmmo
    proto: BulletRifleIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleUranium
  name: "патрон (.20 rifle урановий)"
  description: "Сучасний проміжний патрон для бойових гвинтівок. Уранові боєприпаси замінюють свинцеве осердя кулі на подільний матеріал, опромінюючи цілі зсередини."
  components:
  - type: CartridgeAmmo
    proto: BulletRifleUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"
- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeLightRifle
  name: "патрон (.30 гвинтівковий)"
  components:
  - type: Tag
    tags:
    - CartridgeLightRifle
  - type: CartridgeAmmo
    proto: BulletLightRifle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRifle
  name: "патрон (.30 гвинтівковий)"
  description: "Класичний проміжний патрон, що використовується в багатьох бойових гвинтівках та легких кулеметах. Стандартні кінетичні боєприпаси поширені та корисні в більшості ситуацій."
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifle

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRiflePractice
  name: "патрон (.30 rifle тренувальний)"
  description: "Класичний проміжний патрон, що використовується багатьма бойовими гвинтівками та LMG. Тренувальні боєприпаси стріляють крейдяним снарядом, який трохи щипає, але не завдає тривалої шкоди."
  components:
  - type: CartridgeAmmo
    proto: BulletLightRiflePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRifleIncendiary
  name: "патрон (.30 rifle запалювальний)"
  description: "Класичний проміжний патрон, що використовується багатьма бойовими гвинтівками та LMG. Запалювальні боєприпаси містять самозаймисту суміш, яка підпалює цілі."
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  parent: BaseCartridgeLightRifle
  id: CartridgeLightRifleUranium
  name: "патрон (.30 rifle урановий)"
  description: "Класичний проміжний патрон, що використовується багатьма бойовими гвинтівками та LMG. Уранові боєприпаси замінюють свинцеве осердя кулі на подільний матеріал, опромінюючи цілі зсередини."
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"
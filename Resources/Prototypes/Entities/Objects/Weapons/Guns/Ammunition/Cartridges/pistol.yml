- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgePistol
  name: "патрон (.35 авто)"
  components:
  - type: Tag
    tags:
      - CartridgePistol
  - type: CartridgeAmmo
    proto: BulletPistol
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistol
  name: "патрон (.35 авто)"
  description: "Мабуть, найпопулярніший калібр на ринку, використовується всіма видами пістолетів та пістолетів-кулеметів. Стандартні кінетичні боєприпаси поширені та корисні в більшості ситуацій."
  components:
  - type: CartridgeAmmo
    proto: BulletPistol

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolPractice
  name: "патрон (.35 auto тренувальний)"
  description: "Мабуть, найпопулярніший калібр на ринку, який використовується всілякими пістолетами й пістолетами-кулеметами. Тренувальні боєприпаси стріляють крейдяним снарядом, який трохи щипає, але не завдає тривалої шкоди."
  components:
  - type: CartridgeAmmo
    proto: BulletPistolPractice
  -  type: Sprite
     layers:
       - state: base
         map: [ "enum.AmmoVisualLayers.Base" ]
       - state: tip
         map: [ "enum.AmmoVisualLayers.Tip" ]
         color: "#dbdbdb"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolIncendiary
  name: "патрон (.35 auto запалювальний)"
  description: "Мабуть, найпопулярніший калібр на ринку, який використовується всілякими пістолетами й пістолетами-кулеметами. Запалювальні боєприпаси містять самозаймисту суміш, яка підпалює цілі."
  components:
  - type: CartridgeAmmo
    proto: BulletPistolIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  id: CartridgePistolUranium
  name: "патрон (.35 auto урановий)"
  description: "Мабуть, найпопулярніший калібр на ринку, який використовується всілякими пістолетами й пістолетами-кулеметами. Уранові боєприпаси замінюють свинцеве осердя кулі на подільний матеріал, опромінюючи цілі зсередини."
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    proto: BulletPistolUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolSpent
  name: "патрон (.35 авто)"
  suffix: spent
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base-spent
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: SpentAmmoVisuals
  - type: CartridgeAmmo
    proto: BulletPistol
    spent: true
  - type: Tag
    tags:
    - CartridgePistol
    - Trash # surely theres a way to automatically add this...

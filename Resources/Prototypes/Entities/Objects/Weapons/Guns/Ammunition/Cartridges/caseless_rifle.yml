- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeCaselessRifle
  name: "патрон (9.5мм)" # Goob edit
  components:
  - type: Tag
    tags:
      - CartridgeCaselessRifle
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRifle
  name: "патрон (9.5мм HP)" # Goob edit
  description: "Малокаліберний патрон, що використовує безгільзову технологію, замінюючи звичайну латунну гільзу на затверділий пропелент. Стандартні кінетичні боєприпаси поширені та корисні в більшості ситуацій."
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRifle

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRiflePractice
  name: "патрон (9.5мм тренувальний)" # Goob edit
  description: "Малий калібр із безгільзовою технологією, що відмовляється від звичайної латунної гільзи на користь затверділого метального заряду. Тренувальні боєприпаси стріляють крейдяним снарядом, який трохи щипає, але не завдає тривалої шкоди."
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRiflePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

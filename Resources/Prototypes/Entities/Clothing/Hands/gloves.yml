- type: entity
  parent: [ClothingHandsBase, BaseToggleClothing, BaseHighlyIllegalContraband]
  id: ClothingHandsGlovesSpaceNinja
  name: "рукавички космічних ніндзя"
  description: "Ці чорні рукавички з нанопокриттям ізолюють від електрики та забезпечують вогнестійкість."
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/spaceninja.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: Clothing/Hands/Gloves/spaceninja.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-green}
          False: {state: icon}
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-nanomachines
  - type: FingerprintMask
  - type: Thieving
    stripTimeReduction: 1
    stealthy: true
  - type: ToggleClothing
    action: ActionToggleNinjaGloves
    disableOnUnequip: true
  - type: NinjaGloves
    abilities:
    - components:
      - type: BatteryDrainer
      # Goobstation - replaced shock with ninjutsu
      #- type: StunProvider
      #  noPowerPopup: ninja-no-power
      #  whitelist:
      #    components:
      #    - Stamina
      - type: EmagProvider
        whitelist:
          components:
          - Airlock
    - objective: StealResearchObjective
      components:
      - type: ResearchStealer
    - objective: TerrorObjective
      components:
      - type: CommsHacker
        threats: NinjaThreats
    - objective: MassArrestObjective
      components:
      - type: CriminalRecordsHacker


- type: entity
  parent: [ ClothingHandsButcherable, BaseMagicalContraband ] # goob edit - it's now magical contra
  id: ClothingHandsGlovesNorthStar
  name: "рукавички Північної Зірки"
  description: "Лише поглянувши на них, ви відчуваєте непереборне бажання набити комусь пику."
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/northstar.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/northstar.rsi
  - type: MeleeWeapon
    altDisarm: true
    attackRate: 10
    damage:
      types:
       Blunt: 3
       Slash: 3
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    #mustBeEquippedToUse: true # goob edit
    heavyStaminaCost: 0 # goob edit
    canWideSwing: false # goob edit
  - type: Fiber
    fiberMaterial: fibers-leather
    fiberColor: fibers-blue
  - type: FingerprintMask
  - type: MeleeSpeech
  - type: ActivatableUI
    key: enum.MeleeSpeechUiKey.Key
    verbOnly: true
  - type: Actions
  - type: UserInterface
    interfaces:
      enum.MeleeSpeechUiKey.Key:
        type: MeleeSpeechBoundUserInterface
  - type: StaticPrice
    price: 2500
  - type: Tag
    tags:
    - Kangaroo
    - WhitelistChameleon


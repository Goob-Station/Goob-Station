- type: entity
  abstract: true
  parent: Clothing
  id: UnsensoredClothingUniformBase
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/cloth_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/cloth_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/cloth_drop.ogg
      params:
        volume: -4
  # Goobstation edit end
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [innerclothing]
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 3
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 150
  - type: Edible
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Fiber
          Quantity: 30
      #region Pirate: stains
      stain:
        maxVol: 10
      #endregion Pirate: stains
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
    - Skirt # Goobstation
  #region Pirate: stains
  - type: Appearance
  - type: Stainable
    clothingVisuals:
      jumpsuit:
      - sprite: _Pirate/Effects/blood.rsi
        state: uniformblood
    iconVisuals:
    - sprite: _Pirate/Effects/blood.rsi
      state: uniformbloodicon
  #endregion Pirate: stains
  #region Pirate: wetness
  - type: Wettable
  #endregion Pirate: wetness

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: UnsensoredClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
  #region Pirate: stains
  - type: Stainable
    clothingVisuals:
      jumpsuit:
      - sprite: _Pirate/Effects/blood.rsi
        state: uniformblood
    iconVisuals:
    - sprite: _Pirate/Effects/blood.rsi
      state: uniformbloodicon
  #endregion Pirate: stains


- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: ClothingUniformBase
  components:
  - type: SuitSensor
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 1200
  - type: StationLimitedNetwork
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Cloth: 75
  - type: SuitSensorShockable # Goobstation
  # Pirate banking start
  - type: StaticPrice
    price: 50
  # Pirate banking end
  # Pirate clothingDelay start
  - type: Clothing
    equipDelay: 1.5
    unequipDelay: 1.2
  # Pirate clothingDelay end

- type: entity
  abstract: true
  parent: ClothingUniformBase
  id: ClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
  - type: Tag
    tags:
    - Skirt
    - ClothMade
    - WhitelistChameleon
  #region Pirate: stains
  - type: Stainable
    clothingVisuals:
      jumpsuit:
      - sprite: _Pirate/Effects/blood.rsi
        state: uniformblood
    iconVisuals:
    - sprite: _Pirate/Effects/blood.rsi
      state: uniformbloodicon
  #endregion Pirate: stains

# Goobstation

- type: entity
  abstract: true
  parent: BaseFoldable
  id: ClothingUniformFoldableBase
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: unfold-verb-clothing-jacket
    foldVerbText: fold-verb-clothing-jacket
  - type: FoldableClothing
    foldedEquippedPrefix: folded

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatHoodBioGeneral
  name: "біо капюшон"
  suffix: Generic
  description: "Капюшон, який захищає голову та обличчя від біологічних забруднень."
  components:
  - type: Sprite
    sprite: Clothing/Head/Hoods/Bio/general.rsi
  - type: Clothing
    sprite: Clothing/Head/Hoods/Bio/general.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: GroupExamine
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.9
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: HideLayerClothing
    layers:
      Hair: HEAD
      Snout: HEAD
      HeadTop: HEAD
      HeadSide: HEAD
  - type: Armor # Goob
    coverage:
    - Head
    modifiers:
      coefficients:
        Caustic: 0.75
  # Goobstation
  - type: DiseaseProtection
    # full prot with even a normal mask
    incoming:
      powerModifiers:
        Aerial: -0.8
      chanceMultipliers:
        Aerial: 0.5
    outgoing:
      powerModifiers:
        Aerial: -0.8
      chanceMultipliers:
        Aerial: 0.5


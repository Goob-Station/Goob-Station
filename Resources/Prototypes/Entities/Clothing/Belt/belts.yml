  - type: Sprite
    sprite: Clothing/Belt/wand.rsi
  - type: Clothing
    sprite: Clothing/Belt/wand.rsi
  - type: Storage
    grid:
    - 0,0,15,1
    whitelist:
      tags:
      - WizardWand
      #- WhitelistChameleon # Goob - wtf would you allow this for

## Holsters

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltHolster
  name: "наплічна кобура"
  description: "Кобура для носіння пістолета та набоїв. Попередження: тільки для крутих."
  components:
  - type: Sprite
    sprite: Clothing/Belt/holster.rsi
  - type: Clothing
    sprite: Clothing/Belt/holster.rsi
  - type: Storage
    grid:
    - 0,0,3,1
    # Goobstation start
    whitelist:
      components:
      - BallisticAmmoProvider
      - CartridgeAmmo
      tags:
      - EnergySpeedloader
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
      storagebase: !type:Container
        ents: []
  - type: ItemSlots
    slots:
      item:
        name: Handgun
        whitelist:
          tags:
          - Sidearm
  # Goobstation end

- type: entity
  parent: [ClothingBeltHolster, BaseSyndicateContraband] # Goob - inherit from regular holster
  id: ClothingBeltSyndieHolster
  name: "синдикатна наплічна кобура"
  description: "Глибока наплічна кобура, здатна вмістити багато видів балістики."
  components:
  - type: Sprite
    sprite: Clothing/Belt/syndieholster.rsi
  - type: Clothing
    sprite: Clothing/Belt/syndieholster.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,3,3
    whitelist:
      components:
      - Gun
      - BallisticAmmoProvider
      - CartridgeAmmo
      tags: # Goob
      - EnergySpeedloader
  - type: ItemSlots # Goob - hold ANY gun instead of just sidearms
    slots:
      item:
        name: Gun
        whitelist:
          components:
          - Gun
  - type: StaticPrice
    price: 500

## Webbing

# Weirdly the only webbing with a storage whitelist and item mapper.

- type: entity
  parent: ClothingBeltMedical
  id: ClothingBeltMedicalEMT
  name: "Пояс EMT"
  description: "Ідеально підходить для зберігання різного обладнання для екстреної медичної допомоги."
  components:
  - type: Sprite
    sprite: Clothing/Belt/emt.rsi
  - type: Clothing
    sprite: Clothing/Belt/emt.rsi

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltPlant
  name: "ботанічний пояс"
  description: "Ремінь, який використовується для зберігання більшості матеріалів для гідропоніки. Дивно, але не зелений."
  components:
  - type: Sprite
    sprite: Clothing/Belt/plant.rsi
  - type: Clothing
    sprite: Clothing/Belt/plant.rsi
  - type: Storage
    whitelist:
      tags:
      - PlantAnalyzer # Pirate
      - PlantSampleTaker
      - BotanyShovel
      - BotanyHoe
      - BotanyHatchet
      - PlantBGone
      - Bottle
      - Syringe
      - CigPack
      - Dropper
      components:
      - Seed
      - Smokable
      - HandLabeler
  - type: ItemMapper
    sprite: *BeltOverlay
    mapLayers:
      hatchet:
        whitelist:
          tags:
          - BotanyHatchet
      hydro: # Pirate
        whitelist:
          tags:
          - PlantAnalyzer
      hoe:
        whitelist:
          tags:
          - BotanyHoe
      secateurs: # We don't have secateurs and this looks similar enough.
        whitelist:
          tags:
          - BotanyShovel
      plantbgone:
        whitelist:
          tags:
          - PlantBGone
      bottle:
        whitelist:
          tags:
          - Bottle
  - type: Appearance


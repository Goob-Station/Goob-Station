- type: entity
  parent: [ClothingBeltStorageBase, ContentsExplosionResistanceBase, BaseSecurityContraband]
  id: ClothingBeltSecurity
  name: "ремінь безпеки"
  description: "Містить засоби захисту, такі як наручники та спалахи."
  components:
  - type: Sprite
    sprite: Clothing/Belt/security.rsi
  - type: Clothing
    sprite: Clothing/Belt/security.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.5 # Goobstation
  - type: Storage
    whitelist:
      tags:
      - CigPack
      - Taser
      - SecBeltEquip
      - Radio
      - Sidearm
      - MagazinePistol
      - MagazineMagnum
      - CombatKnife
      - Truncheon
      - BolaEnergy # Goobstation
      - EnergySpeedloader # Goobstation
      - MilitaryPowerCell # Goobstation
      - EnergyMagAmmo # Goobstation
      - HandGrenade
      components:
      - Stunbaton
      - FlashOnTrigger
      - SmokeOnTrigger
      - Flash
      - Handcuff
      - BallisticAmmoProvider
      - CartridgeAmmo
      - DoorRemote
      - Whistle
      - BalloonPopper
      - ScatteringGrenade # Goobstation
  - type: ItemMapper
    sprite: *BeltOverlay
    mapLayers:
      flashbang:
        whitelist:
          components:
          - FlashOnTrigger
      stunbaton:
        whitelist:
          components:
          - Stunbaton
      tear_gas_grenade:
        whitelist:
          components:
          - SmokeOnTrigger
  - type: Appearance
  - type: EmitsSoundOnMove # Pirate: gear step sounds
    soundCollection: # Pirate: gear step sounds
      collection: PirateFootstepTacticalWebbing # Pirate: gear step sounds
      params: # Pirate: gear step sounds
        volume: -10 # Pirate: gear step sounds

  - type: Clothing
    sprite: Clothing/Belt/medical.rsi
  - type: Storage
    whitelist:
      tags:
      - Wrench
      - Bottle
      - Spray
      - Brutepack
      - Bloodpack
      - Gauze
      - Ointment
      - Tourniquet
      - CigPack
      - PillCanister
      - Radio
      - DiscreteHealthAnalyzer
      - SurgeryTool
      - Dropper
      - Tourniquet #Goobstation
      - MedicalPatch # Goobstation
      - AutoinjectorCartridge # Goobstation
      - HandheldCrewMonitor # Goobstation
      - Hypospray
      components:
      - Injector
      - Pill
      - HandLabeler
      - SurgeryTool # Shitmed Change
      - Defibrillator # Goobstation
      - SyringeGun # Goobstation
      - GunApplySolution # Goobstation - Syndicate dart gun
  - type: ItemMapper
    sprite: *BeltOverlay
    mapLayers:
      bottle:
        whitelist:
          tags:
          - Bottle
      hypo:
        whitelist:
          tags:
          - Hypospray
          - Injector
      pill:
        whitelist:
          components:

# Belts meant to be used by a specific job to hold their tools

- type: entity
  abstract: true
  parent: ClothingBeltStorageBase
  id: BaseClothingBeltEngineering
  components:
  - type: Storage
    # Don't add more than absolutely needed to this whitelist!
    # Utility belts shouldn't just be free extra storage.
    # This is only intended for basic engineering equipment.
    whitelist:
      tags:
      - Powerdrill
      - Wirecutter
      - Crowbar
      - Screwdriver
      - Flashlight
      - Wrench
      - GeigerCounter
      - Flare
      - CableCoil
      - CigPack
      - Radio
      - HolofanProjector
      - Multitool
      - AppraisalTool
      - JawsOfLife
      - GPS
      - WeldingMask
      - RemoteSignaller
      - UtilityKnife
      - Hammer # Goobstation
      - Nailgun # Goobstation
      - MagazineNailgun # Goobstation
      - MesonGoggles # Goobstation
      components:
      - StationMap
      - SprayPainter
      - SprayPainterAmmo
      - NetworkConfigurator
      - RCD
      - RCDAmmo
      - Welder
      - PowerCell
      - Geiger
      - TrayScanner
      - GasAnalyzer
      - HandLabeler
      - RadarConsole # Goobstation
  - type: ItemMapper
    sprite: &BeltOverlay Clothing/Belt/belt_overlay.rsi
    mapLayers:
      drill:
        whitelist:
          tags:
          - Powerdrill
      cutters_red:
        whitelist:
          tags:
          - Wirecutter
      crowbar:
        whitelist:
          tags:
          - Crowbar
      crowbar_red:
        whitelist:
          tags:
          - CrowbarRed
      jaws:
        whitelist:
          tags:
          - JawsOfLife
      screwdriver_nuke:
        whitelist:
          tags:
          - Screwdriver
      wrench:
        whitelist:
          tags:
          - Wrench
      multitool:
        whitelist:
          tags:
          - Multitool
      weldmask:
        whitelist:
          tags:
          - WeldingMask
      mass_scanner:
        whitelist:
          tags:
          - GPS
          components:
          - RadarConsole
      meson:
        whitelist:
          tags:
          - MesonGoggles
  - type: Appearance

- type: entity
  parent: BaseClothingBeltEngineering
  id: ClothingBeltUtility
  name: "поясний ремінь"
  description: "Може вміщати різні речі."
  components:
  - type: Sprite
    sprite: Clothing/Belt/utility.rsi
  - type: Clothing
    sprite: Clothing/Belt/utility.rsi
  - type: Tag
    tags:
    - UtilityBelt
    - WhitelistChameleon

- type: entity
  parent: BaseClothingBeltEngineering
  id: ClothingBeltChiefEngineer
  name: "пояс головного інженера"
  description: "Тримає інструменти, виглядає шикарно."
  components:
  - type: Sprite
    sprite: Clothing/Belt/ce.rsi
  - type: Clothing
    sprite: Clothing/Belt/ce.rsi
  - type: Storage
    grid:
    - 0,0,9,1
  - type: StealTarget
    stealGroup: ChiefEngineerToolBelt

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltJanitor
  name: "прибиральницький пояс"
  description: "Ремінь, на якому тримається більшість прибиральницького приладдя."
  components:
  - type: Sprite
    sprite: Clothing/Belt/janitor.rsi
  - type: Clothing
    sprite: Clothing/Belt/janitor.rsi
  - type: Storage
    maxItemSize: Large
    whitelist:
      tags:
      - Wrench
      - Bottle
      - Spray
      - Soap
      - Flashlight
      - CigPack
      - TrashBag
      - WetFloorSign
      - HolosignProjector
      - Plunger
      - Keyring # Goobstation
      - GoldenPlunger
      - WireBrush
      components:
      - LightReplacer
      - SmokeOnTrigger
  - type: ItemMapper
    sprite: *BeltOverlay
    mapLayers:
      bottle:
        whitelist:
          tags:
          - Bottle
      bottle_spray:
        whitelist:
          tags:
          - Spray
      wrench:
        whitelist:
          tags:
          - Wrench
      keyring: # Goobstation
        whitelist:
          tags:
          - Keyring
  - type: Appearance

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltMedical
  name: "медичний пояс"
  description: "Може вміщати різне медичне обладнання."

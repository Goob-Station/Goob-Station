- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesHudDiagnostic
  name: "діагностичний hud"
  description: "Головний дисплей, здатний аналізувати цілісність і стан робототехніки та екзокостюмів. Виготовлений із сі-борг-іуму."
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Hud/diag.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Hud/diag.rsi
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
    - SiliconRadiation # Goobstation - Make IPCs take radiation
  - type: ShowAccessReaderSettings
  - type: Tag
    tags:
    - HudDiagnostic # Goobstation - CR glasses changes and addition


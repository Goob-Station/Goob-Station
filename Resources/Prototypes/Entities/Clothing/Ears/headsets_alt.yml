- type: entity
  parent: [ClothingHeadsetAlt, BaseSyndicateContraband]
  id: ClothingHeadsetAltSyndicate
  name: "криваво-червона накладна гарнітура"
  description: "Оновлений модульний синдикатний інтерком, який одягається на голову і приймає ключі шифрування (є 5 слотів для ключів)."
  components:
  - type: Headset
  - type: EncryptionKeyHolder
    keySlots: 5
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySyndie
  - type: Sprite
    sprite: Clothing/Ears/Headsets/syndicate.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/syndicate.rsi
  - type: RadioSoundProfile # Pirate: radio sounds
    transmitSound: /Audio/_Pirate/Radio/radio_talk_alter.ogg # Pirate: radio sounds
    receiveSound: /Audio/_Pirate/Radio/radio_receive_alter.ogg # Pirate: radio sounds
    allowedChannels: # Pirate: radio sounds
      - Syndicate # Pirate: radio sounds
      - Interdyne # Pirate: radio sounds
      - InterdynePrivat # Pirate: radio sounds


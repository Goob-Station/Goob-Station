- type: entity
  abstract: true
  parent: ClothingHeadset
  id: ClothingHeadsetAlt
  name: "гарнітура"
  description: "Оновлений модульний інтерком, який одягається на голову. Приймає ключі шифрування."
  components:
  - type: Sprite
    state: icon_alt
  - type: Clothing
    equippedPrefix: alt
  - type: FlashSoundSuppression # Goobstation

- type: entity
  parent: [ClothingHeadsetAltLoudspeaker, BaseCommandContraband] # Goobstation
  id: ClothingHeadsetAltCargo
  name: "накладні навушники квартирмейстера"
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCargo
      - EncryptionKeyCommand
      - EncryptionKeyCommon
  - type: Sprite
    sprite: Clothing/Ears/Headsets/cargo.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/cargo.rsi


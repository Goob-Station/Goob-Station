- type: entity
  parent: ClothingShoesBaseButcherable #Goobstation
  id: ClothingShoesHighheelBoots
  name: "чоботи на високих підборах"
  description: "Модні черевики для тих, хто хоче бути стильним, але підготовленим."
  components:
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 6
  - type: Sprite
    sprite: Clothing/Shoes/Boots/highheelboots.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/highheelboots.rsi
  # region Pirate: loadout
  - type: HideLayerClothing
    force: true
    slots:
    - LFoot
    - RFoot
  # endregion Pirate: loadout
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHighHeels
      params:
        volume: -6
        variation: 0.09


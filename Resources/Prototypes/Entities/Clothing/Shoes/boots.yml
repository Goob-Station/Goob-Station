- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesBootsWork
  name: "робочі черевики"
  description: "Інженерні робочі черевики на шнурівці для особливо синіх комірців."
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/workboots.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/workboots.rsi
  - type: Matchbox

- type: entity
  parent: [ClothingShoesMilitaryBase, BaseSecurityCargoContraband] # Goob edit - Also allowed for Cargo
  id: ClothingShoesBootsJack
  name: "чоботи"
  description: "Видані Нанотрейзен захисні черевики для бойових сценаріїв або бойових ситуацій. Всюди бойові, весь час."
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/jackboots.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/jackboots.rsi
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesBootsSalvage
  name: "чоботи утилізатора"
  description: "Черевики зі сталевим носком для утилізаторських робіт в небезпечних умовах."

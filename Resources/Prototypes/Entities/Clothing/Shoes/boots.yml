  - type: Sprite
    sprite: Clothing/Shoes/Boots/explorer.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/explorer.rsi
  - type: Matchbox

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesBootsPerformer
  name: "черевики артиста"
  description: "Ці черевики забезпечують чудове зчеплення з поверхнею під час виступів на сцені."
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/performer.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/performer.rsi
  # region Pirate: loadout
  - type: HideLayerClothing
    force: true
    slots:
    - LFoot
    - RFoot
  # endregion Pirate: loadout

- type: entity
  parent: [ClothingShoesMilitaryBase, BaseSecurityContraband]
  id: ClothingShoesBootsCombat
  name: "бойові чоботи"
  description: "Міцні бойові черевики для бойових сценаріїв або бойових ситуацій. Всюди бойові, весь час."

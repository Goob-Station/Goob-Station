  components:
  - type: Sprite
    sprite: Clothing/Shoes/Misc/damedaneshoes.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Misc/damedaneshoes.rsi

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesSnakeskinBoots
  name: "чоботи зі зміїної шкіри"
  description: "Чоботи з колись цінної зміїної шкіри. Усі навколо заздрили б вам."
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Misc/snakeskin.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Misc/snakeskin.rsi

- type: entity
  parent: [ClothingShoesBase, PowerCellSlotSmallItem, BaseToggleClothing]
  id: ClothingShoesBootsSpeed
  name: "швидкісні черевики"
  description: "Високотехнологічні черевики, сплетені з квантових волокон, здатні перетворювати електрику на чисту швидкість!"
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/speedboots.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: Clothing/Shoes/Boots/speedboots.rsi
  - type: ToggleClothing
    action: ActionToggleSpeedBoots
  - type: ClothingSpeedModifier
    walkModifier: 1.5
    sprintModifier: 1.5
    standing: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: StaticPrice
    price: 500
  - type: PowerCellDraw
    drawRate: 20 #Goob
  - type: ToggleCellDraw
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
  - type: Tag
    tags: []
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 375
      Plastic: 250
      Silver: 125
  - type: ModifyStandingUpTime
    multiplier: 3

- type: entity
  parent: BaseAction
  id: ActionToggleSpeedBoots
  name: "Перемкнути Швидкісні Черевики"
  description: "Увімкнення та вимкнення швидкості черевиків."
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesBootsMoon
  name: "місячні чоботи"
  description: "Спеціальні антигравітаційні черевики, розроблені зі спеціальною сумішшю гелю місячної породи. Постачаються з Нідерландів."
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/moonboots.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: Clothing/Shoes/Boots/moonboots.rsi
  - type: AntiGravityClothing
  - type: StaticPrice
    price: 75
  - type: Tag
    tags: [ ]
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 150

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesBootsJump
  name: "стрибучі черевики"
  description: "Високотехнологічні черевики, що дають вам неймовірну здатність СТРИБАТИ! З цими черевиками ви можете перестрибувати через лаву, прірви та дивні хімікати на підлозі!"
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/jumpboots.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: Clothing/Shoes/Boots/jumpboots.rsi
  - type: JumpAbility
    jumpDistance: 4
    jumpSound: /Audio/Effects/stealthoff.ogg
  - type: ActionGrant
    actions:
    - ActionGravityJump
  - type: ItemActionGrant
    actions:
    - ActionGravityJump
    activeIfWorn: true
    restrictedSlots:
    - FEET
  - type: StaticPrice
    price: 220
  - type: Tag
    tags: []

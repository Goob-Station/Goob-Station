- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterWinterCoat
  name: "зимове пальто"
  description: "Важка куртка з \"синтетичного\" хутра тварин."
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  - type: TemperatureProtection
    heatingCoefficient: 1.1
    coolingCoefficient: 0.1
  - type: Item
    size: Normal
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Tail
    - Arm
    modifiers:
      coefficients:
        Slash: 0.9
        Heat: 0.8
    priceMultiplier: 0
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.55
  - type: Edible
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Fiber
          Quantity: 30
      #region Pirate: stains
      stain:
        maxVol: 10
      #endregion Pirate: stains
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
    - WinterCoat # Goobstation
  - type: StaticPrice
    price: 50
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Cloth: 125
      Durathread: 50

- type: entity
  parent: [ ClothingOuterStorageToggleableBase, ClothingOuterWinterCoat ]
  id: ClothingOuterWinterCoatToggleable
  name: "зимове пальто з капюшоном"
  categories: [ HideSpawnMenu ]

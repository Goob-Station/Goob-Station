  name: "тюремний EVA-скафандр"
  description: "Аварійний EVA-скафандр, призначений для в’язнів. Він жахливо повільний і майже не захищає від температури, але цього досить, щоб виграти трохи часу в суворому вакуумі космосу."
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_prisoner.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_prisoner.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.75
    coolingCoefficient: 0.5
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
    - Softsuit # OuterSlotClothingPenalty

#NTSRA Voidsuit / Ancient Voidsuit
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitAncientEVA
  name: "стародавній скафандр NTSRA" #Nanotrasen Space Research Association
  description: "Стародавній космічний костюм, розроблений філією NTSRA ЦентКому. Він дуже тонко виготовлений, що забезпечує більшу мобільність, ніж більшість сучасних космічних костюмів."
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/ancient_voidsuit.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/ancient_voidsuit.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier

#Paramedic Voidsuit
#Despite having resistances and looking like a hardsuit, this parents off the EVA suit so it goes here.
- type: entity
  parent: [ ClothingOuterEVASuitBase, ClothingOuterBaseToggleable ]
  id: ClothingOuterHardsuitVoidParamed
  name: "скафандр парамедика" # Goob edit - it has high pressure protection and resistances, call it a hardsuit
  description: "Скафандр, створений для парамедиків." # Goob edit
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/paramed.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/paramed.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
    requireActivated: false
  - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    modifiers:
      coefficients:
        Heat: 0.9
        Radiation: 0.75
        Caustic: 0.5
  - type: GroupExamine
  - type: StealTarget
    stealGroup: ClothingOuterHardsuitVoidParamed
  - type: ToggleableClothing # Goobstation - Modsuits change
    clothingPrototypes:
      head: ClothingHeadHelmetVoidParamed

#Basic EVA
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitEVA
  name: "костюм ЄВА"
  description: "Легкий космічний костюм з базовою здатністю захищати власника від вакууму космосу в надзвичайних ситуаціях."
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - CorgiWearable
    - WhitelistChameleon
    - Softsuit # OuterSlotClothingPenalty

#Syndicate EVA
- type: entity
  parent: [ ClothingOuterEVASuitBase, BaseSyndicateContraband ]
  id: ClothingOuterEVASuitSyndicate
  name: "скафандр ЄВА синдикату"
  description: "На спині є бирка з написом: 'Абсолютно точно не власність ворожої корпорації, чесно!'"
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
    - Softsuit # OuterSlotClothingPenalty
  - type: StaticPrice
    price: 1000 # Helmet is 500

#Emergency EVA
- type: entity
  parent: [ ClothingOuterEVASuitBase, ClothingOuterBaseToggleable ]
  id: ClothingOuterSuitEmergency
  name: "аварійний костюм ЄВА"
  description: "Аварійний костюм ЄВА з вбудованим шоломом. Він жахливо повільний і не має температурного захисту, але цього достатньо, щоб виграти час у суворому вакуумі космосу."
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.75
    coolingCoefficient: 0.5
  - type: Tag
    tags:
    - SuitEVA
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable
    - WhitelistChameleon
    - Softsuit # OuterSlotClothingPenalty
  - type: ToggleableClothing # Goobstation - Modsuits change
    clothingPrototypes:
      head: ClothingHeadHelmetEVALarge

#Prisoner EVA
- type: entity
  parent: ClothingOuterEVASuitBase

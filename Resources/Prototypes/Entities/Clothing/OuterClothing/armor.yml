#Basic armor vest for inheritance
- type: entity
  abstract: true
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseSecurityContraband]
  id: ClothingOuterArmorBase
  name: "бронежилет"
  description: "Стандартний бронежилет типу I, що забезпечує гідний захист від більшості видів пошкоджень."
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/security.rsi
  #region Pirate: stains
  - type: Stainable
    clothingVisuals:
      outerClothing:
      - sprite: _Pirate/Effects/blood.rsi
        state: armorblood
    iconVisuals:
    - sprite: _Pirate/Effects/blood.rsi
      state: armorbloodicon
  #endregion Pirate: stains
    # Goob start
  - type: Armor
    coverage:
    - Chest
    - Groin
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.7
    # Goob end
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance # Goobstation
    damageCoefficient: 0.7


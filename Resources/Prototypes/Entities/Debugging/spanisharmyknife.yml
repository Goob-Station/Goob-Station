- type: entity
  name: "іспанський армійський ніж"
  parent: BaseItem
  id: ToolDebug
  description: "Біль від його використання майже занадто сильний, щоб його витримати."
  suffix: DEBUG
  components:
  - type: Sprite
    sprite: Objects/Tools/debug.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Tools/debug.rsi
    quickEquip: false
    slots:
      - Belt
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
  - type: ToolTileCompatible
  - type: Tool
  - type: Prying
  - type: UseDelay # Goobstation - For insta prying
    delay: 0.25 # Goobstation - Changed to 0.25, Shit was annoying
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Prying
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Screwing
        useSound: /Audio/Items/drill_use.ogg
        changeSound: /Audio/Items/change_drill.ogg
      - behavior: Anchoring
        useSound: /Audio/Items/drill_use.ogg
        changeSound: /Audio/Items/change_drill.ogg
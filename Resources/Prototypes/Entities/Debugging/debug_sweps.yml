- type: entity
  name: "бах hitscan 1 шкоди"
  parent: BaseWeaponBatterySmall
  id: WeaponHitscanDebug
  description: "піу-піу!"
  suffix: DEBUG
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/debug.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/debug.rsi
  - type: Gun
    fireRate: 10
    availableModes:
    - SemiAuto
    - FullAuto
  - type: BatteryAmmoProvider
    proto: DebugLaser
    fireCost: 1
  - type: BatterySelfRecharger
    autoRechargeRate: 1000

- type: entity
  name: "бах hitscan розчленовувач"
  parent: WeaponHitscanDebug
  id: WeaponHitscanDebugGib
  components:
  - type: BatteryAmmoProvider
    proto: DebugLaserGib

- type: entity
  name: "бах, Дідо-ган"
  parent: BaseWeaponPistol
  id: WeaponPistolDebug
  description: "дід. Тікайте хто може!"
  suffix: DEBUG
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/debug.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/debug.rsi
  - type: Gun
    soundGunshot: null
    fireRate: 100
    selectedMode: FullAuto
    availableModes:
      - SemiAuto
      - FullAuto
  - type: AmmoCounter
  - type: ChamberMagazineAmmoProvider
    boltClosed: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolDebug
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineDebug
      gun_chamber:
        name: Chamber
        startingItem: CartridgeDebug
        priority: 1
        whitelist:
          tags:
            - CartridgeDebug

- type: entity
  id: MagazinePistolDebug
  name: "бац, Дід Маг!"
  parent: BaseMagazinePistol
  suffix: DEBUG
  components:
  - type: Tag
    tags:
      - MagazineDebug
  - type: BallisticAmmoProvider
    proto: CartridgeDebug
    capacity: 1000
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi

- type: entity
  id: BulletDebug
  name: "бах, куля!"
  parent: BaseBullet
  categories: [ Debug, HideSpawnMenu ]
  suffix: DEBUG
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 20000

- type: entity
  id: CartridgeDebug
  name: "бах, розряджений патрон"
  parent: BaseCartridgePistol
  suffix: DEBUG
  components:
  - type: Tag
    tags:
    - CartridgeDebug
  - type: CartridgeAmmo
    proto: BulletDebug


- type: entity
# parent: Poweredlight # Goobstation edit
  id: JanitorServiceLight
  name: janitorial service light
  description: A wall-mounted janitorial sign. If the light is blinking, a janitor's service is required.
  components:
# Goobstation start
  - type: StationAiWhitelist
  - type: Clickable
  - type: InteractionOutline
# Goobstation end
  - type: Sprite
    sprite: Structures/Wallmounts/service_light.rsi
    drawdepth: WallMountedItems
    layers:
    - map: ["enum.PoweredLightLayers.Base"]
      state: base
    - map: ["enum.PoweredLightLayers.Glow"]
      state: glow
      shader: unshaded
    state: base
  - type: PointLight
    radius: 1.5
    energy: 0.45
    softness: 3
    offset: "0, 0"
    enabled: false
# Goobstation start
# - type: PoweredLight
#   bulb: Bulb
#   on: false
#   hasLampOnSpawn: ServiceLightBulb
# - type: DamageOnInteract
#   damage:
#     types:
#       Heat: 5
#   popupText: powered-light-component-burn-hand
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: SlimPoweredLight
    enabled: false
  - type: Appearance
  - type: PoweredLightVisuals
    spriteStateMap:
      off: base
      on: base
  - type: JanitorCallButton
  - type: Rotatable
  - type: Construction
    graph: SignalButtonGraph
    node: SignalButtonNode
  - type: Transform
    anchored: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
            pitch: 1
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
# Goobstation end

- type: entity
  parent: ReinforcedWindow
  id: XenoResinWindow
  name: "смоляне вікно"
  description: "Прозоре й загартоване, але трохи липке на дотик. Трохи міцніше за звичайне укріплене вікно."
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/xeno_resin.rsi
  - type: Icon
    sprite: Structures/Windows/xeno_resin.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200 #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    base: xwindow
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 4
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi

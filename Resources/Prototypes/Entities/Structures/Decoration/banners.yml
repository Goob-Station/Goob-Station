- type: entity
  id: BannerBase
  parent: BaseStructureDynamic
  name: "базовий банер"
  description: "Це концепція банера, ви не повинні цього бачити."
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner
    noRot: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - HighImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: BannerNanotrasen
  parent: BannerBase
  name: "банер нанотрейзен"
  description: "Банер з логотипом Nanotrasen. Виглядає досить дешево."
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner
  - type: Construction # Frontier
    graph: BannersGraph # Frontier
    node: BannerNanotrasenNode # Frontier    


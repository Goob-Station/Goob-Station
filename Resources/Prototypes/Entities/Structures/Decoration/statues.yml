- type: entity
  id: StatueVenusRed
  parent: BaseStructure
  name: "статуя пречистої діви"
  suffix: Red
  description: "Антична мармурова статуя. Об'єкт зображений з косою до підлоги і тримає в руках червоний ящик з інструментами."
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_red
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  id: StatueVenusBlue
  parent: BaseStructure
  name: "статуя пречистої діви"
  suffix: Blue
  description: "Антична мармурова статуя. Об'єкт зображений з косою до підлоги і тримає в руках синій ящик з інструментами."
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_blue
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  id: StatueBananiumClown
  parent: BaseStructure
  name: "бананіумна статуя рятівника"
  description: "Бананіумна статуя. Вона зображує повернення спасителя, який підніметься і поведе клоунів під великий гудок."
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: bananium_clown
    drawdepth: Mobs
    offset: "0.0,0.5"
  - type: Construction
    graph: BananiumStatueClown
    node: bananiumStatue

# Ironsand Statues

- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseIronsandStatue
  description: "Таємнича статуя, знайдена в пустелі залізного піску."
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150 # Overkill
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 1
            max: 2

- type: entity
  parent: BaseIronsandStatue
  id: StatueIronsandSmall
  name: "мала статуя із залізного піску"
  components:
  - type: Sprite
    sprite: Structures/Decoration/ironsand_statue.rsi
    state: small_pillar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer


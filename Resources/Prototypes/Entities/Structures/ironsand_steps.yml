- type: entity
  parent: BaseFloorDecoration
  id: IronsandStep
  name: "сходинка із залізного піску"
  description: "Піднімає ваш залізний пісок на рівень вище."
  components:
  - type: Sprite
    sprite: Structures/ironsand_steps.rsi
    state: straight
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: IronsandStep
  id: IronsandStepConvexCorner
  name: "опуклий кут сходинки із залізного піску"
  components:
  - type: Sprite
    state: corner_convex

- type: entity
  parent: IronsandStep
  id: IronsandStepConcaveCorner
  name: "увігнутий кут сходинки із залізного піску"
  components:
  - type: Sprite
    state: corner_concave

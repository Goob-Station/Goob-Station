- type: entity
  abstract: true
  id: ReagentDispenserBase
  parent: SmallConstructibleMachine
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false # Pirate: chem plumbing
  - type: Rotatable # Pirate: chem plumbing
    rotateWhileAnchored: true
  - type: Clickable
  - type: InteractionOutline
  # Pirate: chem plumbing
  - type: PlumbingConnectorAppearance
    offset: 0.09375
  - type: AtmosPipeColor
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        density: 190
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: ActivatableUI
    key: enum.ReagentDispenserUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ReagentDispenserUiKey.Key:
        type: ReagentDispenserBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,19,5
  - type: ReagentDispenser
    beakerSlot:
      whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
      whitelist:
        components:
        - FitsInDispenser
      priority: 9
    recipeDiskSlot: # Pirate: chem plumbing
      name: reagent-dispenser-component-slot-name-disk
      priority: 10
      insertSound:
        path: /Audio/Machines/terminal_insert_disc.ogg
      ejectSound:
        path: /Audio/Machines/terminal_insert_disc.ogg
      whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
      whitelist:
        tags:
        - ChemRecipeDisk
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beakerSlot: !type:ContainerSlot
      recipeDiskSlot: !type:ContainerSlot # Pirate: chem plumbing
      storagebase: !type:Container
  - type: StaticPrice
    price: 1000
  - type: WiresPanel
  # Pirate: chem plumbing
  - type: NodeContainer
    nodes:
      outletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      outletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: PlumbingOutlet
    solutionName: beaker
    connectedOutlets: true
    outletNames:
    - outletNorth
    - outletEast
    - outletSouth
    - outletWest
    containerSlotId: beakerSlot
    enabled: false
  - type: EmptyOnMachineDeconstruct
    containers:
    - storagebase
    - beakerSlot

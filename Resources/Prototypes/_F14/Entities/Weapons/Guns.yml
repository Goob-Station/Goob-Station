# ============================================
# PISTOLS & REVOLVERS
# ============================================

- type: entity
  id: SCPWeaponPistolFiveSeven
  parent: BaseWeaponPistol
  name: FN Five-seveN
  description: A semi-automatic pistol chambered in the armor-piercing 5.7x28mm cartridge.
  components:
  - type: Sprite
    sprite: _F14/objects/Weapons/Guns/Pistols/Five-Seven.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Gun
    fireRate: 4
    minAngle: 2
    maxAngle: 7
    angleIncrease: 1.5
    angleDecay: 8
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot {}
      gun_chamber: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineFiveSeven
        insertSound:
          path: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound:
          path: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineFiveSeven


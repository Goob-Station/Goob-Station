# ============================================
# PISTOL & PDW CARTRIDGES
# ============================================

- type: entity
  id: Cartridge45ACP
  parent: BaseCartridgePistol
  name: .45 ACP cartridge
  description: A heavy, slow-moving pistol round.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: Bullet45ACP


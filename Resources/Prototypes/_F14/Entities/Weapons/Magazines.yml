# ============================================

- type: entity
  id: MagazineFiveSeven
  parent: BaseItem
  name: FN Five-seveN Magazine (5.7x28mm)
  description: A 20-round double-stack magazine for the FN Five-seveN pistol.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/CaselessRifle/caseless_pistol_mag.rsi
    layers:
    - state: base
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    proto: Cartridge57x28mm
    capacity: 20
  - type: Tag
    tags:
    - MagazineFiveSeven


- type: entity
  parent: ComputerId
  id: ComputerIdSCPTabletop
  name: Desktop Computer
  description: Great computer that has most advanced parts! You still can see sticker "Intel Pentium" on a side panel. It has slot for id cards
  components:
  - type: SCPOSComputer
    diskCapacity: 64
    installedSoftware:
    - scpos_file_manager
    - scpos_config_tool
    - scpos_nanoword
    - scpos_relay_chat_client
  - type: UserInterface
    interfaces:
      enum.SCPOSSoftwareUiKey.Key:
        type: SCPOSSoftwareDownloadBoundUserInterface
  - type: ActivatableUI
    key: enum.SCPOSSoftwareUiKey.Key

  - type: Sprite
    sprite: _F14/Structures/IDComputer.rsi
    layers:
    - state: base

  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"

  - type: IdCardConsole
    accessLevels:
    # Administration
    - O5
    - Admin5
    - Admin4
    - Admin3
    - Admin2
    - Admin1
    - Admin
    - Command
    - Unrestricted
    # Science
    - Science5
    - Science4
    - Science3
    - Science2
    - Science1
    - Science
    - Research
    - Lab
    # Security
    - Security5
    - Security4
    - Security3
    - Security2
    - Security1
    - Security
    - Containment
    - LowSecurity
    # Civilian / Class-D
    - ClassD
    - Botany
    - Kitchen
    - Maintenance
    - Medical
    - Mining


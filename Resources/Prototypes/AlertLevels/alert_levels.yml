- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      color: Green
      emergencyLightColor: LawnGreen
      sound: /Audio/_Pirate/Announcements/Alerts/code_green.ogg # Pirate
      shuttleTime: 600
    blue:
      announcement: alert-level-blue-announcement
      sound: /Audio/_Pirate/Announcements/Alerts/code_blue.ogg # Pirate
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: /Audio/_Pirate/Announcements/Alerts/code_violet.ogg # Pirate
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: /Audio/_Pirate/Announcements/Alerts/code_yellow.ogg # Pirate
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: /Audio/_Pirate/Announcements/Alerts/code_red.ogg # Pirate
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound: /Audio/_Pirate/Announcements/Alerts/code_gamma.ogg # Pirate
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound: /Audio/_Pirate/Announcements/Alerts/code_delta.ogg # Pirate
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound: /Audio/_Pirate/Announcements/Alerts/code_epsilon.ogg # Pirate
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: DarkViolet
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    omicron: # Goobstation
      announcement: alert-level-omicron-announcement
      selectable: false
      sound:
        path: /Audio/_Goobstation/Misc/omicron.ogg
      disableSelection: true
      color: Ivory
      emergencyLightColor: Ivory
      forceEnableEmergencyLights: true
      shuttleTime: 2400
    octarine: # DeltaV - Cosmic Cult
      announcement: alert-level-octarine-announcement
      selectable: false
      sound: /Audio/Announcements/Alerts/code_octarine.ogg
      disableSelection: true
      color: CadetBlue
      emergencyLightColor: CadetBlue
      forceEnableEmergencyLights: true
      shuttleTime: 600
    honk: # Goobstation
      announcement: alert-level-honk-announcement
      selectable: false
      emagSelectable: true
      sound:
        path: /Audio/Items/bikehorn.ogg
      color: Magenta
      emergencyLightColor: Magenta
      forceEnableEmergencyLights: true
      shuttleTime: 600
    white: # Pirate - Psionic Emergency
      announcement: alert-level-white-announcement
      sound: /Audio/_Pirate/Announcements/Alerts/code_white.ogg
      emergencyLightColor: "#F6CCF6"
      color: White
      shuttleTime: 600
    amber:
      announcement: alert-level-amber-announcement
      sound: /Audio/_Goobstation/Announcements/amberalarm.ogg
      color: "#8A3324"
      emergencyLightColor: "#8A3324"
      forceEnableEmergencyLights: true
      shuttleTime: 600

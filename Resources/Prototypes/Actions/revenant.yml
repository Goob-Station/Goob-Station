- type: entity
  parent: BaseAction
  id: ActionRevenantMalfunction
  name: "Спричинити несправність"
  description: "Спричиняє несправність найближчих механізмів. Вартість 60 есенції." #Goob edit
  components:
  - type: Action
    icon: Interface/Actions/malfunction.png
    useDelay: 20
  - type: InstantAction
    event: !type:RevenantMalfunctionActionEvent

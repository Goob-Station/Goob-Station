- type: entity
  parent: ActionIntrinsicStore
  id: ActionRevenantShop
  name: "Магазин"
  description: "Відкриває крамницю здібностей."

- type: entity
  parent: BaseAction
  id: ActionRevenantDefile
  name: "Осквернити"
  description: "Розбиває вікна, плитку та відкриває сусідні контейнери. Вартість 30 есенції." #Goob edit
  components:
  - type: Action
    useDelay: 15
    icon: Interface/Actions/defile.png
  - type: InstantAction
    event: !type:RevenantDefileActionEvent

- type: entity
  parent: BaseAction
  id: ActionRevenantOverloadLights
  name: "Перевантажити світло"
  description: "Викликає блискавку з найближчих джерел світла. Вартість 40 есенції." #Goob edit
  components:
  - type: Action
    icon: Interface/Actions/overloadlight.png
    useDelay: 20
  - type: InstantAction
    event: !type:RevenantOverloadLightsActionEvent


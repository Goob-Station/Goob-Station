- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseTraitorObjective
  components:
  - type: Objective
    issuer: objective-issuer-syndicate
  - type: RoleRequirement
    roles:
    - TraitorRole

- type: entity
  abstract: true
  parent: [BaseTraitorObjective, BaseSocialObjective]
  id: BaseTraitorSocialObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/folders.rsi
      state: folder-colormap
  - type: MultipleTraitorsRequirement

- type: entity
  abstract: true
  parent: [BaseTraitorObjective, BaseStealObjective]
  id: BaseTraitorStealObjective
  components:
  - type: StealCondition
    verifyMapExistence: false
  - type: Objective
    difficulty: 2.75
  - type: ObjectiveLimit
    limit: 2 # there is usually only 1 of each steal objective, have 2 max for drama

# state

- type: entity
  parent: [BaseTraitorObjective, BaseLivingObjective]
  id: EscapeShuttleObjective
  name: "Втекти до ЦентКому живим і без кайданок на евакуаційному шатлі."
  description: "Один із наших агентів під прикриттям проведе вам дебрифінг після прибуття. Не приходьте в кайданках."
  components:
  - type: Objective
    difficulty: 1.3
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition

- type: entity
  parent: BaseTraitorObjective
  id: DieObjective
  name: "Померти славною смертю"
  description: "Здохни."
  components:
  - type: Objective
    difficulty: 0.5
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - EscapeShuttleCondition
      - StealCondition
  - type: DieCondition

- type: entity
  parent: [BaseTraitorObjective, BaseLivingObjective]
  id: HijackShuttleObjective
  name: "Викрасти аварійний шатл"
  description: "Вийдіть з шатла вільно і без лояльного екіпажу Нанотрасен на борту. Використовуйте БУДЬ-ЯКІ доступні вам методи. На шатлі можуть залишитися живими агенти Синдикату, вороги Нанотрасену та заручники в наручниках. Ігноруйте допомогу від будь-кого, окрім агента підтримки."
  components:
    - type: Objective
      difficulty: 5 # insane, default config max difficulty
      icon:
        sprite: Objects/Tools/emag.rsi
        state: icon
    - type: HijackShuttleCondition

# kill

- type: entity
  parent: [BaseTraitorObjective, BaseKillObjective]
  id: KillRandomPersonObjective
  description: "Зробіть це як завгодно, тільки переконайтеся, що вони не покинуть станцію."
  components:
  - type: Objective
    difficulty: 1.75
    unique: false
  - type: TargetObjective
    title: objective-condition-maroon-person-title
  - type: PickRandomPerson
    filters:
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireMaroon: true

- type: entity
  parent: [BaseTraitorObjective, BaseKillObjective]
  id: KillRandomHeadObjective
  description: "Нам потрібно, щоб ця голова зникла, і ви, мабуть, знаєте чому. Переконайтеся, що вони не доберуться до ЦентКому, навіть якщо будуть мертві. Хай щастить, агенте."
  components:
  - type: Objective
    # technically its still possible for KillRandomPersonObjective to roll a head but this is guaranteed, so higher difficulty
    difficulty: 3.0
    # killing 1 head is enough
    unique: true
  - type: TargetObjective
    title: objective-condition-kill-maroon-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    # don't count missing evac as killing as heads are higher profile, so you really need to do the dirty work
    # if ce flies a shittle to centcom you better find a way onto it
    requireDead: true
    requireMaroon: true

# social

- type: entity
  parent: [BaseTraitorSocialObjective, BaseKeepAliveObjective]
  id: RandomTraitorAliveObjective
  description: "Ідентифікуйте себе на свій страх і ризик. Він потрібен нам живим."
  components:
  - type: Objective
    difficulty: 1.75
  - type: TargetObjective
    title: objective-condition-other-traitor-alive-title
  - type: PickRandomPerson
    filters:
    - !type:HasRoleMindFilter
      whitelist:
        components:
        - TraitorRole
    # Can't have multiple objectives to help/save the same person
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - HelpProgressCondition
        - KeepAliveCondition

- type: entity
  parent: [BaseTraitorSocialObjective, BaseHelpProgressObjective]
  id: RandomTraitorProgressObjective
  description: "Ідентифікуйте себе на свій страх і ризик. Нам потрібно, щоб він досяг успіху."
  components:
  - type: Objective
    difficulty: 2.5
  - type: TargetObjective
    title: objective-condition-other-traitor-progress-title
  - type: PickRandomPerson
    filters:
    - !type:HasRoleMindFilter
      whitelist:
        components:
        - TraitorRole
    # Can't help anyone who is tasked with helping:
    # 1. thats boring
    # 2. no cyclic progress dependencies!!!
    - !type:ObjectiveMindFilter
      blacklist:
        components:
        - HelpProgressCondition
    # Can't have multiple objectives to help/save the same person
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - HelpProgressCondition
        - KeepAliveCondition


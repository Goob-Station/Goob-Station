# The Modsuit Itself, This is just a bso modsuit
- type: entity
  parent: [ ClothingModsuitStandard, BaseCentcommContraband ]
  id: ClothingModsuitPraetorian
  name: Praetorian modsuit control unit
  description: The main controller for a Praetorian modsuit.
  components:
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/praetorian.rsi
    - type: Clothing
      clothingVisuals:
        back:
        - state: equipped-BACKPACK
        back-resomi:
        - state: equipped-BACKPACK-resomi
    - type: ModSuit
      theme: ModThemePraetorian
      parts:
        head: ClothingModsuitHelmetPraetorian
        gloves: ClothingModsuitGauntletsPraetorian
        outerClothing: ClothingModsuitChestplatePraetorian
        shoes: ClothingModsuitBootsPraetorian
      inbuiltModules:
      - ModsuitModuleBuiltinFlashProtection
      - ModsuitModuleBuiltinInsulation
    - type: Construction
      graph: Modsuit
      node: praetorian
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        back:
        - state: equipped-BACKPACK-sealed
        back-resomi:
        - state: equipped-BACKPACK-sealed-resomi

- type: entity
  parent: ClothingModsuitPraetorian
  id: ClothingModsuitPraetorianFilled
  suffix: Filled
  components:
    - type: ModSuit
      theme: ModThemePraetorian
      parts:
        head: ClothingModsuitHelmetPraetorian
        gloves: ClothingModsuitGauntletsPraetorian
        outerClothing: ClothingModsuitChestplatePraetorian
        shoes: ClothingModsuitBootsPraetorian
      startingModules:
      - ModsuitModuleStorageLarge
      - ModsuitModuleFlashlight
      - ModsuitModuleMagboots
      inbuiltModules:
      - ModsuitModuleBuiltinFlashProtection
      - ModsuitModuleBuiltinInsulation
    - type: ItemSlots
      slots:
        mod-core:
          name: modsuit-core-slot-name
          startingItem: ModsuitCoreStandardHyper
          whitelist:
            components:
            - ModCore

- type: entity
  parent: ClothingModsuitGauntletsStandard
  id: ClothingModsuitGauntletsPraetorian
  name: Praetorian modsuit gauntlets
  description: A pair of gauntlets made for the Praetorian modsuit.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/praetorian.rsi
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        gloves:
        - state: equipped-HAND-sealed
        - state: equipped-HAND-sealed-unshaded
          shader: unshaded
        gloves-vox:
        - state: equipped-HAND-sealed-vox
        - state: equipped-HAND-sealed-unshaded-vox
          shader: unshaded

- type: entity
  parent: ClothingModsuitHelmetStandard
  id: ClothingModsuitHelmetPraetorian
  name: Praetorian modsuit helmet
  description: A state-of-the-art helmet designed by NanoTrasen for the Praetorian modsuit.
  categories: [HideSpawnMenu]
  components:
    - type: Clothing
      clothingVisuals:
        head-hydrakin:
        - state: equipped-HEAD
        head-feroxi:
        - state: equipped-HEAD
        head:
        - state: equipped-HEAD
        head-resomi:
        - state: equipped-HEAD-resomi
        head-vox:
        - state: equipped-HEAD-vox
        head-vulpkanin:
        - state: equipped-HEAD-vulpkanin
        head-reptilian:
        - state: equipped-HEAD-reptilian
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/praetorian.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.05
      lowPressureMultiplier: 1000
    - type: Armor
      traumaDeductions:
        Dismemberment: 0.3
        OrganDamage: 0.3
        BoneDamage: 0.3
        VeinsDamage: 0
        NerveDamage: 0
      modifiers:
        coefficients:
          Blunt: 0.55
          Slash: 0.55
          Piercing: 0.5
          Radiation: 0.5
          Heat: 0.5
          Caustic: 0.5
    - type: FlashSoundSuppression # Goobstation
    - type: PointLight
      color: "#4d7ae3"
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        head-hydrakin:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-feroxi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-resomi:
        - state: equipped-HEAD-sealed-resomi
        head-vox:
        - state: equipped-HEAD-sealed-vox
        - state: equipped-HEAD-sealed-unshaded-vox
          shader: unshaded
        head-vulpkanin:
        - state: equipped-HEAD-sealed-vulpkanin
        - state: equipped-HEAD-sealed-unshaded-vulpkanin
          shader: unshaded
        head-reptilian:
        - state: equipped-HEAD-sealed-reptilian
        - state: equipped-HEAD-sealed-unshaded-reptilian
          shader: unshaded
- type: entity
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestplatePraetorian
  name: Praetorian modsuit chestplate
  description: A state of the art chestplate designed by NanoTrasen for the Praetorian modsuit. It incorporates powered servos to reduce the equipment load.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/praetorian.rsi
    - type: ClothingSpeedModifier
      walkModifier: 0.75
      sprintModifier: 0.75
    - type: Armor
      traumaDeductions:
        Dismemberment: 0.3
        OrganDamage: 0.3
        BoneDamage: 0.3
        VeinsDamage: 0
        NerveDamage: 0
      modifiers:
        coefficients:
          Blunt: 0.5
          Slash: 0.5
          Piercing: 0.45
          Radiation: 0.5
          Heat: 0.45
          Caustic: 0.5
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        outerClothing:
        - state: equipped-OUTERCLOTHING-sealed
        outerClothing-resomi:
        - state: equipped-OUTERCLOTHING-sealed-resomi
        outerClothing-vox:
        - state: equipped-OUTERCLOTHING-sealed-vox
        outerClothing-reptilian:
        - state: equipped-OUTERCLOTHING-sealed-reptilian
    - type: ModifyDelayedKnockdown
      delayDelta: 2
      knockdownTimeDelta: -2
    - type: PressureProtection
      highPressureMultiplier: 0.05
      lowPressureMultiplier: 1000
    - type: ExplosionResistance
      damageCoefficient: 0.45

- type: entity
  parent: ClothingModsuitBootsStandard
  id: ClothingModsuitBootsPraetorian
  name: Praetorian modsuit boots
  description: A state-of-the-art pair of magboots for the Praetorian modsuit.
  categories: [HideSpawnMenu]
  components:
    - type: Appearance
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/praetorian.rsi
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        shoes:
        - state: equipped-FEET-sealed
        shoes-vox:
        - state: equipped-FEET-sealed-vox
        shoes-reptilian:
        - state: equipped-FEET-sealed-reptilian
    - type: ClothingSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.9

- type: entity
  id: SuitStoragePraetorian
  parent: SuitStorageBase
  suffix: Praetorian Modsuit
  components:
    - type: StorageFill
      contents:
        - id: OxygenTankFilled
        - id: ClothingModsuitPraetorianFilled
        - id: ClothingMaskBreath

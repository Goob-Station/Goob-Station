- type: entity
  id: MachineCoilGround
  parent: BaseMachine
  name: "з'єднувальна котушка"
  description: "Машини, під'єднані до інших машин? Яка збоченість."
  placement:
    mode: AlignTileAny
  components:
  - type: Rotatable
  - type: Sprite
    sprite: _starcup/Structures/Machines/Terraforming/coil.rsi
    drawdepth: FloorObjects
    layers:
    - state: base
  - type: Fixtures
    fixtures:
      slipFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-0.4,1,0.4"
        mask:
        - ConveyorMask
        layer:
        - SlipLayer
        hard: false
  - type: Transform
    noRot: false

- type: entity
  id: MachineCoilGroundMirrored
  parent: MachineCoilGround
  name: "з'єднувальна котушка"
  suffix: mirrored
  description: "Машини, під'єднані до інших машин? Яка збоченість."
  components:
  - type: Rotatable
  - type: Sprite
    sprite: _starcup/Structures/Machines/Terraforming/coil_mirrored.rsi
    drawdepth: FloorObjects
    layers:
    - state: base

- type: entity
  id: MachineElectricGridRusted
  parent: BaseMachinePowered
  name: "іржава електрична решітка"
  description: "Стара, зламана машина."
  placement:
    mode: AlignTileAny
  components:
  - type: Sprite
    sprite: _starcup/Structures/Machines/Terraforming/electric_grid_rusted.rsi
    offset: 0,0.5
    layers:
    - state: base
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.25,0.45,0.1"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]


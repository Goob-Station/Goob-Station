- type: entity
  parent: DropPodspawner
  id: DropPodCharonSecurityCargo
  name: CentCom security-cargo drop pod
  suffix: Charon, Security/Cargo
  components:
  - type: TriggerOnSpawn
  - type: ContainerFill
    containers:
      clowncar_container:
      - WeaponDisabler
      - Stunbaton
      - Handcuffs
      - SurvivalKnife
      - FultonBeacon
      - HandheldGPSBasic
      - WeaponLaserSvalinn
      - WeaponLaserSvalinn

# Randomised spawner used by the game rule.
- type: entityTable
  id: CharonSupplyDropTable
  table: !type:GroupSelector
    children:
    - id: DropPodCharonMedical
      weight: 1
    - id: DropPodCharonFood
      weight: 1
    - id: DropPodCharonEngineering
      weight: 1
    # - id: DropPodCharonScience
    #   weight: 1
    - id: DropPodCharonMaterials
      weight: 1
    - id: DropPodCharonSecurityCargo
      weight: 1

- type: entity
  id: RandomCharonSupplyDropSpawner
  parent: MarkerBase
  name: random Charon supply drop spawner
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: CharonSupplyDropTable

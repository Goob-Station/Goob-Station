# CentCom supply drops for Charon-Epsilon.
# These are pre-filled DropPodspawner variants that trigger on spawn.

- type: entity
  parent: DropPodspawner
  id: DropPodCharonMedical
  name: CentCom medical drop pod
  suffix: Charon, Medical
  components:
  - type: TriggerOnSpawn
  - type: ContainerFill
    containers:
      clowncar_container:
      - MedkitBruteFilled
      - MedkitBurnFilled
      - MedkitRadiationFilled
      - Ointment
      - Bloodpack
      - EmergencyMedipen
      - EmergencyMedipen

- type: entity
  parent: DropPodspawner
  id: DropPodCharonFood
  name: CentCom food drop pod
  suffix: Charon, Food
  components:
  - type: TriggerOnSpawn
  - type: ContainerFill
    containers:
      clowncar_container:
      - FoodBoxPizzaFilled
      - FoodBoxCloth
      - FoodBoxDonkpocket
      - FoodSnackChips
      - DrinkWaterJug
      - DrinkWaterJug
      - DrinkColaCan
      - DrinkColaCan
      - DrinkColaCan


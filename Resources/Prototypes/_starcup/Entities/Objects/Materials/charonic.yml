# Crafting materials harvested from Charonic fauna.

- type: entity
  parent: MaterialBase
  id: MaterialCharonicHide
  name: "харонічна шкіра"
  description: "Шкірястий клапоть шкіри харонічної істоти. На дотик холодний і трохи вологий."
  suffix: Full
  components:
  - type: Sprite
    sprite: Objects/Materials/hide.rsi
    layers:
    - state: goliath_hide
      map: [ "base" ]
      color: "#3B2F55"
  - type: Stack
    stackType: CharonicHide
    baseLayer: base
    layerStates:
    - goliath_hide
    - goliath_hide_2
    - goliath_hide_3
  - type: Item
    size: Large
    heldPrefix: goliathhide
    sprite: Objects/Materials/hide.rsi
    shape:
    - 0,0,2,2
  - type: Tag
    tags:
    - HideContextMenu
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CharonicHide: 100

- type: entity
  parent: MaterialCharonicHide
  id: MaterialCharonicHide1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: MaterialBase
  id: MaterialCharonicLeechTooth
  name: "зуб харонічної п'явки"
  description: "Зазубрений зуб харонічної п'явки. Дивовижно твердий."
  suffix: Full
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    state: bones
    color: "#C0C0C0"
  - type: Stack
    stackType: CharonicLeechTooth
  - type: Item
    size: Small
    sprite: Objects/Materials/materials.rsi
    heldPrefix: bone
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CharonicLeechTooth: 100

- type: entity
  parent: MaterialCharonicLeechTooth
  id: MaterialCharonicLeechTooth1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: MaterialBase
  id: MaterialCharonicWispShard
  name: "уламок харонічного вогника"
  description: "Кристалічний фрагмент, що досі світиться блідо-блакитним світлом."
  suffix: Full
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    state: diamond
    color: "#A8E6FF"
  - type: Stack
    stackType: CharonicWispShard
  - type: Item
    size: Small
    sprite: Objects/Materials/materials.rsi
    heldPrefix: diamond
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 1.0
    color: "#A8E6FF"
    netsync: false
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CharonicWispShard: 100

- type: entity
  parent: MaterialCharonicWispShard
  id: MaterialCharonicWispShard1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: MaterialBase
  id: MaterialCharonicIchor
  name: "харонічний іхор"
  description: "В'язка чорна рідина, зібрана з харонічних слизів. Має заспокійливі властивості після належного очищення."
  suffix: Full
  components:
  - type: Sprite
    sprite: Objects/Misc/reagent_fillings.rsi
    state: powderpile
    color: "#1F2E2C"
  - type: Stack
    stackType: CharonicIchor
  - type: Item
    size: Tiny
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CharonicIchor: 100

- type: entity
  parent: MaterialCharonicIchor
  id: MaterialCharonicIchor1
  suffix: 1
  components:
  - type: Stack
    count: 1

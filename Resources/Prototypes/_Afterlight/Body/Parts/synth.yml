- type: entity
  abstract: true
  parent: [BaseItem, BasePart]
  id: PartSynth
  name: synth body part
  components:
  - type: Sprite
    sprite: _Afterlight/Species/Synth/parts.rsi
  - type: Icon
    sprite: _Afterlight/Species/Synth/parts.rsi
  - type: BodyPart
    species: Synth
  - type: Damageable
    damageModifierSet: Synth
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nanites
        Quantity: 3
      - ReagentId: SynthBlood
        Quantity: 10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Iron
          Quantity: 10
        - ReagentId: Carbon
          Quantity: 5
  - type: FlavorProfile
    flavors:
    - metallic

- type: entity
  parent: [PartSynth, BaseChest]
  id: ChestSynth
  name: synth chest
  components:
  - type: Sprite
    state: chest
  - type: Icon
    state: chest
  - type: BodyPart
    organs:
      heart:
        id: heart
      lungs:
        id: lungs
      battery:
        id: battery
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nanites
        Quantity: 10
      - ReagentId: SynthBlood
        Quantity: 20

- type: entity
  parent: [PartSynth, BaseGroin]
  id: GroinSynth
  name: synth abdomen
  components:
  - type: Sprite

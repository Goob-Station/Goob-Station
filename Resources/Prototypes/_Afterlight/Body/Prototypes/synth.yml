- type: body
  id: Synth
  name: synth
  root: chest
  slots:
    head:
      part: HeadSynth
      connections:
      - chest
      organs:
        brain: OrganSynthBrain
        eyes: OrganSynthEyes
    chest:
      part: ChestSynth
      connections:
      - groin
      - right arm
      - left arm
      - head
      organs:
        heart: OrganSynthHeart
        lungs: OrganSynthLungs
        battery: OrganSynthPowerCell
    groin:
      part: GroinSynth
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganSynthStomach
        liver: OrganSynthLiver
        kidneys: OrganSynthKidneys
    right arm:
      part: RightArmSynth
      connections:
      - right hand
    left arm:
      part: LeftArmSynth
      connections:
      - left hand
    right hand:
      part: RightHandSynth
    left hand:
      part: LeftHandSynth
    right leg:
      part: RightLegSynth
      connections:
      - right foot
    left leg:
      part: LeftLegSynth
      connections:
      - left foot
    right foot:
      part: RightFootSynth
    left foot:
      part: LeftFootSynth

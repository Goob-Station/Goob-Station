- type: species
  id: Synth
  name: species-name-synth
  roundStart: true
  prototype: MobSynth
  sprites: MobSynthSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobSynthMarkingLimits
  dollPrototype: AppearanceSynth
  skinColoration: Hues

- type: speciesBaseSprites
  id: MobSynthSprites
  sprites:
    Head: MobSynthHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobSynthTorso
    Groin: MobSynthGroin
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobSynthEyes
    LArm: MobSynthLArm
    RArm: MobSynthRArm
    LHand: MobSynthLHand
    RHand: MobSynthRHand
    LLeg: MobSynthLLeg
    RLeg: MobSynthRLeg
    LFoot: MobSynthLFoot
    RFoot: MobSynthRFoot

- type: humanoidBaseSprite
  id: MobSynthEyes
  baseSprite:
    sprite: _Afterlight/Species/Synth/parts.rsi
    state: eyes

- type: markingPoints
  id: MobSynthMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    HeadTop:
      points: 2
      required: false
      defaultMarkings: [ SynthAntenna, SynthAntennaLight ]
    HeadSide:
      points: 2
      required: false
    Head:
      points: 2
      required: true
      defaultMarkings: [ SynthVisor, SynthJawComposite ]
    Snout:
      points: 1
      required: true
      defaultMarkings: [ SynthSnout ]
    Chest:
      points: 3
      required: false
    Arms:
      points: 4
      required: false
    Legs:
      points: 4
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ SynthTail ]


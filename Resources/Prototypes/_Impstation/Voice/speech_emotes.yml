# vocal emotes
- type: emote
  id: Bubble
  name: chat-emote-name-bubble
  category: Vocal
  available: false
  icon: Interface/Emotes/squish.png
  whitelist:
    components:
    - Vocal
    - Slime
  blacklist:
    components:
    - BorgChassis
  chatMessages: ["chat-emote-msg-bubble"]
  event: !type:JiggleEmoteEvent # Goobstation
    pulses:
    - impulse: 8,10
    - delay: 0.12
      impulse: -14,-6
    - delay: 0.24
      impulse: 14,10
    - delay: 0.36
      impulse: -14,-6
    - delay: 0.48
      impulse: 8,8
  chatTriggers:
    # Frontier: emote consistency
    - bubble
    - bubbles
    - bubbling
    - bubbled
    # End Frontier: emote consistency


- type: entity
  id: PartKodepiia
  parent: [BaseItem, BasePart]
  name: "kodepiia body part"
  abstract: true
  components:
  - type: BodyPart
    species: Kodepiia #shitmed
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: ShimmeringBlood
        Quantity: 10
  - type: Damageable # Shitmed
    damageModifierSet: Kodepiia
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#f26174"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi


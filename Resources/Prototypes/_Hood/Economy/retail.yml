# This preset is intentionally abstract. It provides an opt-in Store-framework
# catalog for later cashier terminals without turning the physical cash register
# into a vending machine or replacing employee-run sales.
- type: entity
  id: StorePresetHoodRetail
  abstract: true
  components:
  - type: Store
    name: hood-store-name-neighborhood-retail
    categories:
    - HoodRetailBasics
    currencyWhitelist:
    - HoodDollar
    balance:
      HoodDollar: 0


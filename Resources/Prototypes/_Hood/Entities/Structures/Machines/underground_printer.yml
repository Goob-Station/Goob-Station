- type: entity
  id: HoodUndergroundPrinter
  parent: BaseLathe
  name: underground printer
  description: A compact workshop printer with a deliberately restricted catalog.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Hood/Structures/Machines/underground_printer.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - Metal
      - Wooden
      - SheetPlasma
      - Plastic
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - HoodUndergroundStatic

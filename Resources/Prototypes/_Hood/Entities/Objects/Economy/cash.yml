- type: entity
  parent: BaseItem
  id: BaseHoodCash
  name: dollar bill
  description: Physical cash accepted by Hood businesses.
  abstract: true
  components:
  - type: Item
    size: Tiny
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: StaticPrice
    price: 0
  - type: Stack
    stackType: HoodDollar1
    count: 1
    baseLayer: base
    layerStates:
    - cash
    - cash_10
    - cash_100
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [10, 100]
  - type: Sprite
    sprite: Objects/Economy/cash.rsi
    state: cash
    layers:
    - state: cash
      map: ["base"]
  - type: Currency
    price:
      HoodDollar: 1
  - type: Appearance
  - type: Tag
    tags:
    - HoodCash
    - Paper

- type: entity
  parent: BaseHoodCash
  id: HoodCash1
  suffix: $1
  components:
  - type: Icon
    sprite: Objects/Economy/cash.rsi
    state: cash
  - type: Stack
    stackType: HoodDollar1
    count: 1


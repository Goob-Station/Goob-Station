  description: "ПОПЕРЕДЖЕННЯ: Ці пристрої надзвичайно небезпечні і можуть спричинити сліпоту або глухоту при повторних використаннях."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: GrenadeFlashBang
        amount: 4
  - type: Sprite
    layers:
    - state: box_security
    - state: flashbang


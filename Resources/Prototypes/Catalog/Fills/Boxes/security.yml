- type: entity
  name: "коробка з наручниками"
  parent: BoxCardboard
  id: BoxHandcuff
  description: "Коробка, повна наручників."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Handcuffs
        amount: 4
  - type: Sprite
    layers:
    - state: box_security
    - state: handcuff

- type: entity
  name: "коробка стяжок"

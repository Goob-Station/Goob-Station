- type: entity
  parent: BoxCardboard
  id: BoxDetonator
  name: "коробка детонаторів"
  description: "Коробка вибухових детонаторів і тригерів."
  components:
  - type: Item
    shape:
    - 0,0,1,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmptyDetonator
          amount: 3
        - id: TimerTrigger
          amount: 2
        - id: VoiceTrigger
  - type: Sprite
    layers:
    - state: box_security
    - state: trigger

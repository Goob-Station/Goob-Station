- type: entity
  parent: BoxBase
  id: BoxCardboard
  name: "картонна коробка"
  description: "Невеличка коробка для зберігання речей."
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/cardboardbox_pickup.ogg
      params:
        volume: -3
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/cardboardbox_drop.ogg
      params:
        volume: -3
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/cardboardbox_drop.ogg
      params:
        volume: -3
  # Goobstation edit end
  - type: Construction
    graph: BoxCardboard
    node: boxcardboard
    containers:
    - storagebase
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 100
  - type: Sprite
    state: box
  - type: Tag
    tags:
    - BoxCardboard

- type: entity
  parent: BoxBaseSmall
  id: BoxCardboardSmall
  name: "мала картонна коробка"
  description: "Мала картонна коробка для зберігання речей."
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/cardboardbox_pickup.ogg
      params:
        volume: -3
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/cardboardbox_drop.ogg
      params:
        volume: -3
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/cardboardbox_drop.ogg
      params:
        volume: -3
  # Goobstation edit end
  - type: Construction
    graph: BoxCardboardSmall # Half the material cost of the "regular" cardboardbox
    node: boxcardboardsmall
    containers:
    - storagebase
  - type: PhysicalComposition # Half of the "regular" cardboard box
    materialComposition:
      Cardboard: 50
  - type: Sprite
    state: box
  - type: Tag
    tags:
    - BoxCardboard

- type: entity
  name: "коробка з мишоловками"
  parent: BoxCardboard
  id: BoxMousetrap
  description: "Ця коробка наповнена мишоловками. Намагайтеся не застрягти в ній рукою."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Mousetrap
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: mousetraps

- type: entity

  id: BoxLightbulb
  description: "Ця коробка зсередини має таку форму, щоб туди помістилися лише лампочки та трубки."
  components:
  - type: Sprite
    layers:
      - state: box
      - state: light
  - type: Storage
    grid:
    - 0,0,5,3
    whitelist:

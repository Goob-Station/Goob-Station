- type: entity
  parent: CrateSecgear
  id: CrateEmergencyExplosive
  name: "ящик з бомбозахисним костюмом"
  description: "Науковий відділ збожеволів? Щось біпає за шлюзом? Купуйте зараз і станьте героєм, який був потрібний станції... Тобто, треба зараз! (час не включено)"
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingHeadHelmetBombSuit
        - id: ClothingMaskGas
        - id: Screwdriver
        - id: Wirecutter
        - id: Multitool
        - id: ClothingOuterSuitBomb

- type: entity
  parent: CrateGenericSteel
  id: CrateEmergencyFire
  name: "ящик пожежника"
  description: "Тільки ви можете запобігти пожежі на станції. Візьміть з собою два костюми пожежника, протигази, ліхтарики, великі кисневі балони, вогнегасники та каски!"
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FlashlightLantern
          amount: 2
        - id: FireExtinguisher
          amount: 2
        - id: ClothingHeadHatHardhatRed
          amount: 2
        - id: ClothingMaskGas
          amount: 2
        - id: ClothingOuterSuitFire
          amount: 2
        - id: OxygenTankFilled
          amount: 2

- type: entity
  parent: CrateInternals
  id: CrateEmergencyInternals
  name: "ящик з дихальним спорядженням"
  description: "Опануйте свою життєву енергію й контролюйте дихання з трьома дихальними масками, трьома протигазами, трьома аварійними EVA-костюмами, трьома кисневими балонами та трьома азотними балонами."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 3
        - id: ClothingMaskBreath
          amount: 3
        - id: OxygenTankFilled
          amount: 3
        - id: NitrogenTankFilled
          amount: 3
        - id: ClothingOuterSuitEmergency
          amount: 3

- type: entity
  parent: CrateInternals
  id: CrateEmergencyInternalsLarge
  name: "ящик з дихальним спорядженням (великий)"
  description: "Опануйте свою життєву енергію й контролюйте дихання з шістьма дихальними масками, шістьма протигазами, шістьма аварійними EVA-костюмами, шістьма кисневими балонами та шістьма азотними балонами."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 6
        - id: ClothingMaskBreath
          amount: 6
        - id: OxygenTankFilled
          amount: 6
        - id: NitrogenTankFilled
          amount: 6
        - id: ClothingOuterSuitEmergency
          amount: 6

- type: entity
  parent: CrateInternals
  id: CrateNitrogenInternals
  name: "ящик з дихальним спорядженням (азот)"
  description: "Містить дві дихальні маски, два протигази та чотири азотні балони. Призначений для видів, що дихають азотом."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 2
        - id: ClothingMaskBreath
          amount: 2
        - id: NitrogenTankFilled
          amount: 4

- type: entity
  parent: CrateRadiation
  id: CrateEmergencyRadiation
  name: "ящик з захистом від радіації"
  description: "Переживіть ядерний апокаліпсис і коллапс надматерії з двома комплектами костюмів захисту від радіації. Кожен комплект містить шолом, костюм та лічильник Гейгера. Ми навіть докинемо пляшку горілки та кілька склянок, враховуючи тривалість життя людей, які замовляють це."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterSuitRad
          amount: 2
        - id: GeigerCounter
          amount: 2
        - id: DrinkVodkaBottleFull
        - id: DrinkShotGlass
          amount: 2

- type: entity
  parent: CratePlastic
  id: CrateEmergencyInflatablewall
  name: "ящик надувних стін"
  description: "Три стоси надувних стін на випадок, якщо металеві стіни станції більше не хочуть утримувати атмосферу."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxInflatable

- type: entity
  parent: CratePlastic
  id: CrateGenericBiosuit
  name: "ящик з аварійним біокостюмом"
  description: "Містить 2 костюми біозахисту, щоб гарантувати, що жодна хвороба не відволікатиме вас від того, що ви там робите."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearGeneric
          rolls: 2
        - id: ClothingMaskGas
          amount: 2

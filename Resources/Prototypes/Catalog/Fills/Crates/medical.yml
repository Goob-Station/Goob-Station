- type: entity
  parent: CrateMedical
  id: CrateMedicalSupplies
  name: "ящик медикаментів"
  description: "Базові медикаменти."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MedkitFilled
          amount: 2
        - id: Gauze
          amount: 2
        - id: Bloodpack
          amount: 2
        - id: BoxLatexGloves
        - id: BoxSterileMask
        - id: BoxMouthSwab

- type: entity
  parent: CrateMedical
  id: CrateChemistrySupplies
  name: "ящик хімікатів"
  description: "Базові хімікати."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BoxSyringe
        - id: BoxBeaker
        - id: BoxPillCanister
        - id: Dropper
          amount: 2
        - id: BoxBottle
          amount: 2

- type: entity
  parent: CrateMedical
  id: CrateChemistryVials
  name: "ящик для флаконів"
  description: "Ящик, наповнений коробкою з флаконами."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxVial

- type: entity
  parent: CrateMedical
  id: CrateMindShieldImplants
  name: "імпланти MindShield"
  description: "Ящик з 3 імплантатами MindShield."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MindShieldImplanter
        amount: 3

- type: entity
  parent: CrateSurgery
  id: CrateMedicalSurgery
  name: "ящик хірургічних інструментів"
  description: "Хірургічні інструменти."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: Scalpel
        - id: Retractor
        - id: Cautery
        - id: Drill
        - id: SawElectric # Shitmed Change
        - id: Hemostat
        - id: ClothingMaskSterile
        # Shitmed Change
        - id: BoneGel
        - id: MedicalStitches
        - id: BoxLatexGloves
        - id: BoxSterileMask
        - id: NitrousOxideTankFilled # Goobstation
        - id: ClothingMaskBreath # Goobstation

- type: entity
  parent: CrateMedical
  id: CrateMedicalScrubs
  name: "ящик медичних скрабів"
  description: "Медичний одяг."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: UniformScrubsColorGreen
        - id: UniformScrubsColorPurple
        - id: UniformScrubsColorBlue
        - id: ClothingHeadHatSurgcapBlue
        - id: ClothingHeadHatSurgcapPurple
        - id: ClothingHeadHatSurgcapGreen
        - id: ClothingMaskSterile
          amount: 3


    containers:
      entity_storage:
        id: BoxCleanerGrenades
        amount: 2

- type: entity
  parent: CrateGenericSteel
  id: CrateServiceReplacementLights
  name: "ящик із запасними лампами"
  description: "Нехай світло Ефіру сяє над цією станцією! Або хоча б світло дванадцяти люмінесцентних трубок і дванадцяти ламп розжарювання."

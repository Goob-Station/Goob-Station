- type: entity
  parent: CratePlastic
  id: CrateServiceJanitorialSupplies
  name: "ящик з прибиральним інвентарем"
  description: "Боріться з брудом та пилом за допомогою Nanotrasen's Janitorial Essentials(tm)! Містить три відра, попереджувальні знаки та гранати з очищувачем. Також є одна швабра, мітла, розпилювач, дротяна щітка, ганчірка та мішок для сміття."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: AllSoapsTable
        - id: MopItem
        - id: MopBucketCubeWrapped
        - id: Bucket
          amount: 3
        - id: WetFloorSign
          amount: 2
        - id: SprayBottleSpaceCleaner
          amount: 2
        - id: TrashBag
          amount: 2
        - id: Plunger
          amount: 2
        - id: BoxCleanerGrenades
        - id: WireBrush
          amount: 2

- type: entity
  parent: CratePlastic
  id: CrateServiceCleanerGrenades
  name: "ящик з очисними гранатами"
  description: "Містить дві коробки очисних гранат для тих плям, що глибоко в'їлися."
  components:

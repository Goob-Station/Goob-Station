- type: entity
  parent: CrateScienceSecure
  id: CrateScienceBiosuit
  name: "ящик з біокостюмом вченого"
  description: "Містить 2 костюми біозахисту, щоб жодна хвороба не відволікала вас від занять наукою. Для відкриття потрібен доступ вченого."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearScience
          rolls: 2
        - id: ClothingMaskSterile
          amount: 2

- type: entity
  parent: CrateScienceSecure
  id: CrateCrewMonitoring
  name: "ящик моніторингу екіпажу"
  description: "Містить плоский пакет сервера моніторингу екіпажу та кілька комп'ютерів моніторингу екіпажу. Для відкриття потрібен науковий доступ."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CrewMonitoringServerFlatpack
        - id: CrewMonitoringComputerFlatpack
          amount: 3

- type: entity
  parent: CrateScienceSecure
  id: CrateStationAiCore
  name: "ящик ядра ШІ станції"
  description: "Містить компоненти для побудови ядра ШІ станції. Позитронний мозок не входить у комплект. Для відкриття потрібен доступ Науки."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: StationAiCoreElectronics
        - id: Intellicard
        - id: SheetPlasteel1
          amount: 4
        - id: CableApcStack1
        - id: SheetRGlass1
          amount: 2

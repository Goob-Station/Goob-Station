- type: entity
  parent: CratePlastic
  id: CrateFoodPizza
  name: "екстрена доставка піци"
  description: "Допоможіть зробити свій внесок у боротьбу з голодом на станції, роздавши піцу відділенням, які не отримують достатнього фінансування! Включає 4 піци."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FoodBoxPizzaFilled
          amount: 3
        - id: FoodBoxPizzaCotton
        - id: LidSalami
          prob: 0.01

- type: entity
  id: CrateFoodPizzaLarge
  parent: CratePlastic
  name: "доставка піци на випадок катастрофи"
  description: "Коли все інше зазнає краху — пам'ятай: більше піци вирішує всі проблеми. Містить 16 піц."
  components:
  - type: StorageFill
    contents:
    - id: FoodBoxPizzaFilled
      amount: 15
    - id: FoodBoxPizzaCotton
    - id: LidSalami
      prob: 0.04


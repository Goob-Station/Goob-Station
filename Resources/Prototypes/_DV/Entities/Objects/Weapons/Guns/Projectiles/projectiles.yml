- type: entity #DeltaV, modified by Goobstation to work in this folder.
  name: energy bolt
  id: BulletEnergyGunLaser
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Projectiles/energybolts.rsi # Pirate
    layers:
    - state: medium # Pirate
      shader: unshaded
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectHeavyLaser # Pirate
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
  - type: Projectile
    impactEffect: BulletImpactEffectRedDisabler
    damage:
      types:
        Heat: 20 # Pirate edit
      armorPenetration: 0.4 # Pirate edit
    soundHit:
      collection: MeatLaserImpact


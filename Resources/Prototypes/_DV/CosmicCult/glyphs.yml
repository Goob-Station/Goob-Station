- type: entity
  id: CosmicGlyphBase
  name: "базовий гліф"
  description: "Дивне, потойбічне маркування."
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Fixtures
    fixtures:
      glyph:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.2,-0.5,1.2,0.5"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: Physics
  - type: Clickable
  - type: CosmicCultExamine
    othersText: cosmic-examine-text-glyphs
  - type: Sprite
    sprite: _DV/CosmicCult/Objects/glyph_truth.rsi
    layers:
      - state: spawning
        map: ["base"]
    drawdepth: Puddles
  - type: GenericVisualizer
    visuals:
      enum.GlyphVisuals.Status:
        base:
          Spawning: {state: spawning}
          Despawning: {state: despawning}
          Ready: {state: ready}
          Active: {state: active}
          Cooldown: {state: cooldown}
  - type: Appearance
  - type: InteractionOutline
  - type: CosmicPurifiable # Because why the hell not
    cleanseTime: 10
    cleanseTimeChaplain: 5

- type: entity
  parent: CosmicGlyphBase
  id: CosmicGlyphTruth
  name: "Гліф Істини"
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Objects/glyph_truth.rsi
    layers:
      - state: spawning
        map: ["base"]
  - type: CosmicGlyphConversion
    negateProtection: true
  - type: CosmicGlyph
    requiredCultists: 3
    activationDamage:
      types:
        Asphyxiation: 10 # Goobstation
        Ion: 10 # Goobstation
  - type: CosmicCultExamine
    cultistText: cosmic-examine-glyph-truth


- type: entity
  parent: BaseAction
  id: ActionCosmicSiphon
  name: "Висмоктати Ентропію"
  description: "Безшумно висмокчіть ентропію зі своєї цілі."
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: siphon
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicSiphon {}

- type: entity
  parent: BaseAction
  id: ActionCosmicBlank
  name: "Витіснити Суб'єктивність"
  description: "Витіснити розум вашої цілі з її тіла в космічну темряву, тимчасово роблячи її тіло безглуздим."
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: blank
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicBlank {}

- type: entity
  parent: BaseAction
  id: ActionCosmicPlaceMonument
  name: "Покликати Монумент"
  description: "Викликати Монумент у реальний простір. Тримайте його прихованим і в безпеці від не-культистів!"
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument
  - type: ConfirmableAction
    popup: cosmicability-monument-spawn-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicPlaceMonument {}
  - type: MonumentPlacementPreview
    tier: 1

- type: entity
  parent: BaseAction
  id: ActionCosmicMoveMonument
  name: "Перемістити Монумент"
  description: "Ваша робота вкрай важлива, а кінець неминучий. Переконайтеся, що вона буде завершена під вашим наглядом."
  components:
  - type: Action
    useDelay: 600 # Goobstation
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument-relocate
  - type: ConfirmableAction
    popup: cosmicability-monument-move-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicMoveMonument
  - type: MonumentPlacementPreview
    tier: 2

- type: entity
  parent: BaseAction
  id: ActionCosmicReturn
  name: "Повернення"
  description: "Розсіяти свою астральну проєкцію та повернутися до свого тіла."
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    useDelay: 0
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: return
  - type: InstantAction
    event: !type:EventCosmicReturn {}

- type: entity
  parent: BaseAction
  id: ActionCosmicLapse
  name: "Аберантний Проміжок"
  description: "Тимчасово розірвати тілесну форму вашої цілі, роблячи її незмінною, непрохідною та замороженою на місці."
  components:
  - type: Action
    useDelay: 45
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: lapse
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - BibleUser
    event: !type:EventCosmicLapse {}

- type: entity
  parent: BaseAction
  id: ActionCosmicGlare
  name: "Порожній Погляд"
  description: "Випустіть жахливий імпульс космічного світла, що сповільнює й дезорієнтує всіх навколо вас. Його ефекти посилюються проти кремнієвих істот."
  components:
  - type: Action
    useDelay: 60
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: glare
  - type: ConfirmableAction
    popup: cosmicability-glare-confirm
    confirmDelay: 0.1
    primeTime: 5 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicGlare {}

- type: entity
  parent: BaseAction
  id: ActionCosmicIngress
  name: "Примусовий Вхід"
  description: "Використовуйте концентрований вибух сили, щоб змусити відчинити захищені двері."
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: ingress
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicIngress {}

- type: entity
  parent: BaseAction
  id: ActionCosmicImposition
  name: "Порожнисте Нав'язування"
  description: "Ви зводите нанівець будь-яку вхідну шкоду протягом короткого часу."
  components:
  - type: Action
    useDelay: 80
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: entropic
  - type: InstantAction
    event: !type:EventCosmicImposition {}

- type: entity
  parent: BaseAction
  id: ActionCosmicNova
  name: "Астральна Нова"
  description: "Кинути великий і руйнівний вибух астральної енергії."
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: nova
  - type: TargetAction
    range: 6000 # You're just picking a direction anyways
  - type: WorldTargetAction
    event: !type:EventCosmicNova {}

- type: entity
  parent: BaseAction
  id: ActionCosmicFragmentation
  name: "Порожня Фрагментація"
  description: "Передайте своє згубне підсилення в цифрову систему, як-от консоль завантаження ШІ або кіборга, псуючи її в процесі. Це витратить ваше підсилення."
  components:
  - type: Action
    useDelay: 25
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: corruption
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - BorgChassis
      - SiliconLawUpdater
    event: !type:EventCosmicFragmentation {}
  - type: LimitedCharges
    maxCharges: 1

## COLOSSUS ACTIONS

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusSunder
  name: "Ентропійний Розкол"
  description: "Перемістіться до цільового місця й вивільніть каскадну детонацію згубної енергії."
  components:
  - type: Action
    useDelay: 18
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: sunder
  - type: TargetAction
    range: 7
  - type: WorldTargetAction
    event: !type:EventCosmicColossusSunder

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusIngress
  name: "Колосальне Вторгнення"
  description: "Використайте свою колосальну силу, щоб силою відчинити дверний проріз."
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: ingress
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    whitelist:
      components:
      - Door
    event: !type:EventCosmicColossusIngress

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusHibernate
  name: "Сон Оболонки"
  description: "Приспіть своє тіло на певний час, щоб відновити цілісність. Потрібно виконувати на стабільній землі."
  components:
  - type: Action
    useDelay: 180
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: slumber
  - type: ConfirmableAction
    popup: cosmicability-hibernate-confirm
    confirmDelay: 0.1
    primeTime: 5
  - type: InstantAction
    event: !type:EventCosmicColossusHibernate {}

- type: entity
  id: ActionCosmicColossusEffigy
  name: "Закликати Ефігію"
  description: "Витягніть Ефігію Ентропії в реальний простір."
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: nova
  - type: InstantAction
    event: !type:EventCosmicColossusEffigy {}

- type: entity
  parent: BaseAction
  id: ActionOpenRadioImplant
  name: "Відкрити радіоімплант"
  description: "Відкриває відсік для ключів bluespace радіоімплантату, вмонтованого у ваш череп."
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Clothing/Ears/Headsets/base.rsi
      state: icon
  - type: InstantAction
    event: !type:OpenStorageImplantEvent

- type: entity
  parent: BaseAction
  id: ActionOpenMouthStorage
  name: "Відкрити сховище в щічках"
  description: "Дозволяє зберігати предмети в щоках."
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -10
    icon: _DV/Interface/Actions/mouthStorageOpen.png
  - type: InstantAction
    event: !type:OpenStorageImplantEvent

- type: entity
  parent: BaseAction
  id: ActionToggleSneakMode
  name: "Увімкнути прихований режим"
  description: "Проникайте під столи."
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 3
    icon:
      sprite: Structures/Furniture/Tables/generic.rsi
      state: full
  - type: InstantAction
    event: !type:ToggleCrawlingStateEvent

- type: entity
  id: ActionChitzite
  name: "Викашляти Чітзіт"
  description: "Очистіть своє тіло від надлишку радіації та отримайте крутий небезпечний камінь."
  components:
  - type: Action
    enabled: false
    icon:
      sprite: _DV/Objects/Specific/Species/chitinid.rsi
      state: chitzite
    useDelay: 120
  - type: InstantAction
    event: !type:CoughItemActionEvent

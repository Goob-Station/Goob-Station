- type: entity
  id: OrganHarpyLungs
  parent: BaseHumanOrgan
  name: lungs
  description: "An advanced pair of avian lungs. Filters oxygen by way of moving air constantly through air sacs."
  components:
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r
  - type: Lung
  - type: Organ
    slotId: lungs
  - type: Metabolizer
    updateInterval: 2.0
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Human ]
    groups:
    - id: Gas
      rateModifier: 200.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Tag # goob edit
    tags:
     - Meat
     - Organ
     - Lungs

- type: entity
  parent: OrganHumanEyes
  id: OrganHarpyEyes
  name: Harpy eyes
  description: They seem as if they're looking at something far away...
  components:
  - type: Organ
    onAdd:
    - type: EyeCursorOffset
      maxOffset: 3
      pvsIncrease: 0.5
      enabled: false
    - type: CursorOffsetAction

        вологість одягу - система, паралельна забрудненню. Одяг може промокнути,
        якщо на нього потрапить вода. Вона також змиває забруднення з одягу: 1u
        розлитої води = 1u змитого на землю бруду. Волога випаровується і стікає
        на землю. Максимум один елемент одягу може містити 20u води і 5u плям.
        Повне висихання повністю промоклого костюма - 4-6 хвилини. Практично це
        значить, що тепер можна облити когось пляшкою з водою або побризкати з
        вогнегасника і змити з нього бруд
    - type: Add
      message: >-
        звуки хлюпання для ходьби в мокрому взутті, візуальний ефект стікання
        води на персонажі, коли на якомусь одязі більше 5u води
    - type: Add
      message: >-
        мокрий та брудний одяг дебафають настрій, свіжовипраний одяг підвищує
        настрій на 10 хвилин
    - type: Tweak
      message: >-
        віджимання одягу тепер прибирає тільки вологість, без очистки плям.
        Порізав звук та час віджиму до 3 секунд (відчистити одяг все ще можна у
        душі, раковині, пралці, клінером, милом)
    - type: Tweak
      message: >-
        душ зберігає 200u води. Використання розливає 10 u/s на підлогу або на
        моба, який стоїть під струменем. Вимкнений душ відновлює 3 u/s води.
        Побудований душ стартує з 0u води у сховищі й поповнюється з часом
    - type: Tweak
      message: >-
        забруднення взуття залежить від кількості рідини на підлозі: 1u = 1.5%
        .... 20u = 30%. Калюжі, в яких менше 5u, не забруднюють взуття.
        Максимальний шанс - 30%. Не стосується підковзування і ходьби босоніж -
        шанс все ще 100%
    - type: Tweak
      message: >-
        забруднення одягу залежить від розлитої рідини. Вона рівномірно
        розподіляється між одягом і стікає на землю, якщо в ньому не лишилось
        місця для плям. Максимум - 5u бруду на слот
    - type: Tweak
      message: >-
        пралки миють одяг довше (5c => 10c), сильніше пошкоджують мобів, які
        залізли в камеру (6 => 12 брут дамагу), і не зазнають пошкоджень від
        твердих предметів всередині. Одне прання тепер доводить людину до крита
    - type: Tweak
      message: пралки відкриваються альт-кліком і стартують звичайним кліком
    - type: Tweak
      message: >-
        тайли води в басейнах поглинають рідини і промочують одяг, якщо в них
        вступити
    - type: Add
      message: дебаг-команда showwetness, щоб дивитись рідини на одязі

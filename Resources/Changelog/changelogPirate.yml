        вікно, спрацьовує блок. Бити в дворучному хваті можна, але після
        попадання хват міняється на одноручний. Обидві дії повністю гасять
        вхідну шкоду і знімають стаміну, але парирування витрачає менше. Успішні
        парирування накопичують потужність і рівні сили: збільшують вікно,
        зменшують витрати стаміни й підвищують шкоду; бонуси з часом спадають,
        при максимальному рівні змінюється візуал зброї (тільки для сонцехвата -
        у нього 7 варіантів залежно від рівня). Всього 100 поінтів потужності й
        6 (нульовий без бафів не рахується) рівнів, які накоппичують бафи поверх
        один-одного. 
